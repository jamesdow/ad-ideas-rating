<script>
(function () {
  "use strict";
  var DATA = {"pack": "P07", "items": [{"id": "i069", "t": "# Pressed From the Weapon, Heard Where It Lands\n\n## The problem\n\nCampaigns about violence and its aftermath often end with a donation request that feels disconnected from the harm. Supporters give, but they never see where their contribution goes, and the instruments of harm, the weapons or the dangerous ground, remain symbols of loss rather than tools for recovery.\n\nMusic offers a way to reach people emotionally and at scale, but a song released into the digital flood is easily missed. And individual supporters, scattered across many places, rarely see their part in a collective result.\n\nThe task is to make every act of support carry the story of the harm, fund the solution, and show each supporter exactly what they contributed to.\n\n## The approach\n\nTurn the instrument of harm into a branded raw material and use it to make a limited music release, such as records pressed or drives cast from seized weapons, with proceeds returned to affected communities, and make every scattered act of participation visible as one shared public outcome.\n\nThe material is given a name and becomes the physical substance of the release. Copies are scarce: a single copy passed between listeners, tracks tied to particular places, drives left at concerts for fans to find. Every purchase, every pass-along, every discovery is recorded on a live public map or reflected in a visible public change, so that participants can see exactly where their contribution landed.\n\n## Key mechanisms\n\n**1. Harm turned into material.** Melting seized weapons or transforming dangerous ground into a named raw material, and building everyday products from it, makes each item carry the story. With proceeds returned to the communities harmed, every purchase funds the solution and turns a symbol of violence into one of repair.\n\n**2. Scarcity and discovery in the release.** Instead of an endless stream, the music exists in limited, physical, sometimes hidden forms. Fans seek out copies, travel to find them and pass them on, turning a file into an event. The scarcity mirrors the weight of the material itself.\n\n**3. Scattered participation made visible.** A live map, a changing public landmark or a photo of exactly where a contribution landed shows each person their part in the larger effort. Supporters spread across many places can see the cumulative effect of their individual acts.\n\n## How the parts interact\n\nThe material gives the release its meaning: each copy is literally made from what caused harm. The scarcity gives it its value and its social life: copies move from hand to hand and place to place. The visible outcome connects all that movement into a single picture: every copy found or bought lights up a point, funds a community, and adds to a growing public record.\n\nThe journey: a copy made from the named material is released or hidden; a fan finds or buys it; their contribution is shown publicly, linked to the community it supports; they pass it on or share where it came from; the map grows.\n\n## Why it works\n\nIt joins substance, scarcity and visibility. People feel the significance of holding something made from what once did damage; they value what they had to find; and they stay engaged when they can see their share in a collective result. The release becomes both a cultural object and a ledger of repair, and every play and every pass-along keeps the story moving and the funding flowing."}, {"id": "i006", "t": "# The Anthem You Vote to Rebuild\n\n## The problem\n\nCalls to protect threatened heritage tend to provoke a brief wave of sympathy and then fade. The public has no ongoing role, and the story has no reason to keep people watching. At the same time, competitions and live formats are proven at holding attention, but they rarely carry meaning beyond entertainment. And campaigns that try to explain loss through words often fail to move people, because the emotion is told rather than felt.\n\nThe challenge is to create a format that keeps people engaged over time, gives them real influence, and conveys the meaning of preservation through emotion rather than argument.\n\n## The approach\n\nThe idea is a live contest to rebuild threatened heritage from a public backup, where the audience decides in real time what is restored next, and the entire format is structured and scored by music that carries its meaning.\n\nThe premise is that what is destroyed can be rebuilt. Ordinary people contribute to a backup of threatened monuments, spaces or works, for example by scanning them or by making removed works available again. This archive becomes the material for the contest.\n\nThe contest invites teams to reconstruct pieces from the backup. The live audience changes the outcome as it happens: voting on which site is rebuilt next, choosing the next challenge the teams must overcome, bringing back a team that was eliminated, or running an online second-chance round that feeds the finale. Viewers have a real stake in what is restored.\n\nMusic sets the structure. Each stage is built around a track whose tone or history speaks to what is being rebuilt; a chant can rise as audiences vote; the finale can take the form of a music video built from tableaux of the restored sites. The music carries the emotion of loss and recovery without needing explanation.\n\n## Key mechanisms\n\n**Preservation as backup.** The framing transforms despair into a constructive project. A backup means rebuilding is possible, and rebuilding becomes a peaceful counter-statement to destruction.\n\n**Audience-driven outcomes.** Real-time voting and second-chance rounds give viewers genuine influence. They are not just watching rebuilding; they are directing it. This creates a reason to keep watching to the end.\n\n**Music as structure and meaning.** Tracks, chants and tableaux set the rhythm of the contest and deliver its emotion. Viewers feel what each restoration means through sound, which voice-over would struggle to achieve.\n\n## How the parts interact\n\nThe backup supplies the content: the sites and works to be rebuilt. The live contest supplies the format and the stakes: teams, challenges and audience decisions. The music supplies the emotional thread that ties each episode together and gives the restorations significance.\n\nEach element amplifies the others. Audience votes determine which piece of heritage is restored, and the music for that stage expresses what it means to bring it back. The chant that accompanies the voting can become the contest's anthem. Without the backup, the contest would have nothing meaningful to rebuild. Without the audience's influence, the format would lose its suspense. Without the music, the meaning would rely on explanation.\n\n## Why it works\n\nIt works because it combines participation, suspense and emotion around a cause that usually lacks all three. The public helps create the backup, then decides how it is used, and feels the result through music.\n\nThe live format sustains attention across a series rather than a single moment. Viewers develop loyalty to teams and to sites, and they share the votes and the songs. The preservation effort becomes a shared cultural event, and the act of rebuilding is experienced as something the public chose and celebrated together."}, {"id": "i004", "t": "# Clues on the Billboard, a Final Issue at the End\n\n## The problem\n\nHarmful norms often persist through a particular medium, and criticising them from outside rarely changes anything. Campaigns that attack such norms struggle to build anticipation, and their outdoor or digital messages tend to be static and easy to ignore.\n\n## The approach\n\nThe idea is to take over the medium that embodies a harmful norm and close it with a final statement, building anticipation for that moment through a trail of clues delivered by outdoor and digital media that react to the viewer's live surroundings.\n\nThe campaign begins with clues: a seeded phrase, a symbol appearing before any announcement, a chain of hints across platforms, perhaps an early drop for core supporters. These clues appear on outdoor and digital media driven by live conditions where the viewer is standing, such as nearby locations, local weather, a passing vehicle, or traffic ahead. Each clue feels timely and specific.\n\nThe trail leads to the reveal: the campaign has taken over the medium of the harmful norm, publishes one final issue arguing the opposite and closes it. The closure is the statement.\n\n## Key mechanisms\n\n**Anticipation through clues.** A trail of hints turns the audience into investigators. They participate before knowing the answer, building anticipation and conversation.\n\n**Live, local media.** Outdoor and digital placements that react to the viewer's surroundings feel timely and personal. A clue that responds to local conditions or nearby places seems addressed to the viewer right now, which makes it more noticeable and memorable.\n\n**Takeover and closure.** Owning the medium and ending it with an opposite message turns the symbol of the problem into the vehicle for critique. The closure is a clear, dramatic act.\n\n## How the components link\n\nThe clues create curiosity; the live media make the clues relevant; the takeover provides the payoff. Live triggers can reveal clues only in certain conditions, encouraging people to look for them and share them. The final issue resolves the mystery and gives the investigators their answer, rewarding their participation.\n\n## Why it works\n\nPeople ignore criticism but engage with mysteries, especially those that seem to respond to where they are. This idea turns the critique of a harmful norm into an unfolding puzzle delivered through responsive media, and ends it with a decisive act that makes the closure itself the message."}, {"id": "i107", "t": "# The Boutique That Beats the Rule\n\n## The problem\n\nSome essentials are made harder to obtain by rules that make little sense: a tax rate that treats a necessity as a luxury, or support programmes that exclude certain basic items. The people hit hardest are those with the least money, and the charitable response, handouts and donation queues, often adds stigma to hardship. Meanwhile, campaigns about such issues are frequently made by outsiders speaking about a community rather than with it, which undermines trust and misses the nuances of each group's experience.\n\nThe task is to get essentials to people who need them, expose the unfair rule, preserve dignity, and make sure the community itself shapes and voices the effort.\n\n## The approach\n\nOpen a shop that reverses the usual ritual of charity and stocks a real product designed to exploit the rule's own loophole. People in need shop with dignity, choosing what they want, while the product's packaging or classification sidesteps the unfair rule. The whole effort is created with the community behind the camera and in its own voices: different sub-groups shape the concept, the store's communication is rewritten in each language, and the campaign's film and outreach are led by people from the communities served.\n\n## Key mechanisms\n\n**1. A product that uses the loophole.** The essential item is sold in a form that qualifies for a fairer rule: packaged as something the rule treats more generously, or sold with an at-the-till adjustment that cancels the unfair charge. The product delivers relief directly and exposes the rule's absurdity. Every purchase becomes a vote against the rule.\n\n**2. A shop that restores dignity.** Instead of a donation queue, people in need enter a boutique-style store and choose freely, using gift cards or a \"take what you need, give if you can\" model. Donors bring items in, filling empty racks. The ritual of shopping replaces the stigma of receiving, and giving feels familiar.\n\n**3. The community makes the work.** The campaign is created by the community it serves. Creators from different sub-groups direct the film and design the store; local accents and languages shape the voice; outreach is adapted for each group. The message practises the inclusion it preaches and reaches each part of the community directly.\n\n## How the elements fit together\n\nThe loophole product provides practical relief and political pressure. The redesigned shop provides dignity and a familiar context where giving and receiving feel normal. The community-led creation ensures the effort resonates and is trusted.\n\nThey reinforce each other. The shop is the natural place to sell and give the loophole product, so the act of shopping there is both a dignified way to receive and a public statement about the rule. Community creators make sure the product, the store and the message reflect real needs and speak in the right voices. Media coverage, drawn by the absurdity of the loophole, finds a store run with and by the people affected, which strengthens the argument for change.\n\n## Why it works\n\n- **Relief and protest in one act.** The loophole product helps immediately and turns each purchase into evidence against the rule.\n- **Dignity over charity.** A shopping ritual removes the stigma that keeps people from accepting help.\n- **Authentic voices.** Community-made work reaches people directly and earns trust that outsider messages cannot.\n- **A story the press wants.** An absurd rule exposed by a real product sold in a dignified store makes a compelling, shareable narrative."}, {"id": "i150", "t": "# Echo Archive\n\n## The problem\n\nWhen a threatened monument is documented, the record is almost always visual: photographs, drawings, 3D scans. Yet much of what makes a place meaningful is how it sounds. The resonance of a vaulted hall, the wind through a ruined arch, the way footsteps carry across a square. When the building goes, that sound goes with it, and no photograph can bring it back.\n\nAt the same time, attention to heritage loss fades quickly. A news story about a destroyed site is read and forgotten. Something has to make the loss felt, and make the record of what survives worth seeking out.\n\n## The approach\n\nTreat sound as part of heritage's backup. Ordinary people are invited to record the acoustic life of threatened places (the echoes, the wind, the hum of the interior, the sound of the walls themselves) and add it to a shared cloud archive alongside 3D scans. If the place is destroyed, it can be rebuilt not only in shape but in sound.\n\nMusicians then compose with that archive, and each piece is released not as an abundant download but as a scarce, located event: playable only at the site it was made from, or in its rebuilt form.\n\n## Key mechanisms\n\n### Preservation reframed as a backup\n\nThe core reframe is technical and hopeful: what is destroyed can be restored because a copy exists. By including sound in the copy, the archive preserves the part of a place most often lost. And when a site is damaged, rebuilding its sound becomes a peaceful counter-statement, a way of answering destruction with restoration rather than outrage.\n\n### Sound as the missing sense\n\nRecorded and reactive audio puts listeners inside the subject. Binaural recordings let someone far away stand, in their headphones, at the centre of a hall they will never enter. The texture of cracked walls can be read and translated into music, so the damage itself becomes audible. The audience does not look at the monument; they hear themselves inside it.\n\n### Scarcity restores the event\n\nEach composition built from a site's sounds is tied to the place. It can be unlocked only at the location's coordinates, or exists as a single copy that must be played there. Fans have to go to the place, or to its reconstruction, to hear it, and they share the experience because it cannot be streamed. An abundant digital file becomes a pilgrimage.\n\n## How it fits together\n\nThe archive supplies the raw material: the voices of places. The music turns that raw material into something people want rather than something they ought to care about. The scarcity mechanic brings people back to the physical site, which in turn generates more recordings and more contributors. The loop is self-reinforcing: listening leads to visiting, visiting leads to recording, recording leads to new music.\n\nWhen a place is lost, the composition tied to it takes on new weight. It may now be the only way left to hear the site, and the act of playing it at the ruin becomes a quiet ceremony of rebuilding.\n\n## Why it works\n\n- It gives heritage a dimension people have never been asked to protect, which makes the idea feel new without being complicated.\n- Sound is intimate. Hearing the inside of a threatened space creates a bond that images rarely achieve.\n- Scarcity makes the record valuable. A track you must travel to hear is talked about; a file anyone can download is not.\n- The tone is constructive. Rather than mourning, the work insists that culture can be backed up, and that ordinary people, with a phone and a pair of ears, can be the ones who do it."}, {"id": "i114", "t": "# The Name That Writes Its Own Campaign\n\n## The problem\n\nMost brands treat their identity system and their cultural output as two separate jobs. A design team builds a logo, a typeface and a sonic cue; later, a social team tries to be funny on the internet. The two rarely meet. The result is an identity that needs captions to be understood, and a stream of culture-chasing content that could belong to anyone. When the brand finally tries to join a creator's world or a meme format, it either looks like a sponsor wearing a costume or loses the voice its audience liked in the first place.\n\nThe challenge, then, is to build one generative source that feeds both: an identity that explains itself, and a cultural presence that stays recognisably the brand's own however far it travels.\n\n## The approach\n\nThe idea starts from the one asset every brand already owns and rarely interrogates: its name. The creative team mines the name for a second meaning: a pun that lands in another field, a sound-word hidden in its syllables, a lucky phrase in the local language, or a prefix that can be attached to other words. That second meaning becomes a character, a world or a ritual.\n\nFrom that discovery, the identity is derived. The logo, the typeface, the sonic cue and the mascot are not designed from scratch; they are drawn out of what the name already means. A few of these marks are fixed anchors that never change. Everything else is allowed to flex.\n\nFinally, the brand's established irreverent voice is handed to that character and sent into the forms internet culture already uses: the mascot releases a rap EP, creators whose humour matches the brand take it into their own formats, and a meme riff is licensed from its original artists rather than borrowed without permission.\n\n## Key mechanisms\n\n**1. The name as a story engine.** Once the name is read two ways, it stops being a label and becomes a premise. If the name sounds like a word, that word can become the mascot's catchphrase. If a prefix can attach to other words, every new product, event or post can be named by the same rule. The campaign never has to invent a fresh concept; it only has to apply the second meaning again. The name keeps generating the idea.\n\n**2. Marks derived from what is already true.** Because the logo, sonic cue and mascot come from the name's own second meaning, each mark is self-explanatory. Someone who sees the mascot already half-understands the joke in the name; someone who hears the sonic cue hears the sound-word the name contains. The design carries the story without copy. The fixed anchors, perhaps the core logo shape and the sonic cue, guarantee recognition, while the flexible elements can change costume to suit a genre, a platform or a moment.\n\n**3. A voice that enters other people's forms.** The character born from the name is the natural vehicle for the brand's irreverence. A mascot can credibly release a rap EP because it is a character, not a corporation. Creators whose humour already matches the brand can play with that character without having to adopt an alien script. And a meme riff licensed from the original artists lets the brand use a format the audience already loves without being seen as a thief.\n\n## How the components interact\n\nThe three atoms form a chain. The name supplies the premise. The identity system turns that premise into recognisable, repeatable marks. The irreverent voice gives those marks permission to travel into culture. Each link depends on the one before it.\n\nWithout the second meaning, the mascot would be an arbitrary cartoon and the rap EP would be a gimmick. Without the fixed anchors, the brand would dissolve as it entered creators' formats: a meme version of the mascot would be indistinguishable from fan noise. Without the voice extension, the identity would stay on packaging and storefronts, clear but silent.\n\nTogether, they let the brand behave like a cultural property. The flexing parts of the identity are exactly the parts that can be remixed by creators and genres; the anchored parts are what keep every remix attributable.\n\n## Why it works\n\nIt works because nothing is imposed from outside. The character comes from the name, the marks come from the character, and the voice comes from what the audience already enjoyed about the brand. Each step is an extension of something true rather than a new invention, so audiences recognise it instantly and accept it as authentic.\n\nIt also scales cheaply in creative terms. A rule that says \"apply the second meaning again\" produces endless executions: a new track, a new collaboration, a new riff. Because the anchors stay fixed, every execution adds to the same memory structure instead of fragmenting it.\n\nFinally, it solves the classic problem of brands in internet culture. The brand does not pretend to be a creator; it brings a character that belongs in creator formats, speaks in a voice people already like, and pays respect to the original makers of the memes it uses. It joins the culture while remaining unmistakably itself."}, {"id": "i095", "t": "# Proof by Embarrassment\n\n## The problem\n\nBrands that genuinely own their category face a strange difficulty: they cannot say so. A claim of leadership or superiority sounds like exactly what every advertiser says, and the audience discounts it automatically. Even true product claims suffer the same fate. The more confident the brand sounds, the less it is believed. The challenge is to make people accept a claim of quality and dominance without the brand having to assert it.\n\n## The approach\n\nThe idea is a campaign that proves the brand's claims through evidence that looks unflattering or comes from outside the brand, and that reveals the brand's dominance through the audience's own unprompted behaviour, all framed by a brand willing to laugh at itself so the proof is enjoyed rather than resisted.\n\nThe tone comes first. The brand plays an absurd premise with total sincerity, perhaps a deadpan parody of a familiar format such as a serious investigative documentary or a scientific trial, or it makes itself the butt of the joke. Inside that comic frame sit two kinds of evidence.\n\nThe first is proof the audience cannot dismiss as advertising: filming the product doing something unglamorous over time, running a blind test among people who have never tasted the category, quoting a rival's own legal complaint word for word, or revealing a change the brand made silently that nobody noticed.\n\nThe second is proof of ownership through unprompted behaviour: asking people to draw the generic product and watching them draw the brand, asking an AI for the category and seeing it produce the brand's pack, or showing an everyday object that shares the brand's shape.\n\n## Key mechanisms\n\n**Self-deprecation as a delivery system.** Evidence of quality is still a boast if it is presented smugly. By casting the brand as the willing target of the joke, or by playing the investigation with mock solemnity, the campaign converts scepticism into amusement. People share the work as entertainment, and the claim travels with it.\n\n**Unflattering evidence.** The most credible proof is the kind no marketer would choose. A product shown in an unattractive light, a rival's complaint used as a compliment, or a silent change that nobody spotted all look like admissions rather than claims. The humour gives the brand licence to show these things: what might look damaging in a straight ad becomes a knowing wink.\n\n**The audience's recall as the ad.** When people asked to draw a category draw the brand, they demonstrate category ownership with their own hands. The brand is not claiming leadership; the audience is proving it. This kind of evidence is also inherently funny, because watching people unwittingly draw a logo is a small comic reveal. It fits naturally into the deadpan frame.\n\n## How the parts connect\n\nEach atom solves a piece of the believability problem. External or unflattering evidence proves the product is good. Unprompted behaviour proves the brand is dominant. The comic, self-mocking frame makes both palatable and shareable. Without the humour, the proof risks feeling like a lawyer's brief. Without the proof, the humour is just a joke with no claim attached. Without the recall test, the campaign shows quality but not leadership.\n\nThe structure can run as a series of mock experiments, each played straight: a deadpan presenter running a blind test, an investigator reading a rival's legal complaint aloud, a researcher asking passers-by to sketch the generic product and staring blankly at the results. Each episode ends with a reveal that the audience witnesses rather than being told.\n\n## Why it works\n\nAudiences have been trained to filter out claims. They do not filter out what they see with their own eyes, what comes from outside the brand, or what they themselves do. This idea moves every claim into one of those categories and wraps it in a tone that turns resistance into enjoyment. The brand never says it is best; it lets an unflattering test, a rival's words and the public's own drawings say it, while laughing at itself the whole time."}, {"id": "i143", "t": "# A Name That Plays on the Skip Button\n\n## The problem\n\nDigital formats come with irritations: the skip button, the buffering wheel, the tight time slot, the device in the room that is always listening. Audiences resent these constraints and tune out. Brands treat them as obstacles to work around, producing generic content that viewers skip. At the same time, many brands have names that carry no particular meaning in the campaign and identities that need explanation.\n\n## The approach\n\nThe idea is to mine the brand's name for a second meaning, build the identity's marks from that meaning, and write ads that play directly with the constraints of their own format, so the name, the identity and the format all generate the joke.\n\nThe campaign begins with the name. A pun in another field, a sound-word hidden in it, a lucky phrase in the local language, or a prefix that can be attached to other words gives the campaign a ready-made character, world or ritual.\n\nFrom that second meaning, the identity is derived: a logo, typeface, sonic cue or mascot that expresses it. A few anchors stay fixed while the rest flexes.\n\nThen the ads are written around the format. If the format has a skip button, the ad plays with it; if it buffers, the buffering becomes the joke; if it has a fixed short slot, the ad uses the limit as its hook; if a smart speaker is in the room, the ad talks to it.\n\n## Key mechanisms\n\n### A name that generates ideas\n\nWhen the brand's name has a second meaning, it keeps producing creative material. A sound-word can become a sonic cue; a pun can become a character; a prefix can create a vocabulary. The name becomes a generator rather than a label.\n\n### Self-explanatory marks\n\nDeriving the identity from the name's second meaning makes every appearance recognisable and self-explanatory. The mascot is the pun; the sonic cue is the sound-word. Viewers understand the brand without copy, because the design carries the story.\n\n### Ads that embrace their constraints\n\nWriting around the format's habits turns what viewers resent into the reason to watch. A skip button becomes a punchline; a buffering wheel becomes a character's pause; a short slot becomes a challenge the brand meets. Viewers choose to keep watching because the ad is clearly about their experience.\n\n## How they intertwine\n\nThe name supplies the concept; the identity makes it visible and audible; the format provides the stage. The second meaning can be tied directly to the format's constraints: a sound-word that plays as the skip button appears, a character from the pun who interacts with the buffering wheel, a prefix that turns the time limit into a brand term. Because the identity's anchors stay constant, every format-specific joke still reads as the same brand.\n\n## Why it works\n\nAudiences tolerate ads that respect their time and their intelligence. Playing with a format's constraints shows respect; mining the brand's name gives the brand a voice of its own; and an identity derived from that name makes the voice recognisable everywhere. The brand turns irritation into delight, and its own name into an engine for ideas."}, {"id": "i119", "t": "# Opening the Ritual to the Whole Game\n\n## The challenge\n\nSports sponsorship often stays on the edges of the sport: logos on boards, names on shirts, adverts during breaks. Fans see the sponsor as someone who pays to be near what they love, not as part of it. At the same time, many sporting and cultural traditions carry exclusions. Some rituals are reserved for certain people, and a brand that criticises them from outside risks being seen as an interloper lecturing a culture it does not belong to.\n\nThe brand's challenge is twofold: earn a genuine place inside a sport's community, and help widen who that community includes, without attacking the traditions that hold it together.\n\n## The approach\n\nThe idea is for the sponsor to host an inclusive version of a sporting ritual itself, delivered through the grassroots partners and community structures that sustain the sport, so that the brand serves the game's people and places while quietly changing who takes part.\n\nRather than funding the top of the sport and advertising around it, the brand turns towards the people who keep it alive: grassroots pitches, overlooked athletes, the home city, the objects used in its ceremonies. It identifies a ritual or tradition within that world that has been reserved for a narrow group, following the pattern of a festival rite normally limited to one kind of participant, and it stages an open version where everyone who loves the sport is welcome.\n\nThe ritual is not run by the brand alone. It is delivered through local clubs, community organisations, expert committees and people's own gatherings, the partners who already hold the trust of the sport's audience.\n\n## Key mechanisms\n\n**Serving the people and places that sustain the sport.** The sponsor's role becomes one of contribution: improving pitches, supporting athletes who are usually ignored, crafting the objects that ceremonies need, investing in the home city. Fans feel the brand as a member of the sport's community rather than a logo on its perimeter.\n\n**Hosting the inclusive ritual rather than criticising the exclusive one.** In cultures rich in ritual, change lasts when it enters how a tradition is practised. By staging an open version of the ceremony, the brand demonstrates inclusion instead of arguing for it. Participants experience the tradition as theirs, which is more persuasive than any statement about fairness.\n\n**Delivering through trusted local structures.** The brand works through the organisations and gatherings people already belong to. These partners give the initiative reach and legitimacy it could not build alone, and they ensure the inclusive ritual is seen as coming from inside the community.\n\n## How the parts interact\n\nThe grassroots focus gives the brand the standing to take part in the sport's rituals at all. The trusted local partners give the inclusive version authority and spread it across the places where the sport is played. The ritual itself provides a moment of shared meaning in which inclusion becomes visible. Each depends on the others: without grassroots service, hosting a ritual would look opportunistic; without local partners, the ritual would be a brand event; without the ritual, the grassroots work would remain worthy but quiet.\n\nThe sequence is natural. The brand first earns its place by serving pitches, athletes and ceremonies. It then invites the community, through its own clubs and gatherings, to take part in an open version of a tradition. The ritual draws people who were previously excluded into the centre of the sport, alongside those who always belonged.\n\n## Why it works\n\nIt works because it changes practice rather than opinion. People do not need to be convinced that a tradition should be open; they take part in it and see that it already is. The change becomes part of how the sport is lived.\n\nIt also redefines the sponsor's relationship with fans. A brand that maintains pitches, supports overlooked players and helps host the sport's rituals is part of the game. When that same brand widens who belongs, fans read it as a member of the community improving it from within, not an outsider imposing values. The sponsorship becomes something fans would miss if it disappeared."}, {"id": "i112", "t": "# The Banned Album, Backed Up\n\n## What stands in the way\n\nCensorship works by removal. A book is pulled from a library, a song is barred from broadcast, a piece of journalism is taken down, and the culture it carried simply disappears from public reach. Opposing the ban directly often fails: the censor holds the rules, and protests against it can be blocked by the very same rules. Meanwhile, cultural works that survive online lose their weight; a file that anyone could find is easily ignored even when it is hard to find.\n\nThe task is to keep censored culture alive, make people care enough to seek it out, and expose the rule that tried to erase it, without breaking the rule outright.\n\n## The concept\n\nTreat the censored work as heritage that can be backed up, and smuggle it back to the public through a route the censorship rule does not cover. The work, an album or a collection of songs and texts, is hidden in places and media the rule allows: a physical spot, a single copy passed hand to hand, USB drives left where fans gather, coordinates that unlock a track. Wherever possible, it returns inside the very institutions that removed it. The censor's objection is quoted openly, so every rediscovery also exposes the rule.\n\n## Key mechanisms\n\n**1. Preservation as a backup.** The campaign's founding idea is that what has been removed can be restored if it has been preserved. The banned material is archived and made available again, ideally inside the place that removed it. Restoration becomes a peaceful counter-statement: the work was taken away, and now it is back.\n\n**2. Scarcity and discovery.** Rather than uploading the work for anyone to download, the campaign releases it in scarce, physical and place-bound ways. A single copy may travel between listeners; tracks may be playable only at one spot; drives may be left at concerts; songs may be hidden at map coordinates. Fans have to seek it out, which turns the release into an event and makes each copy precious.\n\n**3. The rule as the vehicle.** The campaign studies the censorship rule closely and uses its gaps. The work may travel through a medium the rule does not cover, appear in a form that is technically permitted, or disappear at a legal deadline to dramatise the ban. The censor's own words, the objection or the regulation, are quoted in the release. The message gets through while showing how absurd the rule is.\n\n## How the parts interact\n\nThe backup idea gives the campaign its purpose and moral clarity. Scarcity gives it energy and spread: people who hunt down a copy of something banned feel they have done something brave, and they tell others. Using the rule as the vehicle gives it protection and an argument: since every route is technically permitted, the campaign shows the ban to be both arbitrary and ineffective.\n\nThere is a natural fit between scarcity and censorship. Censorship makes culture scarce by force; the campaign makes it scarce by design, so that finding it becomes a mark of resistance. And because each discovery is shared, the work spreads further than it would have if it had never been banned.\n\n## Why it works\n\n- **Restoration over protest.** Bringing back what was removed is a calm, powerful answer that is hard to oppose.\n- **Scarcity drives desire.** Works that must be sought out are valued and discussed more than works that are everywhere.\n- **The rule exposes itself.** Using permitted routes and quoting the censor turns the ban into the campaign's best evidence.\n- **Participation as defiance.** Each person who finds and passes on a copy joins the counter-statement, spreading the work through their own networks."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
