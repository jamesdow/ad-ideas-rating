  var DATA = {"pack": "P08", "items": [{"id": "i146", "t": "# A Flag Shot in One Colour\n\n## The situation\n\nGroups without a state, or whose belonging is contested, often lack the symbols that everyone else takes for granted. Arguments about their place can be made in words, but words invite counter-arguments. A cause that wants to say \"these people belong\" needs a symbol that makes the case without debate, that supporters can adopt, and that is visually distinct enough to cut through.\n\nAt the same time, a film supporting such a cause must stand out among countless earnest films, most of which look the same: grainy realism, soft piano, faces in close-up. The cause needs both an emblem and a look.\n\n## The idea\n\nCreate a flag or emblem made from the actual material or colours of the group's experience, and make that emblem the visual rule of the campaign's film. Every frame obeys one strict principle tied to the flag: for example, the flag's colour is the only colour in each shot, or its material is the only element that stands out. Then give supporters the emblem in a form they can wear, print or post.\n\nThe film introduces the symbol with unusual visual force; the supporters carry it into the world.\n\n## Key mechanisms\n\n**1. A flag made of experience.** The emblem is not designed from scratch. It is made from things that carry the group's story: materials gathered from their journey, discarded fabric, or colours drawn from objects central to their experience. It may also give a stateless group the symbols of nationhood, a flag where none existed. Because the emblem is literally made of their experience, it tells the story by itself and argues for belonging without a single word of explanation.\n\n**2. One visual rule for the film.** The film is governed by a single rule tied to the emblem: the flag's colour may be the only colour on screen, or the only bright element in every frame, or the composition may borrow from a recognisable painterly tradition. Restraint sets the work apart from category norms. The audience learns to search each frame for the emblem, and by the end the look itself has become the identity of the cause.\n\n**3. A symbol supporters reproduce.** The emblem is simple enough to be worn on clothing, printed, set as a profile picture or photographed in a symbolic gesture. Supporters spread it through their own networks, and its distinctive appearance makes it easy for news coverage to picture. The movement grows through its members rather than through paid media.\n\n## How they work together\n\nThe flag's material gives the emblem its meaning; the film's visual rule gives it a memorable debut; the supporter-friendly format gives it a life after the film. Each depends on the others. A film with a strong visual rule but no emblem behind it would be a style exercise. An emblem without a striking launch might remain unknown. A beautiful launch without a way for people to adopt the symbol would end when the film ends.\n\nThere is also a feedback effect. Once audiences have seen the emblem as the single point of colour in the film, every time they meet it on a shirt or profile they see it the same way: as the one thing standing out in a grey world. The film's rule trains people to notice the symbol everywhere.\n\n## Why it works\n\n- **Material carries meaning.** A flag made from the group's real experience communicates the story instantly and invites empathy without argument.\n- **Restraint creates distinctiveness.** A single visual rule makes the film instantly recognisable and different from the look of similar causes.\n- **Symbols spread through people.** An easy-to-reproduce emblem lets the movement scale through its own supporters and appear in coverage for free.\n- **Belonging made visible.** Giving a group a flag of its own frames its claim to belong as a fact, shown rather than argued."}, {"id": "i089", "t": "# The Sound of Taking It Slowly\n\n## Context and problem\n\nAn alcohol brand lives with two constraints that most brands do not face. It carries a duty to encourage moderation, and in many places its advertising is restricted or banned outright. The usual response is a small responsibility line at the end of an advert, which reads as a warning attached to the brand rather than part of it. Restrictions also push the brand out of the media where it would normally speak, leaving it to compete for attention with fewer tools.\n\nAt the same time, alcohol brands share a crowded visual language. Bottles, glasses and bars all look alike. The brand needs a way to be distinctive, to make responsibility feel like its own choice, and to reach people in ways a ban does not cover.\n\n## The approach\n\nThe idea is to turn moderation into a branded ritual expressed through sound, and to release that sound as a scarce piece of music that fans have to seek out and share.\n\nThe brand takes the responsible act, slowing down, pausing, choosing a non-alcoholic stand-in in the same bottle, and makes it part of its signature. Slow pouring becomes a mark of quality; the pause between drinks becomes a moment the brand owns. That ritual is then given a sound: the hiss of opening, the slow pour, the clink, composed into a signature that carries the brand without needing its name or its image.\n\nThat sonic signature is released as music, but not as an abundant file. A single copy is passed between listeners; tracks are hidden at map coordinates or playable only at one physical spot; recordings are left at concerts for people to find. Getting the music requires patience and discovery, which mirrors the slower pace the ritual is meant to encourage.\n\n## Key mechanisms\n\n**Making moderation a branded ritual.** Instead of a warning, responsibility becomes part of the product experience. Slow pouring, a non-alcoholic option in the familiar bottle, or water presented as the brand's own drink are acts the brand can be proud of. The responsible choice becomes an expression of brand quality.\n\n**Designing the ritual's sound as the brand message.** Sound is a sense that rivals rarely own. By composing the opening, pouring and pause into a distinctive audio signature, the brand can be recognised wherever that sound is heard, including in places where showing the product is not allowed. The sound carries both identity and the idea of taking time.\n\n**Restoring scarcity and discovery to the release.** Music is usually infinite and free. Limiting access to one copy, one place or one discovery turns the brand's sound into an event. Fans seek it out, pass it on and talk about where they found it. The scarcity creates conversation the brand could not buy.\n\n## How the parts interact\n\nThe ritual provides the meaning: slowing down is good, and it is what this brand stands for. The sound design turns that meaning into something recognisable and portable. The scarce release distributes the sound in a way that reflects the message itself. Seeking out a hidden track or waiting for a passed-on copy is a form of patience; the mechanic acts out the ritual it promotes.\n\nEach part also helps with the brand's constraints. The ritual reframes the moderation duty as brand character. The sound lets the brand be present without visual advertising. The discovery-based release creates earned attention in culture rather than relying on restricted paid media.\n\n## Why it works\n\nIt works because it turns limits into identity. The duty to moderate becomes a ritual people associate with quality; the inability to advertise freely becomes a reason to own a sense rather than a screen; the abundance of digital music becomes an opportunity to create rarity.\n\nThe idea also stays coherent. Everything points to the same behaviour: slowing down. The pour is slow, the sound invites a pause, and the music must be found rather than streamed instantly. People who encounter any part of it experience the brand's message, and those who find the music become part of passing it on."}, {"id": "i060", "t": "# The Piggy Bank That Breathes\n\n## The problem\n\nTwo habits that matter most over a lifetime are also the hardest to teach a child: putting money aside, and understanding that spending has a cost beyond the price tag. Both suffer from the same flaw. Their payoff is distant and invisible. A balance sitting in an account is a number nobody sees; the emissions behind a purchase are a global abstraction that never shows up at the till. Children and first-time savers are told these things matter, but nothing in their daily world makes them feel it.\n\nAt the same time, the money tools adults already use have begun to surface hidden costs at the moment of purchase. That is the opening: if the same logic can be made physical and playful, a young saver can learn thrift and climate awareness as one habit, not two lectures.\n\n## The approach\n\nThe idea is a savings companion for children: a familiar household object (a money box, a lamp, a plush figure on the shelf) connected to the child's real account. It is not a novelty that pretends; it shows the true balance, live. Every deposit visibly fills it.\n\nBut the companion is also alive in a second sense. It carries a small living world (leaves, a sky, a creature's colour) that reacts to the climate cost of what the child and the family account spend. Each purchase made with the linked card carries a carbon figure, exactly as the money tool does for adults, and the companion translates that figure into something the child can see: the leaves droop, the sky dims, the creature looks unwell. Saving, choosing lower-impact purchases, or accepting an offset when a bill is paid brings it back to health.\n\nThe child's job is not to \"be green\" or to \"be good with money\". The child's job is to look after the companion. The habits follow from the care.\n\n## Key mechanisms\n\n**1. Real money, made visible now.** The companion displays the actual balance, not a pretend one. Rewards arrive in a currency the young person already wants (in-game items, unlockable content, small privileges) and are earned by completing short learning modules about saving. A long-term goal becomes a set of small, immediate, visible wins.\n\n**2. Climate cost inside the tool the family already uses.** Because the companion is linked to the card and the bill payments, the carbon figure appears automatically, at the moment of spending, without a separate app or a separate effort. A parent can set an emissions cap, and when the card reaches it, the companion signals clearly that the world inside it has had enough for now. An offset offered at bill time becomes a visible act of repair.\n\n**3. Care for the toy first, then for oneself.** The protective habit is taught the way a child learns most routines: by caring for something else. The companion's reddened or wilted state is an invisible risk made visible. Restoring it is a game. Over time, the child realises that the same choices that heal the companion are choices they make about their own money and their own world.\n\n## How the pieces interact\n\nEach mechanism covers a weakness of the others. A savings toy alone teaches accumulation but not consequence. A carbon figure alone is information a child will ignore. A caring-for-a-toy loop alone has no link to real behaviour. Combined, the real balance gives the toy stakes, the carbon figure gives it a second dimension of health, and the care loop gives the child a reason to pay attention at all.\n\nThe family also changes. Because the companion reacts to the household card, parents' purchases show up too. The child becomes a gentle auditor, asking why the leaves drooped after a particular shop. The learning travels upward.\n\n## Why it works\n\nIt works because it removes distance on both sides. Saving stops being a promise about the future and becomes a thing on the shelf that fills up today. Climate impact stops being a headline and becomes a creature in the bedroom that looks tired after a careless week. And because the child is protecting the companion rather than being instructed, the routine is accepted as their own.\n\nFor the brand behind the money tool, this turns a product feature into a relationship that starts in childhood. The first account a young person opens is the one whose companion they nursed back to health, and the habit of checking the cost of a purchase, in money and in carbon, comes with them into adulthood."}, {"id": "i087", "t": "# A Song, a Story, a Single Take\n\n## The problem\n\nHarms that happen far away, or that have become normal, are easy to ignore. Audiences have learned to tune out statistics and appeals about distant injustices. Young people in particular are hard to reach through conventional cause advertising, which they recognise and avoid. And cause films often look alike, with familiar production styles that do little to make the work memorable.\n\nThe challenge is to make an audience feel an injustice they have learned to ignore, reach young people through channels they choose, and make the work distinctive enough to stay with them.\n\n## The approach\n\nThe campaign stages the distant or normalised harm as a familiar story close to home: a fictional local character living through it, a soap-opera storyline that audiences come to demand be stopped, a lost future played out, a survivor presenting it within an everyday format.\n\nThat story is packaged as a genuine pop song and music video by artists young people already follow: a real single, featuring the cause's own participants as the cast, or a band formed from the excluded group.\n\nAnd the video is made under one production constraint committed to fully: a single uncut camera move, a first-person rig, physical imperfections added to computer imagery, or a budget limit turned into a framing rule.\n\n## Mechanisms\n\n**Bringing the harm home.** The story transplants the injustice into a setting the audience recognises. Instead of a statistic about elsewhere, viewers meet someone like them, in a place like theirs, experiencing something they would never accept for themselves.\n\n**Releasing it as music.** Because the story arrives as a real song by artists the audience already follows, it circulates as entertainment people share by choice. It is heard, sung and shared before it is recognised as a campaign. Casting the cause's participants, or forming a band from the excluded group, keeps the music grounded in real lives.\n\n**Committing to a constraint.** The video is shot with a single rule held throughout. A first-person rig places the viewer inside the character's experience; a single uncut take refuses to let the viewer look away. The craft becomes part of what the audience notices and remembers.\n\n## How they work together\n\nThe near-to-home story gives the song its content. A pop song about a distant harm in abstract terms would be forgettable; a story-song about someone close to home living through it gives the lyrics and the video emotional force.\n\nThe pop format gives the story its reach. Young people may never seek out a cause film, but they will listen to a single by artists they follow and watch its music video repeatedly. Each listen deepens the story.\n\nThe production constraint gives both their impact. A single uncut take or a first-person view turns the video into an experience rather than a performance, intensifying the feeling that this is happening here and now. And a distinctive technique makes the video stand out among both music videos and cause films, prompting people to talk about how it was made.\n\nThere is also a fit between constraint and subject. Refusing to cut can mirror the impossibility of escaping a harm; a first-person view can mirror the experience of the person suffering it. The craft is not decoration but an expression of the story.\n\n## Why it works\n\nPeople feel what happens to those close to them. Staging the harm close to home bypasses the distance that makes injustice easy to ignore.\n\nPeople share music they enjoy. Packaging the story as a genuine song by artists they follow lets the message travel by choice.\n\nAnd people remember work with a strong, consistent texture. Committing to a single constraint makes the video distinctive and gives the audience a reason to watch again.\n\nThe combined effect is a campaign that young audiences encounter as a song they like, experience as a story that could be their own, and remember as a film made unlike any other. By the time they realise it is a campaign, they already feel the injustice it set out to reveal."}, {"id": "i071", "t": "# Scan Your Street, Save Your City\n\n## What needed solving\n\nMonuments, buildings and cultural sites face destruction by conflict, neglect or deliberate erasure. Once they are gone, they are gone; and the public's sense of what is lost is usually vague, a news image of a place most people have never visited. Preservation is treated as the work of specialists, not something ordinary people can take part in.\n\nThere is also a participation problem. Even when people care, a single contribution to a large cause feels like nothing. Without seeing their part in the whole, most people never begin.\n\n## The idea in one line\n\nTurn heritage preservation into a location-based game in which players scan the threatened places around them into a shared cloud backup, and show every contribution landing on a single, public, physical reconstruction.\n\n## How it unfolds\n\n**The reframe: preservation as a backup.** The campaign borrows the logic of everyday technology. Nobody loses their photos any more, because they are backed up. Why should a city lose its monuments? By recasting preservation as backing up, the idea gives a clear, modern, achievable task: capture enough of a place that it could be rebuilt if destroyed. And it gives destruction an answer that is peaceful: whatever is torn down can be brought back.\n\n**The game board is the player's own city.** Using the phone's GPS and motion sensors, the game turns the streets the player already walks into the map. Threatened structures, statues, facades and doorways appear as targets nearby. Players walk to them and move the phone around each one, sweeping it like a net, to capture the scans that build the 3D archive. Completing a building, a street or a neighbourhood unlocks progress. Because it is played in places the player knows, it feels personal: this is not saving a distant ruin, it is backing up the corner where they grew up.\n\n**Scattered effort becomes one visible outcome.** Every scan feeds a live public map showing which places are now backed up and which remain at risk. At a central landmark, a projection or lighting change grows as contributions arrive, showing the archive filling in real time. Each player receives an image of exactly where their scan landed in the reconstructed model: this column, this window, this arch is theirs.\n\n## How the parts reinforce each other\n\nThe backup reframe gives the game its purpose; without it, scanning would be a technical chore. The GPS game gives the reframe its scale; without it, preservation would remain the work of a few experts. And the public visualisation gives individuals the reason to keep playing, because the cumulative result is visible and their own contribution is identifiable inside it.\n\nThere is also a rhetorical effect. When a site is threatened or destroyed, the archive is already there, and the reconstructed model, built by thousands of ordinary hands, becomes a counter-statement: a calm, collective refusal to let erasure succeed.\n\n## Why it works\n\n- **It gives people something to do, not just something to feel.** Concern about lost heritage rarely has an outlet. Here it becomes a walk, a sweep of the phone, and a result.\n- **It is local before it is global.** People care most about places they know. Starting in their own streets earns attention that a distant appeal would not.\n- **It makes the crowd visible to itself.** Seeing the landmark change, the map fill, and one's own piece within the whole converts a lonely act into membership of something larger.\n- **It is answerable to destruction.** The message does not depend on anger. It rests on a quiet fact: we have a copy, and we can rebuild.\n\nThe result is a cultural cause expressed as play, measured in public, and owned by the people who took part."}, {"id": "i111", "t": "# A Different Fight, in a Familiar Voice\n\n## The challenge\n\nThe brand sits in a category where every competitor makes the same claim, so it is hard to be chosen for any reason other than price or habit. At the same time, the brand already has an irreverent voice that people enjoy, and it wants to take part in internet culture without becoming just another brand awkwardly chasing trends. It also needs to be recognisable wherever it shows up, including in formats it does not control, such as creators' channels and memes.\n\n## The approach\n\nThe brand changes what it competes on, expresses that new position in its established irreverent voice through creators' and genres' own forms, and keeps everything recognisable with an identity derived from something already true of the brand.\n\nThe repositioning moves the brand away from specifications toward something rivals cannot easily claim: an emotional role, the human tension the product resolves, the need it meets rather than its category, or the opposite of what the leaders say. That position is then carried into culture in the brand's own voice. A mascot might release a rap EP; the brand might work with creators whose humour already matches its own; a meme might be riffed on with the blessing of the original artists.\n\nUnderpinning all of this is an identity built from something true about the brand: a logo, typeface, sonic cue, mascot or physical object that makes sense without explanation. A few anchors are fixed, and the rest flexes to fit each creator's format or each meme.\n\n## Key mechanisms\n\n**Redefining the competition.** By claiming an emotional role, a human tension or the opposite of the category's convention, the brand creates a difference that rivals cannot copy without contradicting what they already say.\n\n**Irreverent voice in native forms.** The brand does not explain its new position in conventional advertising. It lets the position be expressed through cultural forms the audience already enjoys, using a voice they already associate with the brand. The brand joins internet culture as a participant, not an intruder.\n\n**Self-explanatory identity with fixed anchors.** When a brand's appearance depends on creators and memes, recognisability is at risk. Marks drawn from an existing brand truth carry meaning on their own, and a few fixed anchors ensure the brand is identifiable even inside someone else's format. The flexing elements let it adapt to a rap EP, a creator's sketch or a meme template.\n\n## How the pieces fit\n\nThe repositioning gives the cultural work something to say. The irreverent voice and native forms give it a way to be heard. The identity ensures it is credited. Without the repositioning, the brand's cultural presence would be entertaining but strategically empty. Without native forms, the new position would be stated rather than lived. Without the identity, creators' and memes' versions might be enjoyed without anyone remembering which brand was involved.\n\nThere is also a natural synergy between the irreverent voice and the repositioning. A brand that says the opposite of what category leaders say is already irreverent in spirit; expressing that stance through humour, rap or memes feels authentic rather than forced. A mascot derived from the brand's truth makes a natural performer, able to carry the new position into a genre while remaining an unmistakable anchor of the identity.\n\n## Why it works\n\nAudiences engage with culture, not with category claims, and they reward brands that sound like themselves. This idea gives them a brand that has stepped out of the category's shared claim, speaks in a voice they already enjoy, shows up in the forms they already consume, and is recognisable every time. The difference is hard for rivals to copy because it lives in a position they would have to contradict themselves to adopt and in a voice they do not have."}, {"id": "i043", "t": "# Paying for the Match: Adoption That Costs Something, on a Day That Means Something\n\n## The problem\n\nRescue animals are often presented as free or nearly free. That framing sounds generous but creates two problems. First, people tend to undervalue what they get for nothing, and the adoption becomes an impulse rather than a commitment. Second, the real effort behind each animal, the rescue, the care, the patient work of rehabilitation, stays invisible, and the organisations doing that work struggle to justify asking for anything in return.\n\nThere is also a fit problem. Generic appeals with generic pictures lead to mismatches: an adopter takes home an animal whose needs they did not understand, and the match fails.\n\nThe task is to make adoption feel personal, honest and worth paying for, and to give the moment of asking extra weight.\n\n## The approach\n\nBuild an adoption campaign around three ideas working together. Match each adopter to one specific animal, shown truthfully. Justify the adoption fee by revealing the persistence and sacrifice behind getting that animal ready. Launch it on the national anniversary of a value the cause connects to, so the occasion itself makes the argument.\n\n## Key mechanisms\n\n**1. The individual match.** Instead of a stock image of a happy dog, each animal is shown as itself, in real photographs, with its real history and its difficult traits stated candidly. A search over rescue databases, or a matching process that pairs people with the animal that suits them, including people who are lonely and would benefit from the companionship, makes adoption personal. Candour about challenges is not a weakness; it is what makes the match last.\n\n**2. The price explained.** People expect a rescue animal to be cheap. The campaign answers that expectation by showing what lies behind each one: the risky rescues, the months of treatment and training, the patience of the people involved. The fee is framed with a line that reads two ways, one about cost and one about what was given, so that paying the fee becomes a way of honouring the work rather than buying a commodity. The buyer's payment connects directly to the carer's effort.\n\n**3. The anniversary as argument.** Launching on the anniversary of a national value the cause speaks to lets the date carry the message. On a day associated with that value, the campaign asks whether the nation is living up to it in how it treats the animals in its care. The occasion supplies urgency and media attention without the campaign having to manufacture either.\n\n## How the parts connect\n\nThe individual match creates the emotional pull: this animal, with this story. The explained price turns that pull into a considered decision: this animal is worth it, and so is the work that brought it here. The anniversary frames the decision as part of something larger than a personal choice, giving people a public reason to act on a specific day.\n\nStep by step: build honest profiles of each animal and a way to match adopters to them; document the work behind each animal so the fee has a visible story; craft a double-meaning line that ties price to sacrifice; time the launch to the anniversary; let individual adoption stories carry the campaign forward from that day.\n\n## Why it works\n\nIt replaces a transaction with a relationship. People do not just adopt an animal; they adopt a known individual whose history they understand and whose care they have helped pay for. Honesty about difficulty builds trust, the visible effort builds respect for the fee, and the anniversary gives the whole thing a moment of public meaning. The result is fewer impulsive adoptions, more lasting matches, and a cause that can ask for money without apologising for it."}, {"id": "i118", "t": "# One Device, Many Real Lives\n\n## The problem being solved\n\nBrands with technical benefits often struggle to make them felt. Specifications and demonstrations inform but do not move people. Attempts at emotional storytelling frequently rely on scripted casting that audiences recognise as artificial, which undermines any claim about real lives. And branded film series that try to show a brand's breadth tend to fragment: each film is different, so nothing accumulates.\n\nThe challenge is to make a technical claim felt as experience, ground it in authentic human stories, and build a body of work that shows breadth while staying coherent.\n\n## The approach\n\nThe brand builds a film series around one fixed device: the same script given to different directors, one virtue per film, a recurring character, or a repeatable structure. Genre and style vary from film to film, but the device stays constant.\n\nEach film dramatises the product's benefit through story or metaphor rather than demonstration. The benefit becomes something that happens in the narrative: a space that changes to reflect the experience, a counter that marks a meaningful moment, a companion that follows a person the way the product does, an honest downside that proves a strength.\n\nThe people in the films are real, along with their own material. The community itself is cast, subjects control their stories, real home videos or messages are used, and where someone is recreated, their family is involved.\n\n## Key mechanisms\n\n**The fixed device.** A constant element, such as a shared script, a single virtue per instalment, or a recurring structure, holds the series together. Audiences recognise it and anticipate it. Against that constant, the variations in genre and style become evidence of range: the product's benefit works in every kind of life.\n\n**The metaphor.** Within each film, the benefit is not shown but dramatised. The technical claim becomes an emotional event: something expands, something counts down, something follows faithfully. Viewers feel the benefit through the story rather than being told it.\n\n**The real material.** Each story is drawn from real people, using their own footage, words and messages, with the subjects shaping how they are portrayed. This authenticity grounds the metaphor; it is not an invented allegory but a real life seen through the lens of the benefit.\n\n## How they reinforce one another\n\nThe fixed device allows real stories to be compared. If every film uses the same script, for instance, delivered by real people in very different circumstances, the differences between their lives become vivid and the shared benefit becomes clear. If each film focuses on one virtue, real subjects can be matched to the virtue they embody.\n\nReal material makes the metaphor credible. A dramatised benefit in a scripted film is a nice idea; the same dramatisation applied to someone's actual home videos or messages becomes moving because it is true.\n\nThe metaphor, in turn, makes real material persuasive for the brand. Authentic stories alone can be beautiful but unrelated to the product. When each story is shaped around a metaphor for the product's benefit, the brand's claim is woven into the narrative without needing to interrupt it.\n\nDifferent directors or styles add a further layer: each director interprets the device and the real material in their own way, so the series displays not only the range of people the product serves but also the range of feelings it can evoke.\n\n## Why it succeeds\n\nPeople believe what they see in real lives more than what they hear in claims. People remember stories more than specifications. And people come back to series whose structure they recognise. This idea combines all three.\n\nThe fixed device builds familiarity and makes variety legible as breadth. The metaphors turn the technical into the emotional. The real material makes the emotional true. The result is a series that proves the product's benefit across many kinds of lives, in a form audiences recognise, return to and trust."}, {"id": "i046", "t": "# The Open Heritage Hunt\n\n## Context and tension\n\nThreatened heritage is usually protected, if at all, by institutions with limited budgets. The public watches important places disappear and has no part to play. Some efforts invite volunteers to help, but they rarely scale: a single organisation can only run so many projects, fund so many tools or reach so many places. And invitations to contribute often feel like work rather than something people want to do.\n\nThe task is to involve the public in protecting heritage, make participation enjoyable and personal, and allow the effort to grow far beyond what any one creator could finance.\n\n## The approach\n\nBuild a game that turns the player's real surroundings into the board, with the objective of capturing threatened buildings and monuments into a shared archive so that they can be rebuilt if lost. Then release everything openly: the game's code, the capture tools, the resulting 3D models and an open fund that others can contribute to. Anyone can adapt the game for their own city, use the scans, or print and rebuild what has been saved.\n\nThe brand provides the spark; the public and the open release carry it everywhere.\n\n## Key mechanisms\n\n**1. A game played in the player's own world.** Using GPS and motion sensors, the game makes the player's streets, journeys and neighbourhood the playing field. They are guided to real sites, move physically around them with the phone to capture them, and can claim streets or districts they have documented. Because the game is played in places people know, protecting heritage becomes a personal mission rather than an abstract cause.\n\n**2. Heritage as a backup.** The purpose of the game is to back up heritage. Scans of threatened monuments go into a cloud archive, so what is destroyed can be rebuilt. This reframes loss as recoverable and turns any future rebuilding into a peaceful counter-statement to destruction.\n\n**3. Everything released openly.** The code, the scanning tools, the archive's models and printable files are all released openly and free. Others can run their own versions, contribute to an open fund, or build on the archive. This lets the idea spread far beyond the creator's budget and positions the brand as a giver.\n\n## How the parts combine\n\nThe game makes capture fun and local. The backup reframe makes it meaningful. The open release makes it scalable. Each needs the others: a game without purpose is a diversion; a backup appeal without play attracts few volunteers; a closed project cannot grow beyond its owner's means.\n\nReleased openly, the game can be adapted to any city, language or community, and the archive becomes a public resource for researchers, educators and future rebuilders. The brand, by giving everything away, gains credibility as an enabler of the public good.\n\nThe flow for a single player shows how tightly the pieces connect. They open the game and see their own neighbourhood as the map, with threatened places marked as targets. They walk to one, circle it with the phone to capture it, and watch it appear as a model in the shared archive. That model is immediately available to anyone, so a local history group could print it, a school could study it, or a community elsewhere could fork the game to cover its own streets. Over time, many versions of the game run in many places, all feeding the same open archive. No single organisation pays for that growth; it happens because the tools are free and the purpose is clear.\n\nOpen release also answers a natural suspicion. A brand collecting people's scans of cultural places could look like it is building an asset for itself. By making the archive and the tools public, the brand removes that doubt and makes clear that the heritage belongs to everyone.\n\n## Why it works\n\n- Agency: people can do something real to protect heritage.\n- Personal relevance: playing in familiar places makes the mission feel close.\n- Scale: open release multiplies the effort beyond any single organisation's budget.\n- Generosity: giving the tools away casts the brand as a giver, which earns trust."}, {"id": "i045", "t": "# The Screen in the Street\n\n## The problem\n\nSome conditions are easy to catch early and devastating when caught late, yet most people never get tested. The obstacles are mundane: booking an appointment, paying for it, and the quiet fear of what the result might say. Awareness messaging rarely moves this, because the problem it describes is invisible. Nobody walks past an undiagnosed illness. And charities that want to fund more screening face a second wall: asking the public for money competes with every other appeal they see that day.\n\nSo the brief has three knots tied together. Make an unseen harm physically present. Make the first test so easy that the fear and friction disappear. And fund more tests without asking anyone to open their wallet.\n\n## The approach\n\nThe idea is a public intervention that does all three in one encounter. A physical stand-in for the harm is placed in an ordinary street, where people pass it on the way to work or the shops. Built into that encounter is a first health screen that uses something every passer-by already carries: their phone. Taking the screen, and sharing it, is the act that triggers a fixed donation to fund screening for someone who could not otherwise get it.\n\nThe audience does not read about the illness. They meet it, test themselves for it, and pay for someone else's test, all without an appointment, a fee or a donation form.\n\n## Key mechanisms\n\n**1. The harm made physical.** The centrepiece is an object placed where the problem is least expected: in the everyday street rather than the clinic. Where possible it is made from the real material of the harm, or acts as a direct physical stand-in for what the condition takes away. It interrupts routine in the way a news report cannot. People stop, touch it, photograph it. The point is presence: the condition stops being a statistic or a leaflet and becomes something standing in front of you.\n\n**2. The first screen, using what you already own.** Next to the object, the passer-by is invited to take a simple first screen with their own phone, using a capability it already has, such as its camera flash, its microphone or its screen. Because the tool is familiar and already in the pocket, the three barriers fall away at once. There is no appointment to book, no cost, and the fear is softened because this is a first look, not a diagnosis, done privately in a few moments. Anyone flagged is pointed to proper follow-up.\n\n**3. The share that becomes a donation.** Completing the screen produces something worth posting: an image or result card tied to the street object. Each post is converted into a fixed, countable donation, a set amount or a set number of screenings funded per share, paid by the campaign's backers rather than the participant. The supporter gives without spending, and every post carries the object, the test and the cause to a new audience who did not walk down that street.\n\n## How the parts interact\n\nThe three mechanisms form a loop rather than a list. The physical object creates the stop and the emotional charge; without it, a phone test is just another app nobody downloads. The phone screen converts that charge into a personal action, so the emotion lands as \"this could be me\" rather than \"how sad\". The donation mechanic converts the personal action into a public one, which sends the image of the object far beyond its location and brings new people to try the screen themselves, online or in the next street where the object appears.\n\nEach participant therefore plays three roles in sequence: witness, patient and broadcaster. And each share is countable, so the campaign can report a running total of screens taken and tests funded, a concrete measure of impact that also becomes fresh news.\n\n## Why it works\n\n- **It removes the real barriers, not just the ignorance.** Most health campaigns tell people they should get tested. This one hands them the test at the moment they are moved to take it.\n- **Presence beats description.** A physical stand-in in a familiar place is hard to scroll past, and it gives the press and social feeds an image rather than an argument.\n- **Giving costs nothing.** Turning a free action into a fixed donation lowers the threshold for generosity to a tap, and the fixed amount makes each act feel meaningful.\n- **Distribution is built in.** Every person who takes part becomes a carrier of the message, so reach grows with participation instead of with media spend.\n- **The story closes on itself.** The harm is shown, the individual checks themselves, and their action helps someone else check too. The campaign does not only point at a problem; it visibly starts to shrink it."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
