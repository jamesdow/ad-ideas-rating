(function () {
  "use strict";
  var DATA = {"pack": "P02", "items": [{"id": "i096", "t": "# Breathe Here\n\n## Problem statement\n\nSome harms are counted in figures so large that they have become background noise. People hear that many lives are lost each year to a common, preventable cause, and nothing changes in how they feel. The number does not belong to anyone they know or any place they stand.\n\nOutdoor and digital media usually contribute to that indifference. A poster carries the same message at dawn and midnight, in sunshine and rain, to someone running for a train and to someone sitting in traffic. It is information about nowhere in particular.\n\n## What we propose\n\nA network of outdoor and digital screens that reads the live conditions of the street (the local air, humidity, the traffic jam ahead, the train approaching, the plane overhead) and, when conditions match the harm being addressed, introduces passers-by to one person whose life was ended by it. Each introduction is carried by sound: a recording that lets the viewer hear the world as that person heard it, or a soundscape that makes the invisible condition audible.\n\n## The mechanisms\n\n**Conditions decide when the message plays.** The screens are fed by live data from their immediate surroundings. Where the harm relates to the air, for instance, the screen activates when the local reading worsens. Where it concerns roads, it responds to the traffic building nearby. Where it concerns transport, it waits for the train's arrival. The placement turns from a fixed advert into a timely message about the exact spot where the viewer is standing.\n\n**Each activation reveals one person.** The screens never show a total. Every activation presents an individual: a name, a portrait, an empty seat at a bus stop, a balloon released in their memory. Across many locations and many days, the total accumulates one person at a time. People can count them, recognise local names, and return to see who is shown next. The overwhelming number becomes a set of individual absences the public can meet.\n\n**Sound makes the invisible felt.** Alongside each person, a directional speaker or a headphone link plays recorded or reactive audio. It might be a binaural recording made in that person's neighbourhood, or the ambient sound of the very street where the viewer stands, transformed to express the invisible condition: the air thickening into a low, heavy tone as pollution rises, for example. A track may last precisely as long as the harmful condition persists. The audience is placed inside the subject rather than in front of it.\n\n## How the three combine\n\nThe live data supplies relevance: the message appears when the risk is real and present. The individual supplies empathy: the person shown could be a neighbour. The sound supplies immersion: the viewer does not just see, they hear what is otherwise unseen. The result is an encounter that is local, specific and felt, rather than a statistic that is read and dismissed.\n\nBecause the triggers and the people vary, the screens are never the same twice. Viewers record and share particular moments, especially when a name they recognise appears. Local press and residents begin to follow the screens as a running memorial driven by their own conditions.\n\n## Why it works\n\n- **It meets the viewer in their actual moment.** Messages tied to live conditions demand attention because they describe now.\n- **It honours individuals.** People feel loss one person at a time, not in aggregates.\n- **It uses sound to cut through visual clutter.** Hearing an invisible condition makes it undeniable.\n- **It makes the harm local.** The question changes from \"how many?\" to \"who, and here?\".\n\nThe street itself becomes the messenger, and the number becomes neighbours."}, {"id": "i065", "t": "# One Tap, Remembered Since Childhood\n\n## The problem\n\nA protection brand's value is usually felt only after harm has happened. Its purpose, keeping people safe, is hard to prove, and launches of new safety services often struggle to gain trust or use. People are reluctant to adopt something new, and when the moment of risk arrives, any service that requires effort is likely to be forgotten.\n\nThe brand needs a safety tool people trust from the start, that intervenes before harm occurs, and that is so easy to use that it works even in a stressful moment.\n\n## The approach\n\nThe idea is to launch a one-gesture safety tool rooted in the brand's own history, built from what the brand already owns, so that the new service arrives feeling familiar and requires nothing more than a single tap.\n\nThe launch draws on the brand's past. An anniversary, a founder's belief in prevention, an unaltered archive, or the adults who grew up with the brand give the new tool a story. The message is that the brand has always stood for protecting people, and this tool continues that commitment. Audiences' existing memories of the brand carry the launch.\n\nThe tool is built from owned assets. The brand's data, research and claims operations reveal when and where harm is likely. Its vehicles and products in the field can respond. The new tool connects people to that knowledge and those resources at the moment of risk, intervening before something goes wrong.\n\nThe tool is reduced to the smallest possible gesture. Following the pattern of a one-tap reorder, a one-button magnet, or a single emoji that triggers a saved order, the safety action is a single tap or symbol. In a moment of risk, the person needs only to make that gesture, and the brand's systems do the rest.\n\n## Key mechanisms\n\n**Anchoring in the brand's past.** Linking the tool to the brand's history makes it feel earned. People trust it because it continues something they already know and associate with the brand.\n\n**Redeploying owned assets to prevent harm.** Using the brand's data, research and resources as a live tool shifts its role from payer to protector. The tool is proof of purpose that people can use.\n\n**Reducing action to one gesture.** Making the tool usable with a single tap removes friction at the most critical moment. It also demonstrates that the brand can be reached from anywhere.\n\n## How the parts interact\n\nThe history provides trust, the assets provide capability, and the gesture provides access. A person who remembers the brand from childhood is more likely to adopt the new tool; the tool works because the brand's knowledge and resources stand behind it; and it is used because it requires almost no effort.\n\nEach part supports the others. Without the history, the tool would be a new product with no emotional connection. Without the assets, the gesture would trigger nothing meaningful. Without the gesture, the tool would be too cumbersome to use when it matters. Together they make prevention feel familiar, capable and effortless.\n\n## Why it works\n\nIt works because it addresses the main barriers to adopting a safety service: trust, usefulness and ease. The brand's past makes people believe in the tool; its assets make the tool genuinely protective; the single gesture makes it usable under pressure.\n\nIt also redefines the brand's relationship with its customers. Instead of a brand that pays after harm, the brand becomes a protector that is always one tap away. That shift, carried by memories people already hold, gives the brand a lasting presence in everyday life."}, {"id": "i130", "t": "# The Gallery Without Doors: Using Audience Data to Commission Outside Creators Who Open Culture Through New Points of Access\n\n## Problem\n\nCultural institutions hold work that many people never see. The barrier is not always cost; it is the venue itself. A museum, theatre or concert hall feels like a place for other people, with rules and codes that newcomers do not know. Brands that sponsor culture tend to reinforce this by attaching their logo to the existing institution, which reaches the audience that already goes.\n\nTwo further weaknesses compound the problem. Brand-led cultural projects are often recognisable as advertising and are treated as such. And the choice of what to open up, and for whom, is usually based on the brand's guess about what people might want.\n\n## Approach\n\nThe reconstructed idea assembles three components into a single programme.\n\n**Data chooses the brief.** The brand starts from what it already holds: answers users have given, search trends, customer lists and results of past campaigns. This data is used to decide which cultural works to open, which audiences to reach, which markets to start in and which creators to partner with. If the data shows that people search for a certain kind of work but never visit the venues that show it, that gap becomes the programme's target.\n\n**A new point of access.** The selected work is opened through a format that bypasses the venue: augmented or virtual reality, a phone-native format, reproductions placed in the street, a geolocated trail through a city, or a cheap headset delivered with a newspaper. People explore the work on their own terms, at home, on the commute or walking through their own neighbourhood.\n\n**An outside creator in their own form.** Rather than building the experience as a branded production, the brand hands it to a respected creator working in their own medium: a documentary-maker, a theatre company, a film director who does not make ads, or a crew of insiders from the community the data identified. The brand's presence is kept light, credited rather than centred.\n\n## Key mechanisms\n\n- *Evidence instead of instinct.* Because partners, content and markets are selected from data about demonstrated interest, the programme is built around demand that already exists. This reduces the risk of opening work nobody asked for and lets the brand explain its choices.\n- *Access redesigned around the person.* A trail through the streets or a headset arriving with the morning paper removes the intimidating threshold of the venue. The format meets people where they already are, in physical and digital space.\n- *Credibility borrowed from genuine authorship.* An outside creator gives the experience integrity. It becomes a piece of culture that can be reviewed, discussed and shared as work in its own right, not as a sponsor's activation.\n- *Feedback loop.* The new access formats themselves generate data: which works were explored, where, for how long. That feeds the next round of choices.\n\n## How it fits together\n\nThe data answers *what* and *for whom*; the new access format answers *how*; the outside creator answers *in what voice*. Each element makes the others stronger. Data without a compelling creator would produce a technically correct but lifeless experience. A great creator without a new access format would still be confined to the people who visit venues. A new format without data would risk opening the wrong things to the wrong people. Combined, they produce culture that reaches newcomers, feels authored rather than marketed and is grounded in real appetite.\n\n## Why it works\n\nThe brand earns a place in culture by expanding it, not by decorating it. People who would never cross a gallery threshold encounter significant work through means they already use. The respected creator ensures the experience is judged on its merits, and the data ensures the investment goes where interest has already been demonstrated. The brand ends up associated with the act of opening doors, which is a more valuable role than that of a name on a banner at the entrance."}, {"id": "i145", "t": "# Every Step Saves a Stone\n\n## The problem worth solving\n\nThreatened heritage tends to be framed as tragedy. A building falls, a monument is defaced, a site is lost, and the public watches it happen from a distance. People feel sorrow but no agency. Preservation belongs to specialists; the rest of us read the news. A campaign that wants to change this has to give ordinary people something meaningful to do, make it feel close to home, and show them that their small contribution matters.\n\n## The approach\n\nTreat heritage as data that can be backed up, and recruit the public to do the backing up as a game that takes place in their own neighbourhoods. People walk, explore and capture the buildings and monuments around them with their phones; every capture adds to a cloud archive from which lost places can be rebuilt. The progress of the whole effort is turned into something visible in public: a well-known landmark that changes as the archive fills, or a live map on which every player can find the exact spot their contribution occupies.\n\n## Key mechanisms\n\n### Backup, not mourning\nThe campaign's central reframe is that heritage does not have to be lost forever. If enough people scan threatened places, destruction can be undone. That shifts the story from helplessness to resilience. It also turns the act of rebuilding, when it comes, into a peaceful answer to whoever caused the loss: whatever is destroyed can come back.\n\n### The player's own streets as the board\nThe capture is designed as a game that runs on the phone's GPS and motion sensors. The map is the player's real surroundings. Quests lead them to places they pass every day; capturing a facade means physically moving around it with the phone; claiming a street or district rewards thoroughness. Because the board is the player's own town, the game becomes personal. People protect the places they know.\n\n### One visible outcome from many hands\nIndividual scans happen in thousands of separate places, so the campaign gathers them into a single public result. A landmark's lighting may change as the archive grows; a live map may fill in, street by street; each player may receive an image showing exactly where their scan sits within the whole. Scattered participation becomes one shared achievement that everyone can see.\n\n## Why the three belong together\n\nWithout the backup reframe, a location game is just entertainment. Without the location game, a backup appeal is a request for volunteers that few would answer. Without the visible outcome, players have no sense of the larger effort and the media have no image to cover.\n\nCombined, they create momentum. The reframe gives every capture a purpose. The game makes capturing fun and local. The visible outcome shows progress, encouraging players to fill gaps and recruit others. As the map grows, it also becomes a record of how much heritage people cared enough to save.\n\n## Why it works\n\n- People act when they are given agency, not just information.\n- Play in familiar places makes a global cause feel personal.\n- Visible collective outcomes make each person's contribution feel significant and keep participation growing.\n- The archive itself is a lasting asset, and the campaign's image of public rebuilding is a counter-statement to destruction."}, {"id": "i048", "t": "# Concert Beyond the Border of the Law\n\n## The situation\n\nA restrictive law bans something people want to do: gather, speak, access a service, or perform. Arguing against it head-on runs into entrenched positions and legal walls. Supporters who live far away or are afraid to show up have no way to take part. And messages of protest, if released digitally, become just more content in an endless feed.\n\nThe challenge is to protest the law in a way that is lawful, makes a powerful image, draws people in, and shows how many care.\n\n## The approach\n\nFind the only legal route around the law and stage a music event there: in international waters, on a platform outside the law's jurisdiction, or through holograms where bodies are banned. The music is released only there, as a scarce, place-bound experience. Fans who cannot attend contribute remotely, and their participation is made visible as one physical outcome at the site: messages projected or chalked, lights that change with each vote, or an image showing exactly where each person's contribution appears.\n\n## Key mechanisms\n\n**Acting out the legal route.** The campaign identifies the one way around the restriction that remains legal and performs it publicly. Holding the event beyond the law's reach, or using a stand-in where people are not allowed, produces an image that argues by itself: the absurdity of the rule is visible in the very need to escape it.\n\n**Music made scarce.** The performance's music is released only at that location, or as a single copy, or at coordinates. Fans must seek it out; it cannot simply be streamed. The scarcity turns the release into an event people talk about and share.\n\n**Remote participation made visible.** People everywhere can support the protest by sending messages, votes or acts, which are turned into a single public outcome at the event site. Each contributor can see where their part landed. Scattered support becomes a visible, physical crowd, even when people cannot attend.\n\n## How it holds together\n\nThe legal-route event gives the protest its image and its argument. The scarce music gives people a reason to care, seek out and share. The visible remote participation gives the protest its scale, showing that the event represents many people, not just those present.\n\nEach strengthens the others. The image of a concert held beyond the law's reach is compelling; the scarcity of the music means coverage includes the story of who heard it and how; the visible messages from remote supporters show the depth of opposition. Together, they create a protest that is lawful, memorable and visibly supported.\n\nThe sequence matters too. Before the event, word spreads that music will be released only at a place the law cannot touch, which builds anticipation and invites supporters to send their contributions in advance. During the event, those contributions appear at the site alongside the performance, so the few who are physically present stand among the many who are not. Afterwards, each contributor can find the record of exactly where their message appeared, and those who heard the music carry the account of it back home. The protest is therefore experienced in three ways at once: as a performance, as a crowd and as a story, and each of those reaches a different part of the audience.\n\nThe design also protects participants. Because every element stays on the right side of the law, nobody has to risk punishment to take part, which widens the circle of supporters to include the cautious and the far away.\n\n## Why it works\n\n- **Images argue.** Showing the lengths needed to get around a law exposes its absurdity without debate.\n- **Scarcity creates attention.** Music that must be sought out becomes an event and spreads through word of mouth.\n- **Scale made visible.** Turning remote support into one public outcome shows the protest's breadth and includes those who cannot attend.\n- **Lawful defiance.** Staying within the law protects participants while making the rule look untenable."}, {"id": "i047", "t": "# Playing for One Name\n\n## What needed solving\n\nCauses that depend on public pressure suffer from fragmentation. Supporters act in many places at once, posting, giving, talking, but their activity is scattered and the press sees noise rather than a campaign. At the same time, large communities are hard to reach with conventional appeals. Gamers, for example, spend hours inside game worlds where a donation request from outside feels like an interruption. And films made for causes often tell the audience how to feel, which makes them easy to scroll past.\n\nThe task is to gather a dispersed community into one visible campaign, to let a gaming audience contribute without leaving the game, and to make the cause felt with enough force that people choose to join.\n\n## The idea\n\nThe idea is a single named container for the movement, fed by actions taken inside games, and launched by a film whose music deliberately contradicts its images.\n\nThe container is one name, for instance a hashtag that names exactly what the movement wants changed, backed by a place where stories and actions are collected and a coordinated moment when everyone posts at once. Every contribution, wherever it happens, is routed into that name.\n\nInside games, players support the cause through things they already do. A charity cosmetic item appears in the in-game shop; a challenge is named after a familiar game move; the community is set collective win targets. Buying the item, completing the challenge or reaching the target counts as an act under the movement's name, and it is visible to other players in the game.\n\nThe launch film sets bleak or chaotic footage of the problem against music of the opposite mood: a cosy carol, a children's tune, a sweet old song. The clash between sound and image carries the meaning.\n\n## Key mechanisms\n\n**One named container.** A single, specific name turns thousands of separate acts into one story. Because the name states the goal itself, every use of it repeats the demand. A searchable library of stories and a coordinated posting moment give the press something to follow and count, so the movement reads as sustained rather than sporadic.\n\n**Giving through play.** For gamers, contributing becomes part of the game rather than a separate request. The cosmetic item is worn and seen by others, the named challenge spreads as a game ritual, and the collective target creates a shared mission. Support is visible inside the community, which encourages more players to join.\n\n**Music that contradicts the image.** The film does not explain the problem in copy. Instead, it lets a gentle or cheerful song run over hard footage. The dissonance jolts viewers, because what they hear tells them the world should be one way while what they see shows it is another. In some moments the clash can also lend a dark comic lightness that makes the film shareable without trivialising the subject.\n\n## How the parts interact\n\nThe film creates the emotional spark and introduces the name. The games provide a large, active community with a frictionless way to act. The name gathers both, so that a player completing a challenge and a viewer sharing the film are visibly part of the same campaign. The contradiction in the film can even travel into the game: the same gentle tune can accompany the charity item or the challenge, linking play back to the hard images.\n\nWithout the single name, the in-game actions would be isolated charity moments that nobody outside the game notices. Without the games, the name would rely only on people who already post about causes. Without the film, neither would have the emotional charge that makes people want to act.\n\n## Why it works\n\nIt works because it meets each audience where it already is and then connects them. Gamers give by playing, viewers respond to a film that surprises them, and everyone's activity is collected under one banner that the press and the public can track.\n\nThe contradiction between music and image makes the cause memorable without lecturing. The visible in-game items and challenges turn support into a social signal inside a community that values what others can see. And the named container turns many small acts into one accumulating, reportable campaign, which is what gives a movement the weight to change what it names."}, {"id": "i139", "t": "# The Street Object the Public Composed\n\n## The brief behind it\n\nBrands that make a public claim about being useful often struggle to prove it. A film can say the brand improves daily life, but the audience sees only advertising. Contests that invite the public to take part tend to stay small, because entrants have little reason to spread the word. And outdoor media, however striking, is usually a picture that sits in the street doing nothing.\n\nThe brand wants a single idea that proves its usefulness physically, draws the public into creating it, and spreads through the participants themselves, while carrying emotion strongly enough to be remembered.\n\n## The approach\n\nThe idea is a public contest to design working street infrastructure, where the winning designs are built as the brand's advertising, and the whole effort is told through a film whose structure and meaning are set by music.\n\nThe brand invites people to design objects that would serve the street: a poster that bends into a bench or a rain shelter, a die-cut board that holds donated clothes, a structure that produces something people need, such as drinking water drawn from the air. Entrants submit designs, the public votes on finalists, and entrants are encouraged to rally their own followers to support them. The designs that win are manufactured and installed as the brand's outdoor placements.\n\nA film documents the journey from idea to installation. Rather than explaining the process through voice-over, the film is built around music: an existing track whose tone or history carries the argument, a chant that grows as the community joins in, or a music video assembled from tableaux of each installation in use.\n\n## Key mechanisms\n\n**The public designs what the brand makes.** Inviting people to design the infrastructure gives them ownership. Because entrants need votes, each one becomes a distributor, sharing the contest with their own networks. The contest becomes the campaign's reach.\n\n**Advertising as working infrastructure.** The winning designs do something useful in the street. Shelter, seating, clothing collection or water are proof of the brand's claim performed in public. People encounter the brand by using what it built.\n\n**Music as the film's structure.** The film's emotional arc follows the music rather than an explanation. A chant can represent the community's growing voice; an existing song can carry meaning about public spaces or togetherness; tableaux set to rhythm can show the objects in use. The music lets the film convey feeling without telling the audience what to think.\n\n## How the parts interact\n\nThe contest generates ideas and audience at the same time. The infrastructure turns the best ideas into tangible proof. The film gathers the story, from entries and votes to installations in use, and gives it emotional shape through music.\n\nEach part feeds the next. Entrants promote the contest because they want to win; the winning objects become physical evidence of the brand's usefulness; people using the objects appear in the film; the film, carried by its music, brings new audiences back to the brand and potentially to a future round of the contest. A chant used in the film can even begin as something entrants or voters sing, so the music emerges from the participation itself.\n\nWithout the contest, the infrastructure would be a brand stunt. Without the infrastructure, the contest would produce designs with no real-world impact. Without the music-driven film, the story would remain scattered across the places where the objects stand.\n\n## Why it works\n\nIt works because it combines participation, proof and emotion. The public is involved from the beginning, so they care about the outcome. The outcome is useful, so the brand's claim is demonstrated rather than asserted. And the music gives the story an emotional resonance that copy could not.\n\nThe idea also scales naturally. Every entrant who rallies followers expands the audience. Every installation adds another piece of public proof. And the film, structured by music, can be shared as culture rather than as an advert, extending the life of the idea well beyond the contest."}, {"id": "i059", "t": "# Draw It, and You've Drawn Us\n\n## The problem\n\nThe brand leads its category, but saying so sounds like boasting, and claims of leadership are exactly the kind of message audiences doubt. Polished casts performing enthusiasm for the brand only make the claim seem more manufactured. The brand needs to show that it owns the category in people's minds without saying it, and to do so in a way that people enjoy and believe.\n\n## Approach\n\nThe brand lets real people demonstrate its category ownership through their own unprompted behaviour, casts people who naturally live its attitude, and frames the whole exercise with self-deprecating or deadpan humour.\n\nThe demonstration is simple. People are asked to do something generic, such as draw the generic product, and they draw the brand instead. An AI is asked for the category and produces the brand's pack. An everyday object turns out to share the brand's shape. The audience's own recall becomes the advertisement.\n\nThe people taking part are not actors. They are street-cast fans, real families, members of a subculture, or a non-actor at the centre, with any famous faces kept to cheering cameos. Their responses come through in how they simply are.\n\nThe tone is gently absurd. The brand might play the experiment with total seriousness, as though running a solemn scientific study, or poke fun at itself, perhaps pretending to be surprised, or even inconvenienced, that everyone keeps drawing it.\n\n## Key mechanisms\n\n**Category ownership through unprompted behaviour.** When people produce the brand on their own when asked for the category, the brand does not need to claim anything. The evidence comes from the audience's memories, and viewers can test it on themselves.\n\n**Real people living the attitude.** Street-cast fans and real families make the demonstration believable. Their reactions and drawings are not performances, and their natural way of being conveys the brand's attitude in a way actors could not.\n\n**Self-deprecating or deadpan humour.** A leading brand demonstrating its dominance risks arrogance. Humour defuses that. Playing the experiment straight, or making the brand the butt of the joke, turns potential irritation into amusement, and the claim is accepted as entertainment and shared.\n\n## How the components interact\n\nThe unprompted-recall test is the proof, the real people are the witnesses, and the humour is the delivery. The test only works if the people taking it are believable, which is why casting matters: the more ordinary and genuine they are, the more persuasive their drawings become. The humour then makes the proof something people want to watch and pass on, rather than a dry statistic about awareness.\n\nThe elements also share a natural comedy. Watching real people try to draw a generic product and fail, again and again, to draw anything except the brand is inherently funny. Treating this with mock seriousness, or with the brand pretending to be embarrassed by its own fame, heightens the effect. And because the participants are real, their surprise when they see what they have drawn is genuine, which is both funny and convincing.\n\n## Why it works\n\nLeadership is most credible when it is shown by others, and most likeable when the leader does not take itself too seriously. This idea lets real people's memories do the talking, casts people whose authenticity makes the demonstration believable, and uses humour to keep the brand humble while it proves its point. Every viewer can repeat the test in their own head, which means the advertisement continues working long after the film has ended."}, {"id": "i035", "t": "# The Track That Dissolves\n\n## What was wrong\n\nDistant disasters (an oil spill on another coast, a war far away, a flood in a country most people have never visited) reach the public as images and headlines. They are read, regretted and forgotten. The harm never becomes physically present in anyone's daily life.\n\nMusic faces a different problem: abundance. Any song can be played anywhere at any moment, so very few releases feel like events. Listeners collect nothing and seek nothing.\n\nThis idea makes a distant harm physically present in an everyday street, gives it a sound that places the audience inside it, and releases that sound in a way people must seek out in person.\n\n## The approach\n\nBuild a temporary memorial object from the real material of a harm, or a physical stand-in for it, and place it in an ordinary public space. The object is also an instrument: it produces or plays a piece of music that exists only there, for as long as the object survives. When the object is gone, so is the song.\n\n## Key mechanisms\n\n**The harm made physical.** The object is built from the actual remains of the damage, for example oil-spill residue shaped into art, or it stands in for it, such as a soldier sculpted from mud that dissolves in the rain, or a half-sunken house placed in a city lake. People do not read about the problem; they walk past it on their way to work. The material itself carries the truth of what happened.\n\n**Sound as the missing sense.** The object is wired with recorded and reactive audio that puts listeners inside the place of the harm. Binaural recordings from the affected region, the wind across the damaged landscape, or music derived from the object's own textures play as people approach. As rain dissolves the mud figure or the tide moves the sunken house, the sound changes with it. The track lasts exactly as long as the physical object, so its length itself is a measure of loss.\n\n**A song you have to go and hear.** The music is not streamed. It can be heard only at the object's location, in person, while the object lasts. A single recorded copy may be passed among listeners after the object has gone, or hidden at coordinates nearby for those who come later. Scarcity turns listening into an event, and fans share the experience, drawing more people to see the object before it disappears.\n\n## How the mechanisms work together\n\nThe object provides presence: the problem is in the street. The sound provides immersion: the problem is in your ears. The scarcity provides urgency: if you do not go, you will never hear it. Each makes the others stronger. A sculpture alone can be passed by; a soundscape alone can be ignored; a scarce release alone lacks meaning. Combined, they create an encounter that people seek, remember and recount.\n\nThe dissolving or degrading nature of the object makes the metaphor plain: like the places harmed, it is being lost, and the audience is watching and hearing it happen.\n\n## Why it works\n\n- **It brings the distant close.** A physical, local object makes a far-off harm impossible to treat as abstract.\n- **It engages more than sight.** Sound places people inside the harm and makes it felt rather than observed.\n- **It creates a reason to show up.** A song that can only be heard in one place, for a limited time, turns the memorial into a destination.\n- **It lets time do the storytelling.** As the object dissolves and the sound fades, the audience experiences loss in real time.\n\nThe result is a disaster you can stand beside, listen to and lose, which is how the people living through it experience it too."}, {"id": "i036", "t": "# Hired Through the Puzzle\n\n## Problem\n\nRecruiting for a demanding role is often a mismatch between the process and the job. Applications reward people who are good at writing applications; interviews reward people who interview well. The people with the right skills — curiosity, persistence, problem-solving, attention to detail — may never apply, or may be screened out. A conventional recruitment campaign announces vacancies and then filters candidates in ways that bear little relation to the work.\n\n## Approach\n\nThe idea is to recruit through a trail of clues and puzzles that tests the very skills the job demands, and to tell that trail through a branded film series held together by one fixed device. The clues appear before any vacancy is announced; solving them is the application. The film series carries the clues and builds the story, with each episode made in a different genre while keeping the same structure. By the time the role is revealed, the people who have reached it have already shown they can do it.\n\n## Key mechanisms\n\n**A trail of clues as the application.** The campaign begins with a seeded phrase, a symbol or an unexplained hint, followed by a cross-platform chain of puzzles. Each step requires a skill the role needs. Participants who keep going become investigators, and those who reach the end have self-selected through the job's own demands. A surprise early drop can reward the most dedicated solvers.\n\n**A programme designed around the people it must reach.** The process is shaped around the specific candidates the organisation needs rather than generic applicants. Candidates are filtered through the job's own skills; messages can be phased according to audience; quotas per region can ensure solvers from everywhere are considered. Young people paid as consultants might help design the puzzles so they reach the audience in the right way. The offer fits the candidates rather than the other way round.\n\n**A film series with one fixed device.** Clues are embedded in a series of films. Every film obeys the same fixed device — the same script handed to different directors, a recurring character, or a repeatable structure — while genre and style vary from episode to episode. The variety itself shows the range of the organisation and the many kinds of people and work within it, while the fixed device makes each film recognisable as part of the trail.\n\n## How it all fits\n\nThe trail gives the campaign momentum; the audience-centred design gives it purpose; the film series gives it reach and craft. Without the trail, the films would be recruitment advertising; without the films, the trail would be confined to a small group of enthusiasts; without the audience-centred design, the puzzle might reward cleverness unrelated to the job. Together, they produce a process that is entertaining to watch, meaningful to take part in and accurate as a filter.\n\nThe fixed device is particularly useful for hiding clues. When every film follows the same script or structure, small differences between them stand out — and those differences can be where the clues sit.\n\n## Why it works\n\nThe best test of whether someone can do a job is to let them do a version of it. By turning recruitment into a puzzle built from the role's own skills, the organisation finds the people it needs, including those a conventional process would miss. By wrapping the puzzle in a film series that varies in style but holds one constant, it reaches a wide audience and demonstrates its own breadth."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
