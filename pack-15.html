(function () {
  "use strict";
  var DATA = {"pack": "P15", "items": [{"id": "i013", "t": "# The Open Monument\n\n## Context\n\nBrands that build things often struggle to communicate what they value about building. Engineering precision, elegant design, care for materials: these are claims every competitor makes, and they read as empty when written in an ad. At the same time, brands that want to support a cause run into the opposite problem. Their sponsorship looks like ownership, and movements are wary of being branded.\n\nThe task is to show a brand's values in a form people can feel, and to let a cause adopt the result as its own, spreading far beyond anything the brand could fund.\n\n## The approach\n\nThe brand creates a kinetic or architectural artwork that expresses its engineering and design values, and builds the piece around a simple symbol or gesture belonging to a cause. Then it gives the work away. The design files, code or assets behind the piece are released openly and free of charge, so supporters can reproduce the symbol themselves at every scale, from a printed sign to their own build. The brand's installation is the original; the movement makes the copies.\n\n## Key mechanisms\n\n**An artwork that embodies values.** Instead of stating its values, the brand builds them. The piece might be a field of moving elements that slowly resolve into a recognisable shape, a facade of pins that forms an image, or old infrastructure turned into a slow, contemplative space. Visitors feel precision, patience or craft in the way the work moves and is made. The values are experienced as form.\n\n**A symbol supporters can make themselves.** What the artwork resolves into is the cause's symbol or gesture: something simple enough to wear, print, post or perform. Because the symbol is plain, it works both at monumental scale in the installation and at personal scale on a shirt or profile picture. Supporters spread it through their own networks, and its appearance in the artwork gives news coverage a striking image without any paid media.\n\n**Open release.** The brand publishes what it made, design files, printable parts, code that drives the motion, or copyright-free assets, under open terms. Others can rebuild the piece, adapt it, or simply take the symbol. An open fund or invitation can let others join in building more. The idea travels far beyond what one company could pay for or run, and the brand becomes known as the giver of the tool rather than the owner of the movement.\n\n## How these combine\n\nThe artwork gives the symbol a moment of spectacle and authority. The symbol gives the artwork meaning beyond decoration and a reason for people to engage with it. The open release turns a single installation into a template, so the symbol's spread is multiplied by every person who reproduces it.\n\nEach element also protects the others from failure. An installation alone would be admired and forgotten; open release ensures it lives on in copies. A symbol alone might never get the visibility it needs; the artwork launches it. Open files alone have no story; the installation and cause provide one. The brand's values are proven twice: first by the quality of the original work, then by the generosity of giving it away.\n\n## Why it works\n\nShowing is more convincing than telling, especially for values like precision and craft that sound hollow as claims. A symbol designed for self-reproduction lets a movement grow through its members, which is how movements actually spread. Releasing the work freely removes the suspicion that the brand is trying to own the cause, and it turns the brand's capability into a public good. The result is a brand associated with a beautiful, meaningful object that thousands of people have made their own, and with the decision to let them."}, {"id": "i147", "t": "# Absolutely Classified: A Ridiculous Product Mystery That Becomes a Game Fans Play to Solve It\n\n## Where it starts\n\nProduct launches and promotions usually announce, explain and ask to be believed. Audiences meet this with indifference or doubt, since every brand claims its new thing is special. Even interactive promotions often feel like obligations: enter a code, fill in a form. What audiences actually enjoy are mysteries, jokes and games, and brands rarely combine them.\n\nThe reconstructed idea joins three elements: a self-mocking or sincerely absurd premise that turns scepticism into amusement, a launch released as a trail of clues and puzzles, and a game that lets fans act out the brand idea.\n\n## The approach\n\n**An absurd premise, played straight.** The brand builds the launch around a ridiculous idea treated with total seriousness, with itself as the butt of the joke. This might be a solemn genre interrupted by slapstick, a deadpan parody of a familiar format such as a secret-agent briefing or an official investigation, or a product range built on one ridiculous rule.\n\n**A trail of clues.** Rather than revealing the product or promotion, the brand releases fragments: a phrase seeded somewhere unexpected, a symbol that appears before any announcement, a chain of hints across platforms, and a surprise early drop for core fans. The audience starts investigating.\n\n**A game that is the brand idea.** The investigation becomes a game people play. It might be a branded game with the product inside the gameplay, a reward unlocked by skill or knowledge, a playground game scaled up to an entire city, or in-game items with real-world counterparts. Fans act out the absurd premise rather than watching it.\n\n## Key mechanisms\n\n1. **Sincerity disarms.** A claim that would be doubted as a pitch is accepted as entertainment when it comes wrapped in a joke the brand tells at its own expense.\n2. **Clues build investment.** Seeded hints and cross-platform puzzles create anticipation and participation before the answer is known. Fans who receive the early drop become guides for others.\n3. **Play makes the idea physical.** When the trail is a game, fans do not just learn about the brand idea, they perform it. Rewards earned through skill or knowledge feel deserved, and in-game items with real counterparts connect play to purchase.\n\n## How it fits together\n\nThe absurd premise provides the story; the clue trail provides the structure; the game provides the action. For example, a deadpan \"classified\" investigation into the brand's own ridiculous rule can hide its clues in places fans must explore, both online and in physical space. Solving each clue advances a game whose rewards, in-game and real, reveal more about the product. Core fans get an early piece of the puzzle, and the final answer, when revealed, is both the punchline of the joke and the launch of the product.\n\n## Why it works\n\nIt replaces persuasion with participation. Scepticism gives way to amusement, passive viewing gives way to investigation, and investigation turns into play. By the time the product is revealed, fans have spent time inside the brand's world, laughed with it and earned their reward. The brand is remembered not for what it said about itself but for what fans did together to find out."}, {"id": "i098", "t": "# The Most Ridiculous Day of the Sales Season\n\n## The problem\n\nIn a crowded category, every competitor says the same thing. Specifications are matched, prices are matched, and claims cancel each other out. Audiences have learned to tune out the sameness, and any brand that tries to shout louder is met with scepticism: it is just another pitch.\n\nThis sameness peaks around the mass shopping occasions. On the big sale days, every brand in the category makes the same promise of discounts and urgency. The attention is enormous, but it is captured by the occasion itself, not by any one brand, and differences between competitors disappear in the noise.\n\nThe brand needs to stand apart on precisely the days when standing apart is hardest, without making a claim the audience will simply doubt.\n\n## The approach\n\nThe idea is to invent a named day that slots into the existing run of shopping days, built around what the brand really competes on, and to present it with complete, deadpan sincerity, the brand happily making itself the butt of the joke.\n\nFirst, the brand redefines its competition. Instead of competing on specifications, it competes on the human tension its product resolves, or on the need it meets rather than its category, or even on the opposite of what the category leaders say. If everyone else promises more, the brand might stand for the thing they all ignore.\n\nThen it gives that redefinition its own day in the sales calendar. The day borrows the attention and habits the shopping season already commands, but redirects them toward the brand's chosen tension or need, sometimes toward a cause connected to it. And the brand launches the day as an absurd premise played straight: a solemn announcement broken by slapstick, a deadpan parody of the familiar sale-day format, perhaps a product range built on one ridiculous rule for that day only.\n\n## Key mechanisms\n\n**Redefining the battleground.** The brand chooses to compete on something rivals cannot claim without contradicting themselves: an emotional role rather than specifications, the human tension the product resolves, or the opposite of what the leaders say. This becomes the reason for the day to exist.\n\n**A day in the existing run.** By naming its own day next to the established shopping occasions, the brand does not have to build attention from nothing. People are already primed to look for deals and events that week. The new day sits in that habit and redirects it, attaching the moment to the brand's redefined purpose or to a cause that expresses it.\n\n**Sincere absurdity.** The day is presented with total seriousness about something openly ridiculous. A deadpan parody of sale-day advertising, solemn countdowns interrupted by slapstick, or a single absurd rule that governs everything the brand sells that day. The brand is willing to be laughed at, and by laughing at itself it disarms the scepticism that a straight sale-day pitch would meet.\n\n**The joke carrying the claim.** Underneath the comedy, the redefined position is stated clearly. Because the audience is amused rather than defensive, the claim that would be doubted as a pitch is accepted and shared as entertainment. The parody of the sale-day format also quietly points out how alike everyone else is.\n\n## Why it works\n\nEach element covers another's weakness. A redefined position on its own is hard to get noticed in the loudest weeks of the year. A named day on its own risks being just another promotion among many. Self-deprecating, sincere absurdity on its own could be funny without saying anything.\n\nTogether, the redefinition gives the day its meaning, the day gives the redefinition a moment of maximum attention, and the humour gives both a way past the audience's defences. Competitors cannot copy the day without adopting the brand's position, and they cannot adopt the position without contradicting what they have been claiming all season. The brand turns the sameness of the sales calendar into its own stage and leaves people sharing the joke, and the point inside it."}, {"id": "i083", "t": "# The Track That Only Plays at the Game\n\n## What needed solving\n\nSponsorship of live events usually means a logo on a board and a mention in the broadcast. Fans see it, but they do not feel it is theirs. Meanwhile music, often part of the same events, has become so abundant that a new track can be released to millions and still disappear within a day. And the moment of excitement, when a fan is caught up in the game or a song, is usually disconnected from the moment when they could actually buy something.\n\nThree gaps, then: fans are passive, digital releases are weightless, and inspiration and purchase sit far apart. The idea addresses them together.\n\n## The concept\n\nA brand uses its connection to a live event to hand fans an insider's role, and pays it off with a music release that can only be unlocked through that participation. The track is scarce: it exists in a single place or form, or it plays only at one physical spot or moment linked to the event. The way in is a scannable code placed on the exact object fans hold at the moment of interest, such as a product or its packaging, which also leads straight to purchase.\n\nFans do not just watch. They take a role, chase a rare piece of music, and find the product in their hands as the key.\n\n## Key mechanisms\n\n**Fans given an insider's role.** The campaign gives supporters a decision or action normally reserved for players, coaches or officials, for example choosing a line-up, calling the coin toss, or being present on screens in an otherwise empty venue. Or it ties the brand to the live result, so outcomes on the pitch change what fans receive. Sponsorship becomes something fans do rather than something they notice.\n\n**A release made scarce again.** The reward is music, but not a file anyone can stream. It might be a single copy that passes from fan to fan, songs hidden at map coordinates, or a track playable only at one place. Scarcity turns the song into an event; fans have to seek it out, and those who find it want to share the story of how.\n\n**The code on the object.** The bridge between the role, the track and the product is a scannable or verifiable link placed on the thing fans already have in hand at the key moment: a code on sample packaging, a receipt, a broadcast's own platform. Scanning it unlocks the participation or the next clue to the music, and the same scan offers the product for purchase. Interest and buying happen in one gesture.\n\n## How the parts connect\n\nThe insider role gives fans a reason to engage, the scarce track gives them a prize worth chasing, and the code gives them the route, using an object that is also the product. Each element needs the others. A role without a reward is a poll. A hidden track without a route is a puzzle nobody starts. A code without a reason to scan is just a barcode.\n\nLinked together, they form a chain: the fan picks up the product, scans, takes their role in the event, and in return gets access to music that most people cannot hear. Because the music is rare and tied to real moments in the event, people talk about who heard it, where and how. That conversation spreads the brand far beyond those who scanned, and the scan itself is a measurable record of engagement and sales.\n\n## Why it works\n\n- **Ownership through participation.** Fans who make an insider's call feel the event is partly theirs, and the brand gets credit for opening the door.\n- **Scarcity creates value.** Making digital music hard to get turns it from background noise into something worth hunting and talking about.\n- **No gap between wanting and buying.** Placing the link on the object at the moment of interest captures intent before it fades.\n- **Live result as fuel.** When the event's outcome affects the reward, every play keeps attention on the brand without extra media.\n- **Stories, not impressions.** The combination produces anecdotes, \"I got the track at the match\", which travel better than any banner."}, {"id": "i128", "t": "# When the Show's Company Becomes Real\n\n## The problem\n\nPromoting a show is usually done through trailers and adverts that sit outside the story. Audiences know they are being sold to, and the show's world stays on the screen. Companies that support such shows through sponsorship often have the same problem: their involvement is a logo, not something that matters. And creator partnerships, meant to spread the word, can feel like ads that audiences skip.\n\nThe task is to let the audience experience the show's world in real life, to give the partnering company a role that demonstrates genuine public value, and to spread it through creators in a way their audiences embrace.\n\n## The approach\n\nThe idea is to let a fictional organisation from a show step into the real world and run a genuine civic service, built on a real company's network, with creators inside the show's world carrying the story to their own communities.\n\nThe fiction steps out. Following the pattern of a fictional company holding a real public offering or a villain running a real campaign, an organisation from the show appears in real life and acts on its own terms. Instead of advertising the show, it behaves as if it existed.\n\nWhat it does is real. The fictional organisation runs on a real company's installed base or network: vehicles that relay messages where there is no coverage, data that maps passable routes after a disaster, spare network capacity that delivers learning material. The public benefit is genuine and grows with the company's business, demonstrating what the company does.\n\nCreators carry it. Rather than scripted posts, creators bring their own world and voice to the story: pitching how they want to interact with the fictional organisation, matched to the parts of the company's offer their communities already use, chosen because they share the show's passions. Each creator introduces the organisation to their audience in a way that feels native.\n\n## Key mechanisms\n\n**Fiction in the real world.** Blurring story and reality lets audiences experience the show's world directly. The fictional organisation becomes something people can encounter, use and talk about.\n\n**Network as civic infrastructure.** Building the real-world service on the company's core network makes the benefit genuine. It shows the company's capabilities in a way an advert could not.\n\n**Creators in their own voice.** Allowing creators to shape their participation ensures the content feels authentic to their audiences. Matching them by passion rather than reach deepens engagement.\n\n## How the parts interact\n\nThe fiction gives the service a story and a character. The network gives the fiction a real function. The creators give both an audience and a voice. People encounter the fictional organisation through creators they trust, find that it actually helps, and are drawn into the show's world.\n\nEach part is essential. The fiction alone would be a stunt. The civic service alone would be worthy but unremarkable. The creators alone would be another sponsored campaign. Together, they create a living extension of the show that serves the public and demonstrates the company's value.\n\n## Why it works\n\nIt works because it gives audiences something real to engage with. The show's world becomes tangible, the company's role becomes useful, and the creators' content becomes authentic.\n\nIt also changes the relationship between entertainment and public value. A fictional organisation that provides a real service generates goodwill for both the show and the company. Audiences who benefit from the service or see it through creators experience the show's world as part of their own, which is a far deeper form of engagement than watching a trailer."}, {"id": "i033", "t": "# Listening Copies: A Sound Archive You Have to Find\n\n## The problem\n\nWhen a monument, a library or a historic district is threatened, the instinct is to document it visually and to protest its loss. But images of damaged heritage have become routine, and protest can feel futile against forces that destroy on purpose. The audience is left with a choice between sadness and helplessness.\n\nMeanwhile, the people who might care most, music fans who travel, collect and share, are rarely asked to engage with heritage at all. A free stream gives them nothing to pursue and nothing to keep.\n\nThe opportunity is to give that audience a reason to go out, to listen closely, and to become custodians of something at risk.\n\n## The approach\n\nInvite ordinary people to make a sound copy of endangered places, as a backup in the strictest sense, and then compose music from that archive and release it as a hunt.\n\nVolunteers record the acoustics, the ambient life and the physical resonance of threatened sites: the way a vaulted room holds a note, the wind through a ruined gate, the tones that can be drawn from the cracks in a wall. That archive is stored where it cannot be destroyed alongside the place. Musicians then build tracks from it. Each track is released only at the coordinates of the site it came from, or as a single copy that travels between listeners, so the music and the place stay bound together.\n\n## Key mechanisms\n\n**1. A backup, not a eulogy.** Calling the archive a backup changes the emotional register. A backup implies that what is lost can be restored. If a site is damaged, its recorded sound can guide and accompany its rebuilding, and the rebuilding becomes a calm, public answer to whoever tried to erase it. Because ordinary people do the recording, preservation becomes something anyone can join.\n\n**2. Making a place felt through sound.** Recorded and reactive sound adds the sense that photographs lack. A listener wearing headphones can stand inside a space they have never visited, hear its size and texture, and sense its character. The work puts the audience inside the subject instead of in front of it.\n\n**3. A release that must be sought.** Scarcity restores the event to music. A track that plays only at one spot rewards those who make the trip; a single copy handed from person to person makes every listener briefly responsible for it. Fans share where they found it and who gave it to them, spreading the project through their own stories.\n\n## How the pieces reinforce each other\n\nThe archive gives the project substance. The sound gives it emotional power. The scarcity gives it momentum. Without the hunt, the recordings would sit in a database; without the recordings, the hunt would be an ordinary marketing stunt; without the backup framing, both would lack a reason to matter. Together they turn listening into an act of preservation, and preservation into something people actively seek.\n\nThe journey for a fan: hear that a track exists, learn it is tied to a threatened place, travel there or wait to be handed the copy, listen inside the place itself, add their own recording or their own story to the archive, pass it on.\n\n## Why it works\n\nIt rewards attention with intimacy. People rarely feel ownership of heritage they only see in photographs, but they feel it intensely for things they have searched for, held, and heard in person. The project turns fans into carriers and recorders, so that every play is also a small act of keeping the place alive. And because the sound is safely copied, any future destruction is met not with a full stop but with the promise of a rebuilt space that can be heard again."}, {"id": "i086", "t": "# Redrawn in Our Own Hand\n\n## The situation\n\nA brand has been targeted with hate. Perhaps a hateful symbol has been aimed at it, an insult has spread, or one of its ambassadors is facing a torrent of criticism. The usual responses, silence or a carefully worded statement, either look weak or are forgotten within a day. The brand needs a response that shows where it stands, that people remember, and that is unmistakably its own.\n\n## The approach\n\nThe brand answers in public by turning the attack into its own material, expresses that answer through its identity system, and produces the response under one committed production constraint that gives it a distinctive texture.\n\nThe attack is repurposed: the insult is adopted collectively, the hateful symbol is redrawn into something with the opposite meaning, the taunt is answered with its opposite, or the brand stands more visibly behind the ambassador who was criticised most. This repurposing is done through the brand's identity. Its marks, whether a logo, typeface, sonic cue, mascot or physical object, are derived from something already true of the brand, and the redrawn symbol or reclaimed phrase is rendered in those marks. A few anchors stay fixed, so the response is instantly recognisable; the rest flexes to absorb the material of the attack.\n\nThe response film or series is made under one rule followed completely, such as a single uncut camera move, a first-person rig, deliberate physical imperfection, or a framing rule set by a limit. That rule might show the hateful symbol being redrawn in one continuous shot, or let the ambassador's point of view carry the story.\n\n## Key mechanisms\n\n**Turning the attack into material.** Repurposing hate lets the controversy carry the message. The brand appears as a principled ally that stands its ground, and the attackers' own words or symbols end up spreading the brand's position.\n\n**Identity derived from truth.** When the reclaimed symbol or phrase is expressed in the brand's own marks, the answer is self-explanatory. Viewers recognise the brand immediately and understand that it has taken ownership of the attack. Fixed anchors ensure recognition; flexible elements allow the identity to absorb new material.\n\n**One committed constraint.** A response made with a distinctive production rule stands out from both the attack and the usual corporate reply. The craft becomes part of what people remember. A continuous, unedited take, for example, signals that nothing has been hidden or manipulated, which suits a moment that calls for honesty.\n\n## How the parts connect\n\nThe attack provides the raw material, the identity transforms it, and the constraint gives the transformation a memorable form. Redrawing a hateful symbol is far more powerful when the new version is unmistakably in the brand's own visual language, because it shows the brand taking possession rather than merely objecting. Filming that act under a strict constraint, such as one unbroken shot of the redrawing, turns it into a piece of craft that people watch, share and remember.\n\nThe identity system also benefits. Its ability to flex while keeping fixed anchors is demonstrated under pressure: the brand's marks can absorb even hostile material and remain themselves. That makes the identity stronger after the controversy than before it.\n\n## Why it works\n\nAudiences judge brands by how they behave when attacked. This idea turns the attack into evidence of the brand's character, expresses that character in marks everyone recognises, and makes the response so distinctive in its craft that it outlasts the controversy. The attackers supply the attention, the identity claims the meaning, and the single committed technique makes sure the moment is remembered as the brand's own."}, {"id": "i014", "t": "# Relive It, Play It, Heal\n\n## Where it begins\n\nA historic event that shaped a community, or the understanding of a condition, can feel distant to people who were not alive at the time. Anniversaries are marked with summaries and retrospectives that inform but do not move. At the same time, a therapy linked to that history may work well but suffer from low adherence: patients find the exercises repetitive and give up. And gamers, a large and deeply engaged community, are rarely invited to support causes in ways that fit naturally with how they play. Charity appeals usually ask them to step outside the game, which is exactly where their attention is not.\n\nThe challenge is to bring the history alive, make the therapy something people want to do, and enlist players as supporters without asking them to leave the game.\n\n## The approach\n\nOn the anniversary of the event, re-run it in real time inside a game, using formats players already know: in-game messages, feeds and live events that unfold hour by hour, as they did originally. Players live through the event as it happens instead of reading a recap. Woven into that experience are therapeutic activities designed as gameplay, so that playing is also practice. And players can back the cause through actions they already take in the game: buying a charity cosmetic item, completing a challenge named after a move, or pushing towards a collective target that unlocks support.\n\nThe game becomes the place where people remember, practise and give, in one continuous experience.\n\n## Key mechanisms\n\n**1. History re-run as it happened.** The game recreates the event on its anniversary, at the pace it originally unfolded, through formats familiar to players: a social-style feed inside the game, messages arriving in real time, scheduled events, or a first-person account told by a character who lived through it. The audience does not get the ending first. They wait, react and wonder what will happen next, just as people did at the time. That uncertainty creates empathy and memory that a summary cannot.\n\n**2. Therapy hidden in play.** Within the re-run, the game includes activities that work as therapy: rhythm challenges that act like a metronome, sing-along or speech tasks, breathing exercises paced by the action, or short cooperative sessions a parent and child can play together. Because these sit inside a game the player already enjoys, treatment stops being a chore. Patients choose to come back, and coming back is what makes therapy effective.\n\n**3. Giving through play.** Support for the cause never requires leaving the game. A charity cosmetic in the in-game shop lets players show which side they are on and makes their giving visible to everyone they play with. A challenge named after a game move turns the cause into something players do, not something they hear about. Collective win targets give the whole community a shared goal, unlocking support as players progress together.\n\n## How it holds together\n\nThe anniversary re-run supplies the emotional core and a reason to log in on a particular day. The therapy gives the experience lasting value long after the anniversary has passed, and grounds the history in the present: the event is not just remembered, its consequences are being addressed. The in-game giving converts the emotion of the re-run and the goodwill of the therapy into tangible support.\n\nThe three also feed one another in a loop. Players who are moved by the history want to help, and the shop item or challenge gives them an immediate way to do so. Players who see others wearing the charity item ask what it means and are led into the re-run. Funds raised can widen access to the therapy, which brings more patients into the game, who in turn encounter the history and the cause. The game's own systems, its shop, its challenges, its scheduled events, carry the whole campaign, so nothing feels bolted on.\n\n## Why it works\n\n- **Presence over recap.** Living through an event in real time is a different kind of knowing from reading about it; it creates memory people did not have.\n- **Adherence through enjoyment.** Making therapy part of a game people already love solves the practical problem of patients giving up.\n- **Giving in the player's language.** Cosmetic items, named challenges and collective targets are things gamers already value and show off, so support spreads socially.\n- **One place for everything.** Combining history, treatment and fundraising in a single environment means each part recruits for the others, rather than three separate campaigns competing for attention."}, {"id": "i129", "t": "# Instruments of Peace\n\n## The challenge\n\nCampaigns against gun violence are recognised as campaigns within seconds, and audiences respond accordingly: they scroll past, or agree and forget. Meanwhile, the weapons removed from circulation are simply destroyed, a missed opportunity to carry their story somewhere new. And fundraising for affected communities depends on repeated appeals rather than on something people want for its own sake.\n\nThe challenge is to create something that travels as culture before anyone sees it as a cause, that is made from the problem itself, and that sends value back to the people most affected.\n\n## The idea\n\nSeized guns are melted into a named metal. From it, craftspeople make a set of musical instruments, and a credible artist records a genuine single on them. The song is released through a mechanic that acts out its title, and in a deliberately scarce physical form that fans must seek out. Beyond the music, the same metal is sold into everyday products, with proceeds going to the communities harmed by the weapons.\n\n## How it works\n\n### 1. The weapon becomes a material\n\nThe guns are not just destroyed; they are transformed into a branded raw material with its own identity. This material is used first for the instruments, then for a wider range of everyday products: jewellery, kitchen tools, keys. Each item carries the story of where its metal came from, and its sale funds programmes in the affected neighbourhoods. A purchase is both a gift and a contribution.\n\n### 2. The message becomes a song\n\nThe single is real music by an artist the audience already respects, in the genre the audience already listens to. It tells a story the community recognises, and it can sit inside the artist's own commercial release, so people encounter it the way they encounter any new track. Its release mechanic mirrors its title, so that how the song reaches people is part of what it says. People choose to hear it and share it because it is good, and only later discover what it is made of.\n\n### 3. The release becomes an event\n\nRather than being uploaded everywhere at once, the song begins life in scarce, physical form. Drives cast in the gun metal are left at concerts. A single copy is passed from listener to listener. Some tracks or versions can only be played at one physical location, such as a site in a neighbourhood that has suffered gun violence. Fans have to look for the music, and the search becomes the story they share.\n\n## Why the elements need each other\n\nThe metal makes the music meaningful: the instruments are literally the weapons, changed into something that makes beauty. The genuine song makes the metal travel: culture moves far faster than any product launch. The scarce release turns the song into an object of desire, so the story spreads through fans' own pursuit and conversation.\n\nMeanwhile, the product range ensures the idea does more than move people. It sends money back where it is most needed, and keeps doing so long after the single has finished its run.\n\n## Why it works\n\n- **It avoids the campaign filter.** People meet a song first, and a cause second, so the message reaches those who would ignore an appeal.\n- **It transforms the problem visibly.** Hearing a weapon turned into an instrument is a powerful, wordless argument.\n- **It creates demand through scarcity.** Seeking a rare copy produces more engagement than broadcasting a free file.\n- **It funds the solution.** Every purchase of the metal returns value to the communities harmed.\n\nThe music does the persuading, the metal tells the truth, and the money does the repairing."}, {"id": "i072", "t": "# The Station That Hears the Weather\n\n## Why this matters\n\nPet brands mostly talk to owners, which means their care is asserted rather than demonstrated. Yet the moments when animals most need care often happen when owners are absent: when a dog is left home alone, or when a sudden storm, fireworks or traffic noise frightens it. Owners worry about these moments but can do nothing about them.\n\nThere is a second, quieter problem. Outdoor and digital advertising for pet care is generic: the same image of a happy dog regardless of what is actually happening in the street around the viewer or the house around the pet.\n\n## The idea\n\nA pet brand launches an audio service made for animals, not owners: a station that plays sound composed to calm dogs and cats, and that responds in real time to live conditions in the pet's surroundings. When a storm approaches, when local humidity rises, when traffic noise peaks, the station adjusts what it plays. The same live data drives the brand's outdoor and digital placements, which tell passing owners what their animal is hearing right now and how the station is helping.\n\n## The mechanisms\n\n**Serving the animal.** The heart of the idea is a product for the pet itself: music and soundscapes designed for anxious animals, such as shelter cats, and a radio station for dogs left at home. Real shelter animals feature in the communication, shown calming as the sound plays. Owners see the care working, which proves the brand's promise in use rather than in claims.\n\n**Sound as a sense the animal lives in.** Animals experience much of the world through hearing. The station uses recorded and reactive sound to fill that sense with something reassuring: binaural recordings of familiar spaces, the sound of the owner's own home played back, natural sounds that mask frightening ones. The sound puts the animal inside a calmer world when the real one becomes loud.\n\n**Live conditions as the trigger.** The service reads live data from the pet's location: approaching weather, local humidity, nearby traffic, even planes passing overhead. When a likely trigger is detected, the station changes its programming to counteract it. The outdoor and digital media use the same feeds. A digital billboard on a rainy afternoon tells owners walking past that the station has switched to its storm programme; a screen near a congested road describes what dogs nearby are hearing and how the music is responding.\n\n## How it fits together\n\nThe animal-first product supplies the substance: a genuinely useful service. The sound design makes it effective for animals and emotionally vivid for owners. The live-conditions engine makes the service and its advertising timely: the station reacts to the moment, and so does the media, which keeps both relevant.\n\nThe link between product and media is the key creative move. The billboard is not an advert about the brand; it is a live window into what the product is doing for animals right now, in the viewer's own neighbourhood.\n\n## Why it works\n\n- **It proves care through use.** Owners believe a brand that helps their animal when they are not there.\n- **It addresses a real anxiety.** Every owner has wondered how their pet copes alone during a storm. This offers an answer.\n- **It makes media useful.** Advertising that responds to the viewer's actual conditions earns attention instead of being ignored.\n- **It uses the animal's own sense.** Sound is how pets experience much of their world, so it is the right channel for care.\n\nThe brand stops being a voice aimed at owners and becomes a companion for animals, with every placement showing the care in progress."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
