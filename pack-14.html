(function () {
  "use strict";
  var DATA = {"pack": "P14", "items": [{"id": "i077", "t": "# Help Hidden in the Game\n\n## The problem\n\nSome of the people who most need help are the hardest to reach safely. Young people being controlled or harmed at home, partners whose phones are monitored, people whose every message is read: for them, an ordinary support line, poster or charity ad is not just useless but dangerous. Being seen to look for help can make things worse.\n\nStandard campaigns ignore this. They broadcast a helpline and hope. They speak to the person at risk in a channel that the person controlling them also sees. They ask the public to donate through a separate, effortful request rather than through something people already enjoy.\n\n## The approach\n\nPlace help inside a video game, where many at-risk young people already spend their time, and where play looks harmless to anyone watching. The support route is disguised as an ordinary game element. At the same time, the wider player community funds and spreads the cause through actions that are simply part of the game: buying a cosmetic item, completing a challenge, chasing a shared target.\n\nTo the controller, it looks like gaming. To the person at risk, it is a door. To the rest of the players, it is a visible way to help.\n\n## Key mechanisms\n\n**Choosing the right messenger, channel and moment.** The idea starts by asking where the at-risk audience actually is and who they listen to. The game is the channel; the messenger is a familiar character or a player they trust, rather than an authority; and the message arrives at moments when harm is most likely, such as late evenings or holidays. Bystanders, other players who notice something wrong, are also equipped to act.\n\n**Invisible help.** The support route is designed to stay hidden from whoever is watching. A help chat is disguised as an in-game menu or a search page. A coded request, something as innocent as an item order, signals that the player needs contact. Conversations leave no trace on the device, and evidence can be captured automatically for later use. Decoys let offenders reveal themselves without exposing the person they are targeting.\n\n**Giving through play.** The broader player base supports the cause through what they already do: a charity cosmetic item in the in-game shop, a challenge named after a game move, collective win targets that unlock donations. These items are visible to others, so support spreads socially and normalises talk about the issue without singling anyone out.\n\n## How the three connect\n\nThe visible giving layer and the invisible help layer protect each other. Because the cause is a well-known, popular in-game event, a cosmetic item or a challenge appearing on a player's screen is unremarkable. That public cover allows the hidden support route to exist without drawing attention. Meanwhile, the careful choice of messenger and channel ensures that the help actually reaches those who need it rather than simply the players most likely to donate.\n\n## Why it works\n\n- **Safety first.** Help that can be seen by an abuser is not help. Disguise makes reaching out possible.\n- **Meeting people where they are.** The game is a space the at-risk audience already inhabits and the controller is unlikely to scrutinise.\n- **Generosity without friction.** Players support the cause by playing, which makes giving feel natural and visible rather than a separate donation request.\n- **Community as protection.** By making the cause part of the shared culture of the game, bystanders become allies and the silence around the issue begins to break.\n\nThe game remains a game. Within it, for the people who need it, there is a way out."}, {"id": "i099", "t": "# The Song That Changes Its Meaning Halfway\n\n## The starting problem\n\nMany categories design their products around a default user and a default moment, and then try to fix the gaps with messaging. An inclusion ad shows a more varied cast, but the product stays the same, and the people who were overlooked are still underserved. Meanwhile, a film that explains an unmet need tends to lecture: a voice-over states the problem, the audience nods, and nothing lands.\n\nTwo difficulties sit side by side. The brand must find a real need its category has missed, and it must communicate that need in a way that makes viewers feel their own blind spot rather than be told about it.\n\n## The approach\n\nThe idea begins with a question asked of the category: who has it overlooked, or what bigger worry sits in the same moment of use? Examples of the pattern are a carer shaving someone else rather than themselves, the skin effects of a medical treatment that ordinary products ignore, safety testing modelled on only one body, or a parent's fear of losing a child on a crowded beach. The answer becomes a product, built for that person or that worry.\n\nThe launch film is then structured so that the audience first misreads what they are seeing. They are invited to assume the familiar user and the familiar moment. Halfway through, the reading is overturned, and the overlooked person or worry is revealed. The structure of the film, and the shift in meaning, is carried by music rather than by copy: an existing track whose tone or history makes the argument, or a song whose lyrics suddenly mean something different once the reveal has happened.\n\n## Key mechanisms\n\n**Finding the overlooked user or the larger worry.** This is the strategic core. It gives the brand a genuine reason to speak, because the product answers a need that exists in the real moment of use. The answer is not \"we see you\" but \"we made this for you\", which is far harder to dismiss.\n\n**A deliberate wrong first reading.** The film lets viewers build the default assumption themselves. Because the category has always pictured one kind of user, the audience does the same without noticing. The reveal shows them the person they had not imagined. Discovering their own assumption is more powerful than being told the category has ignored someone, because the viewer has just ignored them too.\n\n**Music as the structure.** The track sets the pace, holds the emotion and, crucially, carries the turn. A song that sounds like one thing in the first half and another in the second lets the shift happen without explanation. The same lyric heard before and after the reveal becomes two different statements. The music does the work that a voice-over would otherwise have to do clumsily.\n\n## How the parts interact\n\nThe insight supplies the content of the reveal: the overlooked person and the product made for them. The misdirection supplies the dramatic shape: a familiar picture that turns out to be something else. The music supplies the emotional engine that holds the shape together and makes the turn felt. The insight without the misdirection would be a sincere but forgettable product demonstration. The misdirection without the insight would be a trick with nothing behind it. Both without the music would need words to explain the turn, which would weaken it.\n\nIn practice, the film opens on a scene that matches the category's usual imagery, scored with a track that seems to fit. As the scene develops, small details stop matching the assumption. At the point of reveal, the music continues but its meaning has flipped, and the product appears as the practical answer to what the viewer has just understood.\n\n## Why it works\n\nIt works because the audience participates in the argument. They hold the old assumption, they feel it break, and they see the product as the consequence. That sequence is persuasive in a way a claim is not.\n\nIt also protects the brand from the cynicism that greets inclusion messaging. The film does not ask for credit for noticing someone; it shows a product that exists because the brand asked a better question. And because the emotion is carried by music, the film can stay quiet, letting images and rhythm do the persuading. The viewer leaves with the reveal in their memory and the song attached to it, so each time they hear the track again, the overlooked person comes back with it."}, {"id": "i103", "t": "# The Day the City Hosts You\n\n## The problem\n\nPlaces compete for visitors with images that look alike: skylines, beaches, landmarks shot at golden hour. The result is that destinations blur into scenery, and travellers struggle to say why they should visit one over another. At the same time, the calendar is crowded with shopping occasions that command enormous public attention but redirect it almost entirely toward discounts and big retailers. The local businesses, residents and creative trades that make a place worth visiting see little of that attention. A destination brand needs a way to stand out, to show a place as somewhere people actually live, and to turn borrowed attention into benefit for its own community.\n\n## The approach\n\nThe idea is a destination campaign built around a named day that slots into an existing run of shopping occasions, dedicated to the place's own residents, hosts and local makers. The day is the campaign's anchor event. Its cast is the people who live there. And its visual identity is drawn from something already true of the place, so that every poster, shopfront sticker, street object and sonic cue is recognisably of that city without needing explanation.\n\n## Key mechanisms\n\n**1. Locals as the cast and the hosts.** The place is marketed through the people who actually live there and the stories set there. Residents appear instead of models; hosts are drawn from under-represented communities; the city's own creative trades produce the work. Visitors are not shown views to look at but people to meet, a living home rather than a backdrop.\n\n**2. A named day inside the shopping calendar.** Rather than competing with the big sale days, the campaign joins the run of them with a day of its own: a day for local shops and local hosts, or a deliberate counterpoint to the biggest discount day. Because it sits inside a sequence people already follow, it inherits the attention and habits of that season, such as browsing, planning purchases and booking ahead, and redirects them toward the place's residents and small businesses.\n\n**3. An identity drawn from what is already there.** The marks of the campaign, its logo, typeface, sonic cue and perhaps a distinctive street object, are derived from something real about the place. A few elements are held fixed across every appearance, while the rest flex for shopfronts, host profiles, social posts and street furniture. The design is self-explanatory: anyone who sees a mark understands it belongs to this place and this day.\n\n## How the pieces interact\n\nThe named day gives the people-led story a reason to happen now. Without it, a campaign about residents risks being a pleasant but timeless message. With it, there is a date when hosts open their doors, local shops run their own offers, creative trades show their work and travellers have a reason to book.\n\nThe locals, in turn, give the day its meaning. A shopping occasion built around residents and small businesses is different in kind from one built around discounts; it says the value of this place is its people. The day becomes a way for visitors to meet someone, not just buy something.\n\nThe identity system holds these together across a dispersed, community-run event. Many different shops, hosts and creators will produce their own materials. The fixed anchors make every one of them recognisable as part of the same day and the same place, while the flexible parts let each participant express their own character. The marks derived from something true of the place ensure that even a sticker on a small shop window tells the whole story without copy.\n\n## Why it works\n\nIt works because it uses three forms of existing energy instead of creating new ones from nothing. The shopping calendar already holds the public's attention. The residents already hold the stories that make the place distinct. The place itself already contains the shapes and sounds its identity can be drawn from. The campaign simply connects them. Travellers get a reason to visit and someone to visit. Local businesses get a share of a season that usually passes them by. And the place gets a recognisable identity that belongs to it, not to a postcard."}, {"id": "i124", "t": "# Your Street, Live, With the Brand's Own Joke\n\n## Where attention goes\n\nDuring a live broadcast, most people watch with a phone in hand. Their attention splits between the screen and social feeds, and advertisers in the broadcast compete with everything on the second screen. Brand games designed to capture that attention are often generic, played in abstract worlds that mean nothing to the player. And when brands try to join internet culture, they often abandon the voice that made people like them.\n\nThe problem is to turn second-screen distraction into deeper engagement with the event and its advertisers, make that engagement feel personal, and keep it unmistakably in the brand's own voice.\n\n## The approach\n\nThe brand creates a companion game synchronised to a live broadcast that people are already watching: points awarded when a pick wins, bidding along with an auction, trivia that fires as each ad airs.\n\nThe game uses the phone's GPS and motion sensors to turn the player's real surroundings into the board. Players race through their own streets, treat a car journey as a level, buy their own street, or swing the phone like a net to catch items.\n\nThe game is voiced in the brand's established irreverent tone, carried into the forms people already enjoy: the brand's mascot might release a rap track for the game, creators whose humour matches the brand might host it, and meme riffs licensed from their original artists might appear as rewards or prompts.\n\n## The mechanics\n\n**Synced to the broadcast.** The game listens to the live event. When something happens on the main screen, a goal, a lot sold, an ad, something happens in the game. The phone, previously a distraction, becomes a way of engaging more deeply with what is on the television, including the advertisers.\n\n**Played on familiar ground.** Rather than abstract levels, players see their own neighbourhoods. A broadcast moment might trigger a dash to a real landmark nearby, or let players claim their own street. Swinging the phone to catch something, or completing a level on a car journey, physically involves the player. The game is personal because it happens in places the player knows.\n\n**Spoken in the brand's own voice.** The prompts, rewards and commentary come in the irreverent tone fans already enjoy. The mascot taunts players, creators with matching humour host challenges, licensed memes celebrate wins. The brand joins the culture around the broadcast without losing itself.\n\n## How the elements interlock\n\nThe broadcast gives the game a reason to be played at a specific time, by many people at once, which turns it into a shared event. The location layer gives that shared event a personal dimension: everyone plays together, but each plays in their own world. The brand voice gives both a personality that people want to share.\n\nThe voice also makes the other two mechanics easier to accept. A game that asks for location data and physical movement might feel intrusive if presented blandly; in the brand's familiar irreverent tone, delivered through a mascot or trusted creators, it feels like fun. And the irreverent voice is ideally suited to the real-time rhythm of a live broadcast, where quick, cheeky reactions land best.\n\nThe location layer, in turn, gives the voice material. A mascot can make jokes about the player's own street; a creator can challenge viewers in a particular area to beat each other.\n\n## Why this combination pays off\n\nIt catches people where their attention already is, on the phone during a live event, and connects that attention back to the broadcast rather than letting it leak away.\n\nIt makes participation personal and physical, which is more memorable than tapping in an abstract world.\n\nAnd it stays recognisably the brand. Because the voice is the one audiences already enjoy, carried into formats they already love and licensed from the people who made them, the brand earns its place in internet culture rather than borrowing it awkwardly. The second screen stops competing with the broadcast and starts adding to it, with the brand at the centre."}, {"id": "i056", "t": "# A Record Made for Animals, Found by People\n\n## The situation\n\nPet brands usually talk to owners. Their advertising shows happy animals and promises care, but the care is asserted rather than demonstrated, and owners see so many such claims that they blur together. Meanwhile, the animals themselves have real needs that advertising rarely serves: anxiety when left alone, stress in shelters, and the difficulty of being chosen for adoption.\n\nThe brand needs a way to prove its care by doing something for animals, and to make that proof travel among people without it feeling like an ad.\n\n## The approach\n\nThe idea is to compose genuine music for animals, released as a real piece of culture by a credible artist, and distributed through a scarce, discovery-led release that people have to seek out and share.\n\nThe brand starts with an animal need: shelter cats and dogs living with stress, or pets left alone at home. It commissions music designed for them, built to calm and comfort, in the way a radio station for dogs left home alone serves the animal directly. This is not a jingle; it is a real release, made by an artist with credibility, in a genre the human audience already listens to, or embedded within that artist's own commercial work.\n\nThe release does not simply appear on every platform. A single copy is passed between listeners, tracks are hidden at coordinates or can be played only at one physical spot, such as a shelter, and recordings are left where fans will find them. To hear the full piece, people have to go looking, and the places they are led to are where animals need help.\n\n## Key mechanisms\n\n**Serving the animal, not the owner.** The music has a functional purpose for pets and shelter animals. Its care is proven in use: animals calm, owners see the difference. This is more persuasive than any claim because the owner witnesses it.\n\n**A message released as genuine music.** By making a real single by a credible artist, the brand's work travels as culture that people choose to hear and share. Listeners encounter it as a song first, and only later understand who made it and why. The campaign moves through music channels rather than advertising space.\n\n**Scarcity and discovery in the release.** Turning the music into something to be found makes it an event rather than another file. Fans pass it on, hunt for hidden tracks and share where they found them. If the discovery leads to shelters, the act of finding the music brings people face to face with animals waiting for homes.\n\n## How the parts interact\n\nThe animal need gives the music a reason to exist and gives the brand its proof of care. The credibility of a real artist and a real release gives the music cultural standing, so people engage with it willingly. The scarce release turns that engagement into movement: people travel, share and talk, and in doing so they meet the animals the music was made for.\n\nEach component would be weaker on its own. Music for animals released as a normal track could be dismissed as a novelty. A credible artist's song without the animal purpose would be a sponsorship. A scarce release without the care behind it would be a stunt. Together they form a loop where the music helps animals, people seek it out, and the search connects people to animals in need.\n\n## Why it works\n\nIt works because it gives people a genuine reason to engage on three levels: they enjoy the music, they enjoy the search, and they see it help animals. None of these feel like being sold to.\n\nThe brand's role is clear but understated. It made something useful for animals and let culture carry it. Owners who see their own pets respond to the music, or who discover a track at a shelter, experience the brand's care in action. That experience is far more durable than a promise, and it is passed on by the people who found it."}, {"id": "i008", "t": "# The Clues Were Made by Hand\n\n## Problem\n\nLaunches compete for a brief window of attention. A single reveal — one film, one announcement — is consumed in a moment and forgotten just as fast. Audiences are also saturated with smooth, machine-made imagery, so polished launch films have stopped standing out. A launch needs both a reason for people to pay attention over time and a look that makes the work itself memorable.\n\n## Approach\n\nThe idea is a launch released as a trail of handmade clues, each shot under a single, strictly observed production constraint. Before the announcement, fragments appear — a seeded phrase, a symbol, a short piece of film — across platforms. Each fragment is made with a visibly handmade technique whose material echoes what is being launched, and every piece obeys the same production rule, such as a single uncut camera move. The audience follows the trail, pieces together the clues and, eventually, the full reveal arrives as the completion of a story they have been solving.\n\n## Key mechanisms\n\n**A trail rather than a reveal.** The launch is broken into a chain of hints. A phrase is seeded somewhere unexpected; a symbol appears with no explanation; a cross-platform sequence of fragments points from one place to the next. Core fans may receive a surprise early drop. The audience becomes a group of investigators, comparing notes and building anticipation before the answer is given.\n\n**Handmade materials that comment on the message.** Each clue is made by hand in a material connected to the thing being launched. If the launch is about reuse, the clues might be cutout animation made from discarded material; if it is about craft, thumbprints are left visibly in the clay. The material itself becomes a clue — viewers infer something about the launch from what the fragment is made of — and it signals human effort in a landscape of machine-perfect imagery.\n\n**One constraint, fully committed.** Every fragment is shot under the same rule. A single uncut camera move travels across each handmade set, or every piece is filmed from a first-person rig, or a budget limit becomes a framing rule that all clues share. The constraint gives the trail a distinctive texture that makes each fragment instantly recognisable as part of the same puzzle, even when it appears in an unfamiliar place. The craft itself becomes something people notice, discuss and remember.\n\n## How it fits together\n\nThe trail creates participation; the handmade material creates meaning; the single constraint creates coherence. A cross-platform chain of clues risks becoming scattered and hard to follow; the strict production rule ties every fragment together, so audiences know they have found another piece. Handmade material gives investigators something to interpret — the fragments are not only teasers but readable artefacts. And the craft makes the eventual reveal satisfying, because the final piece can complete the camera move or assemble the handmade set into its finished form.\n\nThe constraint and the craft also support each other. A single uncut move across a handmade set exposes every imperfection, which is exactly the point: the visible human effort becomes part of the story, and the unbroken move proves that nothing was faked between cuts.\n\n## Why it works\n\nPeople invest more in what they have had to work out. By releasing the launch as clues, the brand turns attention into a game that runs for weeks rather than seconds. By making every clue by hand in a material that echoes the message, it gives that game substance and a texture that stands apart from the generic look of digital launches. By committing to one constraint across all of it, it makes the work recognisable and memorable as craft. When the reveal comes, it lands as a reward for those who followed the trail, and as a distinctive piece of work for those who arrive only at the end."}, {"id": "i002", "t": "# Made by the People Who Shape Us\n\n## The problem\n\nMany social problems are not chosen by individuals; they are learned. Children copy what their parents do. Adolescents adopt the habits of the people they admire. Stigma teaches people to hide what they need. Yet most campaigns about such problems speak to the individual who already has the behaviour, often in a tone that feels like blame, and with a production style the audience instantly recognises as advertising.\n\nThe opportunity is to aim at the source of the norm (the people who model it), to do so in a form that earns a place in culture rather than in an ad break, and to give the public a reason to spread the work themselves.\n\n## The approach\n\nA brand commissions a respected outside creator to make a genuine piece of culture (a documentary, a stage play, or a film by a director who does not make ads) about how a harmful norm is passed from one generation to the next. The brand stays light, almost invisible in the work.\n\nAround that film, the public is invited to design the artefacts that model a better norm: the objects, messages or rituals parents and role models can share with the young people who watch them. The best are chosen by public vote and made by the brand. Entrants have to rally their own followers to win, which turns the contest into the work's distribution.\n\n## Key mechanisms\n\n**Trace the problem to its transmission.** The strategic starting point is the observation that behaviour travels through modelling. The campaign therefore addresses the parents, older siblings, coaches and public figures whose behaviour young people copy, rather than the young people themselves. The tone shifts from \"stop doing this\" to \"they are watching what you do\".\n\n**Hand the story to a real creator.** An outside filmmaker or playwright with credibility in their own form explores the theme with full creative control. The brand's role is limited to making it possible. Because the work is good and sincere, it is reviewed, screened and discussed as culture, reaching people who would ignore an advert, and carrying a message about modelling behaviour into homes in a form families watch together.\n\n**Let the public make the answer.** Following the release, the brand invites the audience to design what a positive model looks like: a product, a gesture, a family ritual. Finalists are put to public vote, and the winning designs are manufactured and sold or distributed. Each entrant, to win, must persuade their own community to vote, so every participant becomes a distributor of the campaign and of the message behind it.\n\n## How the pieces connect\n\nThe strategic insight decides who the work is for: the models, not the copiers. The outside creator decides how it is told: as genuine culture, with the authority and emotional depth to change how parents see their own behaviour. The public contest decides how it spreads and what it leaves behind: real objects and rituals, designed by the audience, that put the new norm into daily life.\n\nThe film gives the contest its meaning. The contest gives the film its reach. And both are aimed at the moment of transmission, where a norm can actually change.\n\n## Why it works\n\n- **It changes the norm rather than blaming individuals.** Speaking to role models avoids shaming the people affected and targets the mechanism that perpetuates the problem.\n- **It earns attention honestly.** Work made by a respected creator in their own form is chosen, watched and discussed as culture.\n- **It distributes itself.** Participants have a personal reason to share, so the campaign spreads through networks the brand could never buy.\n- **It leaves something useful.** The winning designs become everyday tools for the people who model behaviour, keeping the message alive long after the film.\n\nThe result is a campaign that reaches the people who teach by example, in a form they respect, and lets them build the better example themselves."}, {"id": "i068", "t": "# The Tour With No Barriers and a Song That Does Not Fit\n\n## The problem\n\nDestination marketing tends to show a place as scenery: landscapes, landmarks, beautiful empty streets. Travellers see the views but not the people, and the places come across as backdrops rather than living homes. At the same time, many of the residents who could be the best hosts, especially from under-represented communities, are shut out of the visitor economy by practical barriers: no fixed address, no ID, no bank account, entitlements scattered across different systems.\n\nThe challenge is to market a place through its real people, unlock participation for those currently excluded, and do it in a way that cuts through the predictable look of travel advertising.\n\n## The approach\n\nMarket the destination through locals who act as hosts and guides, remove the single gatekeeper that keeps many of them from taking part, and present the campaign in films set against music whose mood deliberately contradicts the images.\n\nResidents, including those from under-represented groups, become the cast and the hosts. To make this possible, the campaign identifies the one barrier behind many exclusions, such as needing a fixed address or a bank account to receive payment, and removes it with one tool: an account that needs no address, an ID that doubles as a payment card, or a single portal for all relevant entitlements. The films then show these hosts and their places against a soundtrack that clashes with the imagery, a sweet old song over chaotic city life, or a children's tune over hard scenes, so that the clash carries the message.\n\n## Key mechanisms\n\n**1. Marketing through residents.** Locals as the cast, residents as hosts and the city's own creative trade presenting it show the place as a home rather than a set. Travellers are given someone to visit, not just somewhere.\n\n**2. Removing the single gatekeeper.** Many hosts cannot participate because one requirement blocks everything else. A tool that removes that requirement unlocks all the access it was blocking: they can be paid, verified and listed. The campaign's inclusion is not just in the casting; it is built into the infrastructure.\n\n**3. Music against the image.** Contradictory music creates friction that forces viewers to pay attention. A gentle melody over gritty realism can jolt viewers into seeing the place honestly, or add a lightness and humour that makes ordinary scenes delightful. The clash says something the images alone could not.\n\n## How they combine\n\nThe resident hosts are the content, the gatekeeper tool is the enabler and the contrasting music is the delivery. The films show real people hosting in their real neighbourhoods; the tool is what lets them do it; the music makes the films stand out from every other travel ad and often reveals the gap between how a place is imagined and how it really is.\n\nStep by step: find residents who want to host; identify the single barrier that excludes many of them; build or adopt the tool that removes it; onboard hosts through it; film them in their places with music that contradicts the images; let the films drive bookings with those hosts.\n\n## Why it works\n\nIt changes both the picture and the system. Travellers respond to people more than to postcards, and the residents gain real economic access, not just representation. The contradictory soundtrack ensures the films are noticed and remembered, and gives the work a tone of honesty and wit that standard destination advertising lacks. The result is a place marketed by its own people, many of whom could not have taken part before."}, {"id": "i104", "t": "# The Record Pressed From What Happened\n\n## The problem\n\nSome harms are hard to make present for people who were not there. Photographs and reports reach the eyes but leave the other senses untouched, and the audience keeps a safe distance. Music could close that gap, since it reaches people emotionally and travels widely, but digital abundance works against it. A track uploaded for everyone is easily skipped, and a message carried by it can be consumed and forgotten in the same moment.\n\nThe task is to make the harm felt with more than one sense, give the audience something they literally hold, and make the work valuable enough that people seek it out and talk about it.\n\n## The idea\n\nMake a sound work that carries the place or the moment of the harm, and press it into a physical object made from the evidence of that harm. Release it with deliberate scarcity: only a few copies, or even a single one, passed from listener to listener, or playable only at the place it describes. Hearing it means seeking it out; holding it means holding the argument; passing it on means joining the chain of witnesses.\n\n## Key mechanisms\n\n**Sound as the missing sense.** The work uses recorded or reactive audio to put the listener inside the subject. It might capture the ambient sound of the place where the harm occurred, render a famous image in spatial audio so that you stand inside it, or translate physical traces, cracks, marks, damage, into music. Where pictures keep a distance, sound surrounds. The listener does not look at the place; they are briefly in it.\n\n**A medium made of evidence.** The physical carrier of the sound, the record, its sleeve, its printed notes, is made from material that is itself evidence or a symbol of the problem: residue from the site, ink made from what remained, a typeface taken from the handwriting of someone affected. The object is not packaging around a message; it is the message. Anyone holding it holds proof.\n\n**Scarcity and discovery restored.** Instead of being uploaded for everyone, the work is made hard to reach. A single copy might be passed hand to hand, each listener taking a turn before giving it to the next. Tracks might be playable only at one physical location, or hidden at coordinates people must find. Because it is scarce, the work becomes an event: people want to know who has it, where it can be heard, and what it sounds like.\n\n## How it works together\n\nThe three elements form one object with one journey. The sound supplies the emotional immersion. The evidence-made medium supplies the weight of truth. The scarce release supplies value, conversation and spread.\n\nEach would be weaker without the others. Immersive sound posted freely becomes background. An object made of evidence that contains nothing to experience is a sculpture. A scarce release of something ordinary is a gimmick. Together, the object becomes something people want to hear, are moved by when they do, and feel responsible for when it is their turn to pass it on.\n\nThe chain of listeners also becomes part of the story. Each handover creates a witness who can tell others what they heard and held, so the reach of the work grows through testimony rather than plays.\n\n## Why it works\n\n- **Immersion beats information.** Sound places the audience inside the subject, making the harm felt rather than understood at a distance.\n- **Evidence in hand.** A physical object made from the problem is undeniable, and it gives people a reason to keep and show it.\n- **Scarcity creates attention.** A work that has to be sought out commands more care, and generates more talk, than one that is everywhere.\n- **Witnesses as media.** Passing the object on turns each listener into a carrier of the story, so the work spreads through people's own accounts."}, {"id": "i132", "t": "# One Copy, Many Keepers: The Sound of a Place Passed Hand to Hand\n\n## The problem\n\nWhen something irreplaceable is threatened, the usual response is documentation followed by grief. A building is photographed, then lost; a collection is catalogued, then removed. The public watches from a distance and feels powerless. Heritage becomes a subject of news rather than something people hold.\n\nMusic, by contrast, is something people hold very closely, but digital abundance has drained releases of weight. A track that can be streamed anywhere is easily skipped.\n\nThe question is whether the intimacy people feel with music can be lent to the places that are at risk, and whether a sense of custody can replace the sense of helplessness.\n\n## The approach\n\nRecord the sound of an endangered place, treat that recording as a backup from which the place could be rebuilt, and release it as a piece of music that exists in a single copy, carried from listener to listener like an heirloom entrusted to each in turn.\n\nThe recording uses binaural and reactive techniques so that listening puts you inside the place: its scale, its echoes, the movement of air, even music read from its cracked surfaces. It forms part of an archive, contributed to by ordinary people, from which the place's presence could be reconstructed. The music made from it is not released to everyone at once. It passes from one listener to the next, or waits at the place itself, playable only there.\n\n## Key mechanisms\n\n**1. A backup that defies erasure.** Treating preservation as backup means the place can be rebuilt if it is destroyed. Its sound, alongside any scans, keeps its identity safe, and any rebuilding becomes a peaceful counter-statement. Where works have been removed, copies can reappear inside the very institutions that removed them.\n\n**2. Sound that puts you inside.** Recorded and reactive audio supplies the sense that images lack. The listener does not view the place; they are surrounded by it. The recording carries presence, not just information.\n\n**3. Scarcity as custody.** One copy passed between listeners, or a track playable at one spot, turns the release into an event and each listener into a temporary keeper. People seek it out, wait their turn, and share their moment with it.\n\n## How they come together\n\nThe backup gives the recording its significance: this is how the place survives. The sound gives it its emotional force: this is what it feels like to be there. The single circulating copy gives listeners a role: for a while, you are the one who keeps it. Each keeper listens, perhaps visits, perhaps adds their own recording, and passes it on. The chain of custody becomes the story of the campaign, and the place gains a growing community who have, in a sense, held it.\n\nThe sequence: record the place deeply; store the recording as part of a public backup; compose a piece from it; release a single copy or bind it to the site; let it move from keeper to keeper; document the chain and invite each keeper to share.\n\n## Why it works\n\nIt turns spectators into custodians. People feel responsible for what they have been trusted with, and they feel connected to places they have been immersed in. The scarce copy creates anticipation and conversation, the immersive sound creates attachment, and the backup idea frames the whole effort as resistance rather than mourning. A threatened place stops being a news story and becomes something many people have personally carried."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
