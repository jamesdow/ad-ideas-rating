(function () {
  "use strict";
  var DATA = {"pack": "P04", "items": [{"id": "i141", "t": "# Made by Us, Carried by Many, Fronted by Fans\n\n## The problem\n\nA small organisation wants to reach a diverse community with an important message, but faces three obstacles. Its budget is small, so its own channels reach only a fraction of the audience. The community is made of many sub-groups, each with its own language, accent and culture, and a single message made from outside rarely speaks to all of them. And when the organisation brings in recognisable faces to help, the partnership can easily look like a paid endorsement, which undermines trust.\n\nThe task is to make the message genuinely belong to the community, spread it far beyond the organisation's budget, and use talent whose involvement feels real.\n\n## The approach\n\nHave the community make the work about itself, design the initiative to be adopted and spread through partners' channels, and front it with talent who genuinely love or use what is being promoted.\n\nCreators from each sub-group of the community take the lead behind the camera and in their own voices, with local accents and concepts led by the community, and with outreach rewritten for each language. The initiative is built to be handed on: toolkits partners can adapt, local stories pitched to each community's media, coalitions that co-own and co-fund the effort. The faces chosen to support it are people who are already genuine fans or users, a lifelong supporter, someone whose enthusiasm is already well known, a creator committed over a long period.\n\n## Key mechanisms\n\n**1. Community behind the camera.** When the community makes the work, the message practises the inclusion it preaches. Creators from different sub-groups, speaking in their own voices and languages, reach each part of the audience directly and authentically.\n\n**2. Scaling through other people's channels.** A coalition that co-owns and co-funds the effort, adaptable toolkits, local stories pitched in every community and an initiative designed to be passed on let a small organisation's cause travel far beyond its own budget.\n\n**3. Talent with genuine affinity.** Choosing people who truly love or use the product or cause makes their involvement read as enthusiasm rather than payment. Their followers recognise the authenticity, which is what moves them.\n\n## How the elements combine\n\nThe community-made content provides credibility and reach into each sub-group; the partner model provides scale; the genuine fans provide visibility. The toolkits make it easy for partners to adapt the community's work for their own audiences, while the authentic talent amplify it to their followers. Each layer multiplies the others: content made by the community is more likely to be adopted by partners, and talent who genuinely care are more likely to share content that feels real.\n\nStep by step: invite creators from each sub-group to lead the work; produce versions in each language and voice; package the work into adaptable toolkits; recruit partners to co-own and spread it; enlist talent with real affinity; keep feeding local stories into community media.\n\n## Why it works\n\nIt solves the small organisation's problems by sharing ownership. The community owns the content, partners own the distribution and genuine fans own the endorsement. None of these feels like advertising imposed from outside, so each reaches its audience with trust intact. The organisation achieves reach and resonance far beyond its budget because everyone involved is carrying something they believe is theirs."}, {"id": "i062", "t": "# Clues in Their Own Voices: Answering Hate by Letting the Targeted Community Lead a Puzzle-Trail Reveal\n\n## The problem\n\nWhen a brand stands beside a community that is attacked online, its response often falls into one of two traps. It issues a statement in its own corporate voice, which can feel like the brand speaking for others, or it launches a one-off ad that captures attention briefly and then disappears. The attackers' narrative often outlasts the response. And the people actually targeted are rarely given control of how their story is told.\n\nThe reconstructed idea joins three components: answering the hate by turning the attack into the brand's own material, building the portrayal from the community's own people and material, and releasing the response as a trail of clues that turns the public into active participants.\n\n## The approach\n\n**Reclaim the attack.** The brand takes the insult, the hateful symbol or the taunt and makes it the creative material. The insult is adopted collectively, the hateful symbol is redrawn, the taunt is answered with its opposite, and the most criticised ambassador is backed openly. The brand casts itself as a principled ally.\n\n**Let the community tell it.** The response is constructed from real people and their own material. Members of the community are cast as themselves, given control over their stories, and invited to contribute home videos, messages and recordings. Where people being recreated or remembered are involved, their families participate.\n\n**Release it as a trail.** Instead of revealing everything at once, the response unfolds as a series of clues. A reclaimed phrase is seeded in unexpected places. The redrawn symbol appears before any explanation. Hints travel across platforms, each pointing to the next. The community's core supporters receive an early drop. The public assembles the story piece by piece until the full response is revealed.\n\n## Key mechanisms\n\n- **The attack becomes the brand's material.** Every time the hostile content circulates, the reclaimed version competes with it. The controversy carries the message.\n- **Authenticity through ownership.** When the people targeted choose how they appear and supply their own material, the work cannot be dismissed as the brand speaking over them.\n- **Participation sustains momentum.** A trail of clues builds anticipation over time. People who solve the puzzle become invested in the reveal and in spreading it, extending the response's life far beyond a single ad.\n\n## How the elements interact\n\nThe reclaimed attack supplies the clues: a redrawn symbol or a reversed taunt can be the first hints seeded before anyone explains them. The community's own material supplies the substance revealed at each step: real messages and home footage that show who the targeted people are. The trail structure gives the whole thing tempo. Each clue reclaims a fragment of the attack and leads to a fragment of the community's story, until the final reveal presents the full, self-told portrait alongside the brand's clear stance.\n\n## Why it works\n\nIt answers hate with something more engaging than the hate itself. It places the community at the centre in a way that scripted casting cannot, and it transforms the public from bystanders into investigators who help assemble the counter-narrative. The brand earns its role as ally by giving the stage to those targeted, using the attackers' own material to start the trail, and letting the reveal speak in voices that are unmistakably real."}, {"id": "i021", "t": "# The Hand-Made Episode That Teaches the Teachers\n\n## Why change is hard\n\nMany social problems are not individual failures but learned behaviours. Children copy their parents. Adolescents choose role models and imitate them. Stigma teaches people to hide their needs. Campaigns that blame individuals miss this transmission entirely, and campaigns that run as one-off films rarely have time to change a norm, which shifts slowly over years.\n\nAt the same time, audiences are increasingly surrounded by machine-made imagery, and messages about human behaviour can feel cold when presented through slick production.\n\nThe challenge is to change how a behaviour is passed on, sustain that effort long enough for norms to move, and present the message in a form that feels human.\n\n## The idea\n\nThe campaign traces the problem to how it is learned and passed on, and aims at the people who model it: the parents children copy, the role models adolescents choose, the social environment that creates stigma.\n\nIt does so through a repeatable frame: a recurring hero, a fixed template, a myth with one simple rule, or a sequel that brings back the same cast. Each new execution is an episode in a continuing story rather than a fresh start.\n\nEach episode is produced in a visibly handmade technique whose material or process echoes the message: puppets, sets made from relevant everyday materials, cutout animation, thumbprints left in the clay. The craft itself comments on the story.\n\n## Mechanisms in practice\n\n**Targeting the models.** The campaign speaks to those whose behaviour is copied. Rather than telling the person who has learned the behaviour to stop, it shows the people who model it what they are passing on. The goal is to change the norm at its source.\n\n**Episodic continuity.** A recurring hero or fixed template lets the campaign return year after year. Audiences greet the familiar characters and structure, and each new episode adds to the story rather than restarting it. Because norms change slowly, this persistence matters; meaning accumulates with every episode.\n\n**Craft that carries meaning.** A handmade technique signals human effort. When its materials or process echo the message, the craft becomes part of the argument. Sets built from materials associated with the behaviour, or animation that visibly shows hands at work, remind viewers that habits are shaped by human hands too, and can be reshaped.\n\n## How they reinforce one another\n\nThe focus on transmission suits the episodic frame. Learning happens over time and across generations; a story that continues over years, perhaps following the same characters as they grow, mirrors the way behaviours are passed on. A sequel can show the consequences of what an earlier episode's characters modelled.\n\nThe handmade technique suits the focus on transmission too. Handcraft is itself passed on, learned by watching and copying. A puppet or a clay figure with visible fingerprints quietly makes the point that what we make, and what we teach, carries our marks.\n\nThe episodic frame makes the handmade technique sustainable as a signature. Once the audience associates the campaign with a particular material or style, each new episode is recognised instantly, and the craft becomes the campaign's identity.\n\nAnd the craft makes the episodic frame feel warm rather than formulaic. A recurring template can become predictable; a handmade one, with its imperfections and visible effort, stays human.\n\n## Why the approach works\n\nIt works on the problem where it actually lives: in the transmission of behaviour from models to learners. By addressing the models, the campaign avoids blame and targets the source of the norm.\n\nIt lasts long enough to matter. Because each execution builds on a recurring frame, the campaign accumulates recognition and meaning over years, matching the slow pace of social change.\n\nAnd it speaks in a human voice. Handmade craft whose materials echo the message signals care and effort, and invites audiences to reflect on how behaviour, like craft, is shaped by the hands that make it. Over time, the campaign becomes a familiar presence that teaches the teachers."}, {"id": "i117", "t": "# The Empty-Chair Sale Day\n\n## The difficulty\n\nBig shopping occasions command enormous attention. For a few days a year, the public is primed to browse, spend and respond to offers, and media coverage follows them closely. Causes, by contrast, struggle for attention on ordinary days, especially causes defined by a large and repeated number. When a loss is reported often enough, the figure stops registering, and people no longer feel what it means.\n\nThe task is to redirect the energy of a mass shopping moment toward a cause, and to make its overwhelming number felt again, in a form that can be repeated and grown over time.\n\n## The concept\n\nInvent a named day for the cause that slots into the existing run of shopping days, and use that day to present a film series in which each film stands for one individual within the statistic. The series is held together by one fixed device, the same script, a recurring object or a repeatable structure, while each film is made by a different director in a different genre or style. On the day, the films are released alongside a physical counting device, such as one empty chair or one name for each person, placed where shoppers will encounter it.\n\nThe shopping season provides the audience; the series and the counting device restore the meaning of the number.\n\n## Key mechanisms\n\n**A named day among the shopping days.** The cause claims its own day within, or immediately next to, an established sequence of shopping occasions, or it chooses to stand apart from the biggest sale day in a visible way. Because the day joins an existing ritual, it borrows the habits and attention people already bring to that season: they are online, looking at offers, receptive to messages. The cause redirects that energy toward giving or reflection.\n\n**Individuals instead of a figure.** On the day, the statistic is broken back into people. One object, one chair or one name, stands for each person, and the objects are placed where shoppers go. A stretch of silence or a compressed timeline can also represent the total. People can count and meet those represented, and the figure becomes a felt absence rather than a number.\n\n**A film series with one fixed device.** Each person in the count can be honoured in a short film. The films are bound by a single constant: the same script interpreted by different directors, a recurring character, or a fixed structure. Each film differs in genre and style. The constancy makes them recognisable as one body of work; the variety shows the breadth of lives behind the statistic, and gives every audience a film that speaks to them.\n\n## How it holds together\n\nThe shopping day solves attention, the counting device solves numbness, and the film series solves sustained engagement. On their own, each would be limited. A named day without a strong emotional core would be another promotion. Physical objects without stories would be poignant but mute. Films without a moment to launch them might be lost in the content stream.\n\nTogether, the day gives a reason to release and a ready audience, the objects bring the scale into public view, and the films give each object a voice. The fixed device lets the series grow: each year, new directors can interpret the same script, so the day becomes a recurring fixture with fresh work.\n\n## Why it works\n\n- **Borrowed habit.** Slotting into an established shopping ritual means the cause does not have to build attention from nothing.\n- **Number made personal.** Individual objects and films turn a total into people the public can count and care about.\n- **Variety as proof.** Different genres around one constant show that the loss touches every kind of life, which no single film could prove.\n- **Built for repetition.** A named day and a fixed creative device make the campaign easy to renew, building recognition year on year."}, {"id": "i140", "t": "# Clues Worth Listening For\n\n## The problem\n\nSome health issues are treated by the public as niche or contested: they seem to belong to a small group of patients, or they are tangled in debates that make people switch off. Those who are affected face a second barrier, because treatment and therapy often feel like a chore to be endured, so people drop out. And any launch of a new therapy or public programme competes for attention with everything else, usually with a single announcement that is quickly forgotten.\n\nThe task is to make a wider public feel the issue is theirs, to make the therapy something people want to do, and to launch it in a way that creates anticipation and participation rather than a one-day story.\n\n## The approach\n\nThe idea is to deliver a therapy through something people already enjoy and use, launched as a trail of clues and puzzles, and framed around the cost that everyone bears when the issue goes untreated.\n\nThe therapy is built into an everyday pleasure. Following the pattern of songs carrying a therapeutic frequency on a music app, sing-along playlists for speech practice, a metronome on a smartwatch or short parent-child game sessions, the treatment becomes an activity people would choose for its own sake.\n\nBefore the therapy is announced, the launch begins as a trail. A phrase is seeded, a symbol appears without explanation, and hints are spread across platforms, each leading to the next. Core communities receive early access. The audience becomes investigators, trying to work out what the clues point to.\n\nWhen the answer is revealed, the issue is framed not as a concern for a few but as a cost everyone bears: what the public loses when the problem goes untreated, and who else is part of the solution. This framing makes the reveal matter to people who had followed the trail without any personal stake.\n\n## Key mechanisms\n\n**Therapy through enjoyment.** By embedding treatment in music, games or familiar devices, the therapy stops being a burden. Patients choose to use it, which improves adherence. It also makes the therapy shareable: a playlist or a game can be passed on in a way a clinical regime cannot.\n\n**A launch as a puzzle.** The trail of clues turns attention into participation. People who solve hints share them, discuss them and wait for the next one. By the time the reveal arrives, a large audience is already engaged and invested in the answer.\n\n**Reframing as a shared cost.** Presenting the issue as something that affects everyone widens who feels responsible. It sidesteps entrenched debates by focusing on common loss rather than contested positions. People who are not patients see why the therapy matters to them.\n\n## How the parts interact\n\nThe trail creates curiosity and gathers an audience. The reveal delivers the therapy, which is itself enjoyable, so the audience can try it immediately. The shared-cost framing gives the reveal meaning beyond novelty and gives non-patients a reason to pass it on.\n\nThe clue format suits the therapy format: both are playful, both invite active involvement, and both live in the channels people already use. The puzzle might even be built from the therapy's own material, such as a melody, a rhythm or a game sequence, so that solving the trail is a first taste of the treatment.\n\nWithout the shared-cost framing, the launch would be a clever puzzle for a niche product. Without the puzzle, the therapy would be announced into silence. Without the enjoyable format, the attention would lead to a therapy people would still find hard to stick with.\n\n## Why it works\n\nIt works because it converts every part of the usual sequence into something people choose. They choose to follow the clues, they choose to try the therapy, and they choose to care because they see how the issue affects them. The issue moves from the margins to the mainstream, and the treatment moves from obligation to habit.\n\nThe approach also builds lasting engagement. A puzzle community does not disappear after the reveal; it continues to share. A therapy people enjoy is used again. And a framing that shows everyone's stake makes the issue part of public conversation instead of a debate for specialists."}, {"id": "i110", "t": "# A Billboard That Keeps People Safe\n\n## The problem\n\nProtection brands are paid to be there when things go wrong, but they are rarely there before. Their value is invisible until a loss occurs, and their advertising tends to make claims about care that the audience has no way to test. Outdoor media makes this worse: a static poster promising safety sits in the street doing nothing, regardless of the conditions around it or the risks the people passing are facing.\n\nThe brand needs a way to prove, in public, that it can prevent harm rather than only pay for it, and to do so at the exact time and place where risk occurs.\n\n## The approach\n\nThe idea is to build the brand's outdoor advertising as working protective infrastructure, connected to live local conditions and powered by the data and expertise the brand already owns.\n\nThe brand knows, from its research and claims operations, which conditions precede harm: particular weather, particular traffic, particular moments at particular places. It takes that knowledge out of the back office and into the street. Its placements are engineered so that they physically do something useful: a structure that offers shelter, a surface that becomes a bench, a board that produces something people need, such as drinking water condensed from the air. And these structures are wired to live conditions in their surroundings, so that their message and their function change with what is happening around them at that moment.\n\nWhen conditions are calm, the placement simply serves: shade, rest, water, light. When the brand's data says risk is rising, for example from local humidity, the traffic ahead or the arrival of a crowd, the placement switches to an intervention: a warning specific to this spot, an instruction, a protective function activated.\n\n## Key mechanisms\n\n**Redeploying owned assets to intervene before harm.** The brand's data, research and operational knowledge are the raw material. Using them to act at the moment of risk moves the brand from compensation to prevention. Its purpose is demonstrated by something people can use, not described in copy.\n\n**Advertising as working infrastructure.** The placement is not a picture of help; it is help. A poster bent into a shelter or a board that produces water proves the brand's claim by performing it in the street. People encounter the brand as a useful object before they read any message.\n\n**Media driven by live local conditions.** Because the structure knows what is happening where it stands, its messages are timely and specific. It speaks about this street, this junction, this weather, right now. The same placement can be a convenience on a calm day and a safeguard on a dangerous one.\n\n## How the parts interact\n\nThe three components reinforce one another. The infrastructure gives the brand a permanent, physical presence in places where risk occurs. The live data feed gives that presence intelligence, so it knows when to shift from service to protection. The brand's owned expertise decides what counts as danger and what the right intervention is.\n\nWithout the infrastructure, the live messages would be another reactive screen. Without the live conditions, the infrastructure would be a helpful but generic street object. Without the brand's own knowledge, both would lack credibility, because anyone could put up a shelter or a weather-triggered sign. The combination is something only a protection brand could build.\n\n## Why it works\n\nIt works because the audience does not have to believe a promise; they experience it. People take shelter, sit down, drink, or receive a warning that is relevant to where they are. The usefulness is immediate and local, which makes the brand feel present rather than distant.\n\nIt also changes the meaning of the brand's media spend. Instead of buying space to talk about protection, the brand buys space to protect. Each placement becomes evidence, and each intervention becomes a small story of harm avoided. Over time, the audience comes to associate the brand not with the aftermath of bad days but with the quiet, practical help that stops them happening."}, {"id": "i075", "t": "# Who Will Win: A Pledge of Fair Judgement, Stamped Into Every Visitor and Backed by a Verified Bias Tool\n\n## Context\n\nPublic attitudes toward disabled people are often shaped by pity. Coverage frames disabled athletes and individuals as inspirational exceptions or as objects of sympathy, rather than as competitors or ordinary people. Campaigns that try to correct this often preach, and audiences, believing they hold no bias, ignore messages that seem aimed at someone else. Commitments people make in response are typically optional, soft and impossible to count.\n\nThe reconstructed idea brings together three elements: a portrayal that presents disabled people as elite competitors or simply ordinary people and turns the lens onto the audience's own assumptions; a civic commitment built into an act of identity that cannot be skipped; and a data or AI tool, with safeguards to keep it accurate and trusted, that makes the audience's bias measurable.\n\n## The approach\n\n**Shift the question.** The work treats disabled people as competitors whose outcome matters, focusing on who will win rather than whether they can participate. It also reflects back at the viewer the patronising assumptions they might hold: the camera shows the audience's own reactions, or invites them to recognise moments when they slipped into pity.\n\n**Measure the assumption.** A data tool is built to detect patronising framing, for instance in commentary, captions, headlines or people's own descriptions. Because a tool that labels bias must be credible, it is constructed with explicit checks: feasibility is tested before any public launch, expert curation takes precedence over raw algorithmic output, humans review the classifier's decisions, and large-scale perception tests ensure the tool's judgements match how people understand language.\n\n**Make the commitment unskippable.** The response asked of the public is built into an act of identity. A pledge to judge disabled people as competitors might be stamped into every visitor's passport or entry credential at the relevant event or location; a symbolic citizenship might be granted through signing; or the names of those who commit might be read aloud.\n\n## Key mechanisms\n\n- **Reframing dislodges pity.** By asking who will win, the work moves disabled people from the category of exception into the category of competitor. Turning the lens on the viewer forces them to notice their own bias instead of assuming it lives in others.\n- **Verification makes the critique stick.** A tool that identifies patronising framing would be dismissed if inaccurate. Expert curation, human review and perception testing give it credibility with the people who must rely on its results, such as broadcasters, writers and the public.\n- **Identity acts make commitment real.** A pledge printed in one's passport or credential cannot be skipped, is personal and public, and can be counted.\n\n## How it fits\n\nThe portrayal raises the issue, the tool shows people how often it happens, including in their own language, and the commitment converts that recognition into a counted, personal act. Someone might use the tool on a sample of coverage or on their own phrasing, see where patronising assumptions crept in, and then receive the pledge in their passport or entry credential as they enter. The number of stamps shows how many have committed, and the tool can be used over time to track whether coverage really changes.\n\n## Why it works\n\nIt moves past persuasion to accountability. It respects disabled people as competitors, makes the audience confront their own assumptions without lecturing, gives that confrontation an evidence base that experts and users can trust, and ends with a commitment that becomes part of who the participant is. Bias stops being someone else's problem and becomes something each person has measured in themselves and publicly promised to change."}, {"id": "i038", "t": "# Scan the Spectacle, Play by Text: A Game Anyone Can Join From Any Phone\n\n## Problem\n\nBrand games often reach only a narrow audience. They require a new app, a recent smartphone, mobile data and the confidence to download and learn something. Everyone else — people with basic phones, limited data or little experience of apps — is excluded, even though they may be precisely the people a brand most wants to reach.\n\nThere is a second gap: public spectacles, broadcasts and artworks capture enormous attention, but that attention usually ends where it begins. People look, are impressed and move on. Nothing turns that moment into participation or a purchase.\n\n## Approach\n\nThe idea turns a product or promotion into a game that begins inside a public spectacle and can be played on the simplest technology people already carry.\n\nA broadcast, a large public event or a painted mural carries a scannable code or a location lock. For those with a smartphone, scanning the code inside the television picture or standing at the mural opens the game on the spot. For those without, the same entry is offered through basic channels: a number to text, a missed call that registers the player, keypad responses during a voice call, or a payment through a wallet already on the phone.\n\nThe game itself puts the product into the gameplay. Rewards are unlocked by skill or knowledge. Items earned in the game can have real-world twins that can be redeemed. The game might scale a familiar playground game to the size of a city, played through texts and calls as players move through public spaces.\n\nCrucially, the moment of play is also a moment of sale. The scan or text that starts the game can open a checkout; the reward earned can be redeemed immediately; the spectacle becomes the point of sale.\n\n## Key mechanisms\n\n**The game as the brand experience.** Instead of watching an advert, people act out the brand idea. The product is inside the gameplay, rewards depend on skill or knowledge, and in-game items have real counterparts. Players experience what the brand offers by using it in play.\n\n**Basic technology as the entry point.** Building the game on SMS, missed calls, keypad input, voice calls and existing phone wallets removes the cost and skill barriers that usually exclude people. Almost anyone can take part, including those most often left out of digital campaigns.\n\n**Codes and locks in the spectacle.** Embedding a code in a broadcast picture or locking a checkout to a specific mural transforms a moment of attention into an immediate action. The viewer does not need to remember a website or search later; the action is available in the moment of interest.\n\n**Bridging two audiences.** Smartphone users scan; basic-phone users text or call. Both arrive in the same game, play by the same rules and can win the same rewards. The spectacle is shared, and so is the participation.\n\n## Why it works\n\nThe idea removes the two points at which participation usually fails: the barrier of technology and the gap between attention and action. By using codes and location locks, it captures the instant when interest peaks. By building on the most basic phone features, it ensures that the people captured can actually take part.\n\nThe game gives the experience a reason to continue beyond the first scan or text. Players return to earn rewards, discover in-game items with real counterparts and engage with the product as part of play. Because every route into the game can also lead to purchase, the spectacle, the game and the point of sale become one continuous experience.\n\nThe brand ends up with a campaign that is both mass and inclusive: visible to everyone who sees the spectacle, playable by anyone with any phone and able to convert that participation into immediate sales."}, {"id": "i123", "t": "# Live It Again, Where You Stand\n\n## The problem\n\nAnniversaries of historic events are usually marked with retrospectives: a documentary, an article, a summary of what happened. For anyone who was not alive at the time, the event remains a story told after the fact, something to read rather than to experience. Younger audiences in particular feel no connection.\n\nAt the same time, music and games have both become abundant and placeless. A track can be streamed anywhere; a mobile game is played on a sofa. Neither connects to the streets people actually live in.\n\nThe opportunity is to let people live through a historic event as it unfolds, in their own surroundings, and to make the experience something they have to seek out.\n\n## The approach\n\nOn the anniversary of a historic event, the event is re-run in real time as a location-based game. The phone's GPS and motion sensors turn the player's own city into the map of what happened. The music that defined the moment, or new music made in its memory, is hidden across the map: tracks that can only be played at specific coordinates, at the hour they would have mattered, in the order the event unfolded.\n\n## Key mechanisms\n\n### A historic event in real time, in a familiar format\n\nThe game replays the event hour by hour on its anniversary, delivered through formats the audience already uses daily: messages arriving as texts, updates posted to a social feed, calendar alerts, and an interactive account voiced by a participant. Players do not read a summary. They receive the event as it happens, with the same uncertainty and pace as those who lived it.\n\n### The player's own surroundings as the board\n\nThe game maps the original geography onto the player's actual streets. A march route becomes a walk through the player's own neighbourhood. A journey becomes a level played on a real car or train ride. The phone's motion sensors register gestures, such as raising the phone or swinging it, as actions in the story. Because it is played in places the player knows, the history stops being foreign and becomes local.\n\n### Music restored to scarcity\n\nKey songs of the period, or new tracks created for the anniversary, are not available to stream. They are hidden at map coordinates along the route and unlock only when the player physically reaches that spot at the right moment. Some exist as single copies passed between players; others are playable only at one place. Hearing the music becomes an event that players seek out and share with each other.\n\n## How it fits together\n\nThe real-time re-run gives the experience its tension: nobody knows what comes next unless they keep playing. The GPS game gives it its place: the history happens where the player is. The scarce music gives it its reward and its social currency: players move through their streets to hear what others cannot, and they tell each other where to find it.\n\nEach layer reinforces the others. The music draws players to particular places; the places carry them through the event's timeline; the timeline gives the music its emotional weight because they hear it at the moment it once mattered.\n\n## Why it works\n\n- **It replaces summary with experience.** Living through an event hour by hour builds understanding that a retrospective cannot.\n- **It localises history.** Seeing the event in your own streets makes it personal and memorable.\n- **It uses formats people already trust.** Texts, feeds and calendar alerts feel immediate rather than educational.\n- **It turns music into a destination.** Scarcity and location make each track something to pursue, giving players a reason to move, return and share.\n\nFor one day, a historic event happens again, and the people taking part feel it in the places they call home."}, {"id": "i029", "t": "# Open-Source Heritage: A Game That Lets Anyone Back Up Their City\n\n## The problem\n\nEvery community has buildings, statues and places of memory that could be damaged, demolished or deliberately destroyed. Preserving them has traditionally been the job of experts with expensive equipment, which means only a fraction is ever documented, and the public sees preservation as someone else's responsibility.\n\nA brand that wants to contribute faces a familiar trap: a heritage project it owns and controls can only grow as far as its budget, and it risks looking like the brand is claiming the past for itself.\n\nThe task is to get huge numbers of ordinary people documenting the heritage around them, keep the effort growing beyond the brand, and position the brand as a generous enabler rather than an owner.\n\n## The approach\n\nCreate a mobile game that turns players' own neighbourhoods into the board, in which the core action is scanning local heritage into a shared backup, and release the tools and the resulting archive openly, for anyone to use and build on.\n\nPlayers use their phone's GPS and motion sensors to explore their streets and find landmarks. By moving around a building and capturing it, they create a 3D record. The record joins a cloud archive of threatened and cherished places, so that what is lost could be rebuilt. The scanning tools, the game code and the archive itself are made free: open-source, copyright-free, available to museums, schools, other developers and other cities.\n\n## Key mechanisms\n\n**1. The street as the game.** Using GPS and motion turns the player's real surroundings into the play space: racing through their own streets, claiming their own block, swinging the phone to capture a facade. Because it is played in places people know, the game feels personal, and every move happens where the heritage actually is.\n\n**2. Preservation as backup.** The framing shifts preservation from mourning to readiness. A 3D-scanned archive means that destroyed things can be rebuilt, and rebuilding from it becomes a peaceful counter-statement against those who want them gone. Ordinary people, not only specialists, become the custodians.\n\n**3. Giving it away.** Releasing the tools, designs and data openly and for free lets the idea spread far beyond what the brand could fund or run. Others adapt it for their own cities, add their own sites, build new uses on the archive. The brand is cast as a giver, not an owner of the past.\n\n## How they reinforce each other\n\nThe game produces participation at scale; the backup framing gives that participation meaning; openness gives it a future. A closed game would plateau when the brand stopped spending. An open archive with no game would gather few contributions. A game without the backup purpose would be just another app. Combined, they create a self-sustaining loop: people play because it is fun and local, each play adds to a shared record, and the open release lets others extend both the game and the record indefinitely.\n\nThe player journey: open the game, see the heritage around you mapped as objectives, walk there, scan, watch your contribution join the archive, see how others are using it, invite friends to cover the rest of your area.\n\n## Why it works\n\nIt aligns a personal motive, playing in your own streets, with a collective one, protecting what your community values, and removes the ceiling of a single brand's resources. People defend what they have physically engaged with, and they spread what they are free to share. By giving the whole system away, the brand earns a role in the story as the one who made preservation possible for everyone, rather than the one who owns the result."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
