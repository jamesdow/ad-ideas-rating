(function () {
  "use strict";
  var DATA = {"pack": "P05", "items": [{"id": "i023", "t": "# Play to Qualify: Hiring Through a Game That Does Good\n\n## The problem\n\nRecruiting the right people is hard when the skills you need are not captured by a CV. Traditional job ads attract applicants who look right on paper, while the people with the right instincts, patience or problem-solving never apply. At the same time, a brand that wants to be seen as doing good often keeps its social impact separate from its business, so the good work feels like an add-on rather than proof of who it is.\n\nThe challenge is to find the right candidates in a way they enjoy, make the brand's core product the solution to a real social need, and make the whole effort personal for the people it helps.\n\n## The approach\n\nCreate a game that serves as a recruitment test, in which playing well is the qualification for a real job, and make the job itself the brand's product applied to a social problem, with each player matched to a specific person or animal in need.\n\nPicture a brand whose product could address a concrete need, its equipment, service or know-how deployed where it is lacking. The game simulates that work. Players solve puzzles and complete tasks that mirror the job, and the best are invited to do it for real. As they play, they are matched to a specific case: an individual animal awaiting adoption, a person waiting for help, presented honestly, with its real difficulties.\n\n## Key mechanisms\n\n**1. The game as the filter.** Using a game to recruit lets the right people select themselves. A puzzle only the right talent can solve, or in-game skill treated as evidence of workplace ability, reaches candidates who would never answer a conventional ad, and gives them a reason to try. The experience is enjoyable, so participation spreads beyond active job seekers.\n\n**2. The product as the intervention.** The brand's own product does the social good. Rather than donating money to an unrelated cause, the brand applies what it sells to the problem directly, the way a washing machine in a school keeps students attending. The commercial offer and the good deed are the same activity, so the jobs being recruited for are jobs that deliver impact.\n\n**3. A specific match.** Each player, and each recruit, is linked to one particular animal or need, shown with real photographs and honest detail. A search over real cases, or a match between people who would benefit from each other, gives the work a face. Candour about difficult traits or hard circumstances makes the match more realistic and more likely to last.\n\n## How they combine\n\nThe game provides reach and selection; the product-as-intervention provides purpose; the individual match provides emotion and accountability. A player is not just scoring points; they are rehearsing work that the brand actually does, on behalf of a specific case they can see. If they excel, they are offered the chance to carry on in real life.\n\nStep by step: define the job in which the product solves a social problem; translate that job into game mechanics; attach real, individually described cases to the game; invite top players into the actual role; let early hires' stories, and the cases they helped, become the campaign's ongoing content.\n\n## Why it works\n\nIt aligns three motivations that usually pull apart: enjoyment, employment and empathy. People play because it is fun, stay because a specific case matters to them, and apply because the game has shown them they are good at work that does good. The brand, in turn, gets candidates proven by doing rather than describing, and demonstrates its social purpose through the everyday use of its own product rather than a separate charitable gesture."}, {"id": "i044", "t": "# The Censored Song, Released on Freedom's Birthday\n\n## The problem\n\nWhere speech is restricted, a message that challenges the restriction has two enemies: the rule that blocks it, and the indifference of an audience that has grown used to the rule. Publishing the message openly invites removal. Complaining about censorship in the abstract rarely moves anyone. And in a world saturated with content, even a brave message can simply be scrolled past.\n\nThe task is to get a forbidden message through, make the rule that forbids it look absurd, and make enough people care that the act of hearing it becomes a statement in itself.\n\n## The approach\n\nUse the censorship rule itself as the delivery mechanism, release the message as music that is deliberately scarce and has to be sought out, and launch it on the anniversary of the national value the censorship violates.\n\nConcretely, a song or recording carries content that the rules would block in conventional media: banned journalism, a forbidden phrase, an argument the regulator objects to. Rather than fight the rule head on, the work slips through a medium or a loophole the rule does not cover, and openly quotes the objection it is evading. The release is not a file anyone can stream; it is a single copy passed from listener to listener, tracks playable only at specific spots, or drives left where fans gather. And it goes out on the day the nation celebrates the freedom in question, such as the anniversary of abolishing an earlier censorship.\n\n## Key mechanisms\n\n**1. The rule becomes the vehicle.** By working through what the rule allows, a permitted medium, a legal deadline, an uncensored channel, the message gets through while exposing the restriction as arbitrary. Quoting the regulator's own objection in the work turns the censor into an unwilling co-author. Every attempt to block it confirms the point.\n\n**2. Scarcity and discovery.** A release that cannot simply be downloaded and deleted becomes an event. A copy passed hand to hand, a track hidden at a map coordinate, a drive left at a concert: each forces people to seek the message out and to share it deliberately. Finding it is participation; passing it on is a small act of defiance. Scarcity also makes the work harder to suppress in one stroke, because there is no single file to take down.\n\n**3. The anniversary does the arguing.** Launching on the date that commemorates the freedom at stake borrows that day's meaning. Celebrating free expression while a song is being censored is a contradiction the audience can see for itself. The calendar frames the work before a single line is heard.\n\n## How it fits together\n\nThe three components build one argument. The date sets the moral stage: today we honour this freedom. The censored content, routed through the rule's own gaps, shows that the freedom is not being honoured. The scarce, hand-carried release turns the audience from spectators into carriers, so that the message moves as a chain of people choosing to pass it on, on the very day it means most.\n\nThe sequence: choose the anniversary; craft the message around what the rule technically permits; embed the censor's objection; release in limited, physical or location-bound forms timed for the day; let the search for the copies, and the attempts to stop them, become the story.\n\n## Why it works\n\nIt converts a weakness into a strength. A banned message normally suffers from being hidden; here, its hiddenness is the hook. People value what they have to look for, and they talk about what they are told they should not hear. The anniversary removes any need to explain why it matters, and the rule-bending mechanic ensures that every move by the censor only amplifies the absurdity. The audience leaves not just having heard the message, but having helped deliver it."}, {"id": "i084", "t": "# Carried by Hand\n\n## Situation\n\nHeritage under threat is usually protected by institutions. Archives are held by specialists, recordings are filed away, and the public's only role is to read about a loss after it happens. That distance makes heritage feel like someone else's responsibility.\n\nDigital copies, meanwhile, are everywhere and therefore valued by no one. A recording of a sacred space can be streamed by anyone and is listened to by almost nobody. Abundance has made culture cheap.\n\nHow can the public become the guardians of what is at risk, and how can a record of a threatened place be made precious enough to be protected?\n\n## Concept\n\nEvery threatened site is preserved twice: once in a cloud archive, as a full 3D and acoustic backup, and once as a single physical sound object that travels through the hands of the public. Each object holds a composition made from that site's own sounds. It can be played, but not copied, and must be passed on. Its listeners become a living chain of custodians, and the site's survival is carried by people as well as by servers.\n\n## Mechanics\n\n**A backup that anyone can make.** Ordinary people scan threatened monuments and record their acoustic character, contributing to a cloud archive from which a destroyed place could be rebuilt. The same principle extends to removed knowledge: works that have been taken from shelves are returned, quietly, into the very collections that took them out. Rebuilding is framed not as protest but as a peaceful counter-statement: you may tear it down; we have a copy.\n\n**Sound that places the listener inside.** The archive captures what images miss. Binaural recordings place the listener at the centre of a hall or courtyard. Wind recorded moving across a site carries its landscape. Surfaces and cracks are interpreted as music. A composer works with this material so that each composition feels like being inside the place, adding the sense that most heritage records leave out.\n\n**A release that must be sought and shared.** The composition for each site exists as a single physical copy. It is handed from listener to listener. Some copies begin their journey left at a concert; others are hidden at the coordinates of the site itself; others can only be played when physically present at a designated spot. Each holder listens, then passes it on, adding to a log of everyone who has carried it. The file is no longer abundant. It is an event.\n\n## How the elements interlock\n\nThe archive is the safety net: the site can be rebuilt from it. The sound composition is the emotional link: it lets people far away feel the place. The single traveling copy is the social mechanism: it makes the composition valuable and turns listening into stewardship.\n\nHolding the copy mirrors the responsibility the campaign wants everyone to feel. Like the monument, the object is irreplaceable; if it is lost, its chain breaks. Fans protect it, document its journey, and share its story, which in turn draws attention to the site and recruits new contributors to the archive.\n\n## Why it works\n\n- Guardianship becomes personal. The public does not just support preservation; they physically carry part of it.\n- Scarcity restores value. A single composition passed by hand is treasured in a way a stream never is.\n- Sound creates intimacy. Listening to the inside of a place forges a stronger bond than looking at it.\n- The tone is resilient rather than mournful. The message is that culture survives because people keep it, together.\n\nThe place may fall. Its sound is still moving from hand to hand, and its full copy is waiting to raise it again."}, {"id": "i149", "t": "# A Single on Reclaimed Metal\n\n## The problem\n\nCauses that address violence struggle with a persistent gap between awareness and action. Messaging about the harm is heavy and easy to avoid; fundraising feels transactional; and the physical reminders of the harm, the weapons, the damaged land, are seen only as things to remove. A cause message also tends to be recognised immediately as a campaign, which makes many people tune it out.\n\nThe task is to deliver the cause in a form people want to engage with, make its physical existence tell the story, and fund the solution through the act of engagement.\n\n## The approach\n\nRelease the cause as a genuine piece of music by a credible artist, physically manufactured from a branded material made out of the instruments of harm, and distributed through scarcity so that each copy becomes an event fans seek out and share.\n\nThe song is real: a single from a credible artist, written in the audience's own genre, perhaps telling a story connected to the cause, perhaps with a release mechanic that acts out its title. Its physical form, a record, a drive, a disc, is made from a named material produced from seized weapons or reclaimed dangerous ground. Copies are limited: one passed between listeners, tracks hidden at coordinates, drives left at concerts. Proceeds from the material and the release return to the affected communities.\n\n## Key mechanisms\n\n**1. A genuine piece of music.** Because the message arrives as a real single by a credible artist, it travels as culture that people choose to hear and share, before it is recognised as a campaign. The song earns attention on its own merits.\n\n**2. Harm turned into branded material.** Converting the instruments of harm into a named raw material and using it for the physical release means every copy carries the story. Proceeds returned to the communities harmed mean that every purchase funds the solution.\n\n**3. Scarcity and discovery.** Making the release rare and findable, single copies passed along, tracks bound to locations, drives hidden at shows, turns an abundant digital file into something fans must seek out. Each copy found or handed on is a story to share.\n\n## How the pieces fit\n\nThe music draws people in, the material gives the music weight, and the scarcity gives the release a social life. A listener might first hear the song as just a good track. Later they learn the copies are made from melted weapons and that each one funds the communities harmed. Then they discover the copies are rare, which sends them looking, and when they find one they share the find, extending the song's reach and the cause's funding.\n\nStep by step: produce the named material from the instruments of harm; record the single with the artist; manufacture a limited run from the material; release and hide copies; let fans hunt, buy and pass them on; return proceeds to affected communities; tell the story of each copy's journey.\n\n## Why it works\n\nIt reverses the usual order of cause communication. Instead of opening with the problem and asking for support, it opens with something people want, a good song, and lets them discover the cause through its form and its scarcity. The material makes the meaning concrete, the scarcity makes the copies precious, and the music makes the whole thing spread as culture rather than as an ad. People end up carrying the story because they wanted the song."}, {"id": "i076", "t": "# The Most Important Job Nobody Explained: A Deadpan Recruitment Film That Makes a Hard Role Feel Real and Fits Its Process to Its Candidates\n\n## The problem\n\nRecruiting for demanding roles, especially public or programme roles, is difficult on several fronts. The job's actual benefits are often technical or abstract, so recruitment ads fall back on vague promises and smiling photographs. Audiences, particularly those an organisation most wants to reach, distrust institutional claims and dismiss them as a pitch. And recruitment processes are designed around the institution's convenience, so even interested people discover that the process was not built for them.\n\nThe reconstructed idea brings together three elements: playing an absurd premise with complete sincerity, with the organisation as the willing butt of its own joke; dramatising the job's benefit through a story or metaphor rather than a demonstration; and designing the recruitment programme around the specific people it must reach.\n\n## The approach\n\n**Sincere absurdity.** The recruitment campaign takes a solemn genre, an epic, an official briefing, a prestigious documentary, and breaks it with slapstick, or parodies a familiar format with a straight face. The organisation laughs at its own reputation for being stiff, bureaucratic or confusing.\n\n**The benefit as a metaphor.** Within that comic frame, the real value of the job is made felt rather than listed. A room might literally expand as a candidate grows in the role; a counter might reach zero at the moment the work makes a difference to someone; a companion might follow the worker through their day as the support system does; or an honest admission of the job's hardest part might reveal why it is worthwhile.\n\n**A programme that fits its candidates.** The recruitment itself is redesigned. Candidates are filtered through the job's real skills rather than paper qualifications; young people are paid as consultants to shape the programme; messages are phased by audience; and regional quotas guarantee opportunity across the map.\n\n## Key mechanisms\n\n- **Self-mockery wins trust.** By making itself the joke, the organisation shows humility and lowers the audience's defences. A claim about the job that would be doubted as a pitch is accepted as entertainment.\n- **Metaphor communicates value.** The emotional story conveys what the job really gives and demands, so candidates understand why it matters.\n- **Fit converts interest.** People moved by the film find a process designed for them, with skills-based filtering and co-created elements, so interest turns into applications.\n\n## How the pieces interact\n\nThe comic frame and the metaphor can be fused: the solemn epic about the role is interrupted by slapstick, but at its heart sits a sincere metaphor for what the work achieves. The skills-based filtering can even appear in the film, with the job's own tasks presented as absurdly serious tests, which the audience can then try for real when they apply. The young consultants who co-designed the programme might also shape or appear in the film's humour, keeping it grounded in how the target audience actually speaks.\n\n## Why it works\n\nIt addresses the three core barriers of recruitment at once: credibility through humour, understanding through metaphor, and access through a fitted process. Candidates are entertained, see what the job really means, and find an application route that works for them. The organisation becomes approachable without losing seriousness about the work itself."}, {"id": "i122", "t": "# History Overhead: An Anniversary That Plays Out Where You Stand\n\n## The problem\n\nHistoric events are usually commemorated as summaries: a documentary, a plaque, an article on the anniversary. For people who were not alive at the time, these summaries feel distant and complete, as if history happened somewhere else to someone else. Outdoor and digital advertising, meanwhile, sits in fixed placements and says the same thing to everyone, regardless of where they are or what is happening around them.\n\nThe challenge is to make a historic event felt as something unfolding now, around the audience, in their own streets.\n\n## The approach\n\nOn the anniversary of an event, re-run it in real time in formats people already use, and connect the re-enactment to live conditions in the viewer's surroundings, with recorded and reactive sound making the event audible in the place where the viewer is standing.\n\nAs the hours of the original event pass, messages arrive in feeds, as texts or calendar entries, or through a participant's interactive account. Outdoor screens and digital placements respond to what is actually happening around the viewer: the plane passing overhead, the train arriving, the weather, the nearest location connected to the event. When conditions match a moment in the story, the placement triggers a recording or a reactive soundscape that lets people hear what that place sounded like at that moment in history.\n\n## Key mechanisms\n\n**1. Real-time re-running on the anniversary.** Recreating the event as it unfolded, in familiar formats, lets people live through it rather than read about it. Each update arrives with uncertainty about what happens next.\n\n**2. Media driven by live surroundings.** Linking placements to live conditions, the aircraft overhead, the train pulling in, the local weather, the nearest relevant site, turns a fixed ad into a timely message about exactly where the viewer is right now. History is anchored to the physical present.\n\n**3. Sound as the missing sense.** Recorded or reactive audio makes the event felt. Binaural sound of a famous moment, the wind as it was recorded, a track lasting as long as a sound took to cross a border: each adds what text and images lack, and puts the audience inside the subject.\n\n## How they connect\n\nThe anniversary sets the timeline. The live-conditions trigger places each beat of the timeline in the viewer's real environment. The sound delivers the emotional impact at that moment. A person hears a plane above them and, at the same time, their phone or a nearby screen plays what a plane sounded like over the same city at the same hour decades ago. The past is overlaid on the present through a sense that bypasses explanation.\n\nStep by step: map the historic timeline hour by hour; identify live conditions that echo moments in it; prepare recordings or reactive soundscapes for each; publish the timeline in feeds and messages; trigger outdoor and digital placements when conditions match; let people share the moments when history and the present aligned for them.\n\n## Why it works\n\nIt removes the distance that makes history feel abstract. The event is not shown as finished; it is happening, here, now. Live triggers make every encounter specific to the viewer, which makes it feel personal and worth sharing. Sound makes it visceral. On the one day when the event is already in public memory, the campaign turns remembrance into experience, and people who never lived through it come away feeling that, briefly, they did."}, {"id": "i133", "t": "# Saving What Matters: Young Savers as Heritage Keepers\n\n## The problem\n\nTwo causes often stall for the same reason: the payoff is abstract and distant. Teaching children and first-time savers to save is hard because the reward lies years away and money in an account is invisible. Preserving heritage is hard because people assume someone else is already handling it, or that once something is gone, nothing can be done.\n\nCampaigns for both tend to spread effort widely and hope something sticks, rather than targeting the specific gap that keeps behaviour from changing.\n\nThe task is to identify that gap precisely, make the reward immediate and tangible, and connect it to something with lasting meaning.\n\n## The approach\n\nDiagnose the exact barrier holding back young savers, then design a saving programme in which every deposit visibly contributes to backing up heritage, making both the money and the preservation tangible now.\n\nThe diagnosis might show that young people believe saving makes no visible difference, a paradox between what they say they value and what they do. The response is a savings tool that shows the balance in real form, a familiar object or a toy that displays progress, with rewards in a currency they already care about. As their savings grow, they unlock steps in a heritage backup: a monument scanned into a cloud archive, a removed book returned to a library shelf, a place made rebuildable. Learning modules about money and heritage unlock further rewards and opportunities.\n\n## Key mechanisms\n\n**1. Targeting the specific gap.** Rather than broadly promoting saving or heritage, the campaign aims at the precise reason behaviour does not change: people thinking the problem is solved, a paradox between stated values and actions, a gatekeeper withholding access. Focusing on that gap puts effort where it can move behaviour.\n\n**2. Making money and learning tangible.** A toy that shows the real balance, savings built into a household object, rewards in a currency young people want, scholarships unlocked by finishing modules: each makes an abstract, long-term payoff something young savers can see and feel immediately.\n\n**3. Heritage as backup.** Framing preservation as making a backup, with ordinary people scanning threatened monuments or restoring banned books to the shelves that dropped them, means what is lost can be rebuilt. Linking saving to this framing gives young savers a sense that what they put away protects something real, and that rebuilding is a hopeful act.\n\n## How they connect\n\nThe diagnosis tells the campaign where to aim; the tangible reward tells young people their effort counts right now; the heritage backup gives that effort a meaning beyond themselves. Saving becomes a way of keeping something, both their own future and a shared past. The visible balance and the visible archive grow together.\n\nStep by step: research and name the gap; build the tangible savings tool; link milestones to heritage backup steps; add learning modules with rewards; let savers see both their balance and the places or works they have helped preserve.\n\n## Why it works\n\nIt replaces distant promises with present proof on two fronts. Young people respond to what they can see changing, and they stay motivated when what they do feels significant. By combining a precise diagnosis with immediate, tangible rewards and a hopeful story of preservation, the programme makes saving feel less like denial and more like building something that lasts."}, {"id": "i003", "t": "# The Boutique Built From What Was Thrown Away\n\n## Starting point\n\nSustainability claims have a credibility problem: audiences hear them constantly and believe few. Charity has a dignity problem: the act of receiving donated goods often carries stigma, and the person in need is made to feel like a recipient rather than a customer. And brands that want to do good tend to fund causes at arm's length, so the good deed and the business remain separate.\n\nThis idea addresses all three at once by making the brand's own product the means of a social intervention, built on material reclaimed from waste, and delivered through a shop that reverses the usual ritual of charity.\n\n## The core idea\n\nA brand turns a waste stream connected to its category into a valued raw material, makes everyday products from it, and distributes those products through a boutique where people in need shop with dignity. The value created by the material flows back to the people who collect and handle the waste. The product, the store and the social benefit are one activity, not three.\n\n## The mechanics\n\n**A waste stream becomes a material and a livelihood.** The brand works with the people who currently deal with the waste (collectors, fishers, the community where it originates) and pays them for what they recover. That material is processed into something with clear value. Because the collectors share in the value, they have an economic reason to keep the cycle running. The sustainability claim proves itself: the product exists because the waste was gathered.\n\n**The product is the intervention.** Rather than donating money, the brand uses what it makes and what it is good at to solve a problem directly. If it makes clothing, it clothes people. If it makes appliances, the appliance goes where it removes a barrier, for instance into schools so that students who lack clean clothes can attend. If it promises durability, it teaches people to repair. The commercial offer and the good deed are the same thing, so nobody can accuse the brand of decoration.\n\n**The shop ritual is redesigned.** The products made from reclaimed material are offered in a boutique that looks and feels like any other store. People in need choose what they want, using gift cards rather than handouts. A sister store has empty racks: donors bring items in to fill them, reversing the flow of a normal shop. A simple invitation runs through both, take what you need, give if you can, so that giving and receiving feel like the same familiar act of shopping.\n\n## How it works together\n\nThe waste-to-material loop supplies goods with a story and an economic engine. The product-as-intervention principle makes those goods the brand's contribution, rather than a cheque. The reversed shop provides the human experience at the end of the chain, where dignity replaces stigma.\n\nEach step strengthens the others. The material story makes the boutique's products desirable, not just charitable. The boutique gives the waste collectors' work a visible destination. And the brand's own category expertise ensures the products are genuinely useful, which keeps the cycle credible.\n\n## Why it works\n\n- It makes a sustainability claim tangible: the evidence is the product in your hand and the people who were paid to recover its material.\n- It respects the people being helped by giving them the role of shopper, with choice and a familiar ritual, rather than the role of recipient.\n- It aligns business and benefit. Because the good deed is the product, the brand cannot be accused of performing virtue elsewhere while selling as usual here.\n- It sustains itself. Collectors earn, shoppers choose, donors give in a format they already understand, and the brand has a reason to keep producing.\n\nThe result is a closed loop in which waste, product and generosity share one storefront."}, {"id": "i005", "t": "# The Treasure Hunt That Pays Out: Teaching Young Savers Through a Trail of Clues Set by Famous Mentors\n\n## Why this is hard\n\nSaving and financial learning are among the least exciting things a young person can be asked to do. The rewards are distant and abstract: a balance that grows slowly, a benefit years away. Financial brands and education initiatives that try to change this usually rely on lessons and explainers, which young audiences tune out. When they bring in celebrities, the famous face often dominates, and the cause, the children and first-time savers it should serve, slips into the background.\n\nThe reconstructed idea addresses three barriers at once: the abstractness of the payoff, the passivity of traditional launches and lessons, and the tendency of fame to overshadow the people a cause is for.\n\n## The approach\n\n**Make the payoff visible now.** The core of the programme is a set of mechanics that make money and learning tangible and immediately rewarding. A toy that displays the real account balance; scholarships or rewards unlocked as each learning module is completed; savings built into a familiar household object; rewards paid in a currency young people already value. The long-term benefit acquires an immediate, visible form.\n\n**Release it as a trail.** Instead of announcing the programme, the brand launches it as a series of clues and puzzles. A phrase is seeded in places young audiences frequent. A symbol appears before any explanation. Hints are spread across platforms, each leading to the next. Core participants receive an early drop that lets them start ahead of everyone else. Solving the clues is itself a form of learning, and the trail ends in the reveal of the savings and reward mechanics.\n\n**Give famous people a defined, honest role.** Well-known people participate in roles that match their real involvement: someone who genuinely mentors, someone who has a real story about learning to manage money, ambassadors of a named fund, or a yearly list celebrating young people who have done something notable. Their fame draws attention while the young savers stay at the centre.\n\n## Key mechanisms\n\n1. **Immediate reward replaces abstraction.** A visible balance, an unlocked scholarship or a reward in a valued currency gives each small action a payoff today, building the habit.\n2. **Investigation builds participation.** A clue trail turns the audience into investigators. Anticipation grows before the reveal, and the effort of solving puzzles makes the programme feel earned.\n3. **Defined celebrity roles protect the cause.** When the famous people's roles are specific and genuine, their presence amplifies the programme without replacing its real subjects.\n\n## How they interact\n\nThe celebrities can be the setters of the clues, each seeding a hint tied to their real story or mentoring experience, so their fame draws the audience onto the trail while the puzzles themselves keep attention on learning. Each clue solved can be one of the modules that unlocks rewards, making the trail and the learning programme the same thing. The early drop for core participants can be presented by the mentors, and the annual list of young leaders can recognise those who progressed furthest, returning the spotlight to the young people.\n\n## Why it works\n\nIt converts something dull into a game of discovery with concrete rewards. It makes financial progress visible and therefore motivating. And it uses fame strategically, as a magnet rather than a replacement for the cause. Young people stay involved because each step gives them something they can see right away, and because they are the heroes of the story rather than its audience."}, {"id": "i057", "t": "# Through Their Hands: Famous Supporters Film a Cause on the Product, Under One Unbroken Rule\n\n## The issue\n\nCauses that enlist famous people often struggle with balance. The celebrity draws attention, but frequently becomes the story, and the people the cause serves fade into the background. Brand involvement in such causes can feel like sponsorship rather than contribution, especially when the brand's product plays no role. And cause films tend to share a familiar look, making them hard to remember.\n\nThe reconstructed idea combines three elements to address this: giving well-known people a defined role that matches their genuine involvement in the cause, making the brand's product the means by which the work is made, and committing fully to one production constraint or technique.\n\n## The approach\n\n**Defined, genuine roles.** Well-known people take part in a capacity that reflects their real relationship to the cause: a volunteer who actually volunteers, an ambassador of a named fund, an athlete telling their own story of being mentored or mentoring, or a recurring list honouring leaders from the community the cause serves. Their fame is borrowed, but their role is specific.\n\n**The product as the camera, the tool, the medium.** The celebrities create the work using the brand's product. If the product is a device that captures images, the film is shot only on it; if it is software, the work is a file in its format; if it has a distinctive feature, the piece is something only that feature makes possible. The work's existence proves what the product can do.\n\n**One rule, applied completely.** The production obeys a single constraint. It might be one uncut camera move, a first-person rig that shows the world through the celebrity's eyes, or a budget limit turned into a strict framing rule. The constraint gives the series a distinct texture and makes the craft memorable.\n\n## Key mechanisms\n\n1. **Specific roles keep the cause central.** When the famous person's role is defined by their real involvement, their presence points toward the people the cause serves rather than away from them.\n2. **The product is a participant.** Having the celebrities make the work on the brand's product shows that the brand contributes a capability, not just a logo.\n3. **The constraint shapes perspective.** A first-person rig or a single unbroken shot puts viewers in the celebrity's position as they do the work of the cause, which shifts attention to the people they meet.\n\n## How the parts interact\n\nThe celebrities provide reach and access. The product records what they see. The constraint dictates how they see it: for example, a first-person view filmed in one continuous take on the brand's device, as a volunteer works through a shift or a mentor spends time with a young person. Because the camera is literally in the famous person's hands and looks outward, the frame is filled with the people the cause serves, not with the celebrity. Each piece is distinctive, demonstrates the product and centres the community.\n\n## Why it works\n\nIt reconciles fame and focus. The well-known names bring audiences in, but the constraint and the product's point of view keep the attention on the cause. The brand's contribution is verifiable in the work itself, and the single technique gives the campaign a texture people recognise and remember. Audiences come for the famous names and leave having seen, through their eyes, the people the cause exists for."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
