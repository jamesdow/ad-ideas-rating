(function () {
  "use strict";
  var DATA = {"pack": "P01", "items": [{"id": "i031", "t": "# The Sound of What You Spent\n\n## Problem\n\nThe climate cost of personal spending is invisible. People pay for things dozens of times a week without any sense of the emissions behind them. Even when financial tools display a carbon figure, a number on a screen is easy to ignore.\n\nPayment brands have a related problem: they all look and feel alike. A card is a card, a tap is a tap. Very few own a sense that rivals do not.\n\nAnd the most engaging thing any service can give its customers is a story about themselves. People love being told what kind of listener, reader or traveller they are, and they share it freely.\n\n## Approach\n\nA payment brand makes the climate cost of each purchase audible. The signature sound played when a payment succeeds becomes a living signal: its tone shifts depending on the emissions of what was bought. At the end of the year, each customer receives a personal, shareable portrait of their spending's climate story, presented as a piece of music composed from all their payment sounds.\n\nThe brand owns sound; the customer owns their story; the climate becomes part of everyday ritual.\n\n## Key mechanisms\n\n### 1. Sound as the brand\n\nThe moment of payment is a ritual repeated constantly. The brand designs a signature melody for it, distinctive, recognisable and owned. This sound becomes the brand's primary carrier, present at the till, in the app, and in every piece of communication. It travels through a sense that competitors rarely use.\n\n### 2. Climate cost at the moment of purchase\n\nThat signature melody is not fixed. Each purchase is assigned a carbon figure, and the melody responds: a bright, complete phrase for lower-impact purchases, a heavier or unresolved one for higher-impact spending. Customers who choose can set an emissions cap; when it is reached, the melody shifts to a closing phrase signalling the cap has been hit. When a bill is paid, the app offers an offset, and accepting it plays a restorative chord. An abstract global problem is made personal, routine and actionable, at exactly the moment the decision is made.\n\n### 3. A year told back to you\n\nAt year end, every customer receives a composition built from their own payment sounds: a piece of music that is literally the shape of their year's spending. It comes with a named type based on their pattern of purchases and their climate choices, a portrait built from their behaviour, and formats ready for sharing on other platforms. People talk about themselves; the brand gets advertised.\n\n## How they combine\n\nThe signature sound gives the climate signal a form people actually notice. A number is skipped; a sound in your ear at the till is not. The climate signal gives the sound depth, turning a branding device into something with consequence. And the year-in-review gives both a reason to be shared: it collects a year of small moments into a personal story customers want to show others.\n\nEach element would be weaker alone. A melody without meaning is just a jingle. A carbon figure without a sense is ignored. A year-in-review without a distinctive ingredient looks like everyone else's. Together, they form a recognisable, useful and social idea.\n\n## Why it works\n\n- **It uses a sense rivals do not own.** Sound distinguishes the brand in a category where everything looks the same.\n- **It acts at the point of decision.** Climate information delivered at the till changes behaviour more than reports after the fact.\n- **It builds habit through ritual.** The sound repeats every time customers pay, so awareness becomes routine rather than effort.\n- **It turns customers into broadcasters.** A personal composition is an irresistible share, and every share carries the brand's sound and the climate message.\n\nPaying becomes a small moment of awareness, and the year becomes a song people want others to hear."}, {"id": "i055", "t": "# Draw It and You Have Given\n\n## Setting the scene\n\nBrands that dominate their category want to prove it, but claiming leadership in an advert sounds like boasting. At the same time, they want to show generosity, yet donation campaigns struggle because giving involves friction and doubt. And sponsored content made with creators often feels like an ad dropped into their feed, which audiences tune out.\n\nThe brand wants to demonstrate that it is the category in people's minds, turn that recognition into effortless giving, and spread the effort through creators in a way that feels native to their audiences.\n\n## The approach\n\nThe idea is a creator-led challenge in which people are asked to draw the generic product of the category; when they instinctively draw the brand, that unprompted recognition triggers a tangible donation.\n\nThe challenge is simple: draw the product, without being told which brand. Most people, without thinking, draw something that matches the brand's shape or pack. That is the proof of category ownership, generated by the audience rather than claimed by the brand.\n\nEach drawing becomes a donation. The act of submitting a drawing, or the moment it is recognised as the brand, unlocks a concrete contribution: one drawing for one item provided, a gift that is also a donation, or support that can only be used for necessities. Giving happens at the moment of participation, with no extra step.\n\nCreators carry the challenge. Instead of reading a script, they are invited to bring their own world and voice: they pitch how they want to run the challenge, are matched with the parts of the brand their communities already buy, and are chosen for shared passions rather than reach. Each creator frames the challenge in a way that fits their audience.\n\n## Key mechanisms\n\n**Proving ownership through behaviour.** When people draw the brand without being prompted, their own recall becomes the advertisement. The proof is credible because it comes from the audience.\n\n**Effortless, tangible donation.** Linking the drawing to an immediate, concrete donation removes friction and doubt. People know exactly what their participation achieves, and they do not have to go anywhere else to give.\n\n**Creators in their own voice.** Allowing creators to shape the challenge makes it native to their communities. Audiences see a creator they trust doing something that fits their style, not a brand placement.\n\n## How the parts interact\n\nThe drawing challenge gives the campaign a playful, participatory format. The donation gives that format meaning. The creators give it reach and authenticity across different communities.\n\nEach part reinforces the others. Creators make the challenge spread; the challenge produces proof of category ownership; the proof is tied to donations, giving people a reason to take part beyond fun. And as more drawings come in, the collected images become a vivid, shareable demonstration that the brand is the category.\n\nWithout the donation, the challenge would be a clever brand test with limited motivation. Without the drawing, the donation would be just another charity link. Without creators in their own voice, the challenge would be another branded ad unit.\n\n## Why it works\n\nIt works because it turns participation into both proof and generosity. People enjoy the challenge, discover their own unprompted recognition of the brand, and see a concrete result of their involvement.\n\nThe brand never needs to claim that it owns the category; its audience shows it. It never needs to beg for donations; giving happens through play. And it never needs to impose a script on creators; their own voices carry the idea further and more authentically than any ad could."}, {"id": "i088", "t": "# Built With It, Given Away, Made With Fans\n\n## The problem\n\nThe brand wants to prove what its product can do, but claims are easy to ignore. It wants its work to spread far beyond what its own budget could pay for. And it wants to be part of the communities and fandoms its audience cares about, without looking like a sponsor that has bought its way in. Typically, each of these goals would call for a different campaign, and none of them would feel connected to the others.\n\n## Approach\n\nThe brand makes something using its own product, releases that creation openly and for free, and builds it with and for the fan communities that will use it.\n\nThe creation is made by the product: content shot only through the product's cameras, an asset that is a file in the product's format, a feat made possible only by its features, or an object built from its parts. Its existence proves the product's capability.\n\nIt is then released freely: as open-source code, 3D-printable files, copyright-free assets, public-domain works, or an open fund that others can join. Anyone can use it, adapt it and pass it on.\n\nThe audience it is designed for is an existing community of fans. The brand works with the creators those fans already follow, honours fan artists, opens exclusive events to the community, and celebrates each fandom's own interests. The free release is something the fans genuinely want, made in their language and on their terms.\n\n## Key mechanisms\n\n**The product as the means of making.** The work's existence proves the product's capability before any copy. Every use of the freely released creation is another demonstration.\n\n**Open, free release.** Giving the creation away lets it spread far beyond what the brand could fund or run itself. Each copy, remix or derivative extends the reach. It also casts the brand as a giver rather than an owner, which builds goodwill.\n\n**Joining fandoms on their terms.** Producing with the creators fans follow, honouring fan artists and celebrating fandoms' interests makes the brand feel like part of the culture. The released creation is relevant to the people most likely to use and share it.\n\n## How they combine\n\nThe product makes the creation, the fandom gives it relevance, and the open release gives it reach. Fans are natural makers and remixers, so a free, product-made resource built for them invites them to create with it. As they do, they extend the demonstration of the product's capability, because what they make is built on something the product created. The brand's proof multiplies through the community's own creativity.\n\nThe pieces also protect each other. A product demonstration on its own can feel like an advert; giving it to fans freely turns it into a gift. A free release on its own can disappear without an audience; building it with and for an existing fandom ensures there are people ready to use it. And joining a fandom can look opportunistic; offering the community something genuinely useful, made by the product and given away without conditions, earns the brand its place.\n\n## Why it works\n\nCommunities embrace those who contribute, ideas spread when they are free to use, and proof is strongest when people can test it themselves. This idea brings these together: the brand contributes a genuinely useful creation, makes it free so it can travel, and builds it with the communities most likely to carry it. Every fan who picks it up is both enjoying a gift and experiencing what the product can do, so the brand's reach and credibility grow with every use."}, {"id": "i102", "t": "# Your Order, Wherever You Already Are, Backed by the People Who Built Us\n\n## The problem\n\nA brand with a long history and a loyal following faces a deceptively simple problem: people like it, but they give up before buying. Somewhere between wanting and having, there is a moment of friction. The queue is too long, the app is one more thing to download, the store is not on the way home. At that moment the old affection for the brand counts for nothing.\n\nAt the same time, launching a new way to buy can feel cold and transactional. A pure convenience play says nothing about who the brand is, and novelty on its own does not earn trust.\n\nThe challenge is to make a new purchase channel feel familiar, warm and worth adopting from day one.\n\n## The approach\n\nLaunch the new convenience on the brand's own history, and let the people who carry that history front it.\n\nThe brand marks an anniversary, or returns to a founder's original belief about serving people, and uses it to introduce a new way of ordering that meets customers where they already are: from a social post, a car dashboard, a smart TV, or a private app that lets them customise without holding up the queue. The message is that the brand has always tried to make things easier, and this is simply the latest chapter.\n\nThe launch is fronted not by the brand speaking about itself but by its supporters: the adults who grew up with the product, the community figures who have championed it, a joinable group that gives regulars a name and an identity to act from.\n\n## Key mechanisms\n\n**1. Anchoring in the past.** An anniversary, the founder's belief or an unaltered archive gives the launch a reason to exist beyond novelty. Audiences bring their own memories, so the new ordering method arrives already feeling earned. It is not a gadget; it is a continuation.\n\n**2. Supporters as the heroes.** Rather than celebrities or the brand's own voice, the faces are the people who have lived with the product: families, long-time customers, community leaders who already gather people around it. A named group they can join gives them an identity and a reason to spread the word, and keeps real people at the centre of the story.\n\n**3. Purchase brought to the customer.** The core offer is the removal of the moment where people give up. Ordering can happen in the places people already spend time, from a feed, a dashboard, a living-room screen, or a private app that sidesteps the queue. Convenience is not a feature of the campaign; it is the campaign's offer.\n\n## How the components interact\n\nThe heritage provides the meaning, the supporters provide the voice and the convenience provides the action. History alone would be nostalgic and passive. Supporters alone would be heartfelt but would have nothing new to say. Convenience alone would be useful but forgettable. Together they say: the people who have always loved this can now have it more easily than ever, and that ease is part of what the brand has always stood for.\n\nStep by step: open on the anniversary or founding belief; introduce the community of supporters who embody it; invite them, and everyone like them, to join a named group; give that group first access to ordering from wherever they already are; let their use and their stories become the proof for everyone else.\n\n## Why it works\n\nPeople resist new behaviours, but they accept continuations of ones they already love. By wrapping a new purchase channel in shared memory and handing the story to genuine fans, the brand lowers the emotional barrier at the same moment it removes the practical one. The audience does not feel sold a new technology; they feel recognised as part of the brand's history and rewarded with an easier way to enjoy it."}, {"id": "i144", "t": "# The Chore Nobody Noticed: A Puzzle-Led Launch That Makes a Household Fix Felt\n\n## Where it starts\n\nBrands increasingly want to say something about social issues, but audiences have learned to distrust stances that seem borrowed. A product that has nothing to do with an issue, attaching itself to it in an advert, looks opportunistic.\n\nThere is also a communication problem with any new feature: technical claims are hard to feel. Saying a product does something better is easy to ignore; demonstrating it is often dull. And launches themselves have become predictable — an announcement, a film, a press release — so they rarely generate the anticipation needed to cut through.\n\n## What the team designs\n\nThe idea begins by finding the point where the brand's everyday function genuinely touches a social issue. Examples are the way household work like laundry is unevenly shared, a rule in a financial product that excludes married women, or the poor state of public roads that damages the very goods being delivered. The brand then changes something real at that point — the product, the rule, the infrastructure — so its stance grows out of what it does.\n\nThat change is launched as a trail of clues rather than an announcement. A phrase is seeded in conversations around the issue. A symbol appears in public before any explanation, prompting people to ask what it means. A chain of hints runs across platforms, each one revealing a little more about the change and the issue behind it. The most engaged followers get an early reveal.\n\nWhen the answer arrives, it is told through a story or metaphor rather than a demonstration. Instead of showing the improved product in operation, the film shows what the change means in someone's life, perhaps through a literal image: a space that grows as the burden is shared, a counter that runs down to a moment that matters, a companion that follows a person through their day in the way the product now does, or an honest admission of a downside that proves the strength of the change.\n\n## The mechanics in detail\n\n**A real point of contact with the issue.** The brand does not pick a cause from a list. It looks at where its own product or service already intersects with a social problem and changes something concrete there. This makes the stance unborrowable: rivals cannot adopt it without changing their own product.\n\n**The clue trail as launch.** By releasing the change through seeded phrases, unexplained symbols and cross-platform hints, the brand turns the audience into investigators. People speculate, discuss and share theories, and the issue itself is debated before the brand has said a word. Anticipation builds around the problem as much as the product.\n\n**Metaphor over demonstration.** A technical change — a fairer rule, a redesigned feature — is often too dry to show. A story or metaphor lets viewers feel its effect. A literal visual image of the benefit makes the claim emotional and memorable. An honest downside, openly admitted, can prove the seriousness of the fix.\n\n**Sequencing.** The trail creates curiosity about the issue; the reveal tells people what the brand has actually changed; the metaphorical film lets them feel why it matters.\n\n## Why it holds together\n\nThe approach answers the three objections audiences typically have. \"This brand has nothing to do with this issue\" is answered by the genuine point of contact and the concrete change. \"This is just another launch\" is answered by the puzzle that makes people participate before they know what is coming. \"This is just a technical tweak\" is answered by the story that turns the tweak into an experience.\n\nBecause the change is real, the clues have substance: people who follow the trail discover a genuine improvement rather than a slogan. Because the reveal is metaphorical, the improvement becomes something people feel and repeat. And because the stance is rooted in the product's function, the brand earns the right to keep talking about the issue long after the launch, since its own product continues to embody the change."}, {"id": "i134", "t": "# One Song, Heard One Listener at a Time\n\n## Why a number stopped working\n\nWhen a loss is large enough, it becomes a figure, and figures stop moving people. The public hears that many were lost, nods, and moves on. Repetition has dulled the number. Any campaign that wants people to feel the weight again has to break that number back into individuals, and it has to do it in a way people will seek out rather than scroll past.\n\nMusic seems like an obvious vehicle for remembrance, but a song released online is everywhere at once and therefore nowhere in particular. Abundance makes it disposable. The challenge is to make a tribute that restores both the individuality of those lost and the weight of the occasion.\n\n## The concept\n\nCreate a piece of sound in which each person lost is a distinct, countable element, and release it so that it cannot simply be streamed. Each individual is represented by their own recording, sound or moment within the work, and the work exists only in scarce forms: a single copy passed between listeners, or tracks that play only at specific physical places. To hear the whole, people have to go and find it. To find one part is to meet one person.\n\nThe audience does not hear about a total. They hear absence, one voice or silence at a time, and they work to hear it.\n\n## Key mechanisms\n\n**Individuals instead of a total.** The work is built so that each person counted in the statistic has a presence of their own: a name, a sound, a stretch of silence, a single recorded element. The listener can count them and meet them. A total that had become abstract becomes a sequence of felt absences. Silence can be timed so that its length itself corresponds to how many are gone, making the number something sat through rather than read.\n\n**Sound that makes the subject felt.** The pieces are recorded or reactive audio designed to put the listener inside a place or moment: the ambient sound of where someone lived, a space that responds to the listener's presence, audio that carries what a photograph alone cannot. Sound supplies the missing sense. It surrounds rather than informs, and it lets the listener stand where the people being remembered once stood.\n\n**A release that must be sought.** Instead of a single public upload, the work is distributed with scarcity. Fragments may be playable only at a particular physical spot tied to the person they represent. A sole copy might be handed from one listener to the next. Coordinates might guide people to hidden tracks. Each act of finding a part becomes a small pilgrimage, and listeners share where and how they found it.\n\n## How it fits together\n\nThe countable individuals give the work its meaning; the immersive sound gives it its emotional force; the scarce release gives it its weight and its spread. Take any one away and the idea weakens. Individualised sound posted openly would be skimmed. A scarce release of a generic tribute would be a gimmick. Immersive audio without individual presence would be atmosphere, not remembrance.\n\nTogether they create a loop: the listener seeks a fragment, finds one person, feels the absence through sound, and tells others, who then go looking for other fragments. The total is assembled collectively, through many people each meeting a few of those lost. Completing the work becomes a public act of memory.\n\n## Why it works\n\nRestoring individuality is the most direct cure for statistical numbness, and sound is a medium that reaches people below the level of argument. Scarcity turns attention into effort, and effort into investment; people care more about what they had to find. The physical places add a sense of pilgrimage that makes remembrance an act rather than a view. And because every listener holds only part of the whole, sharing is not optional promotion but the way the tribute is completed. The campaign spreads because people need one another to hear everything."}, {"id": "i116", "t": "# Said Out Loud, With a Straight Face: Breaking a Category Taboo With Deadpan Humour to Reveal a Need Nobody Served\n\n## The problem\n\nSome categories are built on silence. Their products deal with bodily functions, illness or experiences that people are taught to hide, and their advertising has historically followed the same rule: euphemism, coded colours, gentle metaphors that avoid naming anything directly. This hidden language does two kinds of harm. It reinforces the shame people feel, and it obscures the real situations in which people use these products, so needs that sit just outside the polite picture are never addressed.\n\nBrands that try to break the silence earnestly often meet scepticism: a frank manifesto can feel like a calculated provocation. What is needed is a way to break the taboo that disarms resistance, and a product-level reason for doing so.\n\n## The approach\n\nThe reconstructed idea combines three elements into a single campaign and product launch.\n\n**First, ask who has been overlooked.** The team investigates the moment of use for people the category ignores, and for bigger worries that occur in that same moment. Someone using the product on another person's behalf, someone whose medical treatment changes how the product affects them, someone for whom the product was never tested, or a fear that arises at the exact same time as the product's use. From this, the brand identifies a real unmet need it can answer with a product, not with an inclusion message.\n\n**Second, break the euphemism head-on.** The communication refuses the category's coded language. It shows what the category normally disguises, using the real colour instead of the conventional substitute, telling people to do what tradition forbids, or showing a bodily reality as matter-of-factly as a sports injury. The aim is to turn shame into a public act of defiance.\n\n**Third, deliver it as sincere absurdity.** The taboo-breaking is presented through deadpan comedy, with the brand as the willing butt of the joke. A solemn genre may be interrupted by slapstick, a familiar format parodied with a straight face, or the category's own coded conventions ridiculed by playing them to an extreme.\n\n## Key mechanisms\n\n- **A real product reason.** The overlooked need gives the campaign substance. The brand is not simply provoking; it is launching something that answers a situation the category ignored.\n- **Directness removes shame.** Showing what is normally hidden, without apology, normalises it. Each frame where the taboo is ignored tells the audience there is nothing to hide.\n- **Comedy removes defensiveness.** A frank claim might be doubted or resisted as a pitch. Played as deadpan humour at the category's and the brand's own expense, it is enjoyed and shared.\n\n## How the parts interact\n\nThe overlooked need explains *why* the taboo has to break: the hidden language is precisely what kept that need invisible. The taboo-breaking makes the need visible and the product credible. The humour makes the whole thing watchable, and makes it possible to speak plainly about subjects that would otherwise be uncomfortable. A natural shape for the work is a deadpan parody of the category's traditional advertising, interrupted by someone from the overlooked group dealing with the reality matter-of-factly, then the new product answering the need that the polite version never mentioned.\n\n## Why it works\n\nIt gives the brand a meaningful innovation rather than a message, a truth-telling stance that feels brave, and a tone that makes that bravery likeable. The audience laughs at the old conventions, recognises the real situation, and sees the product as the brand's answer. Shame is replaced by openness, and the overlooked group is served in a way that is visible to everyone."}, {"id": "i108", "t": "# Same Words, Different Directors: A Film Series That Reclaims Hate and Delivers Every Viewer to a Decision-Maker\n\n## Background\n\nWhen a brand or its ambassadors become targets of hate or public backlash, the usual response is a single statement or advert. It may be well received, but it is short-lived and rarely moves the people who could change the underlying situation: the legislators and officials who decide. Public sympathy peaks and disappears. And a single piece of communication cannot show how widely the brand's stance applies.\n\nThe reconstructed idea joins three components: answering the attack by turning it into the brand's own material, holding a series of films together with one fixed device while varying genre and style, and converting the resulting sympathy into targeted, measurable pressure on decision-makers.\n\n## The approach\n\n**Reclaim the attack.** The insult, hateful symbol or taunt aimed at the brand or at the people it supports is adopted as the brand's own material. The insult is embraced collectively, the symbol redrawn, the taunt answered with its opposite, and the most criticised ambassador backed visibly. The controversy carries the message, and the brand stands as a principled ally.\n\n**One device, many films.** That reclaimed material becomes the fixed device of a branded film series. The same script, perhaps the text of the attack itself or the brand's reply to it, is handed to different directors; or each film addresses one value; or a recurring character carries through every piece. Genre and style vary widely: drama, comedy, documentary, animation. The variety proves the stance extends across contexts.\n\n**Route support to those who decide.** Each film ends with a direct channel to decision-makers: a ready-to-sign bill, a tear-out page to mail to one's representative, messages and calls routed to named legislators. Media is placed where those decision-makers live and work so they encounter the series directly.\n\n## Key mechanisms\n\n- **The attack becomes the script.** Using the hostile material as the fixed device lets the controversy drive the creative, so every new film extends the brand's reclamation of it.\n- **Variety demonstrates breadth.** When the same words are interpreted across very different genres and styles, audiences see that the stance holds everywhere. The series stays fresh because each director brings a distinct world.\n- **Pressure makes support count.** Routing each viewer to a named person or a specific bill transforms sympathy into measurable action that decision-makers cannot overlook.\n\n## How the parts interact\n\nThe reclaimed attack provides the fixed element, the series provides repetition with variety that sustains attention over time, and each film's ending provides a concrete action. As every new film is released, a fresh wave of viewers arrives at the same ready-to-sign bill or the same named legislators, so pressure accumulates with the series rather than spiking once. Media placed in decision-makers' own surroundings ensures the people being asked to act see the films too.\n\n## Why it works\n\nIt turns an attack into a long-running creative asset, uses the variety of a series to keep attention and prove the stance's range, and ends every piece with a mechanism that converts feeling into measurable pressure. The brand stops being the target of a controversy and becomes the organiser of a sustained campaign, with the hostile words themselves serving as the thread that ties each film to the next and every viewer to the people who decide."}, {"id": "i030", "t": "# Laughing Back in One Take\n\n## The problem\n\nA brand comes under public attack: hateful comments, a taunt, a campaign against one of its ambassadors. The usual responses fail. A defensive statement looks corporate and sounds scripted. Silence looks like weakness. Lecturing the critics hardens them. Any reply that reads as a pitch is doubted by default.\n\nThe challenge is to answer the attack in a way that wins over the undecided, shows the brand's principles without preaching, and is memorable enough to outlast the controversy.\n\n## The approach\n\nAnswer the backlash with a film that takes the attack and makes it the brand's own material, plays the response with deadpan sincerity and the brand as the willing butt of the joke, and is shot under one strict production constraint that makes the craft unforgettable.\n\nThe film adopts the insult, the taunt or the hateful symbol, and turns it around: the brand redraws the symbol, replies with its opposite or stands visibly behind the most criticised ambassador. The tone is an absurd premise played completely straight, perhaps a solemn format broken by slapstick, or a deadpan parody of a familiar genre, in which the brand laughs at itself first. And it is shot with a single committed technique, such as one uncut camera move or a first-person rig, that viewers notice and remember.\n\n## Key mechanisms\n\n**1. Turning the attack into material.** Rather than deflecting the backlash, the brand absorbs it. Adopting the insult collectively, reworking the symbol, answering the taunt with its opposite, publicly backing the person under fire: each casts the brand as a principled ally and lets the controversy itself carry the message to a much wider audience than a normal ad would reach.\n\n**2. Self-deprecation and sincere absurdity.** By making itself the willing butt of the joke, and by committing completely to a ridiculous premise, the brand disarms scepticism. Viewers who would doubt a statement accept the same point as entertainment, and share it. Humour lowers defences that seriousness would raise.\n\n**3. One production constraint.** A single uncut take, a first-person view or another committed rule gives the film a distinctive texture. The craft becomes part of the story: people talk about how it was made as much as what it says. In a crowded news cycle, distinctiveness is what makes the response remembered.\n\n## How they work together\n\nThe backlash supplies the content and the attention. The humour converts that attention from conflict into goodwill. The production constraint ensures the response stands out as a piece of work rather than a press release. A single uncut take, for instance, suits the idea perfectly: it can follow the brand walking straight through the insult, transforming it in real time, with no cuts to suggest manipulation or retreat.\n\nStep by step: identify the specific attack; decide how to adopt or invert it; choose an absurd premise and play it straight; choose one technique and commit; release quickly while the controversy is live; let the audience's sharing carry it.\n\n## Why it works\n\nIt changes who controls the story. Attacks gain power from the target's discomfort; when the brand embraces the attack with good humour and clear principle, the attack loses its sting and becomes the brand's platform. Self-deprecating sincerity makes the stance feel human rather than calculated, and the bold craft gives the response a life of its own. The audience ends up remembering the brand's answer far longer than the original insult."}, {"id": "i106", "t": "# Honey From the Minefield, Songs From the Hive\n\n## The problem\n\nLand left mined after conflict, and weapons left in circulation, continue to harm communities long after the headlines end. Campaigns to fund clearance and recovery struggle for attention because they look like campaigns. And the products and fundraising that support such efforts usually carry no story of their own; buying them feels like a donation, not something desirable.\n\nThere is a cultural route around this. Music reaches people who would never respond to an appeal. But music has lost much of its sense of occasion: everything is available instantly, so few releases feel worth seeking.\n\n## The approach\n\nTurn the instrument of harm into a branded material, and release music that carries its story as a rare, discoverable object. In concrete terms: former minefields are sown with flowers and kept as hives, producing a named honey; seized weapons are melted into a named metal. Both are sold into everyday products, with proceeds returned to the communities that lived with the danger.\n\nA credible artist then records a real single about that transformation. The song is released inside the products themselves and at the places they come from, in scarce physical form that must be found.\n\n## Key mechanisms\n\n**The harm becomes the ingredient.** The honey from cleared land and the metal from destroyed weapons are given their own names and identities and sold into ordinary products: jars on supermarket shelves, utensils, jewellery. Each product carries its origin story, and its sale funds clearance and recovery in the affected communities. Every purchase tells the story and pays for the solution.\n\n**The message becomes music people choose.** The song is a genuine single from an artist the audience already follows, written in the audience's own genre as a story-song about land returned to life. It may sit within the artist's commercial album. Its release mechanic acts out its title: if the song is about something buried returning to the surface, copies are literally unearthed. People hear it as music first and only then realise it is a campaign.\n\n**The release becomes a hunt.** The single is not uploaded everywhere at once. Copies are hidden at map coordinates on the reclaimed land. Some can only be played at one physical spot, such as the edge of a former minefield now in flower. Drives cast in the weapon metal are left at concerts. A single copy is passed between fans. Each find is shared, and the search draws attention to the place and the product.\n\n## How the parts work together\n\nThe material gives the music truth: the song is about something that physically exists and can be bought. The music gives the material reach: culture travels further than product launches. The scarcity gives both momentum: fans seek out the song, which leads them to the places and the products, which fund the communities, which in turn produce more of the material.\n\nWithout the material, the song would be another message. Without the song, the product would be another fundraiser. Without the scarcity, the song would vanish into streaming.\n\n## Why it works\n\n- **Transformation is persuasive.** Seeing danger turned into something sweet or useful is an argument that needs no words.\n- **Culture earns attention.** A real song by a credible artist travels as entertainment, reaching people a campaign cannot.\n- **Rarity creates engagement.** Seeking a hidden track generates more involvement than any broadcast.\n- **The loop funds itself.** Every product sold returns value to the communities harmed.\n\nThe land that once killed now feeds, and its story is sung by people who went looking for it."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> press <b>Send my scores</b>. There is also a short code and a CSV file as a back-up.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Press the button to send your scores. Nothing else is needed.</p>' +
      '<div class="row"><button id="snd">Send my scores</button><span id="m3" class="note"></span></div>' +
      '<p class="note">Back-up, only if the button fails: download the CSV or copy the code and send it to the person who sent you this file.</p>' +
      '<div class="row"><button id="dl" class="ghost">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSdmbZSBNd5jX7mgj_9_gqyzCgbGvbd-bsZmhktpkxr2GAxOLg/formResponse";
    function send() {
      $("#m3").textContent = "Sending...";
      var b = new URLSearchParams(); b.set("entry.34266590", code);
      fetch(FORM, { method: "POST", mode: "no-cors", body: b }).then(function () { $("#m3").textContent = "Sent. Thank you. You can close this page."; }, function () { $("#m3").textContent = "Could not send. Please use the back-up below."; });
    }
    $("#snd").addEventListener("click", send);
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
