<script>
(function () {
  "use strict";
  var DATA = {"pack": "P03", "items": [{"id": "i061", "t": "# Empty Chairs, Inner Rooms\n\n## Problem\n\nSome causes are attached to numbers so large that they have stopped meaning anything. The public hears the figure, nods, and moves on. Behind the number lies an experience that cannot easily be filmed — the grief of a family, the inner state of a person affected — and documentary footage struggles to capture what happens inside someone. And even when a campaign moves people, paid media alone cannot sustain a movement; supporters need a way to carry it themselves.\n\n## Approach\n\nThe idea is a cause campaign that breaks a numbing statistic into individuals people can count and meet, uses the form of film to make the inner experience behind each individual visible, and gives supporters a simple symbol, drawn from the same individual objects, that they can wear, print or post. The individual objects become both the installation, the film's motif and the movement's sign.\n\n## Key mechanisms\n\n**One object for each person.** The campaign represents each person lost or affected with a single, countable object — a chair, a statue, a balloon or a name — gathered in a public space. Or it times a silence to the number, or compresses a stretch of incidents into one street. The overwhelming figure becomes something people can walk among. A number the public had stopped feeling becomes a felt absence.\n\n**A film that shows the inside.** Accompanying the installation, a film uses form to depict what cannot be filmed directly. It might animate the inner world of one person behind one of the objects, tell a story backwards from the moment of loss, use a child's palette for something painful, enact a symptom in the film stock itself, or repeat a motif that never resolves. The film takes one of the countable objects and opens it up, so viewers feel what that single absence contains.\n\n**A symbol supporters carry.** The same object becomes a simple sign that supporters can adopt: a printed tag, a coloured shirt, a profile-picture symbol, or a photograph of themselves performing a symbolic act, such as sitting beside an empty chair. Supporters spread the movement through their own networks, and the symbol appears in news coverage without needing paid media.\n\n## How the parts connect\n\nThe countable objects provide the scale; the film provides the depth; the symbol provides the spread. Each depends on the same visual unit, which makes the campaign coherent. The installation lets people see how many; the film lets them feel one; the symbol lets them stand with all of them.\n\nBecause the symbol is taken directly from the installation and the film, everyone who encounters it is reminded of both. A profile picture showing the object implies the full installation of objects and the inner story the film revealed. A news report on the installation can show supporters wearing the same symbol, linking the public moment with the personal one.\n\n## Why it works\n\nPeople cannot feel a statistic, but they can feel an empty seat, and they can feel one story told from the inside. By converting the number into individuals and then showing what lies within one of them, the campaign restores the emotional weight that familiarity had worn away. By turning the same unit into a symbol anyone can display, it lets supporters become the campaign's media, carrying the message further and more personally than advertising space could."}, {"id": "i136", "t": "# Tonight's Ad Break Belongs to Them\n\n## Why this was needed\n\nCause films often move audiences for a moment and then fade. People watch, feel, and move on, because the film offers no way to act and no sense that anything real happened. Portrayals of communities can also ring false when they are scripted and cast from outside, which undermines trust. And paid media, by its nature, shows something prepared in advance, so it rarely carries the urgency of real events.\n\nThe task is to turn a cause film into a movement, to make its portrayal of a community authentic, and to give paid media the force of something that has just happened.\n\n## The approach\n\nThe idea is to stage a real public event led by the community itself, film it using their own people and material, and turn it into a full ad break almost immediately, surrounded by actions that let the audience join in.\n\nThe event is real. Members of the community gather for a public moment, a screening, a performance, a gathering, convened with the stakeholders who can make change. People from the community lead its production and decide how their story is told.\n\nThe portrayal is authentic. The community is cast as itself. Real home videos, messages and personal material are woven in. Families of those represented are involved. The film is built from people's own lives rather than from scripts.\n\nThe turnaround is immediate. Footage from the event is edited and aired as a full ad break the next evening, or assembled from every feed of the live moment. Viewers see on paid media something that genuinely just happened.\n\nThe film is surrounded by actions. Viewers are invited to post their own stories, attend local screenings, or take up a concrete offer that fulfils the film's wish. Watching becomes the first step in participating.\n\n## Key mechanisms\n\n**Real-world actions around the film.** Screenings, invitations to share, and concrete offers turn viewing into involvement. The film becomes the centre of a movement rather than an end in itself.\n\n**Real people and their own material.** Casting the community and giving them control of their story makes representation credible. Audiences trust what they see because it comes from the people themselves.\n\n**Rapid turnaround into advertising.** Airing footage of a real event almost immediately gives the ad break urgency and authenticity. Viewers know it is not a staged commercial but a moment that happened yesterday.\n\n## How the parts interact\n\nThe community-led event provides both the content and the authenticity. The rapid turnaround brings that content to a mass audience while it is still fresh. The surrounding actions convert that audience into participants, many of whom may contribute their own stories, adding to the community's material for future moments.\n\nThe components support each other. Without the community's own material, the event would be just another staged production. Without the rapid turnaround, it would reach only those present. Without the surrounding actions, the broadcast would move people but leave them with nowhere to go. Combined, they form a cycle of real events, real portrayal and real participation.\n\n## Why it works\n\nIt works because it closes the gap between seeing and doing. The audience sees something real, made by the people it concerns, and is immediately offered a way to act. The urgency of the broadcast and the authenticity of the portrayal make the call to action compelling.\n\nIt also shifts power to the community. They lead the event, tell their own story and see it given the most prominent space in the media. That visibility, combined with an invitation for others to join, turns a single evening's broadcast into the beginning of a movement."}, {"id": "i079", "t": "# A Product for Those the Category Forgot, Defended in Public\n\n## The problem\n\nCategories have blind spots. They design for an assumed user and overlook others: carers who shave someone else, people dealing with the skin effects of hormone therapy, bodies that crash dummies modelled on men never represented, the parent of a child lost on the beach. These people have real, unmet needs in the very moment of using the product, but the category talks past them.\n\nWhen a brand finally addresses an overlooked group, backlash often follows. Some people resent the attention, attack the brand and target those it now serves. The brand is tempted to retreat into a vague inclusion message rather than standing by a concrete change.\n\nA new product for an overlooked group also needs to be understood quickly. If people have to read paragraphs to know what it is and who it is for, it will not travel.\n\n## The approach\n\nWhat the brand does here is ask who its category has overlooked, build a product that answers their real need, give that product a design that explains itself, and treat any backlash as material to strengthen the answer.\n\nThe process starts with a question: who is missing from the moment of use, or what bigger worry sits in that same moment? The answer leads to a product rather than a slogan. The brand then gives this product an identity derived from something already true of the need it meets: a mark, mascot, sonic cue or object whose meaning is obvious from the problem itself. A few anchors stay fixed; others flex for different contexts.\n\nWhen the inevitable insult or taunt arrives, the brand answers in public by turning the attack into its own material: adopting the insult, redrawing the hateful symbol into the product's identity, replying with its opposite, or backing those most criticised.\n\n## Key mechanisms\n\n**Finding the overlooked user.** The brand examines its category's moment of use and asks who is being left out, or what larger concern lives there. This reveals a need that a product can genuinely meet, not just an audience to be included in imagery.\n\n**A product, not a message.** The response is something real that changes the experience for the overlooked group. That makes the brand's position concrete and defensible.\n\n**Self-explanatory design.** The product's marks are derived from the truth of the need itself, so the design carries the story without copy. Fixed anchors make it recognisable wherever it appears.\n\n**Turning backlash into material.** When attacked, the brand uses the attack. The insult can be adopted collectively; the hateful symbol can be redrawn within the product's flexible identity; the taunt can be answered with its opposite. The brand stands visibly with the people it built for.\n\n## Why it works\n\nDiscovering the overlooked need gives the brand something true to stand on. Building a product rather than a message means the brand's support is tangible and cannot be dismissed as performative. The truthful, flexible identity means the product explains itself and absorbs public reactions without losing recognisability. And turning the backlash into material means that controversy amplifies the product rather than burying it.\n\nThe sequence matters: a real product makes the public defence credible; the public defence makes the product famous; the self-explanatory design makes that fame translate into instant understanding. The people the category forgot receive something made for them, and they see the brand refuse to back down when others object."}, {"id": "i125", "t": "# The Sound We Always Made: A Handcrafted Return to the Brand's Archive, Told Through the Product's Own Sound\n\n## The challenge\n\nWhen a brand launches something new, it usually starts from zero: a fresh look, a new message, an unfamiliar story that audiences must learn. Yet many brands already possess deep reserves of feeling in the memories of people who grew up with them. Those memories are rarely just visual. They are often tied to a sound, the noise of a product being opened, used or completed, which people would recognise instantly but which brands seldom treat as a message. And in an age of polished, machine-made imagery, launch films tend to look alike, signalling technology rather than care.\n\nThe reconstructed idea combines the brand's own past, a handmade production technique that echoes the message, and the product's sound or ritual as the core of the brand communication.\n\n## The approach\n\n**Return to the past.** The launch is anchored in the brand's history: an anniversary, a founder's belief, an archive presented without alteration, or the adults who grew up with the product. The new offering is introduced as a continuation of something people already remember.\n\n**Make sound the message.** The brand identifies the sound of its product or its rituals and treats it as the central communication. A product's reveal might be scored as a birth; the noise of the product might be blended with another evocative sound; a signature melody might accompany a moment of completion; or a printed piece might \"play\" a sound by evoking it so precisely that readers hear it. The sound links past and present, because it is the same sound people heard years ago.\n\n**Build it by hand.** The campaign's visuals are produced through a visibly handmade technique whose material or process echoes the message. The sets and characters could be built from the brand's own archival materials, from the materials the product is made of, or from objects associated with the memories it evokes. Fingerprints and imperfections remain visible.\n\n## Key mechanisms\n\n1. **Memory does the persuasion.** By anchoring in heritage, the launch borrows feelings audiences already have, making the new offering feel familiar and earned.\n2. **Sound carries memory.** Sound is a sense that rivals rarely own, and it triggers recognition instantly. Making the product's sound the message gives the brand a distinctive signature that can survive across formats, including those with no visuals.\n3. **Craft signals care.** A handmade technique that echoes the message, for instance using archival materials to build the world, comments on the story itself and signals human effort against generic imagery.\n\n## How the pieces interact\n\nThe archive provides content and emotional depth; the sound connects that content to the present, because it is unchanged; and the handmade technique carries both into a form that feels personal. A film might open with the sound alone, recognisable to those who grew up with it, then reveal a handmade world built from archive materials in which the founder's belief is told, before the new product makes the same sound at its own reveal. Print and outdoor pieces could evoke the sound, so the memory is triggered even without audio.\n\n## Why it works\n\nIt makes the new launch feel like something people have always known. It gives the brand ownership of a sensory signature competitors cannot easily copy. And it frames the brand as made with care by people, rooted in a long history and in the physical materials of its past. The launch arrives already loved, because the audience recognises the sound before they have seen anything new."}, {"id": "i066", "t": "# Learning the Way We Learned\n\n## What the brand faced\n\nA brand with a long history wanted to mark a cultural tribute (a heritage month) without falling into the familiar trap: a logo recoloured, a montage of famous faces, and an audience that sees straight through it. At the same time, the brand had an opportunity to do something more useful than celebrate: teach children a hard skill tied to the culture being honoured, such as its language or a craft, in a way they would actually enjoy.\n\nThe risk on both sides was the same: performance. A tribute that narrates someone else's culture, or a lesson that feels like homework, wins nobody's trust.\n\n## The approach\n\nThe brand returns to its own past to find its real connection with the community, then co-creates a play-based learning kit with that community's institutions and creators. The heritage is the brand's and the community's at once; the learning is built for children as play; and the voice is the community's own.\n\n## How the idea works\n\n### Anchoring in the brand's past\n\nThe starting point is the archive. Unaltered material shows how the brand and the community have been linked over time: early customers, a founder's belief, products that families from the community grew up with. Adults who remember the product from childhood are invited to share what it meant. This gives the tribute an origin that is earned rather than claimed, and makes the new initiative feel familiar from the start.\n\n### A hard skill taught through play\n\nThe kit is designed around the child, not the curriculum. Small toys isolate one concept at a time. A guide character, an older sibling rather than a teacher, walks the child through. Children assemble a piece of the kit themselves before using it, so understanding comes through making. Where the skill is a language, including sign language, it is structured as a levelled game. Learning happens as a by-product of play.\n\n### Rooted in the community\n\nThe kit is co-created with the community's own institutions: its schools, cultural bodies and owned media channels. Production and distribution spend with its businesses. The brand's tribute theme is turned into a personal question for the community's creators, who answer in their own work, so the brand acts as host rather than narrator.\n\n## Why each part matters\n\nThe archive keeps the brand honest. It shows a real, historical relationship rather than a newfound interest, and lets the audience's memories carry the message.\n\nThe play-based design makes the tribute useful. It gives families something to do together and passes the culture to the next generation, which is the point of any heritage observance.\n\nThe community rooting makes the work credible. When the community designs, distributes and speaks, the work cannot be dismissed as appropriation or decoration.\n\n## Why it works\n\nTributes usually fail because the brand speaks too loudly and gives too little. This idea reverses both. The brand's voice is limited to its own history, which it is entitled to tell. Everything else, the content, the teaching and the storytelling, belongs to the community.\n\nThe result is something that outlasts the month. Children keep playing with the kit; parents who grew up with the brand see it reconnecting with them; and the community's institutions gain a tool they helped create. The tribute becomes a contribution, and the brand earns its place in a story it has been part of all along."}, {"id": "i009", "t": "# Records Pressed From Weapons\n\n## The problem\n\nGun violence is reported as totals. The figures are repeated so often that the public no longer feels them; each new number lands as one more statistic. Meanwhile, the weapons themselves, seized or surrendered, are quietly destroyed, and their story ends there. Campaigns asking for donations to support affected communities compete with every other appeal, and rarely give the giver anything that carries the story forward.\n\nThe challenge is to make a numbing statistic felt as individual loss, to turn the weapons into something that funds healing, and to do so in a form people actively want rather than tolerate.\n\n## The idea\n\nMelt seized guns into a named metal and use it to press a series of music records. Each record is dedicated to one person lost to gun violence, and each exists as a single physical copy. A musician composes a track for each name, and the record must be found, played and passed on. Proceeds from the wider product range made from the same metal return to the communities that were harmed.\n\nThe weapon that took a life becomes the object that remembers it.\n\n## Key mechanisms\n\n**From instrument of harm to raw material.** Weapons taken off the streets are melted down and branded as a new material with its own name. That metal goes into the records, and also into everyday products (jewellery, tools, household objects) whose sale funds the affected communities. Every purchase carries the story of where the metal came from and pays for the solution.\n\n**From statistic to individual.** Instead of announcing a total, the campaign makes the number countable. There is one record for each person lost. Together, they form a collection that can be laid out, counted and walked past. A single shelf or wall of records makes the scale visible; each sleeve makes one life knowable. The number the public had stopped feeling becomes a series of absences it can meet.\n\n**From abundant file to scarce event.** Each record exists once. It may be left at a concert for someone to discover, hidden at a location meaningful to the person it honours, or passed hand to hand, each listener adding their name to a sleeve before handing it on. The track is not streamed. Hearing it requires seeking it out, and the people who find it tell others.\n\n## How the pieces work together\n\nThe metal gives the records their meaning: they are literally made from the problem. The one-per-person rule gives them their scale: the size of the collection is the size of the loss. The scarcity gives them their life: they move through the world, collecting listeners and stories, instead of disappearing into a playlist.\n\nThe commercial range funded by the same metal keeps the idea from being only symbolic. While the records carry the memory, the products carry the money back to the communities, so remembrance and repair travel together.\n\n## Why it works\n\n- **It transforms rather than destroys.** The weapon's story does not end in a furnace; it continues as something that honours a life.\n- **It makes the total personal.** One record, one name, one song makes a number something people can grieve.\n- **It turns attention into pursuit.** A single copy that must be found earns more engagement than any broadcast.\n- **It funds the solution.** Every product made from the metal returns value to those who bore the harm.\n\nThe campaign gives a numbing figure a sound, a shape and a name, and makes it impossible to hear the music without remembering where the metal came from."}, {"id": "i027", "t": "# Hired By the People Who Grew Up With Us\n\n## Challenge\n\nRecruitment and public programmes often fail at the first step: they describe themselves in the organisation's language and wait for the right people to translate. The people most needed (younger candidates, applicants from overlooked regions, those who would never read a job advert closely) are the least likely to do that work. Meanwhile, a brand with a long history usually treats that history as nostalgia for marketing rather than as an asset for building trust with the people it wants to bring inside.\n\nThe challenge is to launch a programme that feels both genuinely designed for its intended audience and already familiar, earned, and believable from day one.\n\n## The idea\n\nLaunch the programme on an anniversary of the brand, anchored in the founder's original belief about the kind of people the business should be built by. Rather than a celebration of the brand, the anniversary becomes a promise kept: the founder's belief is put back into practice through a recruitment drive designed around the specific people it must reach.\n\nThe story is told not by the brand but by those connected to it: long-serving staff, customers, members and community figures, many of them adults who grew up with the product, describing their own days and how they came to be part of it. The brand stays in the background; the archive and the people carry the message.\n\n## How it works\n\n**Start in the archive.** The launch draws on unaltered material from the brand's past: early photographs, the founder's own words, original job notices. Shown without polish, these remind the audience of what they already remember about the brand, and frame the new programme as a continuation rather than a reinvention.\n\n**Design the offer around the candidate.** The programme is built backwards from the people it needs:\n- Candidates are filtered through the job's own skills rather than through CVs, so someone without formal credentials can prove ability by doing a task the role actually requires.\n- Young people are paid as consultants to co-create the application process, the language and the channels, so the offer is shaped by the audience rather than presented to it.\n- Messages are phased by audience, with each group hearing the part that matters to them first.\n- Fixed quotas per region ensure the programme reaches beyond the places the brand already recruits from.\n\n**Let real people narrate.** Each piece of communication is a first-person story: a staff member describing a shift, a customer who later joined, a community figure who mentors new starters. These are lived examples of the promise the founder made, told by people who can be met and checked.\n\n## Why each part matters\n\nThe heritage anchor gives the programme credibility it could not buy. Audiences already carry memories of the brand; a programme framed as the founder's belief, finally acted on at scale, arrives feeling familiar and deserved rather than opportunistic.\n\nThe audience-first design keeps that heritage from becoming self-congratulation. It is the evidence that the brand has actually changed how it opens its doors, not merely how it talks about itself. Skill-based filtering and paid co-creation are visible commitments that candidates can experience directly.\n\nThe real-voice storytelling connects the two. An archive can feel distant; a design principle can feel bureaucratic. A person explaining how they found their place in the company, perhaps alongside a photograph of a parent who did the same years earlier, makes the past and the new programme one continuous story.\n\n## Why it works\n\nMost recruitment campaigns ask the audience to believe a claim about culture. This idea replaces the claim with three kinds of proof. The archive proves that the belief is old and sincere. The programme design proves that the offer was built to fit the people it wants. The personal stories prove that people like them already belong.\n\nBecause the brand keeps itself in the background, the work reads as an invitation rather than an advertisement. And because every element (anniversary, founder, archive, staff, customers) is drawn from what the brand already owns, the campaign deepens the brand's meaning at the same time as it fills its roles."}, {"id": "i121", "t": "# The Song That Lives Inside the Ruins\n\n## A cultural loss with no public role\n\nWhen heritage is threatened, most people can only watch. Buildings, monuments and cultural places can be destroyed by conflict or neglect, and while experts may document them, ordinary people have no part in saving them. Music offers a way to engage a wide audience emotionally, but released digitally it becomes one more file among millions, instantly available and quickly forgotten. A campaign that wants people to care about heritage needs to make it precious, make the public part of its protection, and show the scale of their collective care.\n\n## The approach\n\nTreat threatened heritage as something that can be backed up, and make music the reward and engine of that backup. Tracks are hidden at the sites themselves, playable only at the physical location, or released as a single copy that passes between listeners. To unlock a track, people visit and help document the place, adding it to a shared archive from which it can be rebuilt. Every unlock and every contribution is gathered into a single public outcome: a live map, a lit landmark or an image showing where each person's part landed.\n\n## Key mechanisms\n\n**1. Heritage reframed as a backup.** The central idea is that cultural places can be preserved as data. Ordinary people capture them, for example by scanning them, so that if they are destroyed they can be rebuilt. This turns loss into something recoverable and makes any rebuilding a quiet act of defiance.\n\n**2. Music made scarce again.** The campaign's music is not streamed freely. Each track is bound to a place: hidden at coordinates, playable only on site, or existing as one copy passed from hand to hand. Fans must seek it out. Discovering a song becomes an event, and those who find it want to share the experience.\n\n**3. Collective participation made visible.** Every visit, scan and unlocked track feeds into one visible outcome. A landmark's lighting might change as contributions grow, or a live map might show each site documented and each song found. Participants can see exactly where their contribution sits within the whole.\n\n## How the mechanisms interlock\n\nThe scarce music provides the motivation: fans travel to places because a song waits there. Once there, they take part in backing up the site, so the backup gains volunteers who might never have joined a preservation effort. The visible outcome then shows everyone how many places have been saved and how many songs found, turning individual quests into a shared achievement and prompting others to join.\n\nThere is also a symbolic fit. A song that exists only at a site makes the place itself precious, just as the backup does. Both say that this place matters and should not vanish. And the visible public result shows that it is not just one fan or one site, but a whole community choosing to keep its culture alive.\n\n## Why it works\n\nScarcity gives music back its value and gives people a reason to travel to real places. Reframing preservation as backup gives them a meaningful task once they arrive. Visible collective outcomes reward each person and create a public image of shared care that media can report. Together, the three mechanisms turn passive concern into active, enjoyable participation, and produce both an archive of heritage and a body of music that people had to find."}, {"id": "i049", "t": "# The Warning You Can Hear Where You Stand\n\n## The problem\n\nA protection brand is usually only felt after something has gone wrong. Its promise is a payment for harm already done, which means that for most of a customer's life the brand is an invisible cost and an abstract reassurance. Its advertising compounds this: a fixed billboard or a generic digital banner says \"we care about your safety\" to everyone at once, regardless of whether they are in danger, safe, or somewhere in between. Purpose claimed this way is easy to ignore, because nothing the audience can use stands behind it.\n\nAt the same time, many risks are invisible at the moment they matter. People cannot see rising danger in the air, on the road, or in the conditions around them, and a visual message competes with everything else in the street.\n\n## The approach\n\nThe idea is for the protection brand to turn the knowledge and assets it already holds into a live warning system, delivered through outdoor and digital media that react to the conditions where the viewer is standing, and expressed through sound so that an invisible risk can be felt.\n\nThe brand already owns what such a system needs: data on where and when harm happens, research into causes, a claims operation that knows the patterns of loss, and in some cases vehicles and products in the field. Instead of keeping this behind the counter until a claim arrives, the brand redeploys it into its media. Screens, posters and digital placements are connected to live local conditions, such as local humidity, the traffic ahead, or the arrival of a train, and when those conditions combine into a known risk, the placement changes into a timely, specific message about that place, right now.\n\nThe message is not only shown but heard. Reactive sound turns the invisible condition into something the audience can sense: the risk is given a voice, a tone or a recorded texture that rises and falls with what the data says.\n\n## Key mechanisms\n\n**Redeploying owned assets at the moment of risk.** The brand's claims history and research tell it which situations precede harm. Putting that knowledge to work in public moves the brand's role from paying after to intervening before. The proof of purpose is no longer a statement; it is a tool people encounter and can act on.\n\n**Media driven by live, local conditions.** A placement that knows where it is and what is happening around it stops being a fixed advertisement. It becomes a reading of the viewer's surroundings: this junction, this platform, this weather. Relevance is created by time and place, so the message is useful rather than decorative. When conditions are safe, the placement can simply say so; when they shift, it warns.\n\n**Sound that makes the invisible felt.** Many risks have no visible signature. Recorded and reactive audio supplies a missing sense. The sound of the conditions can be captured and played back, or a reactive score can track the level of danger, so a passer-by hears a change before reading any copy. Sound also reaches people whose eyes are elsewhere, on a phone, on the road or on the crowd.\n\n## How the parts interact\n\nThe brand's owned data decides what counts as risk. The live media layer detects when and where those conditions are present. The sound layer translates that detection into something people notice instantly. Remove the data and the media is just reactive novelty. Remove the live triggering and the data becomes another generic safety message. Remove the sound and the warning competes visually with every other sign in the street.\n\nTogether they form a loop: the brand's knowledge watches the environment, the environment triggers the placement, and the placement speaks to the people standing in it. Each activation is a small, public demonstration that the brand can see harm coming and help people avoid it.\n\n## Why it works\n\nIt works because it makes the brand's promise tangible at exactly the moment it is relevant. People do not have to believe a claim about prevention; they experience the brand preventing something, or at least alerting them in time. The intervention is local and immediate, which makes it feel personal rather than corporate.\n\nThe use of sound gives the idea a distinctive character in a crowded visual landscape and suits the nature of invisible risk. And because the system is built from what the brand already owns, it is credible: the brand is not borrowing a cause, it is applying its own expertise in public. Over time, the placements turn the brand from a payer of last resort into a presence people associate with being looked after where they are."}, {"id": "i054", "t": "# The Cause Inside the Game\n\n## Why the usual approach fails\n\nYoung people are difficult to reach with causes in the conventional way. A charity advert explains a problem, asks for a donation, and directs people elsewhere to give. Each step loses attention. The information feels like something being told to them, the request arrives as an interruption, and the act of giving involves friction and doubt: where does the money go, what does it actually do, is it worth the effort right now?\n\nMeanwhile, the place where many young people spend their attention is inside games. A cause that stays outside the game remains information; a request that pulls them out of play is usually ignored.\n\n## The approach\n\nThe idea is to build the cause into a game young people already play, so that they experience the problem through play, and then to let them give inside that same game, at the very moment the experience moves them, with a donation that is effortless and visibly tangible.\n\nFirst, the issue becomes part of the game. A familiar game world is altered to show the harm, the problem is turned into a game mechanic the player has to deal with, or someone affected is returned as a playable character whose situation the player inhabits. The player does not read about the issue; they live it in the rules of the game.\n\nSecond, at the point where that experience creates the wish to help, the game offers a way to act without leaving. A charity cosmetic item in the in-game shop, a challenge named after a recognisable game move, or a collective win target for the community lets players support the cause through what they already do.\n\nThird, the donation is made tangible. Each purchase or achievement is tied to a clear, concrete outcome, in the spirit of one unit given for one thing provided, or an item that is both a gift and a donation, so the player knows exactly what their action has done.\n\n## Key mechanisms\n\n**The issue as experience.** When the harm is expressed as a mechanic or a changed world, players understand it from the inside. They feel the constraint, the loss or the danger as a game condition. This builds empathy without lecturing, because the player has discovered the problem through their own play.\n\n**Giving through play.** Support takes the form of in-game behaviour: wearing an item, completing a named challenge, contributing to a shared target. These actions are visible to other players, which turns giving into a social signal and spreads it through the community.\n\n**Effortless, tangible donation at the moment of intent.** The emotional peak and the opportunity to act happen in the same place and time. There is no form to fill in, no website to find. And because each action is linked to something concrete, the usual doubt about whether giving makes any difference is removed.\n\n## How the parts interact\n\nThe three components form a sequence inside one environment. The altered game world creates the intent; the in-game item or challenge captures that intent immediately; the tangible link to an outcome confirms that the action mattered. Each step depends on the one before. A changed game world with no way to act would create feeling with nowhere to go. An in-game charity item with no experience behind it would be just another cosmetic. A frictionless donation with no tangible result would still leave players unsure it was worthwhile.\n\nThe social visibility of in-game giving then loops back to the beginning: players who see others wearing the item or chasing the target are drawn into the experience themselves.\n\n## Why it works\n\nIt works because it respects how young people actually spend their time and how giving actually fails. It replaces information with experience, interruption with play, and abstract appeals with concrete results.\n\nThe idea also aligns the incentives of the game community with the cause. Players want to complete challenges, show items and reach shared goals; the campaign makes those desires the route to helping. The cause stops being something adults ask of young people and becomes something young people do together, in their own space, with proof that it made a difference."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
