<script>
(function () {
  "use strict";
  var DATA = {"pack": "P10", "items": [{"id": "i050", "t": "# Rebuild Your Street: A Location Game That Hides Music in Heritage\n\n## The problem\n\nHeritage loss feels distant. People know, in a general way, that monuments and archives are threatened, but the threat rarely connects to their own lives or neighbourhoods. Campaigns that ask for concern about faraway places compete with every other cause for attention, and lose.\n\nMusic fans and mobile gamers, two large and active audiences, are seldom invited into this conversation. Yet both are used to seeking things out: one hunts rare releases, the other walks the streets with a phone in hand chasing objectives.\n\nThe aim is to bring heritage preservation into the places people already know, and to make engaging with it feel like play and discovery rather than duty.\n\n## The approach\n\nBuild a location-based game in which the player's own streets become the board, and their task is to back up the heritage around them, with rare music as the reward hidden in the places they protect.\n\nUsing the phone's GPS and motion sensors, players move through their own neighbourhood to find and record landmarks, old buildings and places of memory. Scanning a site, by walking around it and capturing it with the phone, adds it to a shared archive that could be used to rebuild it if it were ever destroyed. At certain locations, tracks are hidden, playable only at that spot, or a single copy waits to be collected and passed on.\n\n## Key mechanisms\n\n**1. Heritage as backup.** The game frames preservation as making a copy. Ordinary people scanning the monuments around them into a cloud archive means that what is lost can be rebuilt. The framing is hopeful: rebuilding from a backup becomes a peaceful counter-statement to whoever would erase the past.\n\n**2. Scarce, discoverable music.** Tracks are tied to places or exist as single copies. A song available only at a particular landmark turns an abundant file into a destination, and the possibility of finding a unique release keeps players exploring. Fans share where they found tracks, drawing others to the same places.\n\n**3. The real world as the game board.** The player's own surroundings and movements drive the play. Racing through one's own streets, swinging the phone to capture a building, claiming the site on one's own block: the game is personal because it is played in places the player knows.\n\n## How it works as one idea\n\nEach mechanism feeds the others. The location game gives people a reason to walk to the places worth preserving. The scanning makes their movement useful, contributing to the backup. The hidden music rewards the effort and gives the game a collectible layer that spreads by word of mouth. Played together, they turn a neighbourhood into a map of things worth keeping and a trail of things worth finding.\n\nThe loop is simple: open the game, see nearby sites marked for backup and rumoured tracks, walk there, scan the site, unlock or collect the music, pass a copy on if it is unique, move to the next.\n\n## Why it works\n\nIt makes preservation local, active and rewarding. People protect what they feel attached to, and nothing builds attachment faster than physically being somewhere and having found something there. By putting the archive in the hands of players and hiding music in the places that matter, the idea makes the ordinary streets around people feel precious, and turns the act of saving them into something people choose to do for fun."}, {"id": "i011", "t": "# The Order That Fixed the Street\n\n## The problem\n\nBrands that take a stance on social issues often struggle to be believed. When a company borrows a cause unrelated to what it does, audiences see opportunism. Technical claims about convenience or performance, meanwhile, rarely move people emotionally; they are understood but not felt. And for many purchases, the biggest obstacle is not desire but friction: the moment when the customer has to stop what they are doing, go somewhere else and complete an awkward process, which is where they give up. The challenge is to build a stance that grows naturally from the product, make its benefit felt rather than explained, and remove the friction that stops people from acting.\n\n## The approach\n\nThe idea is a brand that identifies a real social problem its everyday function genuinely touches, fixes part of it, tells that fix as a story rather than a demonstration, and lets people support it by ordering from wherever they already are.\n\nThe brand starts by examining what its product does every day and where that function intersects a genuine issue. Perhaps the product's journey reveals a public problem that affects its customers' experience; perhaps the way it is used exposes an unfair rule or an unequal burden. Having found that point of contact, the brand changes something real about the problem, rather than just commenting on it.\n\nIt tells the story of that change through metaphor. Instead of showing a technical demonstration, the campaign dramatises the benefit: an image of something literally expanding, a countdown that reaches zero at the moment of connection, a companion that follows someone through their day, or an honest admission that proves the product's strength. The audience feels what the fix means before they understand the details.\n\nFinally, the brand removes friction. People can order the product, and support the change, directly from where they already spend time: a social post, a car dashboard, a smart TV or a private app. Each purchase contributes to the fix, and convenience itself becomes part of the offer.\n\n## Key mechanisms\n\n**The stance grows from the function.** Because the issue is one the product genuinely touches, the brand's role is credible. It is not borrowing a cause but acting on one it already encounters, and changing something real.\n\n**Metaphor makes the benefit felt.** Telling the story through a metaphor rather than a demonstration turns a technical or practical fix into an emotional experience that people remember.\n\n**Purchase where people are.** Allowing people to order from the platforms and devices they already use removes the moment of giving up. Supporting the change becomes as easy as a single action.\n\n**Each order advances the fix.** Linking purchases to the real change gives customers a reason to choose the brand now, and makes convenience part of the cause.\n\n## Why it works\n\nThe three components support each other. A social stance alone can seem like a statement; tying it to the product's real function and a tangible fix makes it credible. A credible fix can still be dry; the metaphorical story makes people feel it. And a moving story is wasted if acting on it is difficult; bringing purchase to where customers already are converts emotion into action immediately.\n\nThe result is a brand whose everyday function, emotional story and buying experience are all aligned. People believe its stance because it does something real, feel its benefit because it is told as a story, and act because acting is effortless."}, {"id": "i109", "t": "# Free to Copy, Easy to Order\n\n## The problem\n\nBrands that try to take a stand on a social issue are often accused of borrowing a cause unconnected to what they actually do. Even when the stance is genuine, the impact stays small, limited to what one brand can fund or operate. And for the customer, there is often a gap between agreeing with a brand and actually buying from it, especially when the path to purchase is inconvenient.\n\n## The approach\n\nThe idea finds the point where the brand's everyday function genuinely touches a social issue, builds a tool or design that changes something real there, releases it openly and for free so others can adopt and extend it, and brings purchasing directly to wherever customers already are. The stance grows from the product; the open release multiplies its reach; and frictionless buying turns support into sales.\n\n## Key mechanisms\n\n**Where the function meets the issue.** The brand identifies a concrete point at which what it does every day intersects with a social problem: a household task that reveals inequality, a rule in its own sector that excludes people, or a public failing that affects how its product is used. It then changes something real about that point.\n\n**Released openly.** The tool, design or content created to address the issue is published free: open-source code, files people can manufacture themselves, copyright-free assets, works placed in the public domain, or an open fund others can join. The idea spreads far beyond what the brand alone could support, and the brand is seen as a giver.\n\n**Buying where people already are.** Purchase is made possible from any existing channel: ordering through a social post, a car dashboard or a smart television, a private app for customising orders without queueing, or a delivery-only kitchen operating in existing spaces. The moment where people give up is removed.\n\n## How they connect\n\nThe function-meets-issue insight ensures the open release is relevant. Because the tool addresses a problem the brand's product actually touches, others in the same space, whether businesses, communities or institutions, can use it directly. The open licence invites them to.\n\nThe open release, in turn, gives the stance scale and credibility. A brand that keeps its fix proprietary may look as if it is using the issue for advantage. A brand that gives it away openly shows that the change matters more than the ownership.\n\nFrictionless purchasing ties the stance back to the business. The same channels people use to engage with the cause, such as social posts and connected devices, can let them buy the product without leaving. Convenience becomes part of the offer, and the brand's generosity on the issue is matched by generosity in how easy it is to buy.\n\nSequence: locate the genuine intersection between product and issue; design a fix that changes something real; release it openly with clear terms for adoption; and enable purchasing within the platforms and devices customers already use.\n\n## Why it works\n\nThe stance is credible because it comes from the product's own function. It spreads because the fix is free to copy and extend. And it supports the business because buying is as easy as agreeing. The brand gains a reputation as a giver and a problem-solver, while removing every obstacle between that reputation and a purchase."}, {"id": "i052", "t": "# You Called Us That. Now Join Us.\n\n## The problem\n\nWhen a brand takes a public stand, backlash usually follows: insults online, a hateful symbol circulated against it, a taunt from critics, attacks on the ambassador who represents it. Most brands respond with silence or a careful statement, and the controversy defines them on their critics' terms.\n\nAt the same time, brand advertising about attitude often rings false. Actors perform a spirit that real people would simply live, and audiences can tell the difference. And campaigns stay a one-way broadcast, watched passively rather than taken up.\n\nThe opportunity is to turn a moment of hostility into the brand's most authentic, participatory work.\n\n## The approach\n\nThe brand answers the attack by adopting it. The insult hurled at the brand and its supporters becomes the title of a new campaign. The brand stands publicly with its most criticised ambassador. And instead of hiring actors, it casts the real people who live the attitude the critics despise, then opens the cast to everyone: an open call, in the campaign's own format, for the public to join the film.\n\n## Key mechanisms\n\n**Turning the attack into material.** The insult is reclaimed collectively, worn by the brand and its supporters as a badge. A hateful symbol aimed at them is redrawn into something positive. Taunts are answered with their opposite. The most criticised ambassador is given the leading role rather than being quietly dropped. The brand becomes a principled ally, and the controversy carries the message further than paid media could.\n\n**Casting people who naturally live it.** The first wave of the film features real fans, street-cast members of the subculture under attack, real families, and a non-actor in the hero role. Celebrities appear only as cheering cameos. Because these people are not performing, the attitude comes through in how they simply are. It reads as authentic precisely because nobody is acting.\n\n**Turning the audience into the cast.** The brand then issues an open invitation, pitched in the format of the campaign itself: record yourself wearing the reclaimed insult, send it in, and you can appear in the official film. A dance or a gesture becomes a challenge whose prize is a place in the final cut. People audition to stand beside the ambassador. Passive viewers become participants, and their entries become the campaign's content.\n\n## How the pieces connect\n\nReclaiming the insult creates the moment and the message: we are not ashamed, and we are not alone. Casting real people proves the message is true: these are the actual people who live this attitude. Opening the cast to the public extends that proof to everyone who agrees: the more who join, the louder the answer to the original attack.\n\nEach step depends on the one before. Without the reclaimed insult, the open call has no rallying point. Without real casting, the open call would look like a gimmick. Without the open call, the reclaimed insult would remain a statement rather than a movement.\n\n## Why it works\n\n- **Controversy becomes fuel.** The attack is already news; responding with it rather than around it captures the attention it generated.\n- **Authenticity is built in.** Real people living the attitude cannot be dismissed as performance.\n- **Support becomes visible.** Every entry is a public act of solidarity, which shows critics and supporters alike how many stand with the brand.\n- **Content scales itself.** The audience supplies the film, so the campaign grows with every participant.\n\nWhat began as an insult ends as a crowd, and the brand is standing in the middle of it."}, {"id": "i142", "t": "# Pressed in Evidence\n\n## The challenge\n\nA large loss, repeated in headlines, eventually stops being felt. The public knows the number but no longer reacts to it. Campaigns that try to restore the feeling often reach for advertising formats, and audiences recognise them as campaigns and look away. What is needed is a message that travels as culture, that people choose to hear, and that carries the weight of what has been lost in a form they cannot dismiss.\n\n## The idea\n\nRelease the message as a genuine piece of music by a credible artist, in the audience's own genre, and make its physical release from the evidence of the harm itself. The song tells the story; the physical edition, its record, sleeve or printed lyrics, is made from material that carries the problem, such as ink mixed with what remains after the harm. And the release is structured so that each person lost is individually present: one name, one voice, one moment of silence, one object for each.\n\nThe audience hears a song they would choose anyway, holds the evidence in their hands, and meets the individuals behind the number.\n\n## Key mechanisms\n\n**1. A real piece of music.** The campaign releases a real single by an artist the audience respects, or a story-song in the genre they already listen to. It might also appear on an artist's commercial release, or the way it is released might act out the song's title. Because it is a genuine piece of culture, people listen to it, share it and play it again before they recognise it as a campaign. The message travels on its own merit.\n\n**2. The medium made of evidence.** The physical form of the release is made from the evidence or a symbol of the problem: ink created from material left by the harm, a sleeve built from records of what happened, a typeface drawn from the handwriting of someone affected. Holding the record or the printed lyrics means holding the argument. It is impossible to treat the object as a mere product.\n\n**3. Individuals instead of a statistic.** The song and its release are built so that each person lost is represented individually: a name in the lyrics, a voice in the mix, a single printed object for each, or a silence timed to the number of victims. The audience can count them and meet them. The overwhelming figure becomes a set of felt absences.\n\n## How they connect\n\nThe song provides reach and voluntary attention. The evidence-made medium provides weight and authenticity. The individual representation provides emotional specificity. Each covers the others' weaknesses: a song alone might be enjoyed without thought; an evidence-made object alone might be seen only by a few; individual representation alone might feel like a memorial rather than a message people share.\n\nTogether, the song carries the individuals into people's lives, and the physical edition makes the harm literally present. The music travels digitally; the object grounds it physically; the names keep it human.\n\n## Why it works\n\nCulture people choose to consume reaches further than advertising they are served. Physical evidence makes the harm undeniable and gives the message a tangible form people keep. Turning a number back into individuals restores the feeling the statistic had lost. Combining the three creates a message that people hear, hold and remember, and pass on because it moved them, not because they were asked."}, {"id": "i094", "t": "# Sing Along, Check Yourself\n\n## The barrier\n\nEarly testing saves lives, and most people put it off. Booking an appointment takes effort, it may cost money, and the possibility of bad news makes avoidance comfortable. Awareness days and months exist to push against this, but they have become crowded; every cause has one, and messages released on them can sound like duty rather than invitation.\n\nWhat is needed is a way to move people from awareness to an actual first check, on the day when the issue already has the public's attention, using something that spreads on its own.\n\n## The idea\n\nOn the awareness day or month already dedicated to the condition, release a rewritten version of a song everyone already knows, and make the song itself a first health screen. The familiar melody gets people singing without prompting. The new lyrics carry the message. And the act of listening, singing or recording oneself along with it, using a phone people already own, performs a simple first check that tells them whether they should follow up.\n\nPeople join in because they love the song. By the time they finish, they have been screened.\n\n## Key mechanisms\n\n**1. A melody the audience already carries.** The campaign takes a song with mass affection, a famous anthem, a crowd's chant, a well-loved title, and changes it. A word is swapped, the lyrics are rewritten around the health message, or the song's meaning is flipped. Because the tune is already embedded in memory, the message rides it effortlessly. People hum it, sing it in groups and pass it on without needing to be asked.\n\n**2. The screen built into an everyday act.** The song is designed to work as a first screen. For example, singing or breathing along with it while a phone records, or listening to it in a way that reveals whether something is off, turns a familiar device and a familiar pastime into a first test. There is no appointment, no fee and less fear, because the person is simply singing a song. Anyone whose result suggests a problem is guided toward proper testing.\n\n**3. The calendar moment that already belongs to the issue.** The release is timed to the awareness day or month dedicated to the condition, or a nearby, less crowded date in the same window. The public's attention is already pointed at the issue, media are looking for stories, and health organisations are active. The song gives that existing attention something to do, and the date gives the song symbolic weight it would not carry on an ordinary day.\n\n## How the parts reinforce one another\n\nThe awareness moment supplies the audience, the familiar song supplies the reach, and the built-in screen supplies the outcome. A song alone would raise awareness and stop there. A test alone would struggle for attention among other health apps. A date alone would produce yet another message. Combined, they turn passive awareness into a participatory act that leaves each participant with a result.\n\nThe song is also the distribution mechanism. Every time someone sings it, shares it, or challenges friends to sing it, more people are exposed to the screen. The date anchors this spread so it happens in a concentrated burst, and the familiar melody means the song can return the next year on the same date, building a ritual.\n\n## Why it works\n\n- **Familiarity lowers resistance.** People join in with a song they love before they think about the message it carries.\n- **The test is hidden in pleasure.** Turning a sing-along into a first screen removes the appointment, cost and dread that stop people being tested.\n- **The calendar does the heavy lifting.** Arriving on a day already dedicated to the issue borrows existing attention and adds meaning.\n- **Spread is effortless.** A song is the most shareable unit of culture; each share is an invitation to be screened.\n- **Measurable action.** Unlike a message, a screen produces a count of people who checked themselves, which shows whether awareness became action."}, {"id": "i064", "t": "# Wash Your Hands to the Beat\n\n## The issue\n\nSome healthy behaviours are simple but stubbornly hard to establish, especially among young people. Persuasion campaigns tell them what to do, but instructions fade, and a cause that arrives as a message is easily ignored. At the same time, cultural experiences that could carry meaning, such as music, art and performance, are often locked inside venues that many people never enter, so their power never reaches those who could benefit.\n\nThe task is to make a healthy behaviour happen without relying on persuasion, to make the message something young people choose to share, and to open the cultural experience that carries it to people who would never walk into a venue.\n\n## The approach\n\nThe idea is to build the healthy behaviour into an object young people already handle every day, launched with a genuine pop song and music video by artists they already follow, and made accessible through a new point of access such as a phone-native or augmented-reality experience that unlocks from the object itself.\n\nThe object does the work. Following the pattern of school chalk made with soap so dusty hands lather when rinsed, sanitising prayer beads, or a soap sliver handed out after a bus ride, the behaviour is built into something people already use, so it happens automatically.\n\nThe song is the invitation. A real single by artists young people follow, with a music video featuring people from the communities the behaviour helps, carries the message as entertainment. The song can also define the length or rhythm of the behaviour itself, so the act and the music are linked.\n\nThe new access point brings the cultural experience out of the venue. Scanning the object, or simply using it, can unlock an augmented-reality performance, a phone-native video, or a geolocated trail where reproductions of the music video's scenes appear in the street. People explore it on their own terms, wherever they are.\n\n## Key mechanisms\n\n**Behaviour built into an object.** The healthy act occurs as a by-product of everyday use. Nobody has to be convinced; the behaviour simply happens. This is especially effective for young people, who are often resistant to instruction.\n\n**The cause as a genuine pop song.** Packaging the message as a real single and music video lets it circulate as entertainment people share by choice. Casting participants from the affected communities keeps it authentic and gives young people faces they recognise.\n\n**A new point of access to culture.** Augmented reality, phone-native formats or street reproductions take the experience to people who would never enter a venue. Linking this access to the object makes the everyday item a gateway to the cultural content.\n\n## How the parts interact\n\nThe object delivers the behaviour, the song makes it desirable, and the access point extends the experience into daily life. A young person using the object triggers or remembers the song; scanning it opens the performance; sharing the song spreads the object and the habit.\n\nEach part strengthens the others. The object without the song would work quietly but would not spread. The song without the object would be a pleasant message with no automatic behaviour behind it. Both without the new access point would keep the cultural experience distant. Together, they combine automatic behaviour with voluntary sharing and personal exploration.\n\n## Why it works\n\nIt works because it removes the need for persuasion while adding reasons to engage. The behaviour happens through the object; the song gives people a reason to talk about it; the access point lets them explore it in their own space.\n\nIt also respects the audience. Young people are not lectured; they are given something useful, something enjoyable and something to discover. The result is a habit that forms almost invisibly, carried by culture they chose to share."}, {"id": "i012", "t": "# Very Serious Animals: A Pet Brand That Serves the Pet, Hand-Builds the World Around It, and Never Breaks Its Deadpan\n\n## The problem\n\nPet brands typically sell to the owner. Their ads show owners cuddling animals, talking about love and quality, and making promises about health that every competitor also makes. The animal is a prop in the owner's story. Claims of care are generic and easy to doubt, and the category's visual language is full of glossy, near-identical imagery.\n\nThe reconstructed idea turns this around with three linked choices: the brand serves the animal directly in a way the owner can witness, the work is made by hand using a material or process that echoes the message, and the whole thing is played as an absurd premise with total sincerity, with the brand happy to be laughed at.\n\n## The approach\n\nThe core is a service created for the animal itself rather than for its owner. That could be music composed specifically for anxious animals, a broadcast designed for pets left at home, or an unlikely training project that proves animals' intelligence. Real animals, including those from shelters, are cast rather than trained models.\n\nThe brand presents this service in a completely straight-faced way, as if it were the most important cultural event of the year. A solemn genre is adopted (a classical premiere, a serious documentary about a new radio station, an earnest news report about a remarkable feat) and played with complete sincerity even though the premise, a service designed for animals, is absurd on its face. Occasional slapstick from the animals themselves breaks the solemnity, and the brand is the willing butt of the joke for taking it so seriously.\n\nAll of it is produced through a visibly handmade technique whose material echoes the message. The sets, characters and props could be crafted from the materials of the category, such as the textures pets love, with fingerprints and seams left visible. The handmade look signals human effort and care, in deliberate contrast to the smooth machine-made imagery of most pet advertising.\n\n## Key mechanisms\n\n**1. Care proven in use.** The animal-facing service is real: it can be listened to, tuned into or watched. Owners see their own pets respond to it. This is a far stronger proof of care than any claim, because the benefit happens to the animal and the owner is a witness.\n\n**2. Sincerity that converts doubt into delight.** A claim like \"we really understand animals\" would be dismissed as a pitch. Delivered through a deadpan, solemn treatment of an absurd premise, the same claim becomes entertaining, and entertainment is shared rather than resisted. The brand's willingness to look slightly ridiculous makes it more likeable.\n\n**3. Craft that comments on the story.** Handmade production carries the theme of care and attention into the form itself. Visible effort mirrors the effort the brand has made for the animal. It also gives the campaign a texture that stands apart in its category.\n\n## How the pieces interact\n\nThe three parts sit in a natural order. The service for animals provides the substance and the proof. The deadpan, solemn treatment makes that service a story people want to watch and share. The handmade production gives the story its warmth and reinforces, through the work's material, that someone took care. The handmade quality also makes the comedy gentler: a lovingly built world full of earnest ceremony around pets feels affectionate rather than cynical. The real shelter animals cast within it keep the humour grounded in genuine stakes.\n\n## Why it works\n\nIt inverts the category's default by putting the animal, not the owner, at the centre, which gives the brand a claim no rival makes. It wins attention through entertainment instead of persuasion. And it builds a distinctive, crafted identity that signals care at every level, from the service to the frames of the film. Owners end up seeing the brand do something kind for their pets, and enjoying the joke the brand told about itself along the way."}, {"id": "i051", "t": "# Wearing the Insult\n\n## Background\n\nWhen a brand takes a public stance, it often attracts hate: insults directed at its customers or ambassadors, taunts, sometimes hateful symbols aimed at what it stands for. The conventional response is either silence or a carefully worded statement, neither of which persuades anyone and both of which let the attackers set the narrative. Meanwhile the brand's identity, its logo, typeface, mascot and sonic cue, sits untouched, as if it belonged to a different conversation.\n\nThe question is how a brand can answer hostility in a way that wins people over, keeps its own voice, and does not sound like a defensive press release.\n\n## The idea\n\nThe brand turns the attack into its own material. It adopts the insult collectively, redraws the hateful symbol into something else, answers the taunt with its opposite, or stands visibly behind the ambassador who has drawn the most criticism.\n\nIt does this through its identity system. Because the brand's marks were derived from something already true of it, and because the system holds a few anchors fixed while letting the rest flex, the identity can absorb the insult or the symbol and be transformed in public without losing recognition.\n\nAnd it does it with humour aimed at itself, or with an absurd premise played completely straight. The brand cheerfully becomes the butt of its own joke, or treats the reclaiming of the insult with mock solemnity.\n\n## Key mechanisms\n\n**Reclaiming the attack.** The force of an insult depends on the target being hurt by it. When the brand adopts the insult as a badge, worn by itself and its supporters together, the attack loses its power. When a hateful symbol is redrawn into something warm or ridiculous, the original meaning is displaced. When a taunt is answered with its exact opposite, the attacker's own words become the setup for the brand's punchline.\n\n**An identity flexible enough to carry the reply.** The fixed anchors of the identity ensure that the reply is unmistakably the brand's. The flexible elements are where the insult or symbol is absorbed: the mascot wears the slur proudly, the typeface spells out the reversed taunt, the logo temporarily incorporates the redrawn symbol. Because the marks are self-explanatory, the transformation needs no copy. People see what has happened and understand it.\n\n**Self-mockery as the delivery.** Responding to hate earnestly can sound wounded or preachy. Responding with self-aware humour, by laughing at the brand itself or playing the ridiculous situation completely straight, makes the reply enjoyable to share. The scepticism that would greet a statement of values is turned into amusement, so the stance is accepted as entertainment.\n\n## How they combine\n\nThe insult or symbol supplies the raw material. The identity system supplies the canvas on which that material is transformed. The humour supplies the tone that lets audiences celebrate the transformation instead of merely noting it.\n\nEach part makes the others possible. Without a flexible identity, reclaiming the insult would require a separate campaign with its own look, diluting the brand. Without humour, an identity carrying a slur or a redrawn hateful image could feel uncomfortable or confrontational. Without the real attack, self-mockery would just be a gag; with it, the joke has stakes and the brand appears principled.\n\nThere is a satisfying reversal at the core. The attacker hoped to make the brand an object of ridicule. The brand makes itself the object of its own ridicule, on its own terms, in its own marks, and the attacker is left with nothing to add.\n\n## Why it works\n\nIt works because it changes who owns the controversy. Instead of reacting to the attackers' framing, the brand reframes the whole episode as material for its own story. The controversy then carries the brand's message further than any planned campaign could, because people who saw the original attack are curious to see the reply.\n\nIt works because the identity does the explaining. A logo or mascot visibly transformed communicates the stance in an instant, and the fixed anchors keep every version recognisably the brand's.\n\nAnd it works because humour lowers defences. A brand that can laugh at itself while standing firmly behind its people is perceived as both confident and principled. Audiences who might scroll past a statement stop to enjoy the joke, and in enjoying it, they take the brand's side."}, {"id": "i105", "t": "# Play the Metal\n\n## What the campaign faces\n\nMovements against a harm usually fight on two fronts at once. They need money to repair the damage done to communities, and they need visible, sustained public pressure to stop the harm happening again. Fundraising tends to be a separate ask from activism, and activism tends to be scattered: thousands of people post, share and speak, but their voices read as noise rather than a campaign the press can follow.\n\nA third difficulty is engagement. Supporters may agree with a cause but have no active way to express it; watching a film or signing once does not keep them involved.\n\n## The idea\n\nTake the instrument of the harm and transform it into a branded raw material. Use that material in everyday products, and return proceeds to the communities harmed. Then build a game around the material, in which players can act out the transformation themselves and unlock real-world twins of what they make in the game. Every piece of play, purchase and post is routed through one named container, a single hashtag or story library, so the whole movement reads as one campaign.\n\nPeople do not just support the cause; they play it, buy it and speak with one voice through it.\n\n## Key mechanisms\n\n**The harm turned into material.** The objects that caused the damage are collected and turned into something useful, given a name and treated as a premium raw material. Products made from it carry their origin story with them. Proceeds from sales go back to the communities that were harmed. Every purchase is both a transaction and a statement, and the material itself is evidence that the harm can become something good.\n\n**A game built around the transformation.** The campaign turns the material into gameplay. Players might collect, transform or build with it in a branded game, earn rewards through skill or knowledge of the cause, or scale a familiar playground game to city size. In-game items made from the material have real-world twins that can be bought. Fans act out the transformation instead of watching it, and the game keeps them coming back.\n\n**One named container for everything.** All activity, from posts about purchases to game achievements to personal stories from affected communities, is directed through one named container: a single hashtag that names what needs to change, a searchable library of stories, or a coordinated moment when everyone posts together. Scattered participation becomes one sustained campaign that journalists can follow and quantify.\n\n## The links between them\n\nThe material gives the campaign a tangible symbol and an income stream. The game converts that symbol into ongoing participation and introduces it to people who would not respond to an appeal. The named container gathers buyers, players and affected voices into one visible current of support.\n\nEach mechanism feeds the next. Players who unlock in-game items learn the material's story and may buy its real twin. Buyers share their purchase under the single named banner. The press, following that banner, sees steady and growing activity and covers the cause, which brings new players into the game. Funds flow back to communities, whose stories in turn enter the same container and keep the narrative grounded in real lives.\n\n## Why it works\n\nTransforming the instrument of harm is a powerful image of redemption, and turning it into products means every purchase funds repair. Games give people a way to participate actively and repeatedly, which turns casual sympathy into habit. A single named container gives scattered voices coherence and turns many small acts into one story the press can report. The campaign solves both of the movement's fronts at once: it raises money and builds pressure, using the same activity."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
