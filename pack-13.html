(function () {
  "use strict";
  var DATA = {"pack": "P13", "items": [{"id": "i073", "t": "# The Classic Scene, Recast With Locals\n\n## The problem\n\nPlaces marketing themselves to visitors often rely on scenery, and their claims of being welcoming or authentic sound like every other destination's advertising. People have learned to discount such promises. At the same time, the films and images that made some places famous are loved and remembered, but the people who actually live there rarely appear in them.\n\nThe challenge is to make a place's claim believable, present it as a living home with people worth visiting, and connect it to the cultural memories audiences already hold.\n\n## The approach\n\nThe idea is to restage a beloved film scene set in the place, shot for shot, but with residents as the cast, and to use the comparison between the original and the remake as proof that cannot be dismissed as advertising.\n\nThe restaging borrows the nostalgia of the original. A classic scene audiences remember is rebuilt in the same locations, with the same framing and timing. People recognise it instantly.\n\nThe cast is the community. Instead of actors, residents play the roles: local hosts, people from under-represented communities, members of the city's own creative trade. The scene becomes a portrait of the people who make the place home.\n\nThe proof comes from the comparison. Shown side by side, or with an unaltered archive of the original, the remake reveals what has changed and what has not in the place and among the people who live there. The evidence is not polished; it may even look unflattering. But because it comes from the place itself and from a film the audience already trusts, it persuades.\n\n## Key mechanisms\n\n**Restaging a loved scene.** The familiar film provides instant recognition and emotional weight. Audiences engage because they already care about the original moment.\n\n**Residents as the cast.** Placing locals in the scene shows the place as lived in. Travellers see people they could meet, not just landmarks to photograph.\n\n**Evidence that cannot be dismissed.** Comparing the remake with the original provides proof grounded in reality. The audience sees for themselves what the place is like now, without relying on the destination's claims.\n\n## How the parts interact\n\nThe restaging provides the frame, the residents provide the content, and the comparison provides the proof. People are drawn in by the film they love, surprised by the real people inside it, and convinced by what the comparison reveals.\n\nEach component strengthens the others. A restaging without residents would be a tribute with no new meaning. Residents without the familiar frame would be another set of destination portraits. Both without the comparison would lack the honesty that makes the message credible. Together, they make the place's story memorable, human and believable.\n\n## Why it works\n\nIt works because it uses the audience's existing affection to carry a new message. People already care about the original scene; seeing it remade by the people who live there gives them a reason to care about those people too.\n\nThe honesty of the comparison disarms scepticism. Instead of telling travellers that the place is welcoming, the campaign shows them the residents, in a scene they know, in a way that admits change. The place becomes both a remembered setting and a living home, and visitors are invited to meet the people who now fill the frame."}, {"id": "i040", "t": "# Scan Your Street\n\n## The threat\n\nMonuments, buildings and other heritage are at risk of being destroyed, whether by conflict, neglect or deliberate erasure. Preservation is usually left to experts and institutions, and ordinary people feel powerless: they can mourn what is lost, but they cannot prevent it. Meanwhile, brand games that ask people to engage with a cause often feel disconnected from their lives, because they are played in imaginary spaces.\n\nThe challenge is to give the public a real role in protecting heritage, make that role personal, and show everyone that their contribution adds up to something larger.\n\n## The idea\n\nTurn heritage preservation into a game played in the player's own surroundings. Using their phone's location and motion sensors, people capture threatened monuments and buildings near them, scanning them into a shared digital archive so they can be rebuilt if destroyed. Every scan is shown on a public, physical or visible outcome: a landmark that lights up as the archive grows, or a live map showing exactly where each contribution landed.\n\nPreservation becomes play, play becomes personal, and personal acts become a visible collective backup.\n\n## Key mechanisms\n\n**Preservation as a backup.** The core reframe is simple: heritage can be backed up. If ordinary people scan threatened places into a cloud archive, what is destroyed can later be rebuilt. This changes the emotional register from loss to resilience. Rebuilding is not only practical; it becomes a peaceful counter-statement to whoever would destroy.\n\n**The real world as the game board.** The scanning is structured as a game that uses GPS and motion sensors. Players walk their own streets to find sites, move the phone around a building to capture it, and complete tasks tied to real places they know. Because the game happens where the player lives, it feels personal. The monument on the corner becomes something they helped protect.\n\n**Collective effort made visible.** Each scan is gathered into a single visible outcome. It might be a live map that fills in as the archive grows, a landmark whose lighting changes with every contribution, or an image showing each player exactly where their scan sits within the whole. Remote, scattered actions become one public result, and each participant sees their part in it.\n\n## How it works as a whole\n\nThe backup reframe gives the game its purpose: players are not collecting points but saving something real. The location-based game gives the backup its method and makes participation intimate. The visible outcome gives both of them a public face, turning thousands of private acts into one shared achievement and a powerful image for media coverage.\n\nBecause the game is played in local places, the archive naturally covers a wide spread of heritage, from famous landmarks to small neighbourhood buildings. And because progress is shown publicly, players are motivated to fill gaps in the map, encouraging friends and neighbours to join in.\n\n## Why it works\n\nReframing preservation as backup gives ordinary people agency over something they thought was out of their hands. Playing in familiar places turns a cause into a personal mission. Visible collective outcomes reward each contribution and show that individual acts matter, which keeps participation growing. The result is a living archive built by the public, and a counter-statement to destruction that grows with every scan."}, {"id": "i085", "t": "# An Identity Others Can Carry\n\n## The problem\n\nA small organisation with a cause has two shortages: money and memory. It cannot afford the media weight needed to make its message known, and it often lacks the familiarity that makes people trust and support it. Typical solutions, such as launching a new name or a fresh visual identity, make things worse: they reset recognition to zero and ask partners to promote something unfamiliar.\n\n## The approach\n\nThe idea is to build the cause's identity directly from its own past, then design that identity as a flexible kit that partners, coalitions and communities can adopt and carry, so the organisation's reach multiplies without its budget growing.\n\nThe organisation starts from what is already true about it: its founding belief, an anniversary, its untouched archive, or the people who grew up with its work. From that history it derives the marks of the identity: a logo drawn from an archive document, a typeface rooted in an early publication, a sonic cue from an old recording, a mascot or object that people already associate with the cause. A few anchors stay fixed; everything else flexes.\n\nThat flexibility is what makes the next step possible. The identity is released as a toolkit for others: coalition partners who co-own and co-fund the cause, local groups who adapt the materials, communities who pitch their own stories, and an initiative designed from the start to be handed on.\n\n## Key mechanisms\n\n**Memory as the message.** Anchoring the identity in the organisation's own past means audiences already have feelings about it. Adults who remember the early work, archive imagery with its original texture, or a founder's original words make any new campaign feel earned. The cause does not have to introduce itself; it reminds people of something they already know.\n\n**Self-explanatory marks with fixed anchors.** Because each mark is derived from something real, it carries the story without copy. A partner using the logo does not need to explain where it comes from. Holding a few anchors constant (the core symbol, a colour, a sonic cue) while letting layout, imagery and language flex means every appearance is recognisable, no matter who produces it.\n\n**Reach through other people's channels.** Coalitions, partner toolkits and locally pitched stories give the organisation reach far beyond its means. Partners co-own the effort, so they invest in it. Communities adapt it, so it feels local. And because the initiative is designed to be handed on, it keeps growing after the organisation's direct involvement ends.\n\n## How the atoms interlock\n\nThe history gives the identity its meaning. The identity system gives partners something coherent and easy to use. The partner network gives the history a stage far larger than the organisation could build. Each piece answers a weakness of the others: a toolkit without a strong identity would fragment into inconsistent messages; a strong identity without partners would remain small; and partners without shared memory would struggle to explain why they care.\n\nIn practice, a local partner might take an archive image, add a story from its own community, and publish it using the fixed anchors. The result looks local and personal but unmistakably belongs to the cause. Multiply that across many partners and the small organisation appears everywhere, speaking with many voices but one identity.\n\n## Why it works\n\nRecognition is expensive to build and cheap to borrow. This idea borrows it twice: from the audience's existing memories of the cause and from the trust and channels partners already hold. A flexible identity grounded in genuine history lets everyone speak for the cause without diluting it. The organisation's budget stays small, but its presence becomes as wide as its coalition."}, {"id": "i091", "t": "# Made From What Hurt Them\n\n## The difficulty\n\nWhen a brand tries to address a social harm, it faces scepticism on two fronts. Its claims are treated as advertising, and its involvement in a cause is suspected of being self-serving. A purpose campaign that simply states good intentions is quickly dismissed. Meanwhile, the communities harmed often see little benefit, because awareness does not translate into funding or practical change.\n\nThe brand needs proof that people cannot dismiss, a story told with cultural credibility, and a mechanism that turns each purchase into tangible support for those who were harmed.\n\n## The approach\n\nThe idea is to turn the instrument of a harm into a branded raw material, prove the transformation with evidence the audience cannot dismiss as advertising, and hand the telling of the story to a respected outside creator in their own form.\n\nThe material comes from the harm itself. Following the pattern of seized guns melted into a named metal, or minefields cleared and sown to produce honey, the brand takes what caused damage and turns it into something useful. This material is sold into everyday products, with proceeds returned to the communities that were harmed.\n\nThe proof is uncompromising. The process is shown openly, including the unflattering parts: the raw state of the material, the difficulties of transformation, an independent test that confirms what the material is. The evidence comes from outside the brand or looks too honest to be advertising.\n\nThe story is told by an outside creator. A documentary filmmaker, a playwright, or a director who does not make ads follows the material from harm to product, in their own form and voice. The brand stays light, appearing as the enabler rather than the hero.\n\n## Key mechanisms\n\n**The harmful instrument as raw material.** Transforming the source of harm into a product turns a symbol of damage into a symbol of repair. Each purchase carries the story and funds the solution, so customers become participants.\n\n**Proof that cannot be dismissed.** Showing evidence that is unflattering or comes from outside sources makes the transformation credible. People believe the material is what the brand says it is because the brand has not polished the truth.\n\n**An outside creator in their own form.** Handing the story to a respected artist gives it cultural legitimacy. A documentary or play earns a place in culture as genuine work, reaching audiences who would ignore an advert and lending the story depth.\n\n## How the parts interact\n\nThe material provides the substance of the idea; the proof makes it believable; the creator makes it meaningful. The creator's work can document the evidence in an authentic way, showing the process as it really is. The proof gives the creator's work credibility, and the creator's work gives the proof emotional weight.\n\nEach is necessary. Without the material, there would be nothing to prove or tell. Without the proof, the transformation could be seen as a marketing invention. Without the creator, the story would be told by the brand itself, inviting scepticism. Together, they produce a narrative that is concrete, credible and culturally resonant.\n\n## Why it works\n\nIt works because it closes the gap between purpose and action. The brand does not just speak about a harm; it physically transforms its instrument and returns value to those affected. The evidence ensures people believe it, and the creator's work ensures people care.\n\nIt also changes how people relate to the products made from the material. Owning something made from what once caused harm becomes a statement and a contribution. The story travels through culture, the proof stands up to scrutiny, and the communities harmed see real benefit from every sale."}, {"id": "i041", "t": "# The Song That Is Also a Way Out\n\n## The problem\n\nPeople living under someone else's control are the hardest audience any support service will ever try to reach. Their phone may be checked, their browsing history read, their conversations overheard. A poster with a hotline number, an ad that names the problem, or an app with an obvious icon is not help to them; it is evidence. Being seen to look for support can make their situation more dangerous, not less.\n\nThere is a second barrier layered on top of the first. Many of the people most at risk do not have a smartphone with data, the confidence to install and hide a new app, or the money to keep one running. A solution that depends on downloads, accounts or new devices quietly excludes the very people it most needs to reach.\n\nSo the brief is twofold: get a lifeline into the most watched households without it looking like a lifeline, and make that lifeline usable on the most basic phone there is.\n\n## The approach\n\nThe idea is to hide a support service inside a genuine piece of music.\n\nA credible artist releases a real single, written as a story-song in the audience's own genre. On the surface it is simply a good track: it gets played on the radio, it sits in playlists, people hum it in the kitchen. Nobody, including a controlling partner or relative, has any reason to treat it as a campaign. It is just culture, something people choose to hear and share.\n\nInside the song sits the key. The hook, a sung sequence of numbers or a keypad melody, is the access code to a support service built on technology every phone already has: a voice call, an SMS, a missed call. The song teaches the code by repetition, the way any chorus lodges in memory, so a person never needs to write it down, save a contact or search for anything.\n\n## Key mechanisms\n\n**1. Music as the carrier.** Because the message is released as a real single by a real artist, it travels on music's own momentum. It is shared because people like it, not because they have been asked to support a cause. That matters twice over: it reaches far further than a paid message could, and its spread looks entirely innocent. A song playing in a home raises no suspicion.\n\n**2. Invisibility to the controller.** Every touchpoint is designed to stay unreadable to the person doing the watching. The number is heard, not written. Dialling it looks like requesting a song, entering a competition or calling a music line. The first contact can be as small as a missed call, after which the service calls or texts back in a coded way that seems ordinary on the screen. Conversations can be ended instantly and leave no trace that looks like a request for help. The help exists, but it wears a disguise that only the person who needs it can see through.\n\n**3. Built on the most basic technology.** The service runs on SMS, missed calls, the keypad and voice. There is nothing to download, nothing to update, no data to pay for and nothing new to learn. A basic handset is enough. This removes the cost and skill barriers and, importantly, removes another hidden artefact that could be discovered on a device.\n\n## How the parts work together\n\nEach atom solves a weakness in the others. A covert service is useless if nobody knows it exists, and advertising it openly would destroy its cover; the song solves distribution without breaking secrecy. A song alone can raise awareness but cannot offer a safe next step; the hidden service gives the listening a purpose. And a hidden service built on an app would fail the people with the least access; building it on calls and texts makes the disguise work on any phone, in any household.\n\nThe step-by-step journey is simple: hear the song, remember the hook, use the hook on any phone, receive help through a channel that looks like nothing at all.\n\n## Why it works\n\nIt reverses the usual logic of awareness campaigns. Instead of making the problem visible and hoping victims find the courage to act in plain sight, it makes the solution ordinary and lets the person act in private. The song earns its place in people's lives as entertainment first, which gives it reach and cover at the same time. The basic-phone service ensures that when someone finally does reach out, the only thing standing between them and help is a few numbers they already know by heart."}, {"id": "i007", "t": "# Earn the Pour\n\n## Where the brand stands\n\nAn alcohol brand has to promote moderation, and it often faces restrictions on how and where it can advertise. A responsibility message is usually a small line at the bottom of an advert, felt as a compliance requirement rather than part of the brand. And because many drinks are sold in places the brand does not own, it struggles to give people a reason to return to its own venues or app rather than simply buying whatever is on offer.\n\nThe brand needs to make moderation feel like something it owns, to stand out through a sense its rivals have not claimed, and to give people a recurring reason to come back to its places.\n\n## The approach\n\nThe idea is to make a responsible drinking ritual the core of the brand, give that ritual a signature sound, and reward people digitally each time they perform it at the brand's venues or with its products.\n\nThe ritual takes moderation and makes it a mark of quality. Slow pouring becomes the brand's way of serving; a non-alcoholic stand-in in the familiar bottle becomes part of the range; water presented as the brand's own drink becomes part of the occasion. Taking time is framed as how this brand should be enjoyed.\n\nThat ritual is scored. The hiss of opening, the slow pour, the moment of pause are designed as a signature sound that carries the brand wherever it is heard, including in a print ad that seems to play the opening hiss or a melody that marks a completed order.\n\nThe sound then triggers rewards. Each time a person completes the ritual at a venue, or opens a pack with a code, they receive a digital reward: a check-in badge with an in-store perk, a code on the packaging or receipt, entry to a location-locked giveaway, or progress on an app game with a leaderboard. Choosing the non-alcoholic option or the slower pace earns as much as, or more than, anything else.\n\n## Key mechanisms\n\n**Moderation as a branded ritual.** Turning the responsible choice into a signature behaviour means it is no longer a warning but an identity. People who pour slowly or alternate with the stand-in are being loyal to the brand, not merely compliant.\n\n**A signature sound for the ritual.** Sound gives the brand a distinctive presence that competitors rarely own. Because it is attached to the ritual, the sound reminds people of the behaviour as well as the brand. It also works in channels where images are restricted.\n\n**Digital rewards tied to physical visits and purchases.** Badges, codes and leaderboards give people a recurring reason to come to the brand's venues and use its app. Linking these rewards to the ritual turns moderation into a game people want to play.\n\n## How the parts interact\n\nThe ritual provides the behaviour, the sound marks it, and the rewards reinforce it. When the pour happens, the sound plays, and the app recognises the moment, delivering a perk or advancing a score. Over time, the sound itself becomes a cue that a reward is near, strengthening the link between the brand, the behaviour and the place.\n\nThe components address different parts of the brief. The ritual handles the moderation duty. The sound handles distinctiveness and restricted media. The rewards handle repeat visits and app use. Together they make one experience in which drinking responsibly at the brand's places is the most rewarding way to engage with it.\n\n## Why it works\n\nIt works because it aligns incentives. The brand wants loyalty and must promote moderation; the customer wants a good experience and rewards. By making the responsible ritual the route to rewards, both goals are served by the same action.\n\nThe sound gives the idea cohesion and memorability, and it travels beyond the venue to remind people of the ritual. The rewards create a habit loop that keeps people coming back. And because moderation is presented as part of the brand's character, it feels like a choice people make with pride rather than a rule imposed on them."}, {"id": "i028", "t": "# Closing the Magazine That Taught the Wrong Lesson\n\n## The problem\n\nSome harmful norms are not abstract. They are printed, sold and displayed. A magazine that has spent years presenting a demeaning image of a group of people is more than a single bad publication; it is a symbol of an attitude that many readers absorbed as normal. Campaigning against such a norm usually means producing counter-messages that sit next to the thing they oppose, competing for the same attention and rarely winning.\n\nThere is a second problem for any initiative that wants to change a norm: credibility. A campaign that arrives from outside a community, fronted by unfamiliar voices, may be seen as preaching. And a campaign that relies on celebrities risks making the famous people the story rather than the people the cause is meant to serve.\n\n## The approach\n\nThe idea is to act on the harmful norm by taking over its own medium. The initiative acquires the offending magazine and uses its final issue to argue the opposite of everything it previously stood for. Then it closes the title for good. The closure is not a side effect of the campaign; it is the statement.\n\nThat final issue is made with, and distributed through, the people and places that already hold the audience's trust. Grassroots organisations that work on the issue contribute its contents. Local businesses — the shops and venues where the magazine was sold — become the points where the last issue is handed out or displayed. Expert committees vouch for the facts it contains. People's own gatherings become the occasions where it is read and discussed.\n\nWell-known people take part, but each in a defined role that matches their genuine involvement. Someone who has volunteered with the cause for years writes the piece they are qualified to write; an athlete who mentors young people tells their own mentoring story; a list of genuine community leaders, compiled with the grassroots partners, replaces the content the magazine once printed. Fame is borrowed to give the issue reach, but the pages belong to the people the cause serves.\n\n## Key mechanisms\n\n**Taking over the medium.** Instead of producing a rival publication, the initiative uses the existing one against itself. The masthead readers already recognise now carries a message that contradicts its own history. The closing of the title turns a symbol of the problem into the most visible rejection of it. Coverage of the closure becomes coverage of the critique.\n\n**Trusted delivery.** The final issue does not arrive from nowhere. It is shaped by grassroots organisations, endorsed by experts and distributed through local businesses and community gatherings. These channels give the initiative reach into the places where the old norm lived, and legitimacy that a campaign arriving from outside could never build alone.\n\n**Celebrities in their real roles.** Each famous contributor appears only where they genuinely belong: as a volunteer, as an ambassador of a fund they actually support, as a mentor speaking from experience. The issue borrows their visibility without letting them crowd out the community. A list of local leaders keeps ordinary people at the centre of the story.\n\n**The last issue as a gathering object.** Because it is final, the issue has a reason to be kept, passed on and discussed. Community groups can build sessions around it; local shops can display it as the end of an era.\n\n## Why it works\n\nThe approach transforms a norm from something to argue with into something that visibly ends. People do not need to be persuaded that the old content was wrong; they watch the publication that embodied it renounce it and disappear.\n\nEach component protects the others from a typical weakness. The takeover gives the initiative a dramatic, newsworthy act. The trusted partners prevent that act from looking like a stunt, rooting it in the work of people who have been on the issue for years. The carefully cast celebrities extend reach without hijacking the message.\n\nThe result is an initiative in which the symbol of the problem becomes the vehicle for its critique, the community becomes the author of the response, and fame is used only in service of the people the cause exists for. The closure is final, but the conversation it starts — in the shops, the gatherings and the organisations that delivered it — continues."}, {"id": "i042", "t": "# Now Showing: Your Comments\n\n## The harm in plain sight\n\nAbuse and cruelty online are often committed casually. People post a slur, pile onto a stranger, or leave a hurtful comment without thinking of themselves as part of a problem. Campaigns against online harm tend to describe it from the outside, with statistics and pleas for kindness, and those messages are easy to scroll past. The people who most need to hear them are the least likely to stop. The challenge is to make people meet the consequences of their own behaviour, in a way they actively choose to watch and cannot dismiss.\n\n## The approach\n\nPromote the campaign as if it were a major film release, with a trailer, a listing on movie databases, screenings and a star talking about \"their new movie\", so audiences anticipate it as entertainment. The film itself is made from the audience's own online behaviour, confronting viewers with their posts and comments, delivered within the platforms where those comments happen. And the full work is released scarcely: shown only at particular screenings or places, or unlocked through clues, so people have to seek it out.\n\nBy the time viewers realise what they are watching, they are already invested, and what they are watching is themselves.\n\n## Key mechanisms\n\n**1. The machinery of a film release.** The campaign launches with everything a film would have: a trailer that builds intrigue, a database listing, cinema slots, interviews, and a well-known face promoting the project. Audiences process it as entertainment and look forward to it, lowering the defences that normally greet cause messages.\n\n**2. Confrontation inside the platform.** The content of the \"film\" is the audience's own behaviour. Inside the platforms where harm happens, tools reflect users' comments back at them: a bot that rewrites slurs, an app that puts a user's posts on trial, images retouched to obey each abusive comment. Excerpts of these confrontations are woven into the film. People see the damage of everyday posting in a personal and undeniable way.\n\n**3. Scarcity and discovery.** The film is not simply uploaded. It plays at particular screenings or physical spots, travels as a single copy, or is unlocked by finding clues. Its soundtrack might be released the same way. People who want to see or hear it must seek it out, making it an event and generating conversation.\n\n## How the parts connect\n\nThe film release machinery gives the campaign attention and anticipation. The in-platform confrontation gives it its content and its sting. The scarce release turns anticipation into effort and conversation.\n\nTogether, they create a chain: the trailer gets people curious; the scarcity makes them work to see it; and when they do, they find their own online world reflected back at them. Because the confrontation happens both in the film and on the platforms themselves, the message follows people back to where they post. Each person who experiences it is likely to tell others, and the social conversation about the \"film\" brings the issue into public view.\n\n## Why it works\n\n- **Entertainment lowers defences.** People anticipate a film; they do not anticipate a lecture.\n- **Personal confrontation.** Seeing one's own behaviour reflected makes harm impossible to wave away.\n- **Scarcity creates value.** A film you have to find is a film you talk about.\n- **The message travels home.** Delivering the confrontation inside the platforms ensures it reaches people in the moment they might post."}, {"id": "i078", "t": "# Absurdly Earnest, Precisely Targeted: A Comic Programme That Fits Its Audience and Ends on One Achievable Political Act\n\n## Starting point\n\nCause campaigns face two kinds of fatigue. The audience is tired of solemn films that ask for sympathy and offer no outlet, and tired of being told what to care about by organisations that sound like institutions. Even when a campaign moves people, the feeling dissipates because there is nothing specific to do with it. Programmes meant to involve the public often make things worse by asking people to adapt to rigid processes that were never designed with them in mind.\n\nThe reconstructed idea combines a programme built around the specific people it needs, comedy that disarms scepticism through sincere absurdity, and a final call that turns the reaction into one precise political action.\n\n## The approach\n\n**A programme designed for its audience.** The underlying offer, a public programme or recruitment drive connected to the cause, is shaped around the people it must reach. Candidates are filtered through the real skills the work needs; young people are paid as consultants to co-create it; messages are phased by audience; regions receive fixed quotas so participation is distributed fairly.\n\n**A sincere absurdity.** The communication does not plead. It takes an absurd premise and plays it with total seriousness, with the organisation itself as the willing butt of the joke. It might be a solemn genre interrupted by slapstick, or a deadpan parody of a familiar format, for instance an earnest public-information film about a ridiculous bureaucratic obstacle that is uncomfortably close to the real one. Laughter replaces the defensive posture audiences adopt toward campaigns.\n\n**One specific action at the end.** The film concludes with a single, achievable political step: a named bill to support, a petition against a particular law, or a button that takes the viewer's urge to look away and routes it into contacting lawmakers.\n\n## Key mechanisms\n\n- **Comedy lowers resistance.** A claim that would be doubted as a pitch becomes entertainment people choose to share. Self-mockery signals that the organisation is not preaching, which increases trust.\n- **Fit increases conversion.** Because the programme accommodates the people it addresses, those moved to participate find an offer that works for them, rather than discovering that it was not designed for them after all.\n- **A defined endpoint captures the energy.** A single named action prevents the feeling from scattering. It turns diffuse outrage or amusement into measurable pressure on the specific people who decide.\n\n## How the three interact\n\nThe comedy brings in attention and goodwill; the tailored programme gives people a meaningful way to take part; the precise political action gives the whole effort a measurable outcome. The absurd premise can be built from the very obstacle the programme is trying to remove, so the joke explains the problem, the programme demonstrates the solution, and the political action demands that decision-makers make the solution permanent. A viewer who has laughed at the absurdity of the current rule is primed to act against it, and the button or petition is right there.\n\n## Why it works\n\nMost cause communication chooses between being moving and being effective. This approach is engaging because it is funny, credible because it is self-deprecating, inclusive because the programme fits its audience, and effective because it ends with a specific action aimed at the people who can change the rule. The audience is entertained into caring and then given a precise way to make that care count."}, {"id": "i018", "t": "# The Mark That Becomes the Game Piece\n\n## The problem\n\nBrand identities are usually designed to be looked at. A logo, a mascot, a typeface sit on packaging and posters, recognised perhaps, but rarely engaged with. People watch brands; they do not do anything with them.\n\nLaunches suffer from the same passivity. An announcement arrives, the audience is informed, and the moment passes. Nobody participates in finding out.\n\nAnd games built for brands often feel like add-ons: a promotion with a game attached, rather than a game that expresses what the brand is about.\n\n## The approach\n\nIn this idea the brand's own marks become pieces in a game, and the game is released as a trail of clues that leads to a launch.\n\nThe identity is built from something already true of the brand or its place: a logo, a sonic cue, a mascot, a street object. A few anchors are fixed, and the rest is allowed to flex. That flexibility is what allows the marks to break apart and reappear as clues. A fragment of the logo appears in public before any announcement; a sonic cue is heard without explanation; a mascot shows up somewhere unexpected. Each is a hint in a chain across platforms.\n\nFollowing the trail is a game. The product is woven into the gameplay; rewards unlock through skill or knowledge; a playground game might be scaled to a whole city; in-game items might have real-world twins. Fans who play their way through the clues act out the brand idea rather than watching it. The trail resolves in the launch, with a surprise early drop for the core players who got there first.\n\n## Key mechanisms\n\n**Truthful, flexible marks.** Because the identity is derived from something real about the brand or place, each mark is self-explanatory. Because only a few anchors are fixed, the marks can be fragmented, reshaped and scattered without losing recognisability. That is what makes them usable as clues.\n\n**Clues seeded before the announcement.** Fragments of the identity appear across platforms in sequence. People who recognise them begin to connect them, becoming investigators. Anticipation grows before the answer is revealed.\n\n**The trail as gameplay.** Solving the clues is the game. It can be played on a branded platform where the product features in play, in the street as a city-scale version of a playground game, or through items that exist both in the game and in the world. Rewards unlock through skill or knowledge.\n\n**A reveal for those who played.** The trail ends in the launch, and the most committed players receive it first. Their early access becomes one more signal for everyone else.\n\n## Why it works\n\nThe identity system provides recognisable, story-carrying fragments that need no copy, which is exactly what a clue trail requires. The clue trail provides narrative tension and a reason to look for the marks. The game provides the action: fans do something with the brand rather than simply observing it.\n\nEach part also gives the others purpose. The marks gain meaning beyond decoration because they are game pieces. The game gains coherence because every piece belongs to one recognisable identity. The trail gains a destination worth reaching, the launch, and fans arrive at it having already handled, collected and played with the brand they are about to meet."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
