(function () {
  "use strict";
  var DATA = {"pack": "P11", "items": [{"id": "i067", "t": "# Scan It, Save for It\n\n## Problem\n\nChildren and first-time savers see things they want constantly — on shelves, in broadcasts, on packaging — but saving for them feels abstract. The link between the object of desire and the act of putting money aside is missing. Meanwhile, purchase links placed on products tend to push spending, not saving, and they usually have nothing to do with a savings brand's identity.\n\n## Approach\n\nThe idea is a savings brand whose own mark doubles as a scannable link on the very objects young people want. When a child sees something they desire, they scan the mark on its packaging or in the broadcast, and the item is added as a savings goal to a tangible savings object at home that shows the real balance and the progress toward that goal. The identity is derived from something true of the brand, with fixed anchors that make the mark recognisable wherever it appears.\n\n## Key mechanisms\n\n**A mark that carries its meaning.** The brand's logo, sonic cue or mascot is drawn from something already true — for example, the way the savings object displays progress. A few fixed anchors stay constant; everything else flexes, so the mark can sit on many different products and surfaces while remaining recognisable and self-explanatory. Young people learn that this mark always means \"you can save for this\".\n\n**A link on the moment of interest.** The mark is scannable or verifiable. It appears on sample packaging, on receipts, inside a broadcast's own platform, or on barcodes. Scanning it at the moment of interest closes the gap between wanting something and doing something about it — but here, the action is to set a savings goal rather than to spend immediately.\n\n**Saving made tangible.** The savings goal appears on a physical object — a toy that shows the real balance, or savings built into a familiar household item. Progress toward the scanned item is visible every time money is added. Rewards may be paid in a currency young people already want, and learning milestones can unlock further rewards.\n\n## How the elements work together\n\nThe mark connects desire to action; the scannable link makes that connection immediate; the savings object makes the action rewarding. Each piece needs the others. A savings toy without the link would leave the desire behind in the shop. A link without the savings toy would become just another way to spend. A mark that is not recognisable would be ignored on busy packaging.\n\nThe fixed anchors in the identity make the system scalable: any product, retailer or broadcaster can carry the mark, and young savers will recognise it.\n\n## Why it works\n\nChildren save more readily when the goal is specific and the progress is visible. By putting the savings link on the very thing they want, the brand captures the moment when desire is strongest. By turning that desire into a goal on a tangible object, it transforms an abstract habit into a concrete project."}, {"id": "i026", "t": "# Giving Silent Monuments Their Voice Back\n\n## The problem\n\nEfforts to protect endangered heritage increasingly rely on scanning and imaging. Ruins are documented in pixels; archives are photographed page by page. The resulting records are valuable but mute. A visual copy tells you what a place looked like, not what it was like to stand in it. For the public, these archives feel technical and remote.\n\nOn the music side, a release is usually a stream that appears everywhere at once and asks nothing of the listener. There is no journey and no story.\n\nThe opportunity is to make heritage audible, and to make listening to it something people must work for and share.\n\n## The approach\n\nCreate a music project built from the sounds of threatened heritage, positioned as a backup of these places, and released through scarcity: tracks that exist in one copy, are hidden at coordinates or can only be played on location.\n\nThe sound of each place is captured, its reverberation, its weather, its everyday life, even the music read from the cracks in its walls. These recordings form an archive that preserves the place's sonic identity alongside any visual record, so that if it is destroyed it can be rebuilt as it sounded as well as how it looked. Composers turn recordings into tracks, and each track is released only in a form that makes it rare and findable.\n\n## Key mechanisms\n\n**1. Heritage as a backup.** Positioning the project as backing up threatened places, involving ordinary people in capturing them, shifts preservation from loss to resilience. What is destroyed can be rebuilt, and rebuilding becomes a peaceful counter-statement. Where books or works are banned, copies can sit inside the very institutions that removed them, as quiet acts of restoration.\n\n**2. Sound as the missing sense.** Recordings and reactive sound let listeners feel a place from inside. Binaural recordings recreate presence; reactive audio responds to the listener. The archive stops being a visual record and becomes an experience.\n\n**3. Scarcity and discovery.** By making each track rare, a single copy passed between listeners, a song hidden at map coordinates, a track playable only at one spot, a drive left at a concert, the release becomes an event. Fans search, travel and share, and each discovery brings attention to the place the music came from.\n\n## How they work as one\n\nThe backup gives the project its reason; the sound gives it its feeling; scarcity gives it its life. Each track is both a piece of music and a piece of a place's preserved identity. Its rarity means hearing it is an occasion, and its location often means hearing it requires going to the place it preserves. Listeners become, in effect, visitors and custodians at once.\n\nThe sequence: select places at risk; record them as fully as possible; archive the recordings as a backup; compose tracks from them; release each track in a scarce or location-bound way; encourage finders to document and pass on their discovery; keep adding places and tracks.\n\n## Why it works\n\nIt brings presence back to preservation. People struggle to love a scan, but they can fall for a sound, especially one they have travelled to hear or been entrusted to pass on. The scarcity makes the music meaningful, the sound makes the places vivid, and the backup framing makes the whole project an act of defiance against erasure. Every time someone hears a track, a threatened place is, for a moment, fully alive again."}, {"id": "i101", "t": "# The Quiet Billboard\n\n## Why the cause was stuck\n\nSome losses are reported as numbers so large and so often repeated that the public no longer feels them. A figure for lives lost on a particular road, in a particular month, in a particular kind of tragedy passes through the news and disappears. Statistics describe harm; they do not let anyone feel it.\n\nOutdoor and digital media have a related weakness. A poster says the same thing to everyone, at all hours, regardless of what is happening around it. It is easy to walk past because it is not about the moment the viewer is in.\n\nThe task: make an overwhelming number felt as individual absences, at the exact place and moment where the viewer can relate to it.\n\n## The idea\n\nA network of outdoor and digital placements that respond to live conditions around the viewer and use sound to make a statistic personal. When a live trigger occurs nearby (a train arriving, a traffic jam forming, a plane passing overhead) the screen falls silent and shows one name, one face, one empty chair. A directional speaker plays a short recording: the ambient sound of that person's ordinary life, or a silence timed to the number of people lost.\n\nThe placement stops being a fixed message and becomes a moment the viewer is standing inside.\n\n## Key mechanisms\n\n**Live conditions as the trigger.** The media is driven by data from the viewer's own surroundings. If the harm being addressed is linked to roads, the trigger is the traffic ahead. If it concerns commuting, the trigger is the train pulling in. If it concerns air quality, local humidity or pollution becomes the cue. This ties the message to the viewer's exact situation, so it reads as timely and relevant rather than generic.\n\n**One person at a time.** Instead of showing the total, each trigger reveals a single individual: a name, an object, a chair. Over a day, a single screen shows many people, and across a week of placements the total becomes countable in a way the public can meet person by person. A number they have stopped noticing becomes a series of absences they cannot.\n\n**Sound as the missing sense.** Each reveal is accompanied by audio. It may be a binaural recording of the place where that person lived or worked, or the noise of the very street the viewer is standing in, recorded at the moment of a past incident. It may be a pause of silence measured to the scale of the loss. Sound puts the audience inside the subject; it is harder to look away from what you can hear.\n\n## How the mechanisms interact\n\nThe live trigger chooses the moment. The single individual chooses the scale. The sound chooses the sense. Together, they create a short, unrepeatable encounter: the viewer is waiting for a train, the screen goes quiet, they hear something from a life that ended on a platform like this one, and they see a name.\n\nBecause the triggers depend on real conditions, no two encounters are the same, which encourages people to film and share them. Because each reveal is one person, viewers return to see who is next. Because the sound is local, the message feels less like an advert and more like an interruption of the place itself.\n\n## Why it works\n\n- It reclaims attention from a medium people habitually ignore by making that medium responsive to them.\n- It turns abstraction into individuals, which is how people naturally feel loss.\n- It uses silence and sound to cut through visual noise. In a busy street, a sudden quiet is the loudest message possible.\n- It connects the harm to the viewer's own location, so the question shifts from \"how many?\" to \"who, and could it be here?\".\n\nThe result is a statistic the public can no longer stop feeling, delivered where they stand."}, {"id": "i034", "t": "# The Poster Fans Decode Together\n\n## The problem\n\nA show or a brand releases content on a schedule, and between releases the audience drifts. Social channels tend to broadcast announcements rather than take part in the conversation, and print and posters, once the backbone of a launch, are glanced at and forgotten. In a crowded category, the visual style also blends in with everything else, so even good work is hard to tell apart.\n\nThe challenge is to keep people engaged between releases, make the visual identity unmistakable, and give fans something to do rather than just something to see.\n\n## The approach\n\nCreate a series of posters and prints built around one strict visual rule that belongs to the product, design each so its full meaning only appears on a second look, and run the social channels as a live participant in the audience's effort to decode them.\n\nThe visual rule might be a single colour treatment, the only white element in every frame, or a borrowed painterly composition, applied with restraint where competitors shout. Within that rule, each poster hides a second reading: a symbol in negative space, an innocent scene that means something else, an editorial format with a twist. Social channels then join the fans in real time, reacting to theories, replying to individual posts within minutes, and timing reveals to the calendar moments fans already mark.\n\n## Key mechanisms\n\n**1. A single visual rule.** Tying the look to the product makes the image itself do the branding. Anyone who sees the strict palette or composition knows whose work it is, and the restraint sets it apart from category norms.\n\n**2. Meaning that completes on a second look.** A hidden symbol or double reading rewards attention. The viewer's discovery feels like their own, which makes it stick better than any stated message. Each poster becomes a small puzzle worth looking at twice.\n\n**3. Social presence as a live participant.** Instead of posting the solution, the brand joins the hunt: responding to fan theories, nudging the conversation, replying to individuals quickly and celebrating those who crack the hidden meaning. Releasing posters on dates fans already mark gives the community regular moments to gather.\n\n## How they combine\n\nThe visual rule makes each poster instantly recognisable as part of the series. The hidden reading gives each poster a reason to be studied and discussed. The live social presence turns that discussion into a shared event that keeps going between releases. Without the rule, the posters would not cohere; without the hidden meaning, there would be nothing to talk about; without the live participation, the talk would fade.\n\nStep by step: define the visual rule tied to the product; design each poster with a second reading within it; release on calendar moments fans care about; monitor and join the conversation in real time; acknowledge and reward the fans who find the hidden layer; tease the next poster.\n\n## Why it works\n\nIt turns passive viewing into active play and makes the space between releases the most engaging part of the campaign. The distinctive look ensures every piece is credited to the brand, the hidden meanings make fans feel clever, and the brand's live involvement makes them feel heard. Engagement becomes a conversation that the audience leads and the brand joins, and the posters become something people hunt for rather than walk past."}, {"id": "i022", "t": "# Rebuilding Together, One Hidden Track at a Time\n\n## The problem being addressed\n\nWhen heritage is threatened or destroyed, the public usually responds with grief or outrage that fades quickly. Calls to preserve monuments, books or cultural spaces rarely give ordinary people a practical role, and individual contributions disappear into an abstract effort. Meanwhile, music, one of the most powerful carriers of culture, has become so abundant that a new release can be heard by anyone instantly and forgotten just as fast.\n\nThe challenge is to give people an active part in preserving something threatened, make each contribution count visibly, and create a cultural event strong enough to draw them in.\n\n## The approach\n\nThe idea is a preservation effort framed as a backup, built around a music release that can only be found at the places being preserved, with every contribution made visible in one shared public outcome.\n\nPeople are invited to help create a backup of what is at risk: scanning threatened monuments, capturing spaces, or making banned or removed works available again inside the institutions that removed them. The message is that what is destroyed can be rebuilt, and that rebuilding is itself a peaceful counter-statement.\n\nThe music release is the invitation. Tracks are hidden at map coordinates corresponding to threatened sites, or are playable only at those physical spots. A single copy may be passed between listeners, or recordings left at gatherings. To hear the music, people must go to the places in question, and while there, they contribute to the backup.\n\nAll contributions feed into one visible result: a live map of where each person's scan or act landed, a landmark whose appearance changes as the backup grows, or an image showing exactly where your contribution sits within the rebuilt whole.\n\n## Key mechanisms\n\n**Preservation as backup.** Reframing preservation as a backup changes the emotional tone from loss to resilience. It tells people that destruction is not final and gives them a task: help make the copy. Rebuilding becomes a calm, constructive act of defiance.\n\n**Scarce, location-bound music.** By restoring scarcity to music, the release becomes something worth travelling for. Hidden tracks and site-specific playback draw people physically to the threatened places, turning the hunt for music into the route to participation.\n\n**Making remote participation visible as one outcome.** Contributions from many people in many places are brought together publicly. Each participant sees their part in something larger, which keeps them engaged and encourages others to join.\n\n## How the parts interact\n\nThe music provides the pull: people want to find and hear it. The location of the music provides the destination: the threatened site. The backup provides the action: while there, people contribute to preserving it. The visible outcome provides the reward: everyone sees how their contribution fits into the whole.\n\nThe pieces depend on one another. A backup without the music would rely on people already motivated to help. Music without the backup would be a clever treasure hunt with no purpose. Both without the visible outcome would leave contributors unsure their effort mattered. Combined, they create a cycle where discovery leads to contribution, and contribution becomes visible, inspiring more discovery.\n\n## Why it works\n\nIt works because it transforms a passive concern into a shared, rewarding project. People are not asked simply to care about heritage; they are given a reason to go to it, something to do there, and a way to see the result.\n\nThe backup framing gives the effort a hopeful, resilient character, and the visible outcome makes collective action tangible. The scarce music release ensures the effort is talked about as an event in its own right. Together, they turn preservation into a cultural moment that people are proud to have been part of."}, {"id": "i039", "t": "# The Mark That Opens a Shop in Their Venue\n\n## The difficulty\n\nA challenger brand faces a double distance. It is distant from customers physically, because larger rivals and partners control the venues, platforms and broadcasts where people spend time. And it is distant from the sale, because even when someone notices the challenger and feels interested, the path to buying is long enough for interest to fade. Adding to this, a challenger's identity often has to be explained before it can be recognised.\n\nThe task is to appear where the bigger players already have audiences, turn interest into purchase immediately, and be recognised without explanation.\n\n## The concept\n\nThe challenger turns a rival's or partner's channel into its own. It rewards customers who bring its product into a venue that does not sell it, accepts a competitor's product as payment, pays a celebrity in its product, or turns popular hacks into partnerships.\n\nAt every point of contact inside that borrowed channel, it places a scannable or verifiable link to purchase on the exact object or moment of interest: a code on sample packaging, a receipt that prints something useful, a checkout inside a broadcast's own platform, or a barcode that triggers a virtual try-on.\n\nThat code, and everything around it, is part of an identity derived from something already true of the brand. A handful of anchors never change; the rest flexes to fit wherever the brand turns up.\n\n## How it works\n\n**Entering the bigger player's space.** The challenger finds a way to be present where the leader's customers already are. The surprise of seeing the challenger in a venue that does not stock it, or of being able to trade a competitor's product for the challenger's, attracts attention. The leader's reach does the work.\n\n**Collapsing the path to purchase.** In that moment of attention, the challenger offers an immediate way to buy. Because the link sits on the very object that sparked interest, there is no need to remember the brand, search for it or visit another place. Inspiration and purchase become one action.\n\n**Being recognised instantly.** The code and the materials around it carry marks drawn from the brand's own truth. The anchors are constant, so even a small sticker or receipt in a rival's environment is recognisably the challenger's. The flexing parts adapt to each borrowed context without needing copy.\n\n## Interplay\n\nThe borrowed channel creates the moment of interest; the scannable link captures it; the identity makes sure the capture is attributed to the right brand.\n\nWithout the purchase link, a stunt in a rival's channel would generate attention that the rival might ultimately benefit from, or that would simply dissipate. Without the borrowed channel, the purchase link would sit only on the challenger's own materials, reaching only the people the challenger already reaches. Without a derived, self-explanatory identity, the link would look like any other code and might be ignored or mistrusted.\n\nThe identity can also shape the link itself. A code or barcode drawn in the brand's own marks becomes a branded object, recognisable even when encountered in an unfamiliar setting. The flexible system allows it to appear on packaging, receipts, screens or broadcast overlays with the same fixed anchors.\n\n## Why it pays off\n\nIt lets a smaller brand use a larger one's distribution without paying for it, a direct correction of the challenger's main weakness.\n\nIt converts that borrowed attention into sales at the moment of greatest intent, removing the gap that normally causes interest to fade.\n\nAnd it builds the challenger's brand at the same time, because every link, every receipt and every package carries marks that are recognisable, self-explanatory and unmistakably its own. Over time, people begin to notice the challenger's marks wherever the leaders are, and know that a single scan is all it takes to choose the smaller brand instead."}, {"id": "i032", "t": "# Saving for the Shelter\n\n## The problem\n\nBrands that serve pets usually talk to owners, but owners judge care by what it does for the animal. Programmes that teach children about money suffer a parallel issue: savings are abstract and the reward is far away. And any initiative created by a brand alone lacks the reach and legitimacy of the community structures people already trust.\n\n## The approach\n\nThe idea is a programme in which children and first-time savers learn about money through immediate, tangible rewards that directly benefit animals, delivered through trusted local partners such as shelters, schools and community groups, so the pet brand's care for animals is proven in use.\n\nThe pet brand serves the animal rather than the owner: music composed for anxious shelter animals, radio for pets left alone, shelter animals cast in the brand's ads, or demonstrations of shelter animals' intelligence. These acts become the rewards in a savings programme for young people.\n\nChildren learn about money through tangible, immediately rewarding tools: a toy showing the real balance, learning modules that unlock rewards, savings built into a household object, or rewards in a currency they already value. In this case, part of the reward is seeing a direct benefit for an animal they care about.\n\nThe programme is delivered through partners that already hold trust: local businesses, grassroots organisations, expert committees and community gatherings.\n\n## Key mechanisms\n\n**Animal-first care.** By serving the animal directly, the brand proves its care in use. Owners and children see the benefit to animals, not just a claim.\n\n**Immediate, tangible saving.** Turning saving into something visible and rewarding now makes the habit attractive. When the reward includes helping an animal, the motivation becomes emotional as well as practical.\n\n**Trusted delivery.** Shelters, schools and community groups provide reach and legitimacy the brand could not build alone. They host the programme, distribute the tools and make it part of local life.\n\n## How they align\n\nThe animal benefit provides the emotional reward; the saving tool provides the immediate feedback; the partners provide access and trust. A child saves using a toy that shows their balance, unlocks rewards that help shelter animals, and sees those animals benefit through a partner they already know. Each element strengthens the others: the animals give saving meaning, saving gives the brand's care a structure, and partners make it credible and widespread.\n\n## Why it works\n\nChildren care about animals and respond to visible rewards. Communities trust local partners. Owners judge pet brands by how animals benefit. This idea combines these truths into one programme, proving the brand's care through what it does for animals, teaching young people to save through immediate rewards, and delivering it all through partners who make it legitimate."}, {"id": "i131", "t": "# A Truce for Therapy\n\n## The problem\n\nSome conditions are treated with therapies that work but are hard to stick to. Exercises have to be repeated often, they feel like chores, and patients drift away. At the same time, the cause of funding and widening access to those therapies is treated as a niche issue: something for the people directly affected and their families, not for everyone. Messages about it compete with bigger, louder debates and are filed under \"not my problem\".\n\nA challenger brand wants to champion this cause. It has energy but not the reach of the famous rival that dominates its category.\n\n## The approach\n\nThe challenger proposes a public truce to its rival, for the sake of the cause. The two famous competitors are invited to set aside their rivalry for a moment and make one thing together: a way of delivering therapy through something people already enjoy, such as music or a short game. At the same time, the message reframes the condition from a niche concern to a cost everyone shares, so the truce is visibly for all of us, not just for a few.\n\nThe rivalry provides attention, the reframing provides reasons to care, and the therapy delivered through enjoyment provides something real that patients will use.\n\n## Key mechanisms\n\n**1. The truce offer.** The challenger publicly invites the rival to collaborate for a day or a single shared product. The offer is specific: a joint creation, a meeting point, a date. If the rival accepts, the image of two competitors cooperating is irresistible to news and social media. If the rival declines, the challenger invites others in the category and goes ahead, looking generous while the rival looks petty. Either answer advances the cause.\n\n**2. Therapy inside something people enjoy.** What the truce produces is not a donation but a usable tool: a therapy built into a pastime patients already choose. It might be songs carrying a therapeutic element on a familiar music service, sing-along playlists that work as speech practice, a rhythm on a device people already wear, or short games for a parent and child to play together. The treatment becomes a pleasure people return to rather than a regime they endure, which is exactly what adherence needs.\n\n**3. The issue as everyone's cost.** The campaign's framing shifts who feels responsible. Instead of a niche condition, it is presented as a cost the whole public bears, through lost potential, what is taken away when support is cut, or by comparison with an issue people already rank as serious. Groups who have felt outside the issue are addressed as part of the solution. This widens support and avoids entrenched argument about whose job it is.\n\n## How the elements interlock\n\nThe truce supplies spectacle, which the cause alone could not generate. But spectacle without substance would be read as a publicity stunt, so the jointly made therapy gives the truce a concrete output people can use and judge. The reframing ties both to the public interest: if the issue is everyone's cost, then rivals working together for it seems not just noble but sensible, and refusing seems hard to justify.\n\nThere is also a neat fit between the truce and the therapy. Rivalries in consumer culture are fought over things people enjoy, and the therapy lives in exactly that territory of enjoyment. The competitors' everyday battlefield becomes the place where treatment happens.\n\n## Why it works\n\n- **Borrowed fame.** A well-known rivalry is a ready-made story. Proposing peace turns that fame into reach for a cause no single brand could amplify alone.\n- **A win either way.** The structure of the offer guarantees a positive outcome for the challenger whether the rival says yes or no.\n- **Adherence through pleasure.** Delivering therapy through enjoyment solves the practical problem that keeps treatments from working.\n- **A wider circle of concern.** Framing the issue as a shared cost recruits people who would never have thought of it as theirs, and it bypasses polarised debate.\n- **Credible generosity.** Because the output is a real tool patients use, the challenger's generosity is proven, not just announced."}, {"id": "i080", "t": "# A Doll That Learns, A Parent Who Teaches\n\n## Problem\n\nChildren do not pick up protective habits from instructions. They pick them up from what they see adults do and from what they practise in play. A parent who skips a protective routine teaches the child to skip it too, however many times the child is told otherwise. And the risks involved are often invisible: you cannot see sun damage happening, or a symptom building, until it is too late.\n\nThere is a growing interest in using smart technology to address such risks, but parents are rightly cautious. A device that claims to detect danger must be accurate, or it becomes another source of false reassurance.\n\n## Approach\n\nCreate a smart toy for children that makes an invisible risk visible, such as a doll whose skin reddens in the sun until it is protected, and back it with a carefully validated detection system so parents can trust what it shows. Design the experience so that it teaches the adult as much as the child: the toy is cared for together, and the parent is the first one modelling the routine.\n\n## Key mechanisms\n\n### Making the invisible visible through care\n\nThe child is given responsibility for a toy that shows the harm the child cannot see on themselves. A doll that reddens under strong sun, or a ride-on car that takes them to a treatment room and logs their symptoms along the way, turns a protective routine into an act of caring for something else. The child protects the toy first, then, having learned the steps, accepts the routine for themselves.\n\n### Checks that make the technology credible\n\nThe toy's sensing system must be right. Before launch, feasibility is tested against real conditions. Thresholds are set with expert guidance rather than left solely to an algorithm. A human review process checks the classifier's decisions. Large-scale perception tests confirm that children and parents read the toy's signals the way they are intended. These checks are communicated openly, so the parents who must rely on the toy understand why it can be trusted.\n\n### Aiming at the people who model the habit\n\nBecause habits are learned by copying, the campaign speaks first to parents. The toy comes with a shared routine: when the doll needs protection, the parent protects themselves and the child at the same moment. Communication shows adults that their own behaviour is the lesson. Rather than blaming families for children's risky habits, it gives parents a tool that makes them the role model.\n\n## How the pieces connect\n\nThe toy gives the routine a form a child enjoys. The validation gives the toy the credibility a parent requires. The modelling strategy gives both a social direction: the routine passes from parent to child, through a shared object, rather than through a lecture.\n\nWithout accurate technology, the toy would teach the wrong lessons. Without the play element, accurate technology would be ignored by children. Without the parent at the centre, the child might protect the doll but still copy the adult who never protects themselves.\n\n## Why it works\n\n- **It shows what cannot be seen.** Visible reddening or a logged symptom is a concrete, unarguable signal.\n- **It teaches through nurture.** Children learn routines faster by caring for something else first.\n- **It earns trust.** Visible checks and expert curation answer the parent's reasonable doubt about smart devices.\n- **It changes the source.** By involving parents as the first practitioners, it alters the norm at the point where it is passed on.\n\nA small toy becomes a family habit, and a habit learned in play becomes one the child keeps."}, {"id": "i137", "t": "# Walking Through the Day It Happened\n\n## The problem\n\nHistoric events are usually handed to people as summaries: a date, a photograph, a paragraph in a textbook. For anyone who was not alive at the time, the event is finished before they meet it. They know how it ends, they see it from above, and they experience it through the eye alone. The result is respect without feeling. A brand that wants to mark an anniversary faces the same trap: a commemorative film or a heritage post tells people that something mattered, but it does not let them feel why.\n\nThe challenge, then, is to move an audience from reading about a past event to living through it, and to do so in a way that feels personal rather than staged.\n\n## The approach\n\nThe idea is to re-run the historic event in real time on its anniversary, as a location-based audio game played on the phone in the player's own streets.\n\nOn the anniversary, the event restarts at the hour it originally began. The account unfolds as it did then, minute by minute, through formats the audience already uses: a feed of updates, text messages from a participant, calendar alerts marking what happens next. The player does not watch from a distance. The phone's GPS and motion sensors map the event onto the player's real surroundings, so the route a participant took becomes a route through the player's own neighbourhood, and the player's movements become the movements of the story. Running, waiting, turning a corner or holding the phone still each has meaning inside the account.\n\nOver this sits sound. Recorded and reactive audio, delivered in binaural form through headphones, places the player inside the scene: the noise around a participant, the weather of the day, the ambience of a place captured in a famous image. The audio responds to where the player is and what they do, so the event is heard as if it were happening around them.\n\n## Key mechanisms\n\n**Real-time replay on the anniversary.** The event is not compressed into a highlight reel. It runs at its own pace, on its own date, and it can be interrupted by the player's everyday life exactly as it would have interrupted a participant's day. Delivering it through a feed, messages and calendar entries means the player meets the event in channels that already feel live and personal. Not knowing what the next message will say restores the uncertainty that summaries remove.\n\n**The player's own streets as the board.** GPS and motion sensing turn familiar places into the setting. A street the player walks every day becomes the street where something happened. This is what makes the experience personal: the event is no longer \"over there and back then\", it is laid across places the player knows. Physical actions, such as moving to a new point or swinging the phone to respond, make participation bodily rather than passive.\n\n**Sound as the missing sense.** History usually reaches people as text and still images. Recorded and reactive sound adds what those formats lack. Binaural audio can open up a famous photograph so that the player stands inside it; recorded ambience can make a distant place present on a local pavement. Because the audio reacts to position and movement, the player's surroundings and the event's soundscape merge.\n\n## How the parts interact\n\nEach component solves a different part of the distance problem. The real-time replay closes the distance in time: the event happens now, on its day. The GPS game closes the distance in place: it happens here, on the player's street. The sound closes the distance of the senses: it is heard, not only read. Separately, each would be a clever format. Together, they produce a single experience in which the player is, for a few hours, a participant.\n\nThe interaction is also practical. The feed and messages carry the narrative structure; the location layer decides where the player needs to be when the next part arrives; the audio fills each location with the atmosphere of the original moment. A message arrives, the player walks to the next point, and on arrival the sound of the scene opens up around them.\n\n## Why it works\n\nIt works because it replaces explanation with experience. People who were not alive at the time cannot remember the event, but they can live a version of it, in real time, in their own surroundings, with their own ears. The anniversary gives the brand a natural, earned reason to stage it, and the familiar formats lower the barrier to taking part.\n\nIt also leaves something behind. A player who has heard the event unfold on their own street will not walk that street the same way again. The commemoration stops being a message the brand sends and becomes a memory the player owns, which is the strongest way for a brand to be associated with a moment that matters."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> press <b>Send my scores</b>. There is also a short code and a CSV file as a back-up.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Press the button to send your scores. Nothing else is needed.</p>' +
      '<div class="row"><button id="snd">Send my scores</button><span id="m3" class="note"></span></div>' +
      '<p class="note">Back-up, only if the button fails: download the CSV or copy the code and send it to the person who sent you this file.</p>' +
      '<div class="row"><button id="dl" class="ghost">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSdmbZSBNd5jX7mgj_9_gqyzCgbGvbd-bsZmhktpkxr2GAxOLg/formResponse";
    function send() {
      $("#m3").textContent = "Sending...";
      var b = new URLSearchParams(); b.set("entry.34266590", code);
      fetch(FORM, { method: "POST", mode: "no-cors", body: b }).then(function () { $("#m3").textContent = "Sent. Thank you. You can close this page."; }, function () { $("#m3").textContent = "Could not send. Please use the back-up below."; });
    }
    $("#snd").addEventListener("click", send);
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
