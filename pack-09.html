  "use strict";
  var DATA = {"pack": "P09", "items": [{"id": "i019", "t": "# The Recurring Hero Who Shows Up in Someone Else's House\n\n## The problem\n\nA challenger brand is up against bigger players with larger budgets, wider distribution and more famous partners. Every campaign it runs starts from zero, because it cannot afford the sustained weight that builds meaning over years. Meanwhile, its sponsored content with creators often reads as an ad that their followers tune out.\n\nThe challenge is to build lasting brand meaning on a small budget, borrow the reach of larger players, and make creator content feel native rather than bought.\n\n## The approach\n\nBuild the brand's communication on one repeatable frame, a recurring hero or a simple rule that can be replayed in endless episodes, and deploy that frame inside rivals' and partners' channels, with each episode made by creators who bring their own world and voice to it.\n\nThe frame might be a character, a fixed template or a myth with one rule: wherever the brand's product appears, something particular happens. Each new episode lands the product somewhere it is not officially sold or supported, in a venue that stocks a competitor, in a popular hack people already use, in a celebrity's life paid for in the product. Creators pitch their own episodes, matched to products their communities already buy and chosen for shared passions rather than reach.\n\n## Key mechanisms\n\n**1. A repeatable frame.** A recurring hero, a fixed template, a simple myth or a returning cast lets each execution add an episode rather than start again. Audiences recognise familiar elements and look forward to the next instalment, and the brand accumulates meaning over time without having to outspend anyone.\n\n**2. Turning bigger players' channels into the brand's own.** Each episode places the brand inside someone else's reach: rewarding customers who bring it into a venue that does not sell it, accepting a competitor's product as payment, paying a celebrity in the product, turning popular hacks into partnerships. The larger player's fame or footfall ends up working for the challenger.\n\n**3. Creators who bring their own world.** Each creator contributes an episode in their own style, pitched by them, aligned with what their community already buys and loves. Because the frame is simple, it can carry very different voices while staying recognisable, and the content feels like the creator's own work rather than an insertion.\n\n## How they fit together\n\nThe frame provides consistency; the hijacked channels provide reach; the creators provide authenticity and variety. The recurring hero shows up in a rival's venue, a creator films it in their own voice, their audience shares it, and the next episode arrives somewhere else. The frame is what links scattered executions into one growing story; the borrowed channels are what make each episode visible beyond the brand's budget; the creators are what make each episode worth watching.\n\nStep by step: define the frame and its one rule; identify channels and venues of bigger players where the hero can appear; open the frame to creators to pitch their own episodes; release episodes in sequence; let fans anticipate where the hero will turn up next.\n\n## Why it works\n\nIt solves the challenger's core constraint, a lack of scale, by combining three forms of leverage. The frame compounds meaning over time, so each modest execution adds to everything before it. Rivals' and partners' channels provide distribution the brand could not buy. Creators supply credibility the brand could not fake. The result is a story that grows episode by episode, carried by other people's reach and other people's voices, while always remaining unmistakably the challenger's own."}, {"id": "i093", "t": "# An Album Recorded From Places That Might Not Survive\n\n## The problem\n\nHeritage under threat is usually communicated in pictures: a facade before and after, a ruin on the news, a plea to save something far away. Audiences have seen so many of these images that they barely register. Worse, the images frame loss as final. Once a monument is destroyed, the story ends, and the people who wanted it gone have, in effect, won.\n\nMusic has its own version of the same fatigue. Releases are endless, instant and weightless; a new track arrives, is skimmed and forgotten. Nothing about a digital file asks the listener to go anywhere, do anything or care.\n\nThe opportunity is to solve both at once: give endangered places a presence people can actually feel, and give a music release enough weight that people will travel for it.\n\n## The approach\n\nTreat threatened heritage the way an engineer treats important data: back it up. But instead of only scanning walls and arches into a visual archive, record how these places sound. The echo of a dome, the wind across a courtyard, the resonance of a stone floor, the faint music that can be read from the cracks in an old wall. These recordings become the raw material for an album composed from the places themselves.\n\nThe album is then released in a way that restores scarcity. Each track can only be played at the physical spot it was recorded, or exists as a single copy that must be passed between listeners. To hear the song of a place, you have to go there, or be handed it by someone who did.\n\n## Key mechanisms\n\n**1. Preservation reframed as backup.** Ordinary people, not only specialists, help capture these sites, adding their recordings to a shared archive. The framing is crucial: what is backed up can be rebuilt. If a place is damaged, its sound survives, and recreating it becomes a peaceful counter-statement rather than an act of mourning.\n\n**2. Sound as the missing sense.** A photograph shows a monument; a binaural recording puts you inside it. By using recorded and reactive sound, the work adds a sense that images cannot supply. Listeners do not look at heritage from outside; they stand in it, hear its scale and feel its absence if it falls silent.\n\n**3. Scarcity and discovery in the release.** Locking tracks to coordinates, or circulating a single copy hand to hand, turns an abundant file into an event. Fans seek the tracks out, share the journey and document it. The act of finding the music becomes a pilgrimage to the very places the project is protecting.\n\n## How it fits together\n\nEach part gives the others meaning. The backup idea explains why the recordings exist: they are an archive against destruction. Sound explains why the archive is moving: it lets people feel a place rather than file it away. Scarcity explains why people engage: the release demands a journey, and the journey brings attention, visitors and storytelling back to the threatened site.\n\nIn practice the sequence runs like this. Sites at risk are identified. Volunteers and musicians record them, from room tone to the sound read from their surfaces. Composers build tracks from those recordings. Each track is anchored to its place, playable only there or carried as a lone copy. Every visit and every handover adds to the shared archive and to public awareness.\n\n## Why it works\n\nIt turns a story of loss into a story of keeping. Instead of asking audiences to grieve for buildings they have never seen, it invites them to hold a piece of those buildings in their ears and to go and find the rest. The scarcity gives the music value; the sound gives the heritage presence; the backup framing gives the whole project defiance. Destruction is no longer the end of the story, because the place has already been copied somewhere it cannot be reached."}, {"id": "i082", "t": "# The Last Issue for Shelter Dogs\n\n## Context and problem\n\nPet brands typically advertise to owners: the person who buys, not the animal who eats, plays or waits at home. That makes their claims of care easy to make and hard to prove. At the same time, a harmful norm surrounds animals in the wider culture: media that treats certain animals as disposable, ugly, or unadoptable, shaping how people see shelter animals long before they ever visit a shelter.\n\nAnd like many categories, pet care advertising tends to start from zero every season. Each campaign introduces a new concept, so the brand never accumulates meaning.\n\nThe problem: prove care through the animals themselves, confront the norm that keeps shelter animals overlooked, and do it in a format that can grow over years.\n\n## The approach\n\nThe brand builds a long-running platform with one simple rule: everything it makes is for the animal, not the owner. Each year brings a new episode under the same frame and with a returning hero, a real shelter dog cast as the face of the brand.\n\nThe opening episode acts on the harmful norm directly. The brand takes over a publication or medium that has long represented animals as products, accessories or rejects, and uses it to publish one final issue that argues the opposite: a celebration of shelter animals, made for them, featuring them. Then the medium closes. The closure is the statement.\n\n## The mechanisms\n\n### Serving the animal, visibly\n\nEach execution is something an animal actually uses. Music composed to calm anxious shelter cats. A radio station for dogs left home alone. Shelter dogs taught a remarkable skill, such as driving, to demonstrate their intelligence and dismantle the idea that they are lesser. The care is proven in use, and the owner watches it work.\n\n### Taking over the medium of the problem\n\nRather than buying space next to a harmful norm, the brand acquires the medium itself and turns it into the vehicle for its critique. The final issue does not shout; it simply replaces what the medium used to say with its opposite, then ends. The symbol of the problem becomes the proof that it can be undone.\n\n### A repeatable frame\n\nThe campaign is structured like a series. The same rule (made for the animal), the same returning hero, the same visual template. Each new execution (the music, the radio, the driving lesson, the final issue) is an episode in one story. Audiences recognise the familiar elements, look forward to the next instalment, and the brand builds meaning cumulatively.\n\n## How it fits together\n\nThe final-issue act gives the platform a dramatic opening and a clear enemy: the norm that sees shelter animals as unwanted. The animal-first rule gives every later episode a test it must pass, and keeps the brand's actions concrete rather than rhetorical. The repeatable frame lets the brand return to the same hero and the same promise, so that each year's work adds proof to the last.\n\nThe returning shelter dog matters especially. As the hero ages and the audience follows the story, the brand's claim of care becomes a relationship the public has watched unfold.\n\n## Why it works\n\n- **Proof over promise.** Owners believe what they see their animals respond to.\n- **Action over commentary.** Closing a harmful medium is more powerful than criticising it.\n- **Accumulation over reinvention.** A recurring frame turns individual stunts into a body of work that compounds over years.\n- **Animals as heroes, not props.** Real shelter animals carry the story, which reframes them in culture and drives adoption as a by-product of the brand's care.\n\nThe brand stops being a supplier to owners and becomes the one that consistently takes the animal's side."}, {"id": "i115", "t": "# The Price of Being Somewhere\n\n## Problem\n\nPlaces that market themselves to travellers tend to show scenery: landscapes, landmarks and empty streets. The people who actually live there disappear, and with them the reason to visit as a guest rather than a spectator. At the same time, much of what tells a place's real story, the reporting, photography and investigation, is expected to be free, even though producing it involves risk, persistence and sometimes great personal cost. And causes connected to a place often struggle to give supporters a role beyond donating.\n\nThe task is to present a place as a living home, to justify paying for the true stories behind it, and to make supporters feel they are part of keeping those stories alive.\n\n## Approach\n\nThe idea is to market a place through the people who live there and the stories set there, to make the case for paying for those stories by showing what it takes to tell them, and to cast the people who pay as the heroes who keep the place's voice going.\n\nThe place is shown through its residents: locals as the cast, hosts from under-represented communities, residents welcoming visitors, the city's own creative trade. Travellers are given people to visit, not just sights to see.\n\nThe stories about the place, told by those who report and photograph it, are presented together with what lies behind them: months of investigation, risks taken, the frames that came before the published picture. A line that reads two ways connects the buyer's payment to the storyteller's sacrifice.\n\nSupporters who pay are given an identity. They join a named group, they stand alongside community leaders already doing the work, and their voices, from families to researchers, appear with those of the people they help. Supporting the stories becomes an act of solidarity with the place and its people.\n\n## Key mechanisms\n\n**Marketing a place through its people.** By making residents the centre, the place becomes a home with hosts. Visitors are invited to meet people, which builds deeper engagement and gives under-represented communities visibility.\n\n**Justifying payment through the cost of production.** Showing the risk and persistence behind stories makes their value visible. The double-reading line links the reader's small payment to the storyteller's large sacrifice, turning a transaction into a recognition.\n\n**Casting supporters as heroes.** A named group and shared stories give supporters an identity to act from. They become part of the place's community rather than distant donors. The real people of the place stay at the centre, with supporters beside them.\n\n## How the parts interact\n\nThe residents give the place its human face and its stories. The storytellers capture those stories, at a cost the audience now understands. The supporters fund the storytelling and, in doing so, join the community depicted. Each relationship reinforces the others: travellers who meet residents care more about their stories; readers who understand what stories cost are more willing to pay; payers who are welcomed into a named community stay engaged and may travel to meet the people they have read about.\n\nWithout residents at the centre, the stories would be about scenery. Without the case for paying, the stories would be consumed and forgotten. Without supporters cast as heroes, payment would remain a cold exchange.\n\n## Why it works\n\nIt works because it connects three groups who usually remain separate: the people of a place, the people who tell its stories, and the people who read and visit. By showing each group's role and cost, it creates mutual respect and a reason to support one another.\n\nThe idea also gives the place a richer identity. It is no longer just a destination; it is a community with voices worth paying for and people worth meeting. Travellers arrive as guests, readers become patrons, and residents remain the heart of the story."}, {"id": "i024", "t": "# The Medium Is the Indictment\n\n## Problem\n\nA cause campaign is fighting a harmful norm and a crisis that the public has grown used to. Conventional advertising about either struggles: messages about the crisis are lost in a stream of similar messages, and criticism of a harmful norm can be shrugged off as one opinion among many. Most of the time the issue competes with everything else for attention, and nothing about the moment the message appears gives it extra weight.\n\n## Approach\n\nThe campaign takes over the very things that symbolise the problem and uses them as its medium, and it times the action to a calendar moment already dedicated to the issue.\n\nWhere the crisis has a clear physical symbol, the campaign builds with it. Protest messages are printed on the symbol itself; posters are constructed from it; pieces of it are sent to the people affected. Messages printed on worthless hyperinflated banknotes, posters built from them, or shredded notes mailed to borrowers are the kind of material meant here. The medium is the proof of the problem.\n\nWhere a harmful norm has its own channel, the campaign takes that channel over. The model is acquiring an outlet that embodies the norm, such as a sexist magazine, publishing a final issue that argues the opposite, and then closing it. The closure is the statement.\n\nThese actions are launched on a date the public already associates with the issue: an awareness day or month, a national day, or a less crowded adjacent date. The public's attention is already pointed in the right direction, and the date adds symbolic weight.\n\n## Key mechanisms\n\n**The crisis symbol as the medium.** Using the clearest symbol of a crisis as the material of the campaign turns the opponent's failure against it. People do not need to be told the crisis is real; they are holding it.\n\n**Taking over the norm's medium.** Seizing the channel through which a harmful norm spreads, then using it to argue against the norm and shutting it down, makes the symbol of the problem into the vehicle for the critique. The action is the message.\n\n**Calendar timing.** An awareness day or national moment already concentrates attention on the issue. Launching on it lets that attention carry the campaign and gives the gesture meaning it would not have on an ordinary day. An adjacent, quieter date can offer the same symbolism with less competition.\n\n## How they work together\n\nBoth medium-based mechanisms rely on the same principle: the problem's own artefacts are turned into the case against it. One works with a symbol of crisis, the other with the channel of a harmful norm. Combined, they let the campaign attack the issue on two fronts, showing its consequences in material form and dismantling one of the channels that sustains it.\n\nThe calendar moment ties these gestures together and amplifies them. A final issue of a norm-spreading publication released on the day dedicated to the issue becomes news, and posters built from the crisis symbol displayed on a national day take on the gravity of the date. The timing ensures that these acts are not seen as isolated stunts but as part of a public conversation that is already happening.\n\n## Why it works\n\nArguments can be debated, but objects and actions are harder to dismiss. This campaign makes the crisis tangible through its own symbol, makes the critique undeniable by using and closing the norm's own medium, and lets a dedicated date provide attention and meaning. Opponents are confronted with their own failures in material form, and the public sees the problem's symbols turned into the most persuasive possible argument against it."}, {"id": "i092", "t": "# What the Children Are Watching\n\n## The underlying problem\n\nMany social problems are treated as individual failings. Campaigns address the person who behaves badly, or the person who struggles, and often end up blaming them. Yet a great deal of behaviour is learned: children copy parents, adolescents imitate role models, and stigma teaches people to hide what they need. Targeting individuals ignores the chain through which the problem is passed on.\n\nAt the same time, those who need help, including help to change their behaviour, often avoid it because it feels like a burden. And campaigns that sit on fixed billboards speak to no one in particular and are easily ignored.\n\n## The approach\n\nThe idea is to aim a campaign at the people who model a behaviour, using media that respond to live conditions where they stand, and to offer them help in the form of an everyday activity they already enjoy.\n\nThe campaign starts by tracing how the problem is passed on: which moments, which relationships, which role models teach it. It addresses those who model the behaviour, parents in front of their children or the figures adolescents look up to, rather than the people who end up imitating it.\n\nOutdoor and digital placements are connected to live local conditions so that they appear at the moment and place where modelling happens: when a parent is at a crossing with a child, in a waiting room, near a school, or at a time of day when families are together. The message speaks to the viewer about what is happening around them right now.\n\nThe support offered is delivered through something people already use and enjoy. Following the pattern of music on a familiar app, sing-along playlists, a smartwatch tool or short parent-child game sessions, the help becomes an activity families choose rather than a programme they must endure.\n\n## Key mechanisms\n\n**Targeting the models of behaviour.** Changing the behaviour of those who are copied changes what is learned. The campaign shifts the norm instead of blaming those who have absorbed it. It also invites the models to see themselves as part of the solution.\n\n**Live, local media.** Placements that react to the viewer's immediate surroundings feel timely and relevant. A message that appears where and when modelling happens is more likely to be noticed and acted on than a generic message seen out of context.\n\n**Help through enjoyment.** Delivering support through music, games or devices people already use removes the stigma and effort of seeking help. Short shared sessions between parent and child, for example, can become a routine both enjoy, and through which better behaviour is practised together.\n\n## How the parts interact\n\nThe insight about learned behaviour decides who the campaign speaks to and when. The live media find those people at the right moment, in the right place. The enjoyable format gives them something to do immediately, in a way that brings the child or the follower into the activity too.\n\nThe pieces depend on each other. Without the insight, the campaign would aim at the wrong people. Without the live media, the message would arrive at the wrong time. Without the enjoyable format, people reached at the right moment would have nothing appealing to act on. Together they turn a moment of modelling into a moment of practising something better.\n\n## Why it works\n\nIt works because it acts on the mechanism of the problem rather than its symptoms. By reaching the people whose behaviour is copied, at the moments when it is copied, and giving them an enjoyable alternative to share, the campaign changes what is passed on.\n\nIt also avoids blame. Parents and role models are addressed as people who can help, not as culprits. The help feels like play or music rather than treatment, which makes it easier to accept. And the live, local nature of the media makes the campaign feel personal and relevant, so it is noticed where it matters most."}, {"id": "i120", "t": "# Hear Where You Are: A Sound Game for Threatened Places\n\n## The problem\n\nHeritage campaigns usually ask people to look: at photographs of damage, at scans of ruins, at images of something far away. Looking is easy and so is forgetting. Even when heritage is close by, people walk past it every day without noticing it, and threats to it only register when it is too late.\n\nThe challenge is to make people notice, feel and act on behalf of the places around them before they are lost.\n\n## The approach\n\nBuild a location-based game that uses the phone's GPS and motion sensors to turn the player's own surroundings into the game board, in which the player's task is to capture and back up the sound of local heritage, and the reward is hearing those places come alive.\n\nAs players move through their streets, the game guides them to buildings, squares and monuments. At each site they record its acoustics and ambient life, or move the phone through the space to trigger reactive sound that reveals its character: the echo of a hall, the wind through a gateway, a composition read from the cracks of an old wall. Every capture is added to a shared archive, a backup from which the site's presence, and potentially its fabric, could be rebuilt if it were damaged.\n\n## Key mechanisms\n\n**1. Sound as the missing sense.** Recorded and reactive sound makes a place felt rather than seen. Binaural capture puts the listener inside a space; reactive audio responds to movement, so walking through a site becomes like playing an instrument. This adds a sense that images cannot, and puts the player inside the subject.\n\n**2. The player's surroundings as the board.** GPS and motion sensors make the game happen in the streets the player knows. A journey becomes a level, a swing of the phone captures a space. Because it is played locally, the experience feels personal, and every point scored corresponds to a real place nearby.\n\n**3. Heritage as backup.** Framing the recordings as a backup, made by ordinary people, means that what is destroyed can be rebuilt. If a site is lost, its archived sound and form can guide its reconstruction, and that rebuilding becomes a peaceful counter-statement rather than an elegy.\n\n## How they work together\n\nThe game supplies the motivation and the movement; sound supplies the emotional payoff; the backup supplies the purpose. Players go out because it is a game in their own neighbourhood. They stay because hearing a familiar building as they have never heard it is genuinely surprising. And they contribute because each recording becomes part of a record that protects the place.\n\nStep by step: open the game, see nearby heritage as objectives, walk there, move through the space to capture and unlock its sound, listen to what it reveals, add the recording to the archive, see the map of your area fill in, share the sounds with others.\n\n## Why it works\n\nIt retrains attention. Places people pass every day become places they have listened to closely, and listening creates attachment in a way that looking rarely does. The game mechanic makes this attention habitual and social, while the backup framing gives every session a quiet significance. Over time, a community builds a living sound map of what it values, and if something is threatened, it already has both the archive to rebuild it and the emotional connection to defend it."}, {"id": "i017", "t": "# The Billboard That Sees the Danger Coming\n\n## The brief behind the idea\n\nBrands that protect people, insurers and safety organisations, are usually present only after something goes wrong. They pay for the damage, and their advertising tells people to be careful. Neither approach makes people want protection: claims are associated with loss, and warnings sound like lectures. These brands own enormous assets, data, research, vehicles and claims operations, that could prevent harm, yet those assets mostly sit behind the scenes.\n\nThe task is to move such a brand from paying for harm to preventing it, prove that purpose through something people can use, and do it without lecturing.\n\n## The approach\n\nTurn the brand's own knowledge of risk into live outdoor and digital media that intervene at the exact moment and place of danger. Using data the brand already owns, for example where incidents tend to happen and under what conditions, signs and screens respond to live conditions around the viewer: weather, traffic, time of day, what is approaching. When risk rises, the media tell a short, dramatic story about what could happen right there, right now, and suggest the protective step.\n\nThe billboard stops being an advert and becomes a piece of safety infrastructure.\n\n## Key mechanisms\n\n### From payment to prevention\nThe brand redeploys what it already owns, its data on where and when harm happens, its research and its operational know-how, as a tool that intervenes at the moment of risk. Instead of only paying after the fact, it helps stop the incident. Its purpose is proven by something people can see and use.\n\n### Media driven by live conditions\nOutdoor and digital placements respond to real-time conditions in the viewer's surroundings: the weather, the traffic jam ahead, the approaching train, the time of day. A fixed placement becomes timely and useful, speaking directly to the situation the viewer is in.\n\n### Risk dramatised as story\nWhen the media trigger, they do not simply warn. They tell a brief, gripping story: a near miss played for suspense, a chain of unlikely events, an ordinary moment that nearly went wrong. The risk becomes something the audience feels. People want protection because the story made the danger real, not because they were told to be careful.\n\n## How the parts interact\n\nThe brand's data provides the intelligence: knowing where and when risk is highest. The live media provide the delivery: reaching people exactly when that risk is present. The dramatic story provides the emotional trigger: making people care in that moment.\n\nEach would fall short alone. Data in a report helps nobody on the street. Live media without real insight would be gimmicky. Dramatic stories shown at random would be entertainment. Together, they create a system where the brand anticipates danger, alerts people with a story that grips them, and helps them avoid harm.\n\nThe result is also measurable. Because the brand already tracks incidents, it can compare what happens where the system runs with what happened before, turning prevention into evidence of purpose.\n\n## Why it works\n\n- **Purpose proven by use.** Preventing harm is more credible than promising to pay for it.\n- **Right message, right moment.** Live conditions make the message relevant and useful rather than generic.\n- **Story over lecture.** Feeling the risk makes people want protection, without the brand sounding preachy.\n- **Assets put to work.** The brand uses what it already owns, so the idea is both authentic and hard for rivals to copy."}, {"id": "i070", "t": "# The Grassroots Film the Product Shot\n\n## The problem\n\nSports sponsorship has a visibility problem disguised as a visibility solution. Brands buy logo space on kits, boards and broadcast overlays, yet fans experience those logos as the edges of the sport, not part of it. At the same time, product films about technical capability look much the same as one another: polished footage, a voiceover listing features, and claims viewers have learned to tune out.\n\nThe challenge is to make a sponsor feel like part of its sport's community and, in the same act, prove what its product can do without relying on copy.\n\n## The approach\n\nThe brand turns its sponsorship budget away from the stadium and towards the people and places that sustain the sport: the grassroots pitches, the overlooked athletes, the home city, the ceremony objects that the sport needs and the brand can craft. It then documents that work in a film made entirely with its own product. The product is the means by which the advertising is made: if it has cameras, the film is shot only through those cameras; if it is software, the work is itself a file in the software's format; if a stunt is possible only because of a particular feature, the stunt is the film.\n\nThe production rule is not just a gimmick for a single shot. The team chooses that one constraint and commits to it fully, the way a filmmaker commits to a single uncut camera move or a first-person rig. Every frame obeys it.\n\n## Key mechanisms\n\n**1. Serving the sport instead of decorating it.** The brand finds a real need at the base of the sport: a pitch that needs rebuilding, a group of athletes who receive no attention, a city whose identity is bound up with its club, or an object used in ceremony that the brand is equipped to make. It does something tangible for them. This gives the campaign its subject matter: real people and places whose stories fans care about.\n\n**2. The product as the camera, the tool, the medium.** The story of that grassroots work is told through the product itself. The fact that the film exists at all is the demonstration. If the footage is crisp, steady or dramatic, viewers understand that the product made it so. The claim is proven before anyone states it.\n\n**3. Total commitment to one constraint.** Making the product the medium is a production constraint, and the idea only works if it is held without exception. The film does not cut away to conventional footage when things get difficult. That rigour gives the work a distinctive texture, slightly unusual and immediately recognisable, and it makes the craft itself something the audience notices and remembers. The constraint becomes part of the story: people ask how it was made, and the answer is the product.\n\n## How the components interact\n\nThe three atoms reinforce each other in a loop. The grassroots work supplies authentic subject matter, so the product-made film is not a sterile technical showcase but a story with real stakes. The product-made film supplies proof, so the sponsorship is not just a good deed but a demonstration of capability. The fully committed constraint supplies distinctiveness, so the film stands apart from both conventional sports content and conventional product advertising.\n\nThere is also a symbolic match. A brand that commits to serving the foundations of the sport, rather than the glamorous top, is the kind of brand that would hold itself to a hard creative rule. The discipline of the production mirrors the sincerity of the sponsorship. Equally, the constraint is easier to justify because the subject is real: a single uncut move through a rebuilt community pitch, or a first-person view from an overlooked athlete, feels earned rather than showy.\n\n## Why it works\n\nFans resist sponsors that sit on the edges of their sport, but they welcome those who show up where the sport lives. By investing in the grassroots and the home city, the brand moves from the perimeter to the centre of the community.\n\nViewers resist product claims, but they cannot easily dismiss a film whose very existence is the evidence. By making the advertising with the product, the brand bypasses the scepticism that greets feature lists.\n\nAnd audiences forget most sports and product films, but they remember work with a strong, consistent texture. By committing fully to one constraint, the brand gives the film a signature that lingers after the final frame.\n\nThe result is a single piece of work that does three jobs at once: it changes something real for the sport's community, it proves what the product can do, and it is crafted distinctively enough that people talk about how it was made, which brings them straight back to the product."}, {"id": "i053", "t": "# Worth Nothing, Unlocks Everything: A Crisis's Own Symbol Becomes the Instant Donation That Removes One Gatekeeper\n\n## The problem\n\nPeople in crisis are often excluded not by a single hardship but by one barrier that triggers many others. Without a fixed address, a person cannot open a bank account; without identification, they cannot receive payments; without cash, they cannot access services; and entitlements are scattered across systems they cannot reach. Fixing each exclusion separately is slow and expensive. At the same time, members of the public who want to help encounter friction and doubt: donation processes are cumbersome and it is unclear whether their gift will make a difference. Campaigns asking for donations often rely on familiar imagery that has lost its power to move.\n\nThe reconstructed idea combines three elements: identifying the single gatekeeper behind many exclusions and removing it with one tool, making donation effortless and tangible at the moment of intent, and using the clearest symbol of the crisis as the campaign's medium.\n\n## The approach\n\n**Find and remove the gatekeeper.** The team analyses the chain of exclusions and finds the one barrier upstream of the rest, such as the lack of an address, an ID or cash, or the fragmentation of entitlements. It then builds one tool that removes it: an account that does not require an address, an identity document that also works as a payment card, or a single portal for all rebates and entitlements.\n\n**Make giving effortless and tangible.** Donations to fund that tool are made frictionless at the moment someone feels moved to give. A card can be swiped directly at a poster; a forgotten credit can be unlocked and donated; a gift item can double as a donation; each unit of money can correspond to one concrete unit of help; or a voucher can be restricted to necessities, removing doubts about how it is used.\n\n**Use the crisis symbol as the medium.** The campaign's materials are made from the most visible symbol of the crisis. If the crisis is economic, the materials might be worthless banknotes overprinted with the campaign's message, posters assembled from them, or shredded notes mailed to those who caused or benefited from the crisis. The medium is the proof, and the opponent's failure becomes the campaign's weapon.\n\n## Key mechanisms\n\n1. **One tool, many unlocks.** Removing the upstream gatekeeper opens access to everything it blocked, multiplying the impact of each donation.\n2. **Frictionless, tangible giving.** Placing the donation mechanism at the moment of intent and making each gift concrete removes the hesitation that stops people giving.\n3. **Symbol as substance.** When the crisis's own symbol carries the message, the campaign demonstrates the problem with every piece of material and turns the failure of those responsible against them.\n\n## How the elements interact\n\nThe crisis symbol attracts attention and makes the problem undeniable: a poster built from worthless notes stops people. The same poster contains the frictionless donation point, so the moment of shock becomes the moment of giving. Each donation is tied to a concrete outcome, funding the one tool that removes the gatekeeper, so the giver knows exactly what their gift does. The money that has lost its value becomes the channel through which new value reaches the excluded.\n\n## Why it works\n\nIt turns a sprawling problem into a single, solvable one, turns a reluctant donor into an immediate giver, and turns the crisis's most visible failure into the medium of the response. Each piece of the campaign shows the problem, offers the way to help and points to the specific tool that unlocks access. The result is a campaign where attention, giving and impact are connected in one gesture."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
