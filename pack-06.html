  "use strict";
  var DATA = {"pack": "P06", "items": [{"id": "i063", "t": "# Living Through the Day the Silence Ended\n\n## The problem\n\nA freedom that was won long ago tends to be taken for granted. People who never lived under the old restrictions find it hard to imagine them, and an anniversary of their abolition passes as a line in the news. Meanwhile, new restrictions may be creeping back in, and the audience that would most need to defend the freedom does not feel the threat.\n\nAt the same time, any campaign that speaks against today's restrictions risks being caught by them: removed, refused or penalised.\n\nThe challenge is to make a historic struggle for a freedom feel immediate, connect it to the present, and get the message out despite the rules that would stop it.\n\n## The approach\n\nOn the anniversary of the day a national freedom was secured, re-run the original events in real time, using the formats people use every day, and build the re-enactment so that it carries a present-day message through the very rules that try to censor it.\n\nThe anniversary is the stage. Over the hours or days the original events unfolded, the campaign publishes them as they happened: posts in a social feed, text messages, calendar entries, or an interactive first-person account by someone who was there. Woven into the re-enactment are parallels to restrictions in force today. Where those parallels touch content the rules forbid, the work slips them through what the rules permit, or quotes the regulator's objection directly, so that the censorship becomes part of the story being told.\n\n## Key mechanisms\n\n**1. The anniversary as argument.** Launching on the date that commemorates the freedom borrows the day's meaning. A society that celebrates the end of censorship on this date has to explain why it censors now. The occasion makes the case before the campaign says anything.\n\n**2. Real-time re-running.** Recreating the historic event live, in a familiar format, lets people who were not alive at the time experience it moment by moment rather than reading a summary. Messages arrive with the tension of not knowing what happens next. History becomes something lived, not learned.\n\n**3. The censorship rule as the vehicle.** When the re-enactment touches subjects that present rules prohibit, the work uses the rules' own boundaries to get through: demonstrating on what the rule permits, publishing material designed to vanish at the legal deadline, routing banned content through an uncensored medium, or reproducing the regulator's complaint in the ad itself. Each workaround exposes the rule as absurd.\n\n## How the pieces interlock\n\nThe date gives the moral frame; the real-time re-run gives emotional immersion; the censorship workaround gives contemporary bite. As people live through the struggle of the past, they encounter the same pressures operating today, and see the campaign itself navigating them. The past and the present begin to rhyme in front of the audience.\n\nStep by step: choose the anniversary; script the original events as a timeline; publish them live in formats like feeds, texts or calendars; insert present-day parallels; route any restricted material through the rules' own gaps; let any reaction from regulators become further material.\n\n## Why it works\n\nIt closes the distance between a historic victory and a current threat. People who feel they have lived through a struggle care about its outcome, and the real-time format produces that feeling. The anniversary ensures the conversation happens on the day the freedom is already in people's minds. And by turning the censor's rules into its own delivery system, the campaign guarantees that every attempt to silence it only proves its point."}, {"id": "i127", "t": "# Listen Inside the Monument\n\n## The problem\n\nThreatened heritage sites face two separate dangers. One is physical: conflict, neglect or deliberate destruction can erase them. The other is social: most people never visit them. Museums, archaeological sites and historic interiors are experienced by a small, self-selecting audience, so when such places are endangered, few people feel the loss personally.\n\nConventional documentation addresses the first danger only partly, by recording what the place looks like. It does nothing for the second, and it leaves out an entire sense: the way a space sounds.\n\n## The approach\n\nCreate a public backup of threatened heritage that captures both form and sound, built with the help of ordinary people, and open it through new, low-barrier points of access so anyone can step inside the place from wherever they are.\n\nThe archive is not stored away for specialists. It becomes an experience: a geolocated, sound-led walk through monuments that may not survive, available to people who would never have entered them.\n\n## Key mechanisms\n\n**1. Heritage as backup.** Volunteers scan threatened monuments with their phones and upload them to a cloud archive. The framing is deliberately everyday: you back up your phone, so we back up our history. If a site is destroyed, it can be rebuilt from the archive, and the rebuilding becomes a peaceful answer to whoever destroyed it. Where knowledge itself has been removed, the same logic applies: forbidden material can be made available again inside the very places that took it away.\n\n**2. Sound that restores the missing sense.** Alongside the scans, the archive records sound: binaural recordings of interiors, the wind moving through ruins, the resonance read from cracked walls translated into music. These recordings put the listener inside the subject, rather than in front of it. A visual model can be admired; an acoustic one can be inhabited.\n\n**3. New doors into the culture.** The archive is distributed through access points that fit people's lives rather than the venue's. An augmented-reality layer places the reconstructed monument in the user's own street. A phone-native format guides them through it in minutes. A low-cost headset delivered with a newspaper puts a full virtual visit in every reader's hands. Reproductions placed in public squares invite passers-by to listen. A geolocated trail lets people walk through a lost site's footprint.\n\n## How they work together\n\nThe backup supplies the content and the purpose. The sound supplies the emotional depth that turns a model into an experience. The access points supply the audience. Without the access, the archive is a vault; without the sound, it is a slideshow; without the backup, there is nothing to open.\n\nThe participatory element also cycles back: people who experience a monument through the headset or the trail are invited to contribute their own scans and recordings of nearby sites, growing the archive.\n\n## Why it works\n\n- **It replaces distance with presence.** Hearing the inside of a place you have never visited makes it real in a way images rarely do.\n- **It democratises heritage.** By meeting people on their own devices, streets and newspapers, it reaches those who would never buy a ticket.\n- **It gives a hopeful answer to destruction.** The message is not only that something is at risk, but that it is being saved, and that anyone can help.\n- **It earns cultural rather than commercial attention.** A free, beautiful way to experience heritage is something people pass on because they want to.\n\nThe outcome is a monument that cannot be fully destroyed, because thousands of people have already stood inside it."}, {"id": "i016", "t": "# Follow the Clues to the Help\n\n## Starting point\n\nWhen a crisis hits, brands rush to say something. Most of what they say is indistinguishable: statements of solidarity, changed logos, donations announced in a press release. Audiences have become sceptical of this reflex, and rightly so. The brands that earn credibility are the ones that do something only they can do, using the capabilities they already have.\n\nBut useful help has its own problem: it can be invisible. A service quietly extended to people in need does good but may not reach everyone who needs it, and the supporters who want to join in have no way to show they stand with it. The challenge is to deliver real, capability-matched help fast, make sure people find it, and let the public carry the cause without paid media.\n\n## The idea\n\nLaunch the crisis response not as an announcement but as a trail. Help that matches exactly what the brand already does is made available to everyone, and it is introduced through a chain of clues: a symbol that appears before any explanation, a seeded phrase, hints spread across platforms. The symbol is simple enough for anyone to wear, print or post, so it becomes the public sign of the movement. Following the trail leads people to the help itself, and adopting the symbol lets supporters spread it.\n\n## Key mechanisms\n\n**1. Help that is the brand's own capability.** The core of the idea is practical. The brand responds with what it already does well, whether that is moving goods, feeding, transporting or connecting people, and offers it openly to anyone affected. It is launched fast. Because the help is an extension of the brand's everyday function, it proves competence rather than claiming compassion. Nobody needs to be told the brand cares; they can see that its operations now work for those in need.\n\n**2. A symbol anyone can carry.** The help is marked by a single simple symbol or gesture. It is designed to be reproduced by supporters without permission or cost: worn on clothing, printed on a sign, set as a profile picture, performed in a photo. Every time a supporter uses it, the symbol both signals solidarity and points to where help can be found. It is also easy for news coverage to show, so the movement appears in reporting without media buying.\n\n**3. A trail of clues before the reveal.** Rather than opening with a full explanation, the symbol appears first, unexplained. Phrases are seeded. Hints move across platforms. Core supporters get early access to what the symbol means. The audience becomes a group of investigators, asking and answering one another. When the full picture is revealed, a crowd is already paying attention and many people already understand how to use or share the help.\n\n## How the pieces support one another\n\nThe capability-matched help gives the campaign substance; without it, the clues and symbol would be a stunt. The symbol gives the help a face and turns supporters into carriers. The clue trail is the distribution engine: curiosity spreads the symbol faster than a statement could, and people who solve the puzzle feel ownership of the answer and pass it on.\n\nThe order matters. The symbol travels first, so by the time the help is explained, the sign is already familiar. Anyone who later sees it on a shirt or a profile knows what it stands for and where it leads. The investigation phase also helps reach people who need the help, because the hints travel through the same channels and communities the affected people use.\n\n## Why it works\n\n- **Doing beats saying.** Help built from the brand's existing operations is a demonstration of capability, which is more credible than any message about values.\n- **Curiosity spreads faster than announcement.** People share mysteries. A trail of clues turns attention into participation before the answer is even given.\n- **The movement distributes itself.** A symbol supporters make themselves multiplies without paid media and is easy for the press to picture.\n- **Open to everyone.** Offering the help to all, rather than to customers, keeps the effort from reading as promotion and widens who is reached.\n- **Speed is preserved.** Each mechanism is cheap and fast to set in motion, so the response can arrive while the crisis is still unfolding, which is when it matters most."}, {"id": "i090", "t": "# The Museum Comes Out: Culture in the Street, Told by Its People\n\n## The problem\n\nCultural institutions often have a reach problem rather than a content problem. The work inside is extraordinary, but large parts of the public never cross the threshold. The building feels intimidating, the visit feels like a commitment, the audience feels it is not for them. A single launch announcement is soon forgotten, and claims about being open to everyone ring hollow when the people inside all look the same.\n\nThe task is to open the experience to people who would never visit, keep them coming back over a long period, and prove the institution's openness through people rather than promises.\n\n## The approach\n\nTake the work out of the building through new points of access, roll the effort out as a planned sequence of story beats, and let real people connected to the institution tell their own stories along the way.\n\nThe cultural experience is opened through new channels: reproductions placed in the street, a geolocated trail through the city, a phone-native format, augmented or virtual reality, even a cheap headset delivered with a newspaper. Instead of a single launch, the campaign is phased as a story: a tease, an announcement, a staged public selection of what goes where, peaks timed to key dates, with PR leading each stage. Throughout, the voices are those of real people: staff, members, visitors, local figures narrating their day and their connection to the work.\n\n## Key mechanisms\n\n**1. New access points.** Bringing the experience to where people already are, on the street, on their phones, inside a newspaper, lets those who would never enter the venue explore it on their own terms. It removes the threshold altogether.\n\n**2. A rolling story.** Planning the campaign as a series of beats gives media and audiences a fresh reason to return. A tease builds curiosity; an announcement gives news; a public selection invites participation and debate; timed peaks give fresh moments. One idea produces months of coverage instead of a single burst.\n\n**3. Real people as proof.** Staff, members and community figures narrating their own experiences demonstrate the institution's promise better than any claim. The brand stays in the background while lived examples show who the work is for: everyone, including those who did not think it was theirs.\n\n## How the parts connect\n\nThe access points create the experience; the rolling story structures its release; the people give it credibility. Each new beat can unlock a new access point, say a new reproduction in a new neighbourhood or a new stretch of the trail, and each access point can be introduced by someone who lives or works near it. The audience meets the work, and the people who love it, again and again, in different places and different formats.\n\nThe sequence: tease that something is coming out of the building; announce the plan; let the public help choose which works go where; release access points in waves timed to key dates; feature a real person's story with each wave; continue until the city is covered.\n\n## Why it works\n\nIt changes the question from whether people will come to the institution to how the institution can come to people. The rolling structure sustains attention long enough for behaviour to change, and the human stories make the invitation feel genuine. By the end, many people who would never have stepped inside have already explored the work in their own streets, and some of them, having heard from people like themselves, will finally walk through the door."}, {"id": "i100", "t": "# A Day That Sounds Like Something\n\n## The problem\n\nCause-related marketing tends to arrive with a straight face. A brand declares support for a good cause, an earnest film plays, and audiences, who have seen this many times before, discount it as a pitch. Meanwhile the biggest shopping occasions of the year command enormous attention and well-worn habits, but that attention points almost entirely at discounts. And in the noise of those days, most brand messages look and sound identical: banners, countdowns, the same voiceover energy.\n\nThe brief this idea answers is threefold: how to make a cause claim believed rather than doubted, how to borrow the gravity of mass shopping occasions without simply joining the sale, and how to be noticed through a channel that rivals are not already crowding.\n\n## The approach\n\nThe brand invents its own named day and slots it into the existing run of shopping occasions, the way a giving day follows the biggest sale weekend or a day for local shops sits beside it. Alternatively it makes a gesture on the biggest sale day itself, such as closing its doors. That day is attached to a cause.\n\nThe launch of the day is played as an absurd premise with total sincerity. Rather than an earnest appeal, the brand makes itself the willing butt of the joke: a solemn genre broken by slapstick, or a deadpan parody of the familiar format of sale-day advertising.\n\nThe day, and the brand's role in it, is then carried by sound. The rituals of the occasion are given a designed sonic signature: the sound of the product, or a signature melody at the moment a transaction or donation succeeds, becomes the message itself.\n\n## Key mechanisms\n\n**1. Borrowed calendar gravity.** People already plan around the big shopping days. They wake early, open apps, wait for notifications. By naming a day that sits inside that run, the brand inherits those habits ready-made. The attention is already there; the campaign only redirects it towards the cause. Closing on the biggest sale day achieves the same effect by contrast: the absence becomes the story precisely because everyone expected the brand to be open.\n\n**2. Sincerity disarmed by self-mockery.** A cause message on a shopping day invites cynicism: is this just another way to sell? The brand anticipates the doubt and laughs first. It parodies the breathless sale-day format with a perfectly straight face, or stages a solemn ceremony for the new day that collapses into slapstick. Because the brand is the target of the joke, the audience relaxes. The claim that would be doubted as a pitch is accepted and shared as entertainment.\n\n**3. Sound as ownership.** Shopping days are visually saturated. Sound is far less contested. The brand designs the sonic ritual of its day: the sound of its product, a short melody that plays each time someone takes part, the audible moment the cause is helped. That cue becomes the day's signature and the brand's. Each time someone hears it, the day and the brand are recalled together through a sense rivals rarely own.\n\n## How the components interact\n\nThe named day gives the campaign a structure and a place in the calendar. The humour gives the day permission to exist: an invented occasion presented earnestly would feel presumptuous, but one launched with self-aware absurdity feels like an invitation to play along. The sound turns participation into something people can hear and repeat, and it is the thread that ties the comic films, the day itself and the moment of contribution together.\n\nThe humour also feeds the sound. A deadpan parody can treat the sonic cue with exaggerated reverence, the way a solemn genre treats a fanfare, and the joke makes the cue memorable. Conversely, the sound makes the joke portable: a melody escapes the film and turns up in every transaction on the day.\n\n## Why it works\n\nIt works because each element neutralises a weakness in the others. Invented days risk seeming self-serving; humour defuses that. Humour risks seeming frivolous next to a cause; the calendar slot and the real redirection of shopping habits give it weight. And both risk being lost among the competing noise of the season; the designed sound gives the campaign a channel where it stands alone.\n\nThe deeper logic is borrowing. The brand borrows attention from the shopping calendar, borrows goodwill from the audience's appetite for entertainment, and borrows memory from a sense that is rarely used in advertising. None of these has to be built from nothing. The result is a cause that people encounter as a joke they enjoy, on a day they were already watching, with a sound they cannot stop hearing."}, {"id": "i113", "t": "# A Song That Tests Your Hearing\n\n## The challenge\n\nMany people never get basic health screening. Appointments take time, cost money and, above all, provoke fear: people would rather not know. Health campaigns that tell them to get checked are easily ignored, because they arrive as warnings rather than as something people want to engage with. And even a good idea can disappear in the flood of content, heard once and forgotten.\n\nThe goal is to make screening effortless and unthreatening, to carry the invitation in a form people actively seek out, and to make it an event people talk about.\n\n## The approach\n\nThe idea is a genuine piece of music by a credible artist that doubles as a first health screen, released through a scarce, discovery-led mechanic that makes listeners hunt for it and pass it on.\n\nThe song is the screen. Following the pattern of a radio broadcast used as a hearing test, a storybook with built-in vision checks, or a phone used to capture a voice or breath, the music is designed so that listening to it, or singing along with it, reveals something about the listener's health. Certain sounds or passages might only be audible to those with healthy hearing, or the act of recording oneself singing along could provide a first indication. The screen takes place in the middle of an everyday pleasure.\n\nThe song is real culture. It is made by a credible artist in a genre the audience already enjoys, released as a single or inside the artist's own commercial work. People hear it first as a song and only later discover what it does.\n\nThe release is scarce. Instead of being everywhere at once, it is passed between listeners as a single copy, hidden at coordinates, or playable only at certain physical spots. People share where they found it and invite others to listen.\n\n## Key mechanisms\n\n**Everyday activity as a first screen.** Turning listening into a test removes the appointment, cost and fear. People are screened without feeling they are being examined, and those who notice a possible issue are encouraged to follow up.\n\n**A message released as genuine music.** Because the song is real, it travels as culture. People choose to hear it and share it, which reaches audiences who would ignore health messages.\n\n**Scarcity and discovery.** Making the song something to find gives it event value. The hunt creates conversation, and each person who finds it becomes a distributor.\n\n## How the parts interact\n\nThe music provides the vehicle; the screen provides the purpose; the scarce release provides momentum. Listeners seek out the song for its own sake and because it is rare; while listening, they are screened; and they pass it on, extending both the music and the screening.\n\nThe interaction makes each part stronger. A screening tool without music would be just another health app. Music without the screening would be a pleasant release with no health impact. Both without the scarcity would risk being lost among countless other songs. Combined, they turn a hard-to-reach health behaviour into a shared cultural experience.\n\n## Why it works\n\nIt works because it meets people where their attention already is, in music, and embeds the health action in something enjoyable. The fear associated with testing is replaced by curiosity, and the effort of making an appointment is replaced by pressing play.\n\nThe scarce release turns the song into a story people want to tell, and each telling brings more people to listen and, in the process, to be screened. The result is health engagement driven by culture rather than by warnings."}, {"id": "i074", "t": "# Clues Hidden in the Insult\n\n## The problem\n\nWhen a brand takes a principled position, backlash follows. Hate arrives in public: insults, hateful symbols, taunts aimed at the brand and at the people it stands with. The usual responses, silence or a carefully worded statement, either look like retreat or vanish in the noise. The attack ends up defining the conversation.\n\nMeanwhile, the people the brand wants to support are often reached poorly by the brand itself. A company's own channels carry little trust in communities that have learned to be wary of corporate allies. Initiatives delivered directly by a brand lack the legitimacy that local businesses, grassroots organisations, expert committees and people's own gatherings already hold.\n\nThe brand needs to answer the attack, turn its energy into support, and deliver that support through places people already trust.\n\n## The approach\n\nThe idea is to answer the backlash by turning the attack into a trail of clues that leads people to a real programme, delivered through the partners and community structures that already hold the audience's trust.\n\nThe brand adopts the insult, redraws the hateful symbol or replies to the taunt with its opposite, and seeds those transformed fragments into the world as clues. A redrawn symbol appears before any announcement; a reversed phrase follows; a chain of hints spreads across platforms. People follow the trail as investigators, and at its end they find not a slogan but an initiative: support available through local businesses, grassroots organisations, expert committees and community gatherings that the brand has partnered with.\n\n## Key mechanisms\n\n**Adopting the attack.** Rather than ignoring the insult, the brand takes it on collectively, redraws the hateful symbol or answers the taunt with its opposite. The controversy becomes the brand's own material, and the brand is seen to stand with the people targeted.\n\n**Transformed fragments as clues.** The adopted insult and the redrawn symbol are released as puzzle pieces. Each appears without explanation, and each points to the next. Because people already know the controversy, they recognise the fragments and want to know where they lead. Anticipation and participation build.\n\n**A cross-platform chain.** The clues spread across different places, linking online conversation to physical locations. A hint might be found in a local shop window or at a community gathering, pulling people towards the trusted partners.\n\n**Delivery through trusted structures.** The trail ends at a programme run with and through local businesses, grassroots organisations, expert committees and people's own gatherings. These partners provide reach and legitimacy the brand could not build on its own, and the brand's role is to fund, connect and amplify.\n\n**An early drop for the core.** Those closest to the issue, reached through the community partners, can be given first access to the programme, so its first users are the people it was built for.\n\n## Why it works\n\nEach part solves a weakness in the others. A public answer to hate on its own risks being a moment of defiance that fades. A clue trail on its own creates intrigue but needs a meaningful destination. A programme delivered through trusted partners on its own may lack attention.\n\nCombined, the backlash supplies the attention, the clue trail turns that attention into participation, and the trusted community structures give the destination credibility and reach. The brand is cast as a principled ally, the controversy carries the message further than any paid media could, and the people who follow the trail arrive somewhere real, run by those they already trust."}, {"id": "i010", "t": "# The Savings Hack Kids Invented\n\n## The problem\n\nFor children and first-time savers, money is abstract. The reward for saving arrives years later, and nothing in the present makes it feel real. Financial education tends to be dry, so young people tune it out. Alongside this sits a second problem: some of the rules around money and everyday essentials are simply unfair to young people or to the households they live in, and those rules rarely meet a challenge that ordinary people can join. And a third: families and young users are endlessly inventive, finding their own tricks and workarounds to make products serve them better, yet those inventions go unnoticed and uncredited.\n\nThe task is to make saving tangible and rewarding now, give young savers a way to push back against an unfair rule, and treat the community as co-creators rather than as an audience.\n\n## The approach\n\nBuild a savings product for children and first-time savers that makes their money visible and immediately rewarding, and grow its features from the hacks young users and their families already use. The headline feature comes from one of those community hacks: a clever, legal way of exploiting an unfair rule's own loophole, which delivers a fairer result and shows how absurd the rule is. Every feature carries the name of the person who found it, and fans vote on which ideas become official next.\n\nThe product is part piggy bank, part protest, and part open workshop.\n\n## Key mechanisms\n\n**1. Money made tangible.** The product shows children their real balance in a physical or familiar form, such as a toy or an everyday household object that reflects what they have saved. Progress is rewarded straight away, in a currency young people already want, or by unlocking something through learning. A payoff that used to sit far in the future becomes something they can see and enjoy today, which is what keeps a habit going.\n\n**2. A loophole turned into a feature.** One feature uses a gap in an unfair rule. It might package a product or a saving in a form that falls under a fairer rule, or apply an adjustment at the till that cancels an unjust charge. It delivers the workaround directly, so families benefit immediately, and its very existence exposes the rule's absurdity. Every time it is used, it counts as a vote against the rule, and the running total becomes a story in its own right.\n\n**3. Community hacks made official.** The brand actively looks for the ways users and their families are already bending the product to their needs. It traces each hack back to the person who found it, verifies it, credits them by name, and turns the best ones into official features or editions, some chosen by fan vote. Users become co-creators, and the brand gains a steady supply of ideas that have already been tested in real homes.\n\n## How it fits together\n\nTangible saving is the reason young people engage. The loophole feature gives the product a purpose beyond itself and a reason for press and parents to talk about it. Community crediting keeps the product evolving and makes users feel it belongs to them.\n\nThe three feed one another. The loophole idea is most convincing when it comes from a real family rather than the brand, so crediting its finder makes the protest personal and authentic. Seeing a peer credited encourages other young users to share their own tricks, which keeps new features flowing. And because each feature makes saving a little more rewarding, the tangible side of the product improves with every round of community ideas. Young savers learn that money can be seen, that rules can be questioned, and that their own ideas count.\n\n## Why it works\n\n- **Now, not later.** Making money visible and rewarding solves the abstraction problem that defeats most financial education.\n- **Action, not complaint.** Exploiting a loophole with a real product turns frustration about an unfair rule into something people can do every day.\n- **Ownership through credit.** Naming the people behind each idea builds loyalty and attracts ideas the brand could not have invented alone.\n- **A product that grows.** Because the community keeps contributing, the product stays fresh and the campaign keeps producing new stories."}, {"id": "i001", "t": "# One Shot, Your Data, Clean Hands\n\n## The problem\n\nGetting people to adopt a healthy habit, such as washing their hands, is notoriously difficult through persuasion. People know they should do it; they simply forget, or do not bother. Health messaging repeated year after year becomes background noise. At the same time, a brand that wants to promote such a behaviour struggles to make its communication distinctive, and rarely gets audiences to talk about it voluntarily.\n\nThe challenge is to make the behaviour happen without nagging, make the campaign memorable as a piece of craft, and give people a reason to share it on their own.\n\n## The approach\n\nBuild the healthy behaviour into an everyday object, track each person's use of it to produce a personal, shareable story, and launch the whole idea with a film made under one strict production constraint.\n\nThe object is something people already handle, such as chalk that contains soap so dusty hands lather when rinsed, beads that sanitise, a sliver of soap handed out at a daily routine point. Each person's use is counted and turned into a personal summary: a year in review, a named type, a portrait of their habits, shareable in the formats of the platforms they already use. The film that introduces the idea is shot with one committed technique, a single uncut camera move or a first-person rig, so that its craft becomes part of what people remember.\n\n## Key mechanisms\n\n**1. Behaviour built into the object.** Rather than asking people to remember to wash, the object does it for them. Dusty hands from soap-infused chalk lather the moment they meet water. The healthy act happens automatically, without anyone having to be persuaded.\n\n**2. Usage turned into a personal story.** Each user's data becomes something about them. A summary of how often they used it, a playful label for the kind of user they are, a portrait built from their routine, all designed to be posted on other platforms. People advertise the idea while talking about themselves.\n\n**3. One production constraint, fully committed.** The launch film follows a single rule, perhaps one continuous camera move following the object through the hands that use it, or a first-person view that puts the viewer in the user's shoes. The texture of the craft makes the film distinctive and memorable, and the technique itself gets talked about.\n\n## How the pieces combine\n\nThe object delivers the result; the data story delivers the sharing; the film delivers the attention. The film introduces the object in a way people remember. The object changes behaviour without effort. The personal summaries turn that changed behaviour into content users choose to post, which brings new people back to the film and the object. Each step feeds the next.\n\nA first-person, uncut film fits naturally: it can follow one day of a single user, showing the object being used again and again, exactly the pattern that later becomes their personal story.\n\n## Why it works\n\nIt combines three things that rarely meet in health communication: effortless behaviour change, personal relevance and craft worth noticing. Embedding the habit in an object bypasses the need for persuasion. Turning each person's use into a story about themselves gives them a reason to spread it. And a film built on one bold constraint makes the launch stand out from the usual instructional tone. The result is a healthy behaviour that happens by default and a campaign people talk about because it reflects them back to themselves."}, {"id": "i097", "t": "# The Singalong That Stopped the Room\n\n## The problem\n\nCampaigns about normalised harms face an audience that has heard the warnings and learned to look away. Serious messages delivered seriously are skipped; graphic messages are resented. Meanwhile, the harm itself stays abstract and distant, something that happens elsewhere to other people. What these causes lack is a way past the audience's defences: a means of getting the message into people's heads before they decide to resist it, and a way of making a remote injustice feel as close as the people next door.\n\n## The approach\n\nThe idea is to smuggle a hard truth into the audience's lives through a song they already love and a comedic premise played completely straight, then let the familiar tune and the familiar story turn around to reveal a harm close to home.\n\nThe campaign takes a well-known song, the kind people sing without prompting, and rewrites it. One word in the title is swapped, or new lyrics are set to a crowd's own chant, or a much-loved anthem is flipped so that it argues the opposite of its original meaning. People start singing it before they notice what it says.\n\nThe song is the soundtrack to a deadpan, absurd setup. The work is presented in a familiar format, perhaps a cheerful parody or a mock-solemn production broken by slapstick, and played with complete sincerity. The brand behind it is happy to look ridiculous. The audience laughs and relaxes.\n\nThen the story shifts. The format that seemed light carries a harm the audience had stopped noticing, now placed in a familiar local setting: a character like someone they know, in a place that looks like home. The rewritten lyrics, which seemed like a joke, turn out to describe that harm precisely. The laughter catches in the throat.\n\n## Key mechanisms\n\n**The borrowed melody.** Rewriting a song people already know means the message travels on a tune they will sing without being asked. It sticks in memory and spreads in conversation, because people repeat melodies they love.\n\n**Sincere absurdity as the way in.** Playing a ridiculous premise straight, with the brand as the butt of the joke, converts the audience's wariness into amusement. They lower their guard, expecting entertainment.\n\n**The harm brought home.** Placing the injustice in a familiar local story removes the distance that allowed people to ignore it. The audience is suddenly confronted with something they recognise rather than something remote.\n\n**The turn.** The power lies in the switch from comedy to recognition. The same song and the same characters that made people laugh now carry the weight of the harm, and the contrast makes it impossible to dismiss.\n\n## Why it works\n\nEach component solves a different barrier. The audience avoids serious messages, so the absurd, self-mocking premise invites them in. They forget messages quickly, so the rewritten song ensures the words stay with them and get repeated. And they feel distant from the harm, so the local, familiar story makes it personal.\n\nCrucially, the humour does not undermine the message; it sets it up. Because people were laughing, the shift to the harm feels sharper. Because the song is one they already sing, the message returns every time they hear the original. The campaign ends up living not in the media slot it bought but in people's heads, attached to a melody they cannot stop humming and a story that now feels uncomfortably close."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> you will get a short code and a CSV file. Send either to the person who sent you this file.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Please send your scores back to the person who sent you this file. Either of these works.</p>' +
      '<div class="row"><button id="dl">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
