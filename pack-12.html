  var DATA = {"pack": "P12", "items": [{"id": "i020", "t": "# The Story Next Door, Told in Episodes\n\n## Problem\n\nSome injustices have become so familiar, or seem so distant, that audiences no longer react to them. Brands that comment on such issues are met with scepticism, especially when their link to the issue is unclear. And even well-intentioned campaigns tend to spike once and vanish, leaving no time for a story to deepen or for the public to demand change. A brand needs a legitimate reason to engage, a way to make the harm feel close, and a structure that keeps attention for months.\n\n## Approach\n\nThe brand first identifies where its everyday function genuinely touches the issue, for instance the way laundry connects to unequal housework or a loan rule can exclude married women, and commits to changing something real at that point. It then makes the harm feel close by staging it as a familiar story at home: a fictional local character's blog, a soap opera so painful audiences demand it be taken off air, a lost future played out, or a survivor speaking through an everyday format such as a beauty tutorial. That story is released as a rolling campaign with planned beats: a tease, an announcement, a staged public moment, peaks timed to the sale days when the product is most present, with PR leading every channel, so media and audiences return at each stage and the brand's real change arrives as the story's resolution.\n\n## Key mechanisms\n\n**A real link and a real change.**\nThe brand does not pick an issue for its popularity. It looks for where its product's daily use meets the problem and then changes something concrete there, so the stance grows out of what the product actually does.\n\n**A distant harm made local.**\nThe injustice is dramatised through a format people know intimately. A fictional neighbour's blog documents what is happening to her; a soap opera shows the harm in a familiar living room; a lost future is imagined in detail; a survivor speaks through a beauty tutorial that turns out to be about something else. The audience feels the injustice as something happening near them.\n\n**A story released in planned beats.**\nThe narrative unfolds over time. A tease raises questions; an announcement reveals the story; a staged public selection or moment invites participation; key beats are timed to the sale days when the brand's products are most visible. PR leads each phase, giving journalists a new angle at every step.\n\n**The real change as the payoff.**\nAs the story peaks, the brand reveals the concrete change it has made at the point where its function meets the issue. The dramatised harm is answered by an action, not a slogan.\n\n## Why it works\n\nGrounding the brand's role in its everyday function makes its involvement credible. People accept a stance that grows from what the product does far more readily than one borrowed for the moment.\n\nStaging the harm as a familiar story close to home cuts through indifference. A local blog or a soap opera makes viewers feel what statistics and distant reports no longer convey.\n\nPhasing the campaign as a rolling story keeps it alive. Each beat gives media and audiences a reason to return, turning one idea into months of coverage, and timing peaks to sale days links the conversation to the moments when the brand's change is most tangible.\n\nLegitimacy comes from the product's real role, emotion from the story told close to home, and endurance from the episodic release, so a normalised harm becomes something people follow, feel and see addressed."}, {"id": "i037", "t": "# Like It, Fund It, Sit Under It\n\n## The problem\n\nSafety and protection are hard to sell. People do not want to think about risk, and lectures about what might go wrong are ignored. Causes linked to safety face the same issue, compounded by the fact that many supporters cannot or will not donate money. Meanwhile, advertising for such brands usually makes claims about protection rather than demonstrating it.\n\nThe challenge is to make people feel the value of protection without lecturing, let them support the cause without spending, and prove the brand's claim in a tangible way.\n\n## The approach\n\nTell a story that dramatises the risk in a way people can feel, convert every social action around that story into a fixed, countable contribution, and build the advertising itself as working infrastructure that protects people in the street.\n\nThe story might be a suspenseful series of near misses, a mascot put in danger live, or strangers brought together by an unlucky accident, told with drama or humour rather than warnings. Every like, share or post in response unlocks a set unit of help: a shelter, a supply, a piece of equipment. And the media itself does the job: posters bent into rain shelters or benches, a billboard that produces drinking water, structures that hold donated goods.\n\n## Key mechanisms\n\n**1. Dramatising the risk.** Turning an abstract danger into a story the audience feels, suspense, loss, absurd bad luck, makes people want protection without being told they need it. Emotion does the persuading.\n\n**2. Free actions into countable donations.** A fixed rate, say one unit of help per post or per set number of likes, lets supporters contribute without spending money. Each participant becomes a broadcaster, and the running tally gives everyone a visible target.\n\n**3. Advertising as infrastructure.** Building the ads to function, sheltering people from rain, providing seating, producing water, holding donations, proves the brand's claim by doing something useful in the street. The ad is the protection.\n\n## How they fit together\n\nThe story generates attention and emotional stakes. The social mechanic converts that attention into measurable action. The infrastructure turns the action into something physical that people can see and use. Every post or like adds to a count, the count is translated into new functional placements, and those placements become both protection and new advertising that brings more people to the story.\n\nStep by step: create a gripping risk story; launch it with a clear rate of contribution for each social action; build and install functional placements as the tally grows; show each new placement in the story's ongoing episodes; let people see, use and share the protection they funded.\n\n## Why it works\n\nIt makes protection tangible at every step. The story makes the risk real, the social mechanic makes participation easy and free, and the infrastructure makes the result visible and useful. People who would scroll past a safety message stop for a good story, act because it costs them nothing, and keep sharing because they can see their actions turn into real shelter in real streets. The brand's promise of protection is no longer a claim; it is standing on the corner."}, {"id": "i015", "t": "# The Return Nobody Announced: A Launch Decoded From the Brand's Own Memory\n\n## The problem\n\nLaunches usually arrive as strangers. A brand announces something new, pays for attention, and asks people to care about a thing they have no history with. The audience has every reason to be indifferent: the product is unproven, the timing feels arbitrary, and the choice of who fronts it and where it appears looks like a guess made in a meeting room.\n\nYet the brand is not a stranger. It has a past: an anniversary approaching, a founder's belief that still sits in old interviews, an archive of work that has never been altered, and a generation of adults who grew up with the product and still carry it in their memories. It also holds a quiet store of evidence about what its people actually want, in their answers, their searches, its customer lists and the results of its past campaigns.\n\nThe challenge is to launch something new so that it does not feel new at all, so that it arrives already familiar and earned, and so that the audience does the work of discovering it rather than being told.\n\n## The approach\n\nThe idea is to treat the launch as a return, and to stage that return as a trail the audience must follow.\n\nInstead of an announcement, the brand reaches into its own past and lifts out fragments that people who grew up with it will recognise: a phrase the founder used, a symbol from the unaltered archive, a mark tied to the anniversary. These fragments are seeded into the world before anything is said. They appear without explanation across platforms, each one a clue pointing to the next.\n\nWhat decides where those clues land, who carries them and which markets see them first is not instinct but the data the brand already holds. Search trends show which memories people are already looking for. Customer lists identify the long-standing fans who should find the earliest hints. Past campaign results reveal which channels and which partners actually moved people. The data chooses; the creative team builds the trail on top of that choice.\n\nThe reveal, when it comes, is not a surprise invented from nothing. It is the answer the audience has already half-guessed, because the clues were made of their own memories.\n\n## Key mechanisms\n\n**Memory as the raw material of the clues.** Every hint is drawn from the brand's own history rather than created for the campaign. A seeded phrase is something the founder once believed and said. A symbol is lifted directly from the archive. Because the audience already knows these things, the clues are legible to the right people and mysterious to everyone else, which is exactly the tension a puzzle needs.\n\n**A chain of hints across platforms.** The fragments are distributed as a sequence, not a single drop. One symbol appears before any announcement; a phrase follows somewhere else; a further hint links them. People who recognise the pieces start connecting them in public, and the act of connecting turns them into investigators who are invested in the answer.\n\n**Data deciding the route.** The brand's own records determine which partners are invited in, which content forms each clue takes, which markets the trail starts in, and which audiences are reached first. If search trends show renewed interest in a particular era of the brand, that era becomes the source of the clues. If customer lists show a core of long-time users, those users become the destination for a surprise early drop.\n\n**An early drop for the core.** Before the public reveal, the most devoted fans, identified through the data rather than assumed, receive the new thing first. They are also the adults who grew up with the product, so their reaction carries both authority and nostalgia, and their discovery becomes another clue for everyone else.\n\n**The reveal as recognition.** When the launch is finally confirmed, it lands as a homecoming. The anniversary, the founder's belief, the archive all click into place, and the new thing feels like a continuation of something people already trusted.\n\n## Why it works\n\nEach part removes a weakness the others would have alone. A launch anchored only in the past risks feeling like a museum piece; the clue trail gives it energy and participation. A clue trail on its own risks being opaque or self-indulgent; drawing the clues from shared memories makes them solvable by the people who matter. Both risk being aimed at the wrong people or places; letting the brand's existing data choose the partners, content, markets and audiences grounds the whole effort in what people demonstrably want rather than in the brand's guess.\n\nTogether they invert the usual launch. The audience is not persuaded to accept something unfamiliar; it is invited to rediscover something it already owns emotionally. Anticipation builds because people are solving a puzzle made from their own past, and by the time the answer is revealed, it feels earned, both by the brand and by those who followed the trail to find it."}, {"id": "i081", "t": "# The Cracks Are the Score\n\n## Brief in plain terms\n\nDamage to cultural heritage is usually communicated with before-and-after photographs. They are shocking for a moment and then forgotten. Meanwhile, the people who most need to care (younger audiences who live through music rather than museums) do not engage with heritage at all. And the act of destruction often aims at a message as much as a building: to erase memory, silence a culture, or remove what some people do not want others to see or hear.\n\nThe question: how do you make the damage to a place felt, give a culture back what was taken from it, and do it in a form a music-loving audience will actively hunt for?\n\n## The idea\n\nRead the wounds of threatened and damaged monuments as music. The cracks, fractures and erosion lines in a building's walls are scanned and translated into notes, so the damage literally becomes a composition. Each piece is then released as a rare, physical, located object rather than a stream, and the whole archive, scans and sound together, is backed up so that the building and its song can be rebuilt.\n\n## The mechanisms in sequence\n\n**Preserve first.** Ordinary people are equipped to 3D-scan endangered sites, uploading them to a cloud archive. The framing is a backup: just as files are saved against loss, a monument is saved against destruction. Where cultural work has been banned or removed, it is restored inside the very institutions that took it out, so that the backup itself becomes a calm act of defiance.\n\n**Listen to the damage.** From those scans, the fissures in each wall become a score. Musicians interpret them, producing tracks in which the shape of the harm is audible. Binaural field recordings from inside each site are woven in, so that listeners hear the space as if standing there. Sound adds the sense that photographs leave out and puts the audience within the subject rather than in front of it.\n\n**Make it scarce.** Each track exists in very limited physical form. A drive is left at a concert and must be passed on. A song is hidden at a set of map coordinates near the site it came from. A single copy circulates between listeners, each of whom adds their name before handing it over. An abundant digital file becomes an object worth seeking and an event worth talking about.\n\n## Why the pieces belong together\n\nThe backup produces the data; the sound design turns the data into feeling; the scarcity turns the feeling into a hunt. Each element alone would be modest. A scan archive is valuable but invisible. A song from cracked walls is poignant but disposable once streamed. A treasure-hunt release is fun but empty without meaning. Together, they create something fans pursue, share and protect.\n\nThe scarcity also mirrors the subject. Heritage is irreplaceable; a single-copy song is irreplaceable. Fans who hold the copy for a time experience in miniature the responsibility of guardianship that the campaign asks of everyone.\n\n## Why it works\n\n- It reframes damage as raw material for creation, offering an answer to destruction that is constructive rather than angry.\n- It reaches a music audience through their own behaviour (collecting, hunting, sharing) rather than asking them to visit a museum.\n- It makes heritage audible, which is more intimate than visible.\n- It protects what it celebrates. Every scan used to compose a song is also a copy from which the place can be rebuilt.\n\nThe monument is broken; its song is not, and neither is the archive that can raise it again."}, {"id": "i135", "t": "# Meet Your Match, Then Write the Law\n\n## The problem\n\nAnimal adoption campaigns tend to generate sympathy rather than results. People feel for shelter animals, share an image, and move on. Two gaps sit behind this. First, adoption feels generic: \"adopt a dog\" asks someone to commit to an idea rather than to an individual animal, and many adoptions fail because the match was never right. Second, the policies that would keep more animals out of shelters (rules on breeding, abandonment, rehoming) are decided by a small number of people, and public sympathy rarely reaches them in any form they must respond to.\n\nAny solution also has to work across many markets, each with its own language, shelters and politics.\n\n## The approach\n\nA single campaign idea that does two things with one gesture: it matches each person to a specific animal, and it converts that personal connection into direct pressure on the people who decide animal-welfare policy. The creative core is fixed; each market fills it with its own animals, language and legislative fight.\n\n## How it works\n\n### Step one: a personal match\n\nThe campaign begins with a search tool that draws on rescue databases and matches each user to an actual animal near them, using photographs of the real dog or cat and an honest description of its character, including its difficult traits. It can be tuned to particular needs: matching lonely people with shelter dogs who need company, or active families with energetic animals. The candour matters. A match made on honest information is more likely to last.\n\n### Step two: the animal asks for something\n\nEach matched animal comes with a request. Alongside the profile is a ready-to-sign bill or petition addressing why animals like this one end up in shelters. With one action, the user's signature, call or message is routed to their own named representative. Media is placed in the places where decision-makers live and work, featuring the animals their constituents have been matched with.\n\n### Step three: a fixed core, local voices\n\nThe constant elements are a positioning line and a fill-in-the-blank invitation: a structure in which the animal's name and the decision-maker's name are always the variables. Each market supplies its own shelters, its own animals, its own language and its own policy tension. One market may be fighting over breeding rules, another over abandonment penalties, but the format is identical.\n\n## Why each component matters\n\nThe **match** creates the emotional bond that generic appeals lack. It turns \"adopt\" into \"meet this animal\", which raises adoption quality and gives every user a specific reason to care.\n\nThe **pressure mechanism** gives that bond a political outlet. Support becomes measurable: decision-makers receive messages tied to their own constituents and to animals in their own districts, which makes the campaign difficult to ignore.\n\nThe **constant core** lets one idea scale across countries without losing local truth. Every market gets the same proven architecture and the freedom to fight its own battle.\n\n## Why it works\n\nSympathy usually evaporates because it has nowhere to go. Here it goes two places at once: into a home for one animal, and onto the desk of one legislator. The personal and the political are connected by the same animal, so the user never feels they are switching from a heartfelt moment to a policy ask.\n\nFor the organisers, the result is countable on both sides: matches made and messages delivered. For the public, the result is simpler: they found an animal they love, and they did something so that fewer animals will need finding."}, {"id": "i025", "t": "# The Story That Runs Backwards\n\n## The problem\n\nSome injustices have become so normal that audiences no longer see them. A harm that happens far away, or one that has persisted for generations, is filed under \"how things are\". Campaigns that describe it are dismissed as advocacy, and statistics are discounted as exaggeration. The audience has learned to ignore exactly what it should feel.\n\nTwo barriers must be broken: distance (it happens elsewhere, to other people) and disbelief (this is just a campaign saying what campaigns say). And a third obstacle sits under both: attention. If the audience does not keep watching, nothing else matters.\n\n## The approach\n\nStage the distant harm as a familiar story close to home, in a format the audience already consumes, and structure it as a puzzle that withholds its central connection until the end. Then support the reveal with evidence the audience cannot dismiss as advertising, proof that looks unflattering, or comes from outside the campaign entirely.\n\n## Key mechanisms\n\n### Bringing the harm home\n\nThe harm is recast as a local story in a familiar genre. A fictional local girl writes a blog about her upcoming marriage as a child bride. A popular soap opera introduces a storyline so disturbing that viewers demand it be taken off air. A boy's future is played out, year after year, until the moment it was stolen. A survivor presents what appears to be a beauty tutorial. The audience recognises the format and engages with it before realising what it is about, and the harm stops being distant.\n\n### Withholding the connection\n\nThe film or series is built around a withheld link or an escalating reveal. Several strangers' stories are shown separately, connected only at the end. A story runs in reverse, from its outcome back to its beginning. A close-up pulls back slowly until the full absurdity of the situation is visible. An opening title sequence condenses the story into symbols that only make sense later. Viewers keep watching to solve the puzzle, and the reveal lands with full force because they have been working towards it.\n\n### Proof that cannot be dismissed\n\nOnce the reveal has landed, the campaign backs it with evidence that does not look like advertising. Footage of a process filmed unflinchingly over time. A blind test among people with no stake in the outcome. An official or legal document quoted word for word. A change made quietly that nobody noticed until it was pointed out. The proof persuades because it is unflattering, external, or simply undeniable.\n\n## How the pieces work together\n\nThe familiar story earns the first moment of attention and closes the distance. The withheld structure keeps the audience watching through to the point of realisation. The undeniable evidence, arriving straight after the reveal, removes the escape route of \"it's just an ad\", so the emotional response cannot be dismissed as manipulation.\n\nEach element covers a weakness in the others. A familiar story without the reveal is simply drama. A reveal without proof can be rationalised away. Proof without a story is a statistic.\n\n## Why it works\n\n- **Familiarity disarms.** Audiences engage with a format they love before their defences go up.\n- **Puzzles hold attention.** Withholding the connection turns passive viewing into active solving.\n- **Evidence closes the case.** Proof that looks unflattering or comes from outside the campaign is harder to argue with than any claim.\n- **The injustice becomes visible again.** By placing the harm in a recognisable setting and proving it is real, the work makes the audience feel what they had learned to ignore.\n\nThe audience arrives for a story, stays for the puzzle, and leaves unable to unknow what it has seen."}, {"id": "i058", "t": "# The Clue Trail Only the Animals Could Solve\n\n## Starting point\n\nLaunches in pet care often speak past the very creatures they claim to serve. The communication is addressed to owners, about owners, and the animal appears as a prop. Owners, in turn, have learned to treat claims of care as standard category language. Meanwhile, launch campaigns in general follow a predictable rhythm: an announcement, a film, a burst of media, and a quick fade. Nothing invites the audience to take part before the reveal, and nothing about the craft is memorable enough to linger.\n\nThe challenge is to launch something for a pet brand in a way that proves its care in use, gives people a reason to participate before the launch, and produces work distinctive enough to be remembered.\n\n## Shape of the idea\n\nThe brand creates something that genuinely serves the animal rather than the owner: music composed for anxious cats in shelters, a radio station for dogs left alone at home, shelter dogs taught a surprising skill to prove their intelligence, or real shelter animals cast in its films. That creation is not announced; it is released as a trail of clues, leaks and puzzles. A phrase is seeded, a symbol appears before any announcement, a chain of hints runs across platforms, and core fans get a surprise early drop.\n\nThe film or content at the centre of the launch is made under one production constraint, committed to fully. It could be a first-person rig at the animal's eye level, a single uncut camera move, or a budget limit turned into a framing rule.\n\n## The working parts\n\n**Serving the animal.** The heart of the idea is a product or service designed for the animal's experience: its anxiety, its loneliness, its abilities. When owners see the animal respond, the care is proven in use rather than claimed. This also supplies a genuine mystery: something made for animals is, by nature, strange and intriguing to humans.\n\n**A trail that turns people into investigators.** Because the thing being launched is unusual, it lends itself to clues. A symbol that only makes sense later, a seeded phrase that hints at an unfamiliar audience, a sequence of puzzles that lead across platforms. Owners and fans start to speculate about what is coming. Participation and anticipation build before the answer is revealed, and the earliest supporters are rewarded with a first look.\n\n**A committed production constraint.** The launch content is shaped by a single technique held without exception. A camera fixed at the animal's height, for instance, makes the audience see the world as the pet does; an uncut take of a shelter dog's achievement removes any suspicion of editing. The constraint gives the work a distinctive texture and makes the craft itself part of what people remember.\n\n## How they fit together\n\nThe three atoms form a sequence. The animal-first creation is the answer; the clue trail is the question that leads to it; the production constraint is how the answer is shown.\n\nThe clue trail benefits from the animal focus because a launch aimed at pets rather than people is inherently puzzling: why would a brand release something humans cannot fully use? That puzzle sustains the investigation. The production constraint benefits from the animal focus too, because a technique like an animal's-eye view is not a stylistic flourish but a literal expression of who the product is for. And the constraint helps the reveal land: after a trail of hints, the payoff needs to feel singular, and a fully committed piece of craft delivers that.\n\nThe clues can also echo the constraint. If the film is shot from a pet's height, the early hints might use that same viewpoint, so fans gradually learn to recognise the visual language before they know what it means.\n\n## The case for it\n\nOwners are sceptical of care claims but cannot argue with an animal visibly calmed, entertained or empowered. The animal-first creation makes the brand's care observable.\n\nAudiences ignore announcements but enjoy solving puzzles. The clue trail converts passive viewers into active participants who feel ownership of the launch by the time it arrives.\n\nAnd most launch films are forgotten, but craft with a clear, consistent texture is not. The committed constraint makes the work itself a talking point.\n\nTogether, the components let a pet brand launch something that people discover rather than are told about, that proves its care through the animal's own response, and that is crafted memorably enough to carry the story long after the reveal."}, {"id": "i138", "t": "# Scan Your Street, Save the City\n\n## The problem\n\nWhen monuments and cultural sites are threatened, most people feel powerless. Preservation seems like the job of experts and institutions, and the public's role is limited to watching and worrying. Even those who want to help find that their small contributions vanish into a vast effort. Brand games, meanwhile, often feel disconnected from real life: they take place in fictional worlds with no meaning beyond the screen.\n\nThe opportunity is to give ordinary people a meaningful, personal role in preserving heritage, and to make their participation feel like part of something larger.\n\n## The approach\n\nThe idea is a location-based game in which players use their phones to scan and back up the threatened heritage in their own surroundings, with every scan contributing to a visible public reconstruction.\n\nThe game turns the player's real streets into the board. Using GPS and motion sensors, it guides players to monuments, buildings and spaces around them. At each location, they use the phone to capture the site, moving around it, swinging the phone to sweep a façade, building up the scan through their own movement.\n\nThese scans form a backup. The framing is that what is destroyed can be rebuilt: the archive created by players is a resource for restoration and a peaceful statement that heritage cannot simply be erased. Where works have been removed, the game can make them available again at the very places that took them away.\n\nEvery contribution is shown. A live map displays where each scan has landed, a landmark's lighting changes as the backup grows, and each player receives an image showing exactly where their scan sits within the rebuilt whole.\n\n## Key mechanisms\n\n**The real world as the game board.** By playing in places they know, players feel personally connected to the game. Their own street, their own city, becomes the site of the mission. Motion-based play makes capture physical and immersive.\n\n**Preservation as backup.** Reframing preservation as creating a backup turns fear into action. Players are not just mourning what might be lost; they are making sure it can be rebuilt. The tone is constructive and defiant.\n\n**Visible collective outcome.** Showing individual contributions within a shared result motivates continued participation. Players see that their scans matter and that they belong to a community of preservers.\n\n## How the parts interact\n\nThe game provides the mechanics and the motivation to explore. The backup provides the purpose: each scan is a real contribution to preservation. The visible outcome provides feedback: players see their effort reflected publicly, which encourages them to scan more and invite others.\n\nThe components depend on each other. A location game without the backup would be entertainment with no lasting value. A backup effort without the game would struggle to attract ordinary participants. Both without a visible outcome would leave players unsure their work counted. Together they form a loop where play produces preservation, and preservation is celebrated publicly.\n\n## Why it works\n\nIt works because it gives people agency over something they care about but usually feel powerless to protect. The game makes participation easy and enjoyable; the backup makes it meaningful; the visible outcome makes it rewarding.\n\nIt also deepens people's relationship with their surroundings. Players look closely at places they pass every day and see them as worth saving. The brand behind the game becomes associated with that care and with the collective act of rebuilding, which is far more memorable than any message about heritage."}, {"id": "i126", "t": "# Buy It, Mail It, Change It\n\n## The injustice\n\nAn unfair rule makes an essential product more expensive or harder to obtain than it should be. Everyone affected knows it, many sympathise, but sympathy rarely changes rules. Petitions disappear into inboxes, and lawmakers can easily ignore general public feeling. Causes trying to raise awareness also struggle for attention on ordinary days, competing with everything else in the news.\n\nThe challenge is to deliver relief now, expose the rule's absurdity, harness a moment when attention is already high, and convert sympathy into direct pressure on the people who can change the rule.\n\n## The approach\n\nOn the busiest shopping occasion of the year, or on a named day the campaign creates to sit next to it, launch a real product that exploits the rule's own loophole: an essential packaged or sold in a way that qualifies for fairer treatment. Each purchase comes with a ready-made way to contact the specific lawmakers responsible, such as a tear-out page to mail, a pre-filled message, or a ready-to-sign bill. Media is placed where those decision-makers live and work.\n\nPeople buy the product they need, and every purchase becomes a message to the people who decide.\n\n## Key mechanisms\n\n**1. The loophole product.** The essential is sold in a format that sidesteps the unfair rule: bundled, classified or priced in a way the rule treats more generously. Buyers get the product at a fairer cost, and the rule's absurdity is exposed by the simple fact that the workaround is legal. Every purchase becomes a vote against the rule.\n\n**2. The shopping occasion.** The product is launched on a major shopping day, or on a new named day slotted into the existing run of them. The public is already in a buying mood; media are covering the season; shoppers are looking for deals. The campaign borrows all that attention and redirects it toward the cause.\n\n**3. Pressure on the people who decide.** Each product includes a direct route to the decision-makers: a ready-to-sign bill, a tear-out page addressed to one's representative, calls or messages routed to named legislators. Media placements appear near where those people work and live. Support becomes measurable, specific and hard to ignore.\n\n## How it all connects\n\nThe loophole product provides relief and the central argument. The shopping occasion provides reach and a natural context for buying. The direct pressure mechanism turns each purchase into political action.\n\nThey work in sequence. Shoppers drawn by the season find a product that solves a real problem; buying it shows them how unfair the rule is; the product then hands them the tool to tell lawmakers. Each completed message is counted, giving the campaign a running total to show decision-makers and media. The more people buy, the louder the pressure becomes.\n\n## Why it works\n\n- **Practical first.** People respond to something that helps them now; the workaround delivers immediate value.\n- **Borrowed attention.** Launching on a major shopping occasion uses existing consumer energy instead of building it from scratch.\n- **Purchase as protest.** The act of buying becomes a vote, which is far easier than joining a protest.\n- **Targeted pressure.** Routing support to specific decision-makers makes it impossible for them to dismiss as general public noise."}, {"id": "i148", "t": "# Sign Here, Then Listen\n\n## Challenge\n\nProtection is a hard thing to sell and an even harder thing to commit to. People know, in the abstract, that risk is real, but abstract risk produces no feeling, and no feeling produces no action. Safety and insurance messages tend to respond with warnings, which audiences have learned to tune out. Civic commitments around safety, pledges to drive carefully or to look out for one another, suffer the same fate: they are optional messages, easy to nod at and easier to skip.\n\nThe task is to make a safety commitment something people actually make, feel and own, without lecturing them into it.\n\n## The idea\n\nBuild a commitment that is part of a ritual people cannot bypass, and put an immersive sound story at the heart of that ritual. Before making the pledge, the audience hears the risk rather than being told about it: a binaural or reactive audio piece that places them inside a near miss, a moment where things almost went wrong. Then, while still inside that feeling, they make a personal, public commitment that is recorded and counted.\n\nThe sequence is simple: listen, feel, commit. A brand in insurance or safety stands behind it, but its role is to stage the experience, not to argue.\n\n## Key mechanisms\n\n**Sound that puts you inside the moment.** The story is delivered as recorded or reactive audio designed to be heard on headphones or in an enclosed space. Spatial sound gives the listener a missing sense: footsteps behind them, a vehicle approaching from one side, the silence before an impact that never comes. Because the audience is inside the subject rather than watching it, the risk stops being abstract. The scene can also respond to the listener, reacting to where they stand or how long they stay, so the experience feels addressed to them alone.\n\n**A story, not a warning.** The audio is crafted as drama: a near miss played for suspense, ordinary people caught in a freak chain of events, a story with tension and release. Nothing is explained, no statistics are read out. The listener is allowed to feel the stakes and draw their own conclusion, which is exactly the emotion that makes protection desirable rather than imposed.\n\n**A commitment that cannot be skipped.** The pledge is built into an act of identity, a moment that already exists in people's journeys and that they must pass through: entering, registering, crossing a threshold. The commitment is stamped, signed or spoken as part of that act, so it becomes a personal mark rather than a message on a poster. Names or signatures are made public, for example read aloud or displayed, and every commitment is counted.\n\n## How it hangs together\n\nEach mechanism covers the weakness of the others. A pledge alone is cheap; people sign without thinking. A sound story alone is moving but leaves nowhere to put the feeling. A drama about risk alone risks being entertainment. Combined, the story supplies the emotion, the sound makes it bodily and personal, and the unskippable ritual captures the emotion at its peak and turns it into a public act.\n\nThe counting matters too. Because each commitment is recorded, the campaign can show a growing total of people who have chosen to protect themselves and others. That total becomes social proof for the next person in line and a story for the media. The brand ends up associated not with fear but with a community that decided to be careful.\n\n## Why it works\n\n- **Feeling precedes commitment.** People make pledges they mean when they have just felt why they matter. The audio is engineered to deliver that feeling in seconds.\n- **Sound bypasses defences.** Visual safety messages are filtered as advertising. Immersive audio arrives as experience, and the listener is inside it before deciding whether to pay attention.\n- **Identity beats instruction.** A commitment fused with an act of identity is remembered as something \"I did\", not something \"they told me\".\n- **Public and countable.** Reading names aloud or displaying signatures makes the commitment social, while the running count gives the campaign a measurable result.\n- **No lecture required.** The brand never wags a finger. It lets the story frighten a little, the sound make it real, and the pledge give people a way to answer. Wanting protection becomes the audience's own idea."}]};
  var SCALES = [
    ["overall", "Overall quality", "How good is this as an idea?"],
    ["feasibility", "Feasibility", "Could a real team make this?"],
    ["novelty", "Novelty", "How fresh does it feel?"],
    ["coherence", "Coherence", "Do its parts hang together?"],
    ["promise", "Promise", "Is it worth developing further?"]
  ];
  var KEY = "aar-pack-" + DATA.pack, st = { name: "", i: -1, s: {} };
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }
  function md(t) {
    var h = esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    h = h.replace(/^(?:[-*]\s+.+(?:\n|$))+/gm, function (b) { return "<ul>" + b.trim().split(/\n/).map(function (l) { return "<li>" + l.replace(/^[-*]\s+/, "") + "</li>"; }).join("") + "</ul>"; });
    return h.split(/\n{2,}/).map(function (p) { return /^<(h3|ul)/.test(p) ? p : "<p>" + p.replace(/\n/g, " ") + "</p>"; }).join("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.s) st = v; } catch (e) {} }

  function intro() {
    var resume = st.i >= 0 && st.i < DATA.items.length;
    app.innerHTML = '<div class="panel"><h3>Before you start</h3><ol class="steps">' +
      '<li><b>Ten ideas, one at a time.</b> About 25 minutes. Please don\'t look anything up.</li>' +
      '<li><b>Score five things</b> from 1 (low) to 5 (high), then say whether you would riff on it.</li>' +
      '<li><b>Your scores save in this browser</b> as you go, so you can close it and come back on the same computer.</li>' +
      '<li><b>At the end</b> press <b>Send my scores</b>. There is also a short code and a CSV file as a back-up.</li></ol>' +
      '<div class="row"><label for="nm">Your name</label><input id="nm" type="text" style="max-width:300px" autocomplete="off"></div>' +
      '<div class="row"><button id="go">' + (resume ? "Carry on" : "Start") + '</button></div></div>';
    $("#nm").value = st.name || "";
    $("#go").addEventListener("click", function () {
      st.name = $("#nm").value.trim(); if (!st.name) { $("#nm").focus(); return; }
      if (st.i < 0) st.i = 0; save(); show();
    });
  }

  function show() {
    if (st.i >= DATA.items.length) return finish();
    var it = DATA.items[st.i], cur = st.s[it.id] || {}, pct = Math.round(st.i / DATA.items.length * 100);
    var h = '<div class="panel"><div class="row" style="justify-content:space-between;margin-top:0"><h3>Idea ' + (st.i + 1) + ' of ' + DATA.items.length + '</h3><span class="note">' + esc(st.name) + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="idea" tabindex="0">' + md(it.t) + '</div><div class="scales">';
    SCALES.forEach(function (s) {
      h += '<div class="scale"><div class="q">' + s[1] + '<small>' + s[2] + '</small></div><div class="pick" role="radiogroup" aria-label="' + s[1] + '">';
      for (var k = 1; k <= 5; k++) h += '<label><input type="radio" name="' + s[0] + '" value="' + k + '"' + (cur[s[0]] === k ? " checked" : "") + '><span>' + k + '</span></label>';
      h += '</div></div>';
    });
    h += '<div class="scale"><div class="q">Would you riff on this?<small>Would it start ideas for you?</small></div><div class="pick" role="radiogroup" aria-label="Would you riff on this">';
    ["Yes", "Maybe", "No"].forEach(function (o) { h += '<label><input type="radio" name="riff" value="' + o + '"' + (cur.riff === o ? " checked" : "") + '><span style="padding:0 14px">' + o + '</span></label>'; });
    h += '</div></div></div><label for="nt" style="display:block;margin-top:16px">Note (optional)</label><textarea id="nt" rows="2" placeholder="What would you do with it, or what is wrong with it?">' + esc(cur.note || "") + '</textarea>';
    h += '<div class="row"><button id="nx">' + (st.i === DATA.items.length - 1 ? "Save and finish" : "Save and next") + '</button>' + (st.i > 0 ? '<button id="bk" class="ghost">Back</button>' : "") + '<span id="msg" class="note"></span></div><p class="note">1 is low and 5 is high.</p></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
    $("#nx").addEventListener("click", function () {
      var rec = { note: ($("#nt").value || "").slice(0, 1000) }, miss = false;
      SCALES.forEach(function (s) { var c = document.querySelector("input[name=" + s[0] + "]:checked"); if (c) rec[s[0]] = +c.value; else miss = true; });
      var rf = document.querySelector("input[name=riff]:checked"); if (rf) rec.riff = rf.value; else miss = true;
      if (miss) { $("#msg").textContent = "Please answer every scale first."; return; }
      st.s[it.id] = rec; st.i++; save(); show();
    });
    var bk = $("#bk"); if (bk) bk.addEventListener("click", function () { st.i--; save(); show(); });
  }

  function payload() {
    return { pack: DATA.pack, name: st.name, at: new Date().toISOString(), ratings: DATA.items.map(function (it) { var r = st.s[it.id] || {}; return { item: it.id, overall: r.overall, feasibility: r.feasibility, novelty: r.novelty, coherence: r.coherence, promise: r.promise, riff: r.riff, note: r.note || "" }; }) };
  }
  function csv(p) {
    var cols = ["pack", "name", "item", "overall", "feasibility", "novelty", "coherence", "promise", "riff", "note"];
    var q = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    return cols.join(",") + "\n" + p.ratings.map(function (r) { return cols.map(function (c) { return q(c === "pack" ? p.pack : c === "name" ? p.name : r[c]); }).join(","); }).join("\n");
  }
  function finish() {
    var p = payload(), code = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    app.innerHTML = '<div class="panel"><h3>All ten done. Thank you.</h3><p class="note">Press the button to send your scores. Nothing else is needed.</p>' +
      '<div class="row"><button id="snd">Send my scores</button><span id="m3" class="note"></span></div>' +
      '<p class="note">Back-up, only if the button fails: download the CSV or copy the code and send it to the person who sent you this file.</p>' +
      '<div class="row"><button id="dl" class="ghost">Download CSV</button><button id="cp" class="ghost">Copy code</button><span id="m2" class="note"></span></div>' +
      '<label for="cd" style="display:block;margin-top:16px">Your code (paste it into an email or message)</label><textarea id="cd" class="code" readonly></textarea>' +
      '<div class="row"><button id="rv" class="ghost">Go back and change a score</button></div></div>';
    $("#cd").value = code;
    var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSdmbZSBNd5jX7mgj_9_gqyzCgbGvbd-bsZmhktpkxr2GAxOLg/formResponse";
    function send() {
      $("#m3").textContent = "Sending...";
      var b = new URLSearchParams(); b.set("entry.34266590", code);
      fetch(FORM, { method: "POST", mode: "no-cors", body: b }).then(function () { $("#m3").textContent = "Sent. Thank you. You can close this page."; }, function () { $("#m3").textContent = "Could not send. Please use the back-up below."; });
    }
    $("#snd").addEventListener("click", send);
    $("#dl").addEventListener("click", function () {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv(p)], { type: "text/csv" })); a.download = "alien-ad-space-scores-" + DATA.pack + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); $("#m2").textContent = "Saved to your downloads.";
    });
    $("#cp").addEventListener("click", function () {
      var t = $("#cd"); t.select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { $("#m2").textContent = "Copied."; }, function () { try { document.execCommand("copy"); $("#m2").textContent = "Copied."; } catch (e) { $("#m2").textContent = "Select the code and copy it."; } });
    });
    $("#rv").addEventListener("click", function () { st.i = 0; save(); show(); });
  }

  load(); intro();
})();
</script>
